# SHEYTAN-LA — build-macos.yml (master work order §10: the five
# platform-specific build workflows)
#
# REUSABLE PLATFORM LANE — invoked ONLY via workflow_call from the
# build-desktop.yml orchestrator. A real, independent macOS build
# definition: native compile on a macOS runner for arm64 and x64, the
# headless core suite, an .app bundle staged with ALPHA build metadata,
# a bounded launch/lifecycle smoke on the runner's window server, and a
# portable .zip archive gate.
#
# Signing honesty (master work order §10.1): the binary is ad-hoc
# signed (`codesign -s -`) — NO developer identity, NO notarization and
# NO PKG/DMG installer. The artifact is a portable, unnotarized test
# build; Gatekeeper on a user Mac will require an explicit right-click
# open. That limitation is stated on the artifact, never papered over.
#
# Product state (ALPHA, run 44205355718 work order): the application UI
# is the Fyne shell and the Go-Gui primary-shell migration is pending
# (§4.1/§5); the gates here exercise the CURRENT product truthfully.

name: build-macos

on:
  workflow_call: {}

permissions:
  contents: read

env:
  GO_VERSION: "1.27.4"
  GO_TEST_TIMEOUT: "25m"

jobs:
  build-macos-app:
    name: macOS ${{ matrix.arch }} (native compile + core suite + .app bundle + launch smoke)
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            goarch: arm64
          - arch: x64
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Runner OS identity (macOS)
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version | head -2

      - name: Setup Go (pinned toolchain + module cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: gofmt (enforced)
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l cmd internal ui scripts)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt violations — run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt OK"

      - name: Headless core suite (darwin/${{ matrix.goarch }})
        run: |
          set -euo pipefail
          export CGO_ENABLED=1
          go test ./internal/... -tags headless -count=1 -timeout "${GO_TEST_TIMEOUT}"

      - name: Release-contract suite (darwin/${{ matrix.goarch }})
        run: |
          set -euo pipefail
          go test ./internal/releasecontract/ -count=1

      - name: Build the full desktop application (native darwin/${{ matrix.goarch }})
        run: |
          set -euo pipefail
          export CGO_ENABLED=1
          mkdir -p "dist/macos-${{ matrix.arch }}/app"
          GOOS=darwin GOARCH=${{ matrix.goarch }} go build -trimpath -o "dist/macos-${{ matrix.arch }}/app/SHEYTAN-LA" ./cmd/sheytan-local-agent

      - name: Cross-check the compiled binary's build identity
        run: |
          set -euo pipefail
          bin="dist/macos-${{ matrix.arch }}/app/SHEYTAN-LA"
          probeDir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/build-info-probe.XXXXXX")"
          cd "$probeDir"
          raw="$("$bin" build-info 2>/dev/null)"
          [ -n "$raw" ] || { echo "::error::the compiled build-info probe produced no output"; exit 1; }
          echo "compiled build-info: $raw"
          stage="$(printf '%s' "$raw" | sed -n 's/.*"product_stage":"\([^"]*\)".*/\1/p')"
          build_id="$(printf '%s' "$raw" | sed -n 's/.*"build_id":"\([^"]*\)".*/\1/p')"
          [ "$stage" = "ALPHA" ] || { echo "::error::compiled product_stage is '$stage', want ALPHA"; exit 1; }
          [ -n "$build_id" ] || { echo "::error::build-info carries no build_id field"; exit 1; }
          echo "compiled build identity OK: product_stage=$stage build_id=$build_id"

      - name: Stage the .app bundle (portable, ad-hoc signed)
        run: |
          set -euo pipefail
          app="dist/macos-${{ matrix.arch }}/SHEYTAN-LA.app"
          mkdir -p "${app}/Contents/MacOS" "${app}/Contents/Resources"
          cp "dist/macos-${{ matrix.arch }}/app/SHEYTAN-LA" "${app}/Contents/MacOS/SHEYTAN-LA"
          chmod +x "${app}/Contents/MacOS/SHEYTAN-LA"
          printf 'product: SHEYTAN-LA\nstage: ALPHA\ncommit: %s\nui: fyne (one Go UI)\n' "${{ github.sha }}" > "${app}/Contents/Resources/BUILD-INFO.txt"
          cat > "${app}/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>SHEYTAN-LA</string>
            <key>CFBundleDisplayName</key><string>SHEYTAN-LA — ALPHA</string>
            <key>CFBundleIdentifier</key><string>io.github.sheytanx13.SHEYTAN-LA</string>
            <key>CFBundleExecutable</key><string>SHEYTAN-LA</string>
            <key>CFBundleShortVersionString</key><string>ALPHA</string>
            <key>CFBundleVersion</key><string>ALPHA</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # The YAML block scalar indents every heredoc line; strip the
          # block indentation so the XML declaration sits at byte 0, then
          # validate the plist before it ships.
          sed -i '' 's/^[[:space:]]*//' "${app}/Contents/Info.plist"
          plutil -lint "${app}/Contents/Info.plist"
          # Ad-hoc signature: honest test-build status, no identity, no
          # notarization (recorded on the artifact, never claimed otherwise).
          codesign --force --deep -s - "${app}"
          codesign -dv "${app}" 2>&1 | head -5 || true
          echo ".app staged (ad-hoc signed, unnotarized — portable test build)"

      - name: Launch smoke (bounded, runner window server)
        run: |
          set -euo pipefail
          app="dist/macos-${{ matrix.arch }}/SHEYTAN-LA.app/Contents/MacOS/SHEYTAN-LA"
          smokeDir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/macos-smoke.XXXXXX")"
          export SHEYTAN_DATA_DIR="${smokeDir}/data"
          "./${app}" &
          appPid=$!
          sleep 15
          if ! kill -0 "$appPid" 2>/dev/null; then
            wait "$appPid" || true
            echo "::error::the SHEYTAN-LA process exited before the bounded smoke window elapsed"
            exit 1
          fi
          kill -TERM "$appPid" 2>/dev/null || true
          for i in $(seq 1 20); do
            kill -0 "$appPid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$appPid" 2>/dev/null; then
            kill -KILL "$appPid" 2>/dev/null || true
            echo "::error::the process ignored SIGTERM for 20s — graceful shutdown regressed"
            exit 1
          fi
          echo "launch smoke OK: alive at t+15s, SIGTERM honored"

      - name: Create the portable .zip (no PKG/DMG)
        run: |
          set -euo pipefail
          cd "dist/macos-${{ matrix.arch }}"
          # ditto preserves the bundle layout exactly (no resource forks).
          ditto -c -k --keepParent "SHEYTAN-LA.app" "SHEYTAN-LA-ALPHA-macos-${{ matrix.arch }}.zip"
          test -s "SHEYTAN-LA-ALPHA-macos-${{ matrix.arch }}.zip"
          echo "portable .zip created (no installer)"

      - name: Verify the portable .zip (fail-closed)
        run: |
          set -euo pipefail
          zip="dist/macos-${{ matrix.arch }}/SHEYTAN-LA-ALPHA-macos-${{ matrix.arch }}.zip"
          members="$(unzip -Z1 "$zip")"
          echo "$members" | grep -q "SHEYTAN-LA.app/Contents/MacOS/SHEYTAN-LA" || { echo "::error::required member missing from the bundle zip"; exit 1; }
          echo "$members" | grep -q "SHEYTAN-LA.app/Contents/Info.plist" || { echo "::error::Info.plist missing from the bundle zip"; exit 1; }
          if echo "$members" | grep -Eqi '\.(pkg|dmg|nsi|msi)$'; then
            echo "::error::installer-class payload found in the portable archive"; exit 1
          fi
          echo "archive verification OK: bundle complete, no installer payloads"

      - name: Upload the portable .zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SHEYTAN-LA-ALPHA-macos-${{ matrix.arch }}-app
          path: dist/macos-${{ matrix.arch }}/SHEYTAN-LA-ALPHA-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
