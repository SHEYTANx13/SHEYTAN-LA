# SHEYTAN-LA — build-android.yml (master work order §10: the five
# platform-specific build workflows)
#
# REUSABLE PLATFORM LANE — invoked ONLY via workflow_call from the
# build-desktop.yml orchestrator. A real, independent Android arm64
# build definition: the fyne mobile toolchain (gomobile, version-resolved
# from the SAME module graph the app builds with), a debug-signed
# development/test APK, APK structural verification and an explicit
# repo-cleanliness guard (the generated debug keystore never enters the
# tree).
#
# Evidence honesty (master work order §10.1): this artifact is a
# DEVELOPMENT/TEST APK. No emulator smoke is claimed: hosted runners in
# this lane do not guarantee hardware acceleration (KVM), and an
# emulator launch without it is neither fast nor representative — the
# emulator/device launch evidence is explicitly NOT RUN here and must be
# recorded as such anywhere this artifact is described. Physical-device
# behavior is never asserted from this workflow.
#
# Product state (ALPHA, current master work order): the UI is the Fyne
# shell (its mobile backend is what gomobile packages here); the Go-Gui
# primary-shell migration is pending (§4.1/§5) and this lane swaps to
# the Go-Gui Android backend only when that migration delivers it.

name: build-android

on:
  workflow_call:
    inputs:
      go_version:
        description: "Exact Go toolchain version (the go.mod toolchain directive is the one authority)"
        required: false
        type: string
        default: "1.27.4"
    outputs:
      artifact_name:
        description: The exact uploaded artifact name
        value: ${{ jobs.build-android-apk.outputs.artifact_name }}

permissions:
  contents: read

env:
  GO_VERSION: "1.27.4"

jobs:
  build-android-apk:
    name: Android arm64 (gomobile toolchain + debug APK + manifest checks)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Runner OS identity (Android lane)
        run: |
          set -euo pipefail
          uname -a
          echo "ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "no preinstalled NDK"

      - name: Setup Go (pinned toolchain + module cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ inputs.go_version }}
          cache: true
          cache-dependency-path: go.sum

      - name: Headless core suite (the same core gates, android-relevant subset host)
        run: |
          set -euo pipefail
          go test ./internal/... -tags headless -count=1 -timeout 25m

      - name: Install gomobile toolchain at the exact pinned version (never @latest)
        run: |
          set -euo pipefail
          # Run 44378562071 §4.1.6/§4.2.4: the mobile toolchain pin lives
          # HERE, not in go.mod. The product module imports no x/mobile
          # runtime package, so go mod tidy (correctly) removes any unused
          # indirect pin — the committed-drift failure. The CLI tools are
          # installed at this exact recorded version instead; checksums for
          # the pin live in the go.sum history of the run that last used it.
          # Never @latest, never a moving branch.
          mobilePin="v0.0.0-20261117202452-47699113848a"
          echo "pinned x/mobile: ${mobilePin}"
          go install "golang.org/x/mobile/cmd/gomobile@${mobilePin}"
          go install "golang.org/x/mobile/cmd/gobind@${mobilePin}"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Locate or install the Android NDK (fail-closed, actionable)
        run: |
          set -euo pipefail
          ndkDir="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$ndkDir" ]; then
            echo "no preinstalled NDK — installing a current LTS NDK via sdkmanager"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null
            ndkDir="$(ls -d "$ANDROID_HOME"/ndk/27.2.12479018)"
          fi
          test -d "$ndkDir" || { echo "::error::NDK unavailable and sdkmanager install failed — the Android lane cannot proceed"; exit 1; }
          echo "ANDROID_NDK_HOME=$ndkDir" >> "$GITHUB_ENV"
          echo "using NDK at $ndkDir"

      - name: Package the Android arm64 APK (debug-signed, never committed keys)
        run: |
          set -euo pipefail
          # fyne CLI pinned to the EXACT fyne version the app builds with
          # (one version authority — the go.mod directive).
          fyneVersion="$(go list -m fyne.io/fyne/v2)"
          go install "fyne.io/fyne/v2/cmd/fyne@${fyneVersion#fyne.io/fyne/v2 }"
          mkdir -p dist/android
          fyne package -os android -arch arm64 \
            -appID io.github.sheytanx13.SHEYTANLA \
            -name SHEYTAN-LA \
            -icon ui/fyne/assets/logo-512.png \
            -appBuild 1 \
            -appVersion 1.11.1 \
            -outputDir dist/android
          ls -la dist/android

      - name: Verify the APK (fail-closed structural checks)
        run: |
          set -euo pipefail
          apk="$(ls dist/android/*.apk)"
          test -s "$apk" || { echo "::error::no APK produced by fyne package"; exit 1; }
          # The APK is a zip: manifest + dex must be present.
          members="$(unzip -Z1 "$apk")"
          echo "$members" | grep -qx "AndroidManifest.xml" || { echo "::error::AndroidManifest.xml missing from the APK"; exit 1; }
          echo "$members" | grep -Eq "^(classes.*\.dex)$" || { echo "::error::no classes.dex in the APK"; exit 1; }
          if echo "$members" | grep -Eqi '\.(nsi|msi|msix)$'; then
            echo "::error::installer-class payload found inside the APK"; exit 1
          fi
          # The manifest must declare the debuggable/testable dev package
          # honestly: aapt reports the package name for the record.
          buildToolsDir="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$buildToolsDir/aapt" dump badging "$apk" | head -4
          echo "APK verification OK: $(du -h "$apk" | cut -f1), manifest + dex present, debug-signed dev artifact"

      # The debug keystore gomobile generated lives in the runner HOME —
      # it must never reach the repository. Fail if ANY untracked file
      # appeared (the packaging step must leave the tree pristine).
      - name: Repo cleanliness guard (no keys, no build residue committed)
        run: |
          set -euo pipefail
          residue="$(git status --porcelain)"
          if [ -n "$residue" ]; then
            echo "::error::the Android packaging step dirtied the working tree — debug keystores and build products must never be committed:"
            echo "$residue"
            exit 1
          fi
          echo "working tree pristine — no keystore or residue tracked"

      - name: Upload the development APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SHEYTAN-LA-ALPHA-android-arm64-debug-apk
          path: dist/android/*.apk
          if-no-files-found: error

      - name: Publish the artifact-name output
        run: |
          echo "artifact_name=SHEYTAN-LA-ALPHA-android-arm64-debug-apk" >> "$GITHUB_OUTPUT"
