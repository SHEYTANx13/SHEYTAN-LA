# SHEYTAN-LA — build-linux.yml (master work order §10: the five
# platform-specific build workflows)
#
# REUSABLE PLATFORM LANE — invoked ONLY via workflow_call from the
# build-desktop.yml orchestrator (the orchestrator owns the push/PR
# triggers; there are no duplicate push builds). A real, independent
# Linux build definition: native compile on an Ubuntu 26.04 runner with
# the Fyne prerequisites, the headless core suite, the release-contract
# suite, an Xvfb/software-render launch smoke, ELF verification and a
# portable archive gate.
#
# Product state (ALPHA, run 44205355718 work order): the application UI
# is the Fyne shell and the Go-Gui primary-shell migration is pending
# (§4.1/§5). The launch smoke therefore exercises the CURRENT shell
# truthfully under Xvfb with the software renderer; it is swapped to a
# Go-Gui smoke only when the migration delivers the new shell. X11 and
# Wayland native runtime coverage remains recorded by the native
# in-orchestrator lane until the Go-Gui gate swap. NO DEB/RPM installer
# is produced — portable archives only.
#
# Transitional duplication note (§4.1 no-deletion rule): the native
# in-orchestrator build-linux lane remains the RELEASE packaging
# authority while this reusable lane proves the standalone §10
# definition with equivalent compile/test/package verification under a
# distinct artifact name.

name: build-linux

on:
  workflow_call: {}

permissions:
  contents: read

env:
  GO_VERSION: "1.27.4"
  GO_TEST_TIMEOUT: "25m"
  LINUX_PKG_ROOT: "SHEYTAN-LA"

jobs:
  build-linux-x64:
    name: Linux x64 (native compile + core/contract suites + Xvfb smoke + portable archive)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Runner OS identity (Ubuntu 26.04 gate)
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          . /etc/os-release
          if [ "${ID}" != "ubuntu" ] || [ "${VERSION_ID}" != "26.04" ]; then
            echo "::error::runner identity: expected ubuntu-26.04, got ${ID}-${VERSION_ID}"
            exit 1
          fi

      - name: Setup Go (pinned toolchain + module cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: gofmt (enforced)
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l cmd internal ui scripts)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt violations — run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt OK"

      - name: Headless core suite (linux/amd64)
        run: |
          set -euo pipefail
          go test ./internal/... -tags headless -count=1 -timeout "${GO_TEST_TIMEOUT}"

      - name: Release-contract suite (linux/amd64)
        run: |
          set -euo pipefail
          go test ./internal/releasecontract/ -count=1

      - name: Install Fyne build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
            gcc pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-dev \
            xorg-dev xauth xvfb x11-utils zip unzip

      - name: Build the full desktop application (native linux/amd64)
        run: |
          set -euo pipefail
          mkdir -p "dist/linux/app/${LINUX_PKG_ROOT}"
          go build -trimpath -o "dist/linux/app/${LINUX_PKG_ROOT}/SHEYTAN-LA" ./cmd/sheytan-local-agent
          chmod +x "dist/linux/app/${LINUX_PKG_ROOT}/SHEYTAN-LA"

      - name: Cross-check the compiled binary's build identity
        run: |
          set -euo pipefail
          bin="dist/linux/app/${LINUX_PKG_ROOT}/SHEYTAN-LA"
          probeDir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/build-info-probe.XXXXXX")"
          trap 'rm -rf "$probeDir"' EXIT
          cd "$probeDir"
          raw="$("$bin" build-info 2>/dev/null)"
          if [ -z "$raw" ]; then
            echo "::error::the compiled build-info probe produced no output — the machine-readable build-identity contract is broken"
            exit 1
          fi
          echo "compiled build-info: $raw"
          stage="$(printf '%s' "$raw" | sed -n 's/.*"product_stage":"\([^"]*\)".*/\1/p')"
          build_id="$(printf '%s' "$raw" | sed -n 's/.*"build_id":"\([^"]*\)".*/\1/p')"
          if [ "$stage" != "ALPHA" ]; then
            echo "::error::compiled product_stage is '$stage', want the public ALPHA identity"
            exit 1
          fi
          if [ -z "$build_id" ]; then
            echo "::error::build-info carries no build_id field"
            exit 1
          fi
          echo "compiled build identity OK: product_stage=$stage (public) build_id=$build_id (internal) — asserted independently"
          residue="$(ls -A "$probeDir" || true)"
          if [ -n "$residue" ]; then
            echo "::error::build-info probe created filesystem residue: $residue — the identity dispatch must stay read-only"
            exit 1
          fi

      - name: Verify the ELF (x86-64, executable bit)
        run: |
          set -euo pipefail
          bin="dist/linux/app/${LINUX_PKG_ROOT}/SHEYTAN-LA"
          test -x "$bin" || { echo "::error::the Linux binary lost its executable bit"; exit 1; }
          file "$bin" | grep -q "ELF 64-bit LSB.*x86-64" || { echo "::error::not an x86-64 ELF binary"; exit 1; }

      # Bounded observable launch smoke under Xvfb with the software
      # renderer: the binary must keep a live process for the bounded
      # window and shut down cleanly on SIGTERM. This proves the shell
      # boots on a real Linux desktop stack — it is NOT a full UI
      # qualification (honest evidence class: native runtime smoke).
      - name: Xvfb launch smoke (software render, bounded)
        run: |
          set -euo pipefail
          smokeDir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/linux-smoke.XXXXXX")"
          cp -r "dist/linux/app/${LINUX_PKG_ROOT}" "${smokeDir}/SHEYTAN-LA"
          cd "${smokeDir}/SHEYTAN-LA"
          export SHEYTAN_DATA_DIR="${smokeDir}/data"
          xvfb-run -a -s "-screen 0 1280x800x24" timeout 30 ./SHEYTAN-LA &
          appPid=$!
          sleep 15
          if ! kill -0 "$appPid" 2>/dev/null; then
            wait "$appPid" || true
            echo "::error::the SHEYTAN-LA process exited before the bounded smoke window elapsed — the shell did not stay alive under Xvfb"
            exit 1
          fi
          kill -TERM "$appPid" 2>/dev/null || true
          for i in $(seq 1 20); do
            kill -0 "$appPid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$appPid" 2>/dev/null; then
            kill -KILL "$appPid" 2>/dev/null || true
            echo "::error::the SHEYTAN-LA process ignored SIGTERM for 20s — graceful shutdown regressed"
            exit 1
          fi
          echo "Xvfb launch smoke OK: process alive at t+15s, SIGTERM honored within the grace window"

      - name: Stage the portable archive (no DEB/RPM)
        run: |
          set -euo pipefail
          root="dist/linux/app/${LINUX_PKG_ROOT}"
          mkdir -p "${root}/resources/docs"
          printf 'product: SHEYTAN-LA\nstage: ALPHA\nbuild_id: 1.11.1\ncommit: %s\nui: fyne (one Go UI)\n' "${{ github.sha }}" > "${root}/resources/docs/BUILD-INFO.txt"
          printf 'SHEYTAN-LA — ALPHA. Run ./SHEYTAN-LA. Models are downloaded in-app; user data lives under data/ next to the executable. Static package content lives under resources/.\n' > "${root}/resources/docs/README.txt"
          find "${root}" -type f -size +100000000c -print -exec false {} + || {
            echo "::error::staged payload exceeds the 100 MB per-file ceiling"; exit 1; }
          tar -czf "dist/SHEYTAN-LA-ALPHA-linux-x64-portable.tar.gz" -C "dist/linux/app" "${LINUX_PKG_ROOT}"
          echo "portable archive created (no installer)"

      - name: Verify the portable archive (fail-closed)
        run: |
          set -euo pipefail
          archive="dist/SHEYTAN-LA-ALPHA-linux-x64-portable.tar.gz"
          test -s "$archive" || { echo "::error::portable archive missing or empty"; exit 1; }
          members="$(tar -tzf "$archive")"
          echo "$members" | grep -qx "SHEYTAN-LA/SHEYTAN-LA" || { echo "::error::required member SHEYTAN-LA/SHEYTAN-LA missing"; exit 1; }
          if echo "$members" | grep -Eqi '\.(deb|rpm|nsi|msi|msix)$'; then
            echo "::error::installer-class payload found in the portable archive"; exit 1
          fi
          count="$(echo "$members" | wc -l)"
          echo "archive verification OK: ${count} members, binary present, no installer payloads"

      - name: Upload the portable archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SHEYTAN-LA-ALPHA-linux-x64-portable
          path: dist/SHEYTAN-LA-ALPHA-linux-x64-portable.tar.gz
          if-no-files-found: error
