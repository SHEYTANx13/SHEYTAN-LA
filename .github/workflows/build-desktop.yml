# ============================================================================
# SHEYTAN-LA — build-desktop.yml (v1.11.0 one-Go-UI pipeline, run #54 repair)
# ============================================================================
# The ONE CI pipeline for the ONE Go + Fyne application. The retired
# stacks — Qt/QML + CMake host, React/TypeScript/Vite frontend, Playwright
# suites, Node toolchain — have no gates here anymore; their behavioral
# contracts live in Go tests (ui/fyne, internal/releasecontract).
#
# Run #54 repair (run 40394318382, commit e6e1968) — root causes fixed:
#   1. audit + Linux version steps compiled the Fyne UI (CGO) on runners
#      without graphics headers → both now run CGO-free: the stress gate
#      under `-tags headless`, version resolution via cmd/printversion.
#   2. Windows BUILD-INFO.txt: fragile here-string + unvalidated writes →
#      explicit, individually-validated UTF-8 (no BOM) writes with
#      per-file diagnostics.
#   3. Log consolidation flattened per-job artifacts with
#      merge-multiple:true (same-named logs overwrote each other) and
#      could silently drop the report → namespaced parts + the
#      scripts/ci/consolidate-run-log.sh collector + mandatory upload.
#   4. MINGW64 deprecation (msys2, October 2026) → UCRT64 toolchain.
#
# Job topology (preflight-first ordering, every job bounded and named):
#
#   preflight      compile gate (go build ./... — includes the Fyne UI,
#                  so the Fyne prerequisites install here) + gofmt + vet
#   audit          headless core suite (-tags headless), race gates on the
#                  critical concurrent packages, the HEADLESS stress
#                  release-surface gate, the release/version contract
#                  tests and the log-collector fixture suite
#   ui             the Fyne UI contract + composition suite, the button
#                  fit matrix (logical-size sweep), the FULL non-headless
#                  test sweep, and the Linux desktop smoke: the real
#                  SHEYTAN-LA binary under Xvfb (boot, window, clean
#                  shutdown)
#   Windows x64    native MSYS2/UCRT64 CGO build of SHEYTAN-LA.exe, the
#                  named-pipe CoreClient integration gate (the REAL
#                  production client over localipc.Serve), PE
#                  verification, the IPC-aware launch smoke (window +
#                  successful handshake + core read + logging persistence
#                  + graceful close), portable ZIP + NSIS installer (no
#                  Qt runtime, no second UI binary)
#   Linux x64      native Linux build of SHEYTAN-LA (executable bit), ELF
#                  verification, compiled-version cross-check, Xvfb
#                  launch smoke, portable ZIP
#   consolidate-logs   ONE plain-text run log (SHEYTAN-LA-all-logs.txt)
#                  collected from the run-attempt logs API (always runs;
#                  red runs keep their log)
#   release        tags only: publishes the contracted artifacts
#
# Honesty contract: a green run is build/test/smoke evidence on hosted
# runners — NEVER a claim of physical-PC or mobile runtime verification.
# Android/iOS are architecture-portable (Fyne) but require their own
# SDKs/toolchains and are NOT built or claimed here.
# ============================================================================
name: build-desktop

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # v1.11.1 maintenance: the EXACT stable Go patch (go1.27.4, released
  # 2026-11-10; verified on go.dev/dl) — one version authority for every
  # lane, matching the go.mod toolchain directive.
  GO_VERSION: "1.27.4"
  # ONE canonical package root per platform (internal/releasecontract):
  # every staging directory, ZIP name, artifact name and release-metadata
  # reference derives from these. No duplicated root literals.
  WIN_PKG_ROOT: "SHEYTAN-LA"
  LINUX_PKG_ROOT: "SHEYTAN-LA"
  # Bounded steps: the largest gates carry explicit timeouts (minutes).
  GO_TEST_TIMEOUT: "25m"

jobs:
  # ==========================================================================
  # Preflight — the compile gate runs FIRST so a broken tree fails in
  # ~2 minutes instead of after the full matrix.
  # ==========================================================================
  preflight:
    name: Preflight compile gate
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Runner OS identity (Ubuntu 26.04 gate)
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          echo "dpkg arch: $(dpkg --print-architecture)"
          echo "ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
          # v1.11.1 (run 41933333132, work order §7): the 24.04 -> 26.04
          # migration is VERIFIED, not a YAML-only change — the exact OS
          # release and architecture are asserted so later runner drift
          # fails loudly here instead of surprising the build.
          . /etc/os-release
          if [ "${ID}" != "ubuntu" ] || [ "${VERSION_ID}" != "26.04" ]; then
            echo "::error::runner identity: expected ubuntu-26.04, got ${ID}-${VERSION_ID} — the Linux lane is pinned to 26.04"
            exit 1
          fi
          if [ "$(dpkg --print-architecture)" != "amd64" ]; then
            echo "::error::runner identity: expected amd64 architecture, got $(dpkg --print-architecture)"
            exit 1
          fi


      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # F1/F7 (run 43008361835): the cache key family is scoped to
          # OS + Go version + the dependency lock (go.sum) — declared
          # explicitly so dependency changes invalidate every lane's
          # cache together and a hit/miss is reproducible.
          cache-dependency-path: go.sum

      # Fyne native build prerequisites (Linux desktop path). This is the
      # HONEST dependency contract: a C compiler + pkg-config + the
      # X11/OpenGL/Wayland development libraries (including libxxf86vm-dev,
      # the linker failure that killed the run-#51 Fyne spike). No Qt, no
      # Node, no GTK.
      # F7 (run 43008361835): cache hit/miss is recorded per job — a hit is
      # a performance optimization, never a correctness condition. Only
      # allowlisted toolchain facts; no environment dumps.
      - name: Record Go cache/toolchain facts
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          {
            echo "setup-go cache-hit: ${GO_CACHE_HIT:-unknown}"
            go version
            go env GOOS GOARCH GOMODCACHE GOCACHE
          } | tee ci-logs/go-cache-facts.log
        env:
          GO_CACHE_HIT: ${{ steps.setup-go.outputs.cache-hit }}

      - name: Install Fyne build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
            gcc \
            pkg-config \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxxf86vm-dev \
            libwayland-dev \
            libxkbcommon-dev \
            xorg-dev

      - name: Compile gate (go build ./...)
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          echo "RUN go build ./..." >> ci-logs/gate-order.txt
          go build ./... 2>&1 | tee ci-logs/preflight-build.log
          echo "gate OK: go build ./..." >> ci-logs/gate-order.txt

      - name: gofmt (enforced)
        run: |
          set -euo pipefail
          echo "RUN gofmt -l cmd internal ui" >> ci-logs/gate-order.txt
          # The gate's own evidence MUST outlive the step log: on red, the
          # violation list and the exact formatter version are teed into the
          # consolidated run-log artifact (run #118 root cause: the
          # file list existed only in the step log, so nobody could retrieve
          # which files to reformat).
          {
            echo "toolchain: $(go version)"
            echo "files:"
          } | tee ci-logs/preflight-gofmt.log
          unformatted=$(gofmt -l cmd internal ui | tee -a ci-logs/preflight-gofmt.log)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt violations — run gofmt -w on:"
            echo "$unformatted"
            echo "::error::full list captured at ci-logs/preflight-gofmt.log — retrievable in the SHEYTAN-LA-all-logs.txt run-log artifact"
            exit 1
          fi
          echo "gofmt OK" | tee -a ci-logs/preflight-gofmt.log
          echo "gate OK: gofmt -l cmd internal ui" >> ci-logs/gate-order.txt

      - name: go vet ./...
        run: |
          set -euo pipefail
          echo "RUN go vet ./..." >> ci-logs/gate-order.txt
          go vet ./... 2>&1 | tee ci-logs/preflight-vet.log
          echo "gate OK: go vet ./..." >> ci-logs/gate-order.txt

      # F6 (run 43008361835): the per-job machine-readable diagnostics
      # index — always built, printed to the step log (so it reaches the
      # consolidated run-log artifact) and written to
      # ci-logs/diagnostics-index.json. Best-effort: a diagnostics failure
      # must never mask the original job conclusion.
      - name: Build the per-job diagnostics index (always run)
        if: always()
        run: |
          set -uo pipefail
          bash scripts/ci/diagnostics-index.sh --job "Preflight compile gate" \
            || echo "::error::diagnostics index build failed (non-masking; original job conclusion stands)"
        env:
          DIAGNOSTICS_CACHE_HIT: ${{ steps.setup-go.outputs.cache-hit }}

  # ==========================================================================
  # Audit — the headless core suite, race gates and release-surface gates.
  # Every command here compiles WITHOUT the Fyne/CGO graphics stack: the
  # job's runner has no X11/OpenGL/Wayland development headers, so all Go
  # invocations carry -tags headless (run #54 root cause #1: the untagged
  # stress invocation compiled ui/fyne and died on the missing headers).
  # ==========================================================================
  audit:
    name: Core audit (headless)
    runs-on: ubuntu-26.04
    needs: [preflight]
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Runner OS identity (Ubuntu 26.04 gate)
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          echo "dpkg arch: $(dpkg --print-architecture)"
          echo "ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
          # v1.11.1 (run 41933333132, work order §7): the 24.04 -> 26.04
          # migration is VERIFIED, not a YAML-only change — the exact OS
          # release and architecture are asserted so later runner drift
          # fails loudly here instead of surprising the build.
          . /etc/os-release
          if [ "${ID}" != "ubuntu" ] || [ "${VERSION_ID}" != "26.04" ]; then
            echo "::error::runner identity: expected ubuntu-26.04, got ${ID}-${VERSION_ID} — the Linux lane is pinned to 26.04"
            exit 1
          fi
          if [ "$(dpkg --print-architecture)" != "amd64" ]; then
            echo "::error::runner identity: expected amd64 architecture, got $(dpkg --print-architecture)"
            exit 1
          fi


      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # F1/F7 (run 43008361835): the cache key family is scoped to
          # OS + Go version + the dependency lock (go.sum) — declared
          # explicitly so dependency changes invalidate every lane's
          # cache together and a hit/miss is reproducible.
          cache-dependency-path: go.sum

      - name: go test ./internal/... (headless)
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          echo "RUN go test ./internal/... (headless)" >> ci-logs/gate-order.txt
          go test ./internal/... -tags headless -count=1 -timeout "${GO_TEST_TIMEOUT:-25m}" 2>&1 | tee ci-logs/audit-go-test-headless.log
          echo "gate OK: go test ./internal/... (headless)" >> ci-logs/gate-order.txt

      - name: Race gate (critical concurrent packages)
        run: |
          set -euo pipefail
          echo "RUN go test -race (critical packages)" >> ci-logs/gate-order.txt
          go test -race -tags headless -count=1 ./internal/api ./internal/agent ./internal/sessions ./internal/contextplan ./internal/histref ./internal/runtime ./internal/localipc 2>&1 | tee ci-logs/audit-go-race.log
          echo "gate OK: go test -race (critical packages)" >> ci-logs/gate-order.txt

      # The stress + release-surface gate runs HEADLESS: it pins the
      # workflow/packaging/release contract from a source checkout and has
      # no need for the desktop build. The headless-tag spelling is a
      # release-contract assertion (cmd/stress_release_surface.go 3l).
      - name: Stress + release-surface gate (headless)
        run: |
          set -euo pipefail
          echo "RUN go run -tags headless ./cmd/sheytan-local-agent stress" >> ci-logs/gate-order.txt
          go run -tags headless ./cmd/sheytan-local-agent stress 2>&1 | tee ci-logs/audit-stress-surface.log
          echo "gate OK: stress suite (includes the release_surface scenario)" >> ci-logs/gate-order.txt

      - name: Release + version contract tests
        run: |
          set -euo pipefail
          echo "RUN go test ./internal/releasecontract/" >> ci-logs/gate-order.txt
          go test ./internal/releasecontract/ -count=1 -v 2>&1 | tee ci-logs/audit-release-contract.log
          echo "gate OK: release contract" >> ci-logs/gate-order.txt

      # Consolidated-log collector fixtures: the one-file run log is a
      # primary deliverable, so its construction logic is regression-tested
      # on every run (synthetic fixtures: success, failure, warning-only,
      # empty, missing source, duplicates, red workflow, never-started).
      - name: Consolidated-log collector fixtures
        run: |
          set -euo pipefail
          echo "RUN bash scripts/ci/consolidate-run-log-fixtures.sh" >> ci-logs/gate-order.txt
          bash scripts/ci/consolidate-run-log-fixtures.sh 2>&1 | tee ci-logs/audit-log-fixtures.log
          echo "gate OK: log collector fixtures" >> ci-logs/gate-order.txt

      # F6 (run 43008361835): the diagnostics-index builder is itself
      # regression-tested here (schema, gate statuses, log inventory,
      # redaction) before any job depends on it.
      - name: Diagnostics-index fixture (self-test)
        run: |
          set -euo pipefail
          echo "RUN bash scripts/ci/diagnostics-index.sh --self-test" >> ci-logs/gate-order.txt
          bash scripts/ci/diagnostics-index.sh --self-test 2>&1 | tee ci-logs/audit-diagnostics-index-selftest.log
          echo "gate OK: diagnostics-index self-test" >> ci-logs/gate-order.txt

      # F6: the per-job machine-readable diagnostics index — always built,
      # printed to the step log (so it reaches the consolidated run-log
      # artifact) and written to ci-logs/diagnostics-index.json.
      # Best-effort: never masks the original job conclusion.
      - name: Build the per-job diagnostics index (always run)
        if: always()
        run: |
          set -uo pipefail
          bash scripts/ci/diagnostics-index.sh --job "Core audit (headless)" \
            || echo "::error::diagnostics index build failed (non-masking; original job conclusion stands)"
        env:
          DIAGNOSTICS_CACHE_HIT: ${{ steps.setup-go.outputs.cache-hit }}

  # ==========================================================================
  # UI — the Fyne suite (real widget trees over a fake core), the full
  # non-headless sweep, and the Linux desktop smoke under Xvfb.
  # ==========================================================================
  ui:
    name: Fyne UI gates (Linux)
    runs-on: ubuntu-26.04
    needs: [preflight]
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Runner OS identity (Ubuntu 26.04 gate)
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          echo "dpkg arch: $(dpkg --print-architecture)"
          echo "ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
          # v1.11.1 (run 41933333132, work order §7): the 24.04 -> 26.04
          # migration is VERIFIED, not a YAML-only change — the exact OS
          # release and architecture are asserted so later runner drift
          # fails loudly here instead of surprising the build.
          . /etc/os-release
          if [ "${ID}" != "ubuntu" ] || [ "${VERSION_ID}" != "26.04" ]; then
            echo "::error::runner identity: expected ubuntu-26.04, got ${ID}-${VERSION_ID} — the Linux lane is pinned to 26.04"
            exit 1
          fi
          if [ "$(dpkg --print-architecture)" != "amd64" ]; then
            echo "::error::runner identity: expected amd64 architecture, got $(dpkg --print-architecture)"
            exit 1
          fi


      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # F1/F7 (run 43008361835): the cache key family is scoped to
          # OS + Go version + the dependency lock (go.sum) — declared
          # explicitly so dependency changes invalidate every lane's
          # cache together and a hit/miss is reproducible.
          cache-dependency-path: go.sum

      - name: Install Fyne build prerequisites + smoke tooling
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
            gcc \
            pkg-config \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxxf86vm-dev \
            libwayland-dev \
            libxkbcommon-dev \
            xorg-dev \
            xauth \
            xvfb \
            x11-utils

          # v1.11.1 (work order §7): the Fyne native prerequisites are
          # re-verified on the 26.04 image — pkg-config must actually
          # resolve gl, not merely have the package names installed.
          echo "gl pkg-config version: $(pkg-config --modversion gl)"
          echo "glx pkg-config version: $(pkg-config --modversion glx 2>/dev/null || echo 'n/a')"

      - name: Fyne UI contract + composition suite
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          echo "RUN go test ./ui/fyne/" >> ci-logs/gate-order.txt
          go test ./ui/fyne/ -count=1 -v 2>&1 | tee ci-logs/ui-fyne-tests.log
          echo "gate OK: go test ./ui/fyne/" >> ci-logs/gate-order.txt

      # v1.11.1 button-fit contract: every primary and utility destination
      # is walked at every representative logical size (phone → wide,
      # breakpoint boundaries, minimum probe) — visible buttons at or
      # above their content size, rigid controls inside the content area,
      # every action reachable. Same binary as the suite above; this named
      # stage exists so the gate and its dedicated log are individually
      # visible in the job transcript and the consolidated run log.
      - name: Fyne button fit matrix (logical-size sweep, no clipped labels)
        run: |
          set -euo pipefail
          echo "RUN go test ./ui/fyne/ -run TestButtonFitMatrix" >> ci-logs/gate-order.txt
          go test ./ui/fyne/ -count=1 -v -run "TestButtonFitMatrix|TestLongLabelButtonsShortened" 2>&1 | tee ci-logs/ui-button-fit-matrix.log
          echo "gate OK: button fit matrix" >> ci-logs/gate-order.txt

      - name: Full test sweep (desktop build, no headless tag)
        run: |
          set -euo pipefail
          echo "RUN go test ./... (desktop)" >> ci-logs/gate-order.txt
          go test -count=1 -timeout "${GO_TEST_TIMEOUT:-25m}" ./... 2>&1 | tee ci-logs/ui-go-test-full.log
          echo "gate OK: go test ./... (desktop)" >> ci-logs/gate-order.txt

      - name: Build the real Linux binary for the smoke
        run: |
          set -euo pipefail
          go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/SHEYTAN-LA" ./cmd/sheytan-local-agent
          file "$RUNNER_TEMP/SHEYTAN-LA"

      # Smoke contract (run #54 repair): bounded polling of OBSERVABLE
      # readiness — the X server lock (Xvfb ready) and the real window in
      # the X tree (xwininfo, title = config.AppName) — then a real
      # SIGTERM close with explicit reaping (zombie-safe; kill -0 alone
      # cannot distinguish a live event loop from an unreaped zombie).
      - name: "Desktop launch smoke (Xvfb: boot, window, clean shutdown)"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          cp "$RUNNER_TEMP/SHEYTAN-LA" .
          Xvfb :91 -screen 0 1280x800x24 >/dev/null 2>&1 &
          XVFB_PID=$!
          xvfb_ready=0
          # v1.11.1 (work order §7): readiness is a REAL X-server probe
          # (xdpyinfo answers only when the server accepts clients), not
          # a lock file that can exist before the server is usable.
          for i in $(seq 1 20); do
            if DISPLAY=:91 xdpyinfo >/dev/null 2>&1; then xvfb_ready=1; break; fi
            sleep 0.5
          done
          if [ "$xvfb_ready" -ne 1 ]; then
            echo "::error::desktop smoke: Xvfb never became ready within 10s"
            exit 1
          fi
          # F2 (run 43008361835): the controlled startup-diagnostics mode
          # rides along — monotonic phase timings land in the captured
          # stdout even when the pristine smoke copy never creates a data
          # root. Adds stdout evidence only; behavior is unchanged.
          DISPLAY=:91 SHEYTAN_STARTUP_DIAGNOSTICS=1 ./SHEYTAN-LA > smoke-stdout.log 2>&1 &
          APP_PID=$!
          app_ready=0
          for i in $(seq 1 60); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then break; fi
            if DISPLAY=:91 xwininfo -root -tree 2>/dev/null | grep -q "SHEYTAN-Local-Agent"; then
              app_ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$app_ready" -ne 1 ]; then
            echo "::error::desktop smoke: the application window was never observable within 30s (boot failure — see smoke-stdout.log)"
            cat smoke-stdout.log || true
            kill "$XVFB_PID" 2>/dev/null || true
            exit 1
          fi
          # Soak: the event loop must stay alive under a real desktop session.
          soak_ok=1
          for i in $(seq 1 20); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then soak_ok=0; break; fi
            sleep 0.5
          done
          if [ "$soak_ok" -ne 1 ]; then
            echo "::error::desktop smoke: the application exited during the 10s soak (see smoke-stdout.log)"
            cat smoke-stdout.log || true
            kill "$XVFB_PID" 2>/dev/null || true
            exit 1
          fi
          # Real close path: SIGTERM, then bounded reap (zombie-safe).
          kill -TERM "$APP_PID"
          reaped=0
          for i in $(seq 1 30); do
            st="$(ps -o stat= -p "$APP_PID" 2>/dev/null || true)"
            if [ -z "$st" ]; then reaped=1; break; fi
            case "$st" in
              *Z*) wait "$APP_PID" 2>/dev/null || true; reaped=1; break;;
            esac
            sleep 0.5
          done
          if [ "$reaped" -ne 1 ]; then
            echo "::error::desktop smoke: the application ignored SIGTERM (no clean exit within 15s)"
            kill -KILL "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
            kill "$XVFB_PID" 2>/dev/null || true
            exit 1
          fi
          wait "$APP_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true
          echo "SMOKE OK: window booted (observed in the X tree), event loop alive through the soak, clean SIGTERM shutdown with reap"
          mkdir -p "$GITHUB_WORKSPACE/ci-logs"
          cp smoke-stdout.log "$GITHUB_WORKSPACE/ci-logs/linux-smoke-stdout.log"
          echo "RUN desktop launch smoke (Xvfb)" >> "$GITHUB_WORKSPACE/ci-logs/gate-order.txt"
          echo "gate OK: desktop launch smoke (Xvfb)" >> "$GITHUB_WORKSPACE/ci-logs/gate-order.txt"

      # F4/§5.3 (run 43008361835): the REAL desktop resize smoke — the
      # same binary, a real GLFW window under Xvfb, resized through the
      # logical-size matrix (phone portrait/landscape, tablets, breakpoint
      # boundaries, laptops, desktop, wide) by the app's controlled
      # SHEYTAN_UI_RESIZE_SMOKE mode. Every target must settle at its
      # requested logical size, the resolved navigation zone is printed
      # per size, and the app closes through the SAME graceful shutdown
      # coordinator a user close exercises (exit code 0, never a kill).
      - name: "Desktop resize smoke (Xvfb: logical-size matrix, graceful close)"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/smoke"
          rm -f resize-stdout.log
          # The screen must fit the widest matrix target (2560x1440).
          Xvfb :92 -screen 0 2560x1440x24 >/dev/null 2>&1 &
          XVFB_PID=$!
          xvfb_ready=0
          for i in $(seq 1 20); do
            if DISPLAY=:92 xdpyinfo >/dev/null 2>&1; then xvfb_ready=1; break; fi
            sleep 0.5
          done
          if [ "$xvfb_ready" -ne 1 ]; then
            echo "::error::resize smoke: Xvfb :92 never became ready within 10s"
            kill "$XVFB_PID" 2>/dev/null || true
            exit 1
          fi
          rc=0
          DISPLAY=:92 SHEYTAN_UI_RESIZE_SMOKE=1 SHEYTAN_STARTUP_DIAGNOSTICS=1 ./SHEYTAN-LA > resize-stdout.log 2>&1 || rc=$?
          cp resize-stdout.log "$GITHUB_WORKSPACE/ci-logs/linux-resize-smoke.log"
          if [ "$rc" -ne 0 ]; then
            echo "::error::resize smoke: the application exited with code $rc (see ci-logs/linux-resize-smoke.log)"
            cat resize-stdout.log || true
            kill "$XVFB_PID" 2>/dev/null || true
            exit 1
          fi
          if ! grep -q "UI-RESIZE-SMOKE complete targets=" resize-stdout.log; then
            echo "::error::resize smoke: no completion evidence line (see ci-logs/linux-resize-smoke.log)"
            cat resize-stdout.log || true
            kill "$XVFB_PID" 2>/dev/null || true
            exit 1
          fi
          failed_targets=$(grep -c "ok=false" resize-stdout.log || true)
          if [ "$failed_targets" -ne 0 ]; then
            echo "::error::resize smoke: $failed_targets resize target(s) did not settle at the requested logical size (see ci-logs/linux-resize-smoke.log)"
            grep "ok=false" resize-stdout.log || true
            kill "$XVFB_PID" 2>/dev/null || true
            exit 1
          fi
          echo "RESIZE SMOKE OK: every logical-size target settled, navigation zone recorded per size, graceful coordinator close (exit 0)"
          kill "$XVFB_PID" 2>/dev/null || true
          echo "RUN desktop resize smoke (Xvfb matrix)" >> "$GITHUB_WORKSPACE/ci-logs/gate-order.txt"
          echo "gate OK: desktop resize smoke (Xvfb matrix)" >> "$GITHUB_WORKSPACE/ci-logs/gate-order.txt"

      # F6: the per-job machine-readable diagnostics index (always run).
      - name: Build the per-job diagnostics index (always run)
        if: always()
        run: |
          set -uo pipefail
          bash scripts/ci/diagnostics-index.sh --job "Fyne UI gates (Linux)" \
            || echo "::error::diagnostics index build failed (non-masking; original job conclusion stands)"
        env:
          DIAGNOSTICS_CACHE_HIT: ${{ steps.setup-go.outputs.cache-hit }}

  # ==========================================================================
  # Windows x64 — the native build of SHEYTAN-LA.exe (MSYS2 UCRT64 CGO for
  # Fyne), PE verification, launch smoke, portable ZIP + NSIS installer.
  # ==========================================================================
  build-windows:
    name: Windows x64
    # v1.11.1 maintenance: the EXPLICIT supported label (windows-2025 =
    # Windows Server 2025, x64), replacing the moving windows-latest
    # alias. Verified against the actions/runner-images label list on
    # 2026-11-14; the OS build is recorded in ci-logs below.
    runs-on: windows-2025
    needs: [preflight]
    timeout-minutes: 45
    env:
      APP_VERSION: "1.11.1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # F1/F7 (run 43008361835): the cache key family is scoped to
          # OS + Go version + the dependency lock (go.sum) — declared
          # explicitly so dependency changes invalidate every lane's
          # cache together and a hit/miss is reproducible.
          cache-dependency-path: go.sum

      # F7 (run 43008361835): cache hit/miss recorded per job (allowlisted
      # toolchain facts only; PowerShell captures $LASTEXITCODE after each
      # native command — the facts log is best-effort evidence, never a
      # gate).
      - name: Record Go cache/toolchain facts
        run: |
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          "setup-go cache-hit: ${env:GO_CACHE_HIT}" | Add-Content -Path ci-logs/win-go-cache-facts.log -Encoding utf8NoBOM
          # v1.11.1 maintenance: the explicit runner label's actual OS
          # build, recorded beside the toolchain facts (runner drift is
          # visible in the consolidated run log).
          (Get-CimInstance Win32_OperatingSystem).Caption + " (build " + (Get-CimInstance Win32_OperatingSystem).BuildNumber + ")" | Add-Content -Path ci-logs/win-go-cache-facts.log -Encoding utf8NoBOM
          go version 2>&1 | Add-Content -Path ci-logs/win-go-cache-facts.log -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::go version failed (exit $LASTEXITCODE)"; throw "cache facts: go version failed" }
          go env GOOS GOARCH GOMODCACHE GOCACHE 2>&1 | Add-Content -Path ci-logs/win-go-cache-facts.log -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::go env failed (exit $LASTEXITCODE)"; throw "cache facts: go env failed" }
          Get-Content ci-logs/win-go-cache-facts.log
        env:
          GO_CACHE_HIT: ${{ steps.setup-go.outputs.cache-hit }}

      # APP_VERSION derives from the ONE Go authority (internal/config
      # AppVersion) via the CGO-free resolver — run #54 root cause: the
      # full agent binary needs the Fyne CGO toolchain, which the version
      # step must never require. printversion compiles in ~1s with
      # CGO_ENABLED=0 and fails closed on malformed versions.
      - name: Resolve APP_VERSION from the Go authority
        env:
          CGO_ENABLED: "0"
        run: |
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          $raw = go run ./cmd/printversion --plain 2>&1
          $code = $LASTEXITCODE
          $raw | Add-Content -Path ci-logs/win-version-resolution.log -Encoding utf8NoBOM
          if ($code -ne 0) {
            Write-Host "::error::printversion exited $code — version resolution failed (output above)"
            throw "version resolution failed with exit code $code"
          }
          $resolved = ([string]$raw).Trim()
          if ($resolved -notmatch '^\d+\.\d+\.\d+$') {
            Write-Host "::error::printversion produced a malformed version: '$resolved'"
            throw "malformed version from the Go authority: $resolved"
          }
          if ($resolved -ne $env:APP_VERSION) {
            Write-Host "::error::workflow APP_VERSION ($env:APP_VERSION) disagrees with internal/config.AppVersion ($resolved) — one authority only"
            throw "version authority mismatch"
          }
          Write-Host "APP_VERSION = $resolved (matches internal/config.AppVersion)"
          "EXIT_CODE: 0 PASS" | Add-Content -Path ci-logs/win-version-resolution.log -Encoding utf8NoBOM

      # ------------------------------------------------------------------
      # Mesa acquisition (run #120 fix 3): the archive is acquired EARLY —
      # immediately after version resolution, BEFORE the ~10-minute CGO
      # build — so an acquisition failure reds the job at minute 1 with a
      # named cause instead of minute 13 bare. This step pair owns the
      # cache restore beside it and the ENTIRE acquisition discipline
      # (run #120 fix 2B, candidate B):
      #   - $ProgressPreference = 'SilentlyContinue' before any IWR (the
      #     default progress rendering throttles large downloads on CI),
      #   - up to 3 Invoke-WebRequest attempts,
      #   - a curl.exe fallback (--retry 3, preinstalled on the runner)
      #     before giving up,
      #   - the checksum gate re-applied in ALL cases (cache or download —
      #     a cached file is not a trusted file until re-hashed); the
      #     checksum remains the only trust anchor,
      #   - every failure path emits a titled ::error naming the stage,
      #     the attempt count and the got/want hashes; the step transcript
      #     (download attempt lines + hash result) tees into
      #     ci-logs/win-mesa-acquire.log → the consolidated run-log artifact.
      # Mesa pin (verified 2026-10-30 against the real release asset):
      #   repo/release : pal1000/mesa-dist-win  tag 26.2.5
      #   asset        : mesa3d-26.2.5-release-msvc.7z (70,248,244 bytes)
      #   sha256       : 997123ef4ce8896204ab912d5b54f19372c487ff9835bcefafa2fca23b8953c2
      # ------------------------------------------------------------------
      - name: Restore pinned Mesa archive (cache, keyed by sha256)
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/mesa3d-26.2.5-release-msvc.7z
          key: mesa3d-26.2.5-release-msvc-sha256-997123ef4ce8896204ab912d5b54f19372c487ff9835bcefafa2fca23b8953c2

      - name: Acquire pinned Mesa archive (cache-or-download, verify checksum)
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          $mesaLog = "ci-logs/win-mesa-acquire.log"
          function Log([string]$m) { Write-Host $m; Add-Content -Path $mesaLog -Value $m -Encoding utf8NoBOM }
          $mesaUrl = "https://github.com/pal1000/mesa-dist-win/releases/download/26.2.5/mesa3d-26.2.5-release-msvc.7z"
          $mesaSha256 = "997123ef4ce8896204ab912d5b54f19372c487ff9835bcefafa2fca23b8953c2"
          $mesaArchive = Join-Path $env:RUNNER_TEMP "mesa3d-26.2.5-release-msvc.7z"
          $stage = "resolve-source"
          try {
            if (Test-Path $mesaArchive) {
              Log "pinned Mesa archive present after cache restore — re-verifying (cached is not trusted until re-hashed)"
            } else {
              Log "pinned Mesa archive not restored from cache — downloading $mesaUrl"
              $stage = "download"
              $downloaded = $false
              for ($attempt = 1; $attempt -le 3 -and -not $downloaded; $attempt++) {
                try {
                  Log ("download attempt {0}/3 via Invoke-WebRequest (progress rendering disabled)" -f $attempt)
                  Invoke-WebRequest -Uri $mesaUrl -OutFile $mesaArchive -ErrorAction Stop
                  $downloaded = $true
                  Log ("download attempt {0} succeeded ({1} bytes)" -f $attempt, (Get-Item $mesaArchive).Length)
                } catch {
                  Log ("download attempt {0} failed: {1}" -f $attempt, $_.Exception.Message)
                  if (Test-Path $mesaArchive) { Remove-Item $mesaArchive -Force -ErrorAction SilentlyContinue }
                }
              }
              if (-not $downloaded) {
                $stage = "download-curl-fallback"
                Log "all 3 Invoke-WebRequest attempts failed — falling back to curl.exe -L --retry 3 (preinstalled on the runner)"
                & curl.exe -L --retry 3 --fail --show-error --output $mesaArchive $mesaUrl 2>&1 | ForEach-Object { Log ("curl: {0}" -f $_) }
                if ($LASTEXITCODE -ne 0 -or -not (Test-Path $mesaArchive)) {
                  Log ("::error::Mesa acquisition failed: 3 Invoke-WebRequest attempts and the curl.exe fallback all failed (curl exit {0}; last IWR error and curl output above) — failing closed" -f $LASTEXITCODE)
                  throw ("Mesa acquisition failed after 3 Invoke-WebRequest attempts and the curl.exe fallback (curl exit {0})" -f $LASTEXITCODE)
                }
                Log ("curl.exe fallback succeeded ({0} bytes)" -f (Get-Item $mesaArchive).Length)
              }
            }
            $stage = "checksum"
            $hash = (Get-FileHash -Algorithm SHA256 $mesaArchive).Hash.ToLowerInvariant()
            Log ("sha256 got {0}" -f $hash)
            Log ("sha256 want {0}" -f $mesaSha256)
            if ($hash -ne $mesaSha256) {
              Remove-Item $mesaArchive -Force
              Log ("::error::Mesa checksum mismatch: got {0}, want {1} — failing closed, archive deleted so a bad copy is never cached" -f $hash, $mesaSha256)
              throw ("Mesa checksum mismatch: got {0}, want {1}" -f $hash, $mesaSha256)
            }
            Log "pinned Mesa archive VERIFIED (sha256 OK) at $mesaArchive — the staging step lists + extracts it after the build"
          } catch {
            Log ("::error::Mesa acquisition failed at stage '{0}': {1}" -f $stage, $_.Exception.Message)
            throw
          }

      # MSYS2 UCRT64 toolchain for Fyne's CGO build (pinned package set per
      # the official Fyne Windows prerequisites). MINGW64 is deprecated per
      # msys2's October 2026 announcement — UCRT64 is the supported CRT.
      - name: Setup MSYS2 (UCRT64 GCC for Fyne CGO)
        # v1.11.1 maintenance: ordinary upstream release tag (never a
        # commit-hash pin — the repo-wide action-reference policy).
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-pango
            mingw-w64-ucrt-x86_64-gtk3
            git
          release: true

      - name: Put UCRT64 on PATH and verify the CGO toolchain
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          gcc --version | head -1
          echo "CGO toolchain ready (UCRT64)"

      - name: Headless core tests (windows/amd64)
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          $env:CGO_ENABLED = "1"
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          go test -tags headless -count=1 -timeout "${{ env.GO_TEST_TIMEOUT }}" ./internal/... 2>&1 | Tee-Object -FilePath "ci-logs/win-go-test-headless.log"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::headless core tests failed on windows/amd64 (exit $LASTEXITCODE; failing test names in ci-logs/win-go-test-headless.log)"; throw "headless core tests failed (windows/amd64)" }

      - name: Build the Fyne UI tests (windows/amd64 compile gate)
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          $env:CGO_ENABLED = "1"
          go vet ./ui/fyne/ 2>&1 | Tee-Object -FilePath "ci-logs/win-ui-vet.log"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::ui/fyne vet failed on windows/amd64 (exit $LASTEXITCODE; output in ci-logs/win-ui-vet.log)"; throw "ui/fyne vet failed (windows/amd64)" }

      # ------------------------------------------------------------------
      # v1.11.1 Windows IPC repair: the REAL production CoreClient over
      # the REAL Windows named pipe. This is the gate the green run
      # 43455711025 never had — a visible window proved nothing about the
      # production client's ability to perform an authenticated request
      # through localipc.Serve. The transport contract tests (busy-pipe
      # budget, caller-deadline bounds, cancellation) run alongside; the
      # named-pipe integration exercises handshake, representative
      # read-only APIs, the WebSocket attach path with a normal close,
      # and wrong-key refusal. No GPU, no model, no outbound network.
      # ------------------------------------------------------------------
      - name: Windows named-pipe CoreClient integration (production client over localipc.Serve)
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          $env:CGO_ENABLED = "1"
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          go test ./internal/localipc/ -count=1 -timeout 15m -v 2>&1 | Tee-Object -FilePath "ci-logs/win-localipc-tests.log"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::localipc transport tests failed on windows/amd64 (exit $LASTEXITCODE; output in ci-logs/win-localipc-tests.log)"; throw "localipc transport tests failed (windows/amd64)" }
          go test ./ui/fyne/ -count=1 -timeout 15m -v -run "TestCoreClientEndToEndOverWindowsNamedPipe|TestCoreClientRejectsWrongKeyWindows" 2>&1 | Tee-Object -FilePath "ci-logs/win-ipc-integration.log"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Windows named-pipe CoreClient integration failed (exit $LASTEXITCODE; output in ci-logs/win-ipc-integration.log) — the production client cannot reach the core through the pipe"; throw "Windows named-pipe CoreClient integration failed" }
          Write-Host "IPC integration gate: production CoreClient handshake + API + WebSocket over the Windows named pipe PASSED"

      - name: "Windows resource pipeline (gen-syso: icon + version + DPI manifest)"
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          $env:CGO_ENABLED = "1"
          go run ./scripts/gen-syso
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::gen-syso failed (exit $LASTEXITCODE) — the Windows resource pipeline (icon + version + DPI manifest) could not be generated"; throw "gen-syso failed" }

      # v1.11.1 MINIMAL INSTALLED ROOT (operator request): the installed
      # application directory carries ONLY the runtime-required items —
      # the executable, the launcher, Uninstall.exe (installer-managed)
      # and the canonical data/ tree. Every STATIC file (license, install
      # README, build manifest, signature, brand icon) is consolidated
      # under resources/docs and resources/brand — one obvious folder per
      # class, one payload authority (the ZIP, the installer and the
      # generated uninstall manifest all consume THIS staging tree).
      # The historical root-level models/ and workspace/ placeholder
      # directories are RETIRED from the shipped payload: the canonical
      # data root is <AppRoot>\data (the runtime's one-time
      # MigrateAppRootDirectData fold still accepts REAL legacy roots and
      # never deletes user-created ones).
      - name: Stage the portable application tree
        run: |
          New-Item -ItemType Directory -Force -Path "dist/windows/app/${{ env.WIN_PKG_ROOT }}/resources/docs" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist/windows/app/${{ env.WIN_PKG_ROOT }}/resources/brand" | Out-Null
          Copy-Item "packaging/SHEYTAN-LA.bat" "dist/windows/app/${{ env.WIN_PKG_ROOT }}/SHEYTAN-LA.bat"
          Copy-Item "LICENSE.md" "dist/windows/app/${{ env.WIN_PKG_ROOT }}/resources/docs/LICENSE.md"
          Copy-Item "SIGNATURE" "dist/windows/app/${{ env.WIN_PKG_ROOT }}/resources/docs/SIGNATURE"
          Copy-Item "build/sheytan.ico" "dist/windows/app/${{ env.WIN_PKG_ROOT }}/resources/brand/sheytan.ico"

      - name: Build SHEYTAN-LA.exe (windowsgui subsystem)
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          $env:CGO_ENABLED = "1"
          # -H=windowsgui is the STRESS PIN (3g) — kept. -s -w strips the
          # symbol tables and DWARF debug info (v1.11.0 size work: ~41%
          # smaller PE locally, Go 1.27.3, same toolchain).
          go build -ldflags "-H=windowsgui -s -w" -o "dist/windows/app/${{ env.WIN_PKG_ROOT }}/SHEYTAN-LA.exe" ./cmd/sheytan-local-agent
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::SHEYTAN-LA.exe build failed (go build exit $LASTEXITCODE, windowsgui subsystem, CGO toolchain above)"; throw "SHEYTAN-LA.exe build failed" }

      - name: Verify the PE (x86-64, windowsgui)
        run: |
          $exe = "dist/windows/app/${{ env.WIN_PKG_ROOT }}/SHEYTAN-LA.exe"
          if (-not (Test-Path $exe)) { Write-Host "::error::PE verify guard: built executable missing at $exe"; throw "built executable missing: $exe" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { Write-Host "::error::PE verify guard: $exe is not a PE binary (missing MZ header)"; throw "not a PE binary (missing MZ)" }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45) { Write-Host "::error::PE verify guard: PE signature missing in $exe (peOffset=$peOffset)"; throw "PE signature missing" }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { Write-Host ("::error::PE verify guard: PE machine = 0x{0:X4}, want x86-64 (0x8664) in {1}" -f $machine, $exe); throw ("PE machine = 0x{0:X4}, want x86-64 (0x8664)" -f $machine) }
          Write-Host "PE OK: x86-64"

      # ------------------------------------------------------------------
      # ZIP purity foundation (run #118 defect): the launch smoke NEVER
      # runs inside the staging tree. The app's portable data root
      # (<AppRoot>\data: app.log, crash reports) is written beside the
      # exe it actually launches — so the smoke launches from a full copy
      # under RUNNER_TEMP and the staging tree stays pristine for the ZIP
      # and NSIS steps that follow.
      # Software GL for the GPU-less hosted runner (run #117 root
      # hypothesis: windows-latest reports only a Basic Display Adapter,
      # software GL 1.1 / WARP Direct3D-only, so GLFW cannot create a
      # usable context and window creation never completes): a pinned
      # Mesa llvmpipe build is placed BESIDE THE COPY's exe (DLL search
      # order picks it up before the system one).
      #
      # TWO-DLL DEPLOYMENT CONTRACT (run #119 root cause — do not
      # "simplify" back to one DLL): since Mesa 21.3.0 the Gallium
      # megadriver is SEPARATED from opengl32.dll. The MSVC
      # x64/opengl32.dll is a thin forwarder (~136 KB) that statically
      # imports its companion x64/libgallium_wgl.dll (~61.9 MB); a
      # per-application deployment of opengl32.dll ALONE kills the
      # process at loader level with 0xC0000135 (STATUS_DLL_NOT_FOUND)
      # before main() runs — exactly run #119's Windows smoke red. The
      # smoke copy therefore carries BOTH DLLs, verified in the pinned
      # archive by listing before extraction, and GALLIUM_DRIVER=llvmpipe
      # makes the driver choice explicit in the launch step.
      #
      # The shipped ZIP and installer must NEVER contain either Mesa DLL
      # — enforced by the purity assertions in "Verify Windows ZIP" and
      # the payload generator guard, not by convention.
      # Mesa pin (verified 2026-10-30: asset sha256 recomputed from the
      # real release download; both x64 entries confirmed by 7z l):
      #   repo/release : pal1000/mesa-dist-win  tag 26.2.5
      #   asset        : mesa3d-26.2.5-release-msvc.7z (70,248,244 bytes)
      #   sha256       : 997123ef4ce8896204ab912d5b54f19372c487ff9835bcefafa2fca23b8953c2
      #   entries      : x64/opengl32.dll (139,264 B)
      #                  x64/libgallium_wgl.dll (61,880,320 B)
      # Checksum mismatch or a missing entry => fail closed, nothing placed.
      # ------------------------------------------------------------------
      # Section-5 speed item + run #120 fix 3: the 70 MB pinned Mesa
      # archive is cached (keyed by its exact sha256) and acquired EARLY by
      # the "Acquire pinned Mesa archive" step near the top of the job
      # (cache restore beside it, checksum gate re-applied in all cases).
      # The staging step below only CONSUMES the verified archive: smoke
      # copy, purity guards, listing contract check, two-filter extraction,
      # two-DLL placement.
      - name: Stage smoke copy (purity + two-DLL placement)
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          $stageLog = "ci-logs/win-smoke-staging.log"
          function Log([string]$m) { Write-Host $m; Add-Content -Path $stageLog -Value $m -Encoding utf8NoBOM }
          $stage = "smoke-copy"
          try {
            $src = (Resolve-Path "dist/windows/app/${{ env.WIN_PKG_ROOT }}").Path
            $smokeRoot = Join-Path $env:RUNNER_TEMP "win-smoke\${{ env.WIN_PKG_ROOT }}"
            if (Test-Path $smokeRoot) { Remove-Item -Recurse -Force $smokeRoot }
            New-Item -ItemType Directory -Force -Path (Split-Path $smokeRoot) | Out-Null
            Copy-Item -Recurse -Force $src $smokeRoot
            if (-not (Test-Path (Join-Path $smokeRoot "SHEYTAN-LA.exe"))) {
              Log ("::error::staging guard fired at stage '{0}': smoke copy is missing SHEYTAN-LA.exe under {1} — failing closed" -f $stage, $smokeRoot)
              throw ("smoke copy is missing SHEYTAN-LA.exe under {0}" -f $smokeRoot)
            }
            $stage = "purity-guards"
            $stagingData = "dist/windows/app/${{ env.WIN_PKG_ROOT }}/data"
            if (Test-Path $stagingData) {
              Log ("::error::staging guard fired at stage '{0}': pristine-staging violation — {1} exists BEFORE the smoke; upstream steps leaked residue" -f $stage, $stagingData)
              throw ("pristine-staging violation: {0} exists BEFORE the smoke" -f $stagingData)
            }
            # Purity guard (two DLLs): neither Mesa DLL may ever enter the
            # staging tree; they exist only inside the smoke copy.
            foreach ($banned in @("opengl32.dll", "libgallium_wgl.dll")) {
              if (Test-Path "dist/windows/app/${{ env.WIN_PKG_ROOT }}/$banned") {
                Log ("::error::staging guard fired at stage '{0}': purity violation — {1} must never enter the staging tree" -f $stage, $banned)
                throw ("purity violation: {0} must never enter the staging tree" -f $banned)
              }
            }
            $stage = "listing-contract"
            $mesaArchive = Join-Path $env:RUNNER_TEMP "mesa3d-26.2.5-release-msvc.7z"
            if (-not (Test-Path $mesaArchive)) {
              Log ("::error::staging guard fired at stage '{0}': pinned Mesa archive absent at {1} — the 'Acquire pinned Mesa archive' step did not run or failed; failing closed" -f $stage, $mesaArchive)
              throw ("pinned Mesa archive absent: {0}" -f $mesaArchive)
            }
            # List before extracting: the two-DLL deployment contract is
            # checked against the archive's ACTUAL entries, not assumptions.
            # Run #120 fix 2A (candidate A — listing separator sensitivity):
            # the RAW 7z listing tail is teed into the staging log (the one
            # artifact that settles A-vs-B without a hosted step log), every
            # parsed token is NORMALIZED to forward-slash separators before
            # filtering and comparing (Windows 7-Zip may render archive entry
            # paths with backslash separators, which made the previous
            # literal-string comparison fail the contract), and the required
            # entry comparison is case-insensitive. The extraction filters
            # below are NOT separator-sensitive in the same way (7z matches
            # archive-internal paths), which is why run #119's extraction
            # worked on the runner while a raw-string listing comparison
            # could fail.
            $listing = & "C:\Program Files\7-Zip\7z.exe" l $mesaArchive | Out-String
            $rawLines = @($listing -split "`r?`n")
            $rawTail = ($rawLines | Select-Object -Last 12) -join "`n"
            Log "raw 7z listing tail (last 12 lines):"
            Log $rawTail
            $x64Entries = @($rawLines |
              ForEach-Object { ($_ -split '\s+')[-1] } |
              Where-Object { $_ -and $_.Trim() -ne "" } |
              ForEach-Object { $_.Trim() -replace '\\', '/' } |
              Where-Object { $_ -like "x64/*.dll" } |
              Sort-Object -Unique)
            Log ("parsed x64 DLL entries (normalized to forward slashes): {0}" -f ($x64Entries -join ', '))
            foreach ($required in @("x64/opengl32.dll", "x64/libgallium_wgl.dll")) {
              $hit = @($x64Entries | Where-Object { $_.ToLowerInvariant() -eq $required.ToLowerInvariant() })
              if ($hit.Count -eq 0) {
                Log ("::error::Mesa archive contract violation at stage '{0}': '{1}' absent from the pinned 26.2.5 release-msvc archive — the two-DLL per-app deployment (Gallium megadriver separation since 21.3.0) cannot be satisfied; RAW listing tail follows" -f $stage, $required)
                Log $rawTail
                throw ("Mesa archive contract violation: '{0}' absent from the pinned 26.2.5 release-msvc archive" -f $required)
              }
            }
            $stage = "two-dll-extraction"
            $mesaExtract = Join-Path $env:RUNNER_TEMP "mesa3d-extract"
            if (Test-Path $mesaExtract) { Remove-Item -Recurse -Force $mesaExtract }
            New-Item -ItemType Directory -Force -Path $mesaExtract | Out-Null
            # ONE invocation, BOTH DLLs, same pinned archive, same sha256.
            & "C:\Program Files\7-Zip\7z.exe" e "$mesaArchive" "-o$mesaExtract" "x64/opengl32.dll" "x64/libgallium_wgl.dll" -y | Out-Null
            if ($LASTEXITCODE -ne 0) {
              Log ("::error::staging guard fired at stage '{0}': 7z extraction of the Mesa two-DLL set failed with exit {1} — failing closed" -f $stage, $LASTEXITCODE)
              throw ("7z extraction of the Mesa two-DLL set failed (exit {0})" -f $LASTEXITCODE)
            }
            $stage = "two-dll-placement"
            foreach ($name in @("opengl32.dll", "libgallium_wgl.dll")) {
              $dll = Join-Path $mesaExtract $name
              if (-not (Test-Path $dll)) {
                Log ("::error::staging guard fired at stage '{0}': extracted Mesa {1} missing under {2} — failing closed" -f $stage, $name, $mesaExtract)
                throw ("extracted Mesa {0} missing under {1}" -f $name, $mesaExtract)
              }
              Copy-Item $dll (Join-Path $smokeRoot $name) -Force
            }
            Log "smoke copy staged at $smokeRoot with pinned Mesa llvmpipe opengl32.dll + libgallium_wgl.dll (sha256 verified by the acquire step, two-DLL contract satisfied, purity guards passed)"
          } catch {
            Log ("::error::smoke staging failed at stage '{0}': {1}" -f $stage, $_.Exception.Message)
            throw
          }

      # v1.11.1 (run 41933333132, P1-C): the audit decision contract is
      # pinned by deterministic local fixtures BEFORE the real smoke
      # depends on it — complete closure = PASS, missing module = FAIL(2),
      # malformed/non-PE/parse/runtime = ERROR(3, never PASS).
      - name: Dependency audit fixture contract
        run: |
          ./scripts/ci/ImportAudit.Tests.ps1

      # v1.11.1 (run 42502043636 work order §3.3 item 6): the package gate
      # decision contract is pinned by deterministic local fixtures BEFORE
      # the real gate depends on it — all six package states (both missing,
      # ZIP-only, installer-only, empty ZIP, empty installer, both valid)
      # plus the exclusivity of the "package gate: reached" success line.
      - name: Package gate fixture contract
        run: |
          ./scripts/ci/PackageGate.Tests.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::package gate fixture contract violated (exit $LASTEXITCODE) — the fail-closed gate truth table drifted"; throw "package gate fixture contract violated (exit $LASTEXITCODE)" }

      # Pre-launch dependency audit (run #119): 0xC0000135 is raised by
      # the Windows loader while resolving the STATIC import chain at
      # process init — before main() runs, so nothing can log it and a
      # bare exit code is the only symptom. This step reads the static
      # import tables of the smoke copy's load-chain modules (app exe +
      # the two Mesa DLLs) and resolves every imported DLL name in the
      # real loader order (exe dir, System32, PATH) BEFORE launch. Any
      # unresolvable name fails the step with a named ::error, so a
      # future DLL red is diagnosable from the run page alone.
      # v1.11.1 (run 41933333132) — the audit is a RELEASE GATE:
      #   exit 0 = PASS, exit 2 = FAIL (named missing DLL) — throws here;
      #   exit 3 = ERROR (audit could not complete: the script crashed OR
      #   a load-chain module's PE parse failed) — NEVER a pass. The old
      #   wrapper caught a script crash, set $auditExit = 0 and launched
      #   with the audit UNKNOWN — the confirmed fail-open warning of
      #   this run. Now: the crash is recorded as ERROR, the separate
      #   launch-smoke step still runs (launch evidence stays valuable),
      #   and the job is failed at the end of that step by the marker
      #   written here. Full output tees into
      #   ci-logs/win-smoke-dep-audit.log (consolidated run-log artifact).
      - name: Pre-launch dependency audit (static imports, release gate)
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "win-smoke\${{ env.WIN_PKG_ROOT }}"
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          if (Test-Path "ci-logs/win-dep-audit-ERROR.marker") { Remove-Item "ci-logs/win-dep-audit-ERROR.marker" -Force }
          $auditExit = 0
          try {
            & ./scripts/ci/ImportAudit.ps1 -ExeDir $smokeRoot -Modules @("SHEYTAN-LA.exe", "opengl32.dll", "libgallium_wgl.dll") 2>&1 | Tee-Object -FilePath "ci-logs/win-smoke-dep-audit.log"
            $auditExit = $LASTEXITCODE
          } catch {
            # A script-level crash (parse error, unhandled terminating
            # error) is an UNKNOWN audit — classified as ERROR (exit 3
            # semantics), never 0. Diagnostics go to the step log AND
            # the tee'd audit log.
            $diag = "ImportAudit.ps1 crashed before producing an exit code: {0} | stack: {1}" -f $_.Exception.Message, ($_.ScriptStackTrace -replace "\r?\n", " | ")
            Write-Host ("::error::smoke dependency audit: {0} — the dependency closure is UNKNOWN (ERROR is never PASS)" -f $diag)
            $diag | Tee-Object -FilePath "ci-logs/win-smoke-dep-audit.log" -Append
            $auditExit = 3
          }
          if ($auditExit -eq 2) {
            Write-Host "::error::smoke dependency audit: unresolvable static import — the launch would die with 0xC0000135 (named DLL in ci-logs/win-smoke-dep-audit.log)"
            throw "smoke dependency audit failed: unresolvable static import (exit 2)"
          }
          if ($auditExit -ne 0) {
            # ERROR (audit could not run / incomplete closure): record the
            # gate decision; the launch smoke still executes in its own
            # step and collects launch evidence, and ITS step fails the
            # job at the end (marker gate below).
            "audit exit $auditExit — dependency closure UNVERIFIED" | Set-Content "ci-logs/win-dep-audit-ERROR.marker"
            Write-Host "::error::smoke dependency audit: audit exit $auditExit — dependency closure UNVERIFIED; launch smoke proceeds for evidence only, the job gate fails afterwards"
          }

      # Launch smoke (run #54 repair; #55 hardening): bounded polling of
      # observable readiness — process alive + real MainWindowHandle OR a
      # visible top-level window found by PID via EnumWindows (a GUI
      # session can report a zero MainWindowHandle for a window that IS
      # mapped — so one observation path is never the whole truth). The
      # app's stdout/stderr are captured to a log so a red run carries its
      # own diagnostics instead of a bare timeout. Then a short soak, a
      # GRACEFUL close attempt, and force termination only as the
      # documented last resort. The 60s boot budget is unchanged.
      - name: "Launch smoke (window + IPC handshake + core read + logging persistence + graceful close)"
        run: |
          # Launch target is the RUNNER_TEMP copy (with the pinned Mesa
          # DLL beside the exe), never the staging tree. Every hardened
          # behavior from #54/#55 is unchanged: dual observation path,
          # stdout/stderr redirect, 60s budget, 12s soak,
          # CloseMainWindow first, force-terminate last resort.
          $smokeRoot = Join-Path $env:RUNNER_TEMP "win-smoke\${{ env.WIN_PKG_ROOT }}"
          if (-not (Test-Path (Join-Path $smokeRoot "SHEYTAN-LA.exe"))) {
            Write-Host "::error::launch smoke guard: smoke copy missing SHEYTAN-LA.exe under $smokeRoot — the staging step did not run or failed"
            throw "smoke copy missing SHEYTAN-LA.exe under $smokeRoot — the staging step did not run"
          }
          $exe = Join-Path (Resolve-Path $smokeRoot) "SHEYTAN-LA.exe"
          $smokeLog = Join-Path (Get-Location) "smoke-app-output.log"
          # Explicit, deterministic software-GL driver choice (the proven
          # GPU-less runner pattern); Start-Process inherits this env.
          $env:GALLIUM_DRIVER = "llvmpipe"
          # F2 (run 43008361835): the controlled startup-diagnostics mode
          # rides along — monotonic phase timings land in the captured
          # stdout even when the pristine smoke copy never creates a data
          # root. Adds stdout evidence only; behavior is unchanged.
          $env:SHEYTAN_STARTUP_DIAGNOSTICS = "1"
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru `
                 -RedirectStandardOutput $smokeLog -RedirectStandardError ($smokeLog + ".err")
          $bootDeadline = (Get-Date).AddSeconds(60)
          $booted = $false
          $windowSeen = $false
          $enumSeen = $false
          Add-Type -Namespace Smoke -Name Win -MemberDefinition @"
          [DllImport("user32.dll")] public static extern bool EnumWindows(EnumWindowsProc cb, IntPtr lp);
          [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
          [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
          [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, System.Text.StringBuilder t, int n);
          public delegate bool EnumWindowsProc(IntPtr h, IntPtr lp);
          "@
          function Get-CandidateWindows([uint32]$targetPid) {
            $found = New-Object System.Collections.Generic.List[string]
            $cb = [Smoke.Win+EnumWindowsProc]{ param($h, $lp)
              [uint32]$wpid = 0
              $null = [Smoke.Win]::GetWindowThreadProcessId($h, [ref]$wpid)
              if ($wpid -eq $targetPid -and [Smoke.Win]::IsWindowVisible($h)) {
                $sb = New-Object System.Text.StringBuilder 256
                $null = [Smoke.Win]::GetWindowText($h, $sb, 256)
                $found.Add("hwnd=0x{0:X} visible title='{1}'" -f $h.ToInt64(), $sb.ToString())
              }
              return $true
            }
            $null = [Smoke.Win]::EnumWindows($cb, [IntPtr]::Zero)
            return $found
          }
          while ((Get-Date) -lt $bootDeadline) {
            if ($p.HasExited) { break }
            $p.Refresh()
            if ($p.MainWindowHandle -ne [IntPtr]::Zero) { $windowSeen = $true; $booted = $true; break }
            if ((Get-CandidateWindows $p.Id).Count -gt 0) { $enumSeen = $true; $booted = $true; break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $booted) {
            Write-Host "::error::launch smoke: the application never produced an observable window within 60s (HasExited=$($p.HasExited) ExitCode=$($p.ExitCode))"
            Write-Host "--- candidate visible windows for PID $($p.Id) ---"
            $cands = Get-CandidateWindows $p.Id
            if ($cands.Count -eq 0) { Write-Host "(none)" } else { $cands | ForEach-Object { Write-Host $_ } }
            Write-Host "--- process threads/modules snapshot ---"
            try { $p.Refresh(); Write-Host "Responding=$($p.Responding) Threads=$($p.Threads.Count) WindowTitle='$($p.MainWindowTitle)'" } catch { Write-Host "process snapshot failed: $($_.Exception.Message)" }
            Write-Host "--- application output (smoke-app-output.log) ---"
            if (Test-Path $smokeLog) { Get-Content $smokeLog -Tail 40 } else { Write-Host "(no stdout captured)" }
            if (Test-Path "$smokeLog.err") { Write-Host "--- application stderr ---"; Get-Content "$smokeLog.err" -Tail 40 }
            # The application's own catcher lives under the portable
            # data root (data\logs\app.log).
            $appLog = Join-Path (Split-Path $exe) "data\logs\app.log"
            if (Test-Path $appLog) { Write-Host "--- data\logs\app.log tail ---"; Get-Content $appLog -Tail 40 }
            Write-Host "::error::launch smoke: Windows launch smoke failed — no observable window within the 60s budget (HasExited=$($p.HasExited), ExitCode=$($p.ExitCode); diagnostics above)"
            throw "Windows launch smoke failed: no observable window"
          }
          Write-Host "window observed (MainWindowHandle: $($p.MainWindowHandle), enumPath: $enumSeen)"

          # ------------------------------------------------------------
          # v1.11.1 Windows IPC repair — the gate MEANING changed: a
          # visible window is necessary but NOT sufficient. The smoke now
          # requires, within a bounded deadline:
          #   1. the app log records a SUCCESSFUL IPC handshake naming
          #      the windows-named-pipe transport;
          #   2. a REAL core read after the handshake (the first session
          #      refresh);
          #   3. the canonical log sinks were created (persistence).
          # A window boot without these is a FAILED smoke.
          # ------------------------------------------------------------
          $appLog = Join-Path (Split-Path $exe) "data\logs\app.log"
          $ipcDeadline = (Get-Date).AddSeconds(30)
          $handshakeSeen = $false
          $refreshSeen = $false
          $logDirSeen = $false
          while ((Get-Date) -lt $ipcDeadline) {
            if ($p.HasExited) { break }
            if (-not $handshakeSeen -and (Test-Path $appLog)) {
              $hits = Select-String -LiteralPath $appLog -Pattern "core handshake successful" -SimpleMatch
              if ($hits) {
                $pipeHit = $hits | Where-Object { $_.Line -match "transport=windows-named-pipe" }
                if ($pipeHit) { $handshakeSeen = $true }
              }
            }
            if (-not $refreshSeen -and (Test-Path $appLog)) {
              if (Select-String -LiteralPath $appLog -Pattern "first session refresh succeeded" -SimpleMatch) { $refreshSeen = $true }
            }
            if (-not $logDirSeen -and (Test-Path $appLog)) {
              if (Select-String -LiteralPath $appLog -Pattern "log directory:" -SimpleMatch) { $logDirSeen = $true }
            }
            if ($handshakeSeen -and $refreshSeen -and $logDirSeen) { break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $handshakeSeen) {
            Write-Host "::error::launch smoke stage IPC-HANDSHAKE: no successful windows-named-pipe handshake record in data\logs\app.log within 30s — a visible window alone is no longer a pass (the run-43455711025 gap)"
            if (Test-Path $appLog) { Write-Host "--- data\logs\app.log tail ---"; Get-Content $appLog -Tail 40 } else { Write-Host "data\logs\app.log was never created (logging persistence failed)" }
            if (Test-Path $smokeLog) { Write-Host "--- stdout tail ---"; Get-Content $smokeLog -Tail 30 }
            if (Test-Path "$smokeLog.err") { Write-Host "--- stderr tail ---"; Get-Content "$smokeLog.err" -Tail 30 }
            throw "Windows launch smoke failed at stage IPC-HANDSHAKE (no handshake record)"
          }
          if (-not $refreshSeen) {
            Write-Host "::error::launch smoke stage CORE-READ: the first session refresh (a real core API read after the handshake) never succeeded within 30s"
            Get-Content $appLog -Tail 40
            throw "Windows launch smoke failed at stage CORE-READ (no successful core read)"
          }
          if (-not $logDirSeen) {
            Write-Host "::error::launch smoke stage LOG-PERSISTENCE: app.log exists but carries no resolved-log-directory startup record"
            Get-Content $appLog -Tail 40
            throw "Windows launch smoke failed at stage LOG-PERSISTENCE (no startup record)"
          }
          Write-Host "IPC gate: handshake successful (windows-named-pipe), first core read succeeded, log directory recorded"

          $soakDeadline = (Get-Date).AddSeconds(12)
          while ((Get-Date) -lt $soakDeadline) {
            if ($p.HasExited) {
              Write-Host "::error::launch smoke: the application exited early with code $($p.ExitCode)"
              if (Test-Path $smokeLog) { Get-Content $smokeLog -Tail 40 }
              throw "Windows launch smoke failed: early exit"
            }
            Start-Sleep -Milliseconds 500
          }
          # Graceful close first — the same path a user's window close takes.
          $null = $p.CloseMainWindow()
          $closed = $false
          $closeDeadline = (Get-Date).AddSeconds(20)
          while ((Get-Date) -lt $closeDeadline) {
            if ($p.HasExited) { $closed = $true; break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $closed) {
            # v1.11.1: force termination is a FAILURE, not a cleanup that
            # still prints SMOKE OK — a candidate that cannot close
            # gracefully does not pass the desktop smoke.
            Write-Host "::error::launch smoke stage GRACEFUL-CLOSE: CloseMainWindow did not exit within 20s — force-terminating as the documented last resort; this is a FAILED smoke, never a pass"
            if (Test-Path $appLog) { Write-Host "--- data\logs\app.log tail ---"; Get-Content $appLog -Tail 40 }
            if (Test-Path $smokeLog) { Write-Host "--- stdout tail ---"; Get-Content $smokeLog -Tail 30 }
            if (Test-Path "$smokeLog.err") { Write-Host "--- stderr tail ---"; Get-Content "$smokeLog.err" -Tail 30 }
            Stop-Process -Id $p.Id -Force
            $p.WaitForExit(15000) | Out-Null
            throw "Windows launch smoke failed at stage GRACEFUL-CLOSE (process had to be force-terminated)"
          }

          # The shutdown evidence must be IN the persisted log: IPC stop,
          # core close and the log-sink close record (bounded — the log
          # is flushed by the process's own exit path).
          $shutDeadline = (Get-Date).AddSeconds(10)
          $ipcStopped = $false
          $sinksClosed = $false
          while ((Get-Date) -lt $shutDeadline) {
            if (Test-Path $appLog) {
              if (-not $ipcStopped -and (Select-String -LiteralPath $appLog -Pattern "ipc stopped" -SimpleMatch)) { $ipcStopped = $true }
              if (-not $sinksClosed -and (Select-String -LiteralPath $appLog -Pattern "log sinks closing" -SimpleMatch)) { $sinksClosed = $true }
            }
            if ($ipcStopped -and $sinksClosed) { break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ipcStopped) {
            Write-Host "::error::launch smoke stage SHUTDOWN-LOG: the 'ipc stopped' record never reached data\logs\app.log"
            if (Test-Path $appLog) { Get-Content $appLog -Tail 40 }
            throw "Windows launch smoke failed at stage SHUTDOWN-LOG (no ipc-stop record)"
          }
          if (-not $sinksClosed) {
            Write-Host "::error::launch smoke stage SHUTDOWN-LOG: the 'log sinks closing' close-outcome record never reached data\logs\app.log"
            if (Test-Path $appLog) { Get-Content $appLog -Tail 40 }
            throw "Windows launch smoke failed at stage SHUTDOWN-LOG (no sink-close record)"
          }

          # Logging persistence: the structured sinks exist (empty is
          # allowed until real calls occur) and the session banner +
          # handshake record survived the clean close.
          $logsDir = Join-Path (Split-Path $exe) "data\logs"
          foreach ($sink in @("app.log", "tools.jsonl", "llm.jsonl")) {
            if (-not (Test-Path (Join-Path $logsDir $sink))) {
              Write-Host "::error::launch smoke stage LOG-PERSISTENCE: expected sink $sink missing under data\logs"
              throw "Windows launch smoke failed at stage LOG-PERSISTENCE (missing $sink)"
            }
          }
          if (-not (Select-String -LiteralPath $appLog -Pattern "session start" -SimpleMatch)) {
            Write-Host "::error::launch smoke stage LOG-PERSISTENCE: the session banner did not persist in app.log"
            throw "Windows launch smoke failed at stage LOG-PERSISTENCE (no session banner)"
          }

          Write-Host "SMOKE OK: window booted, IPC handshake succeeded (windows-named-pipe), core read succeeded, soak survived, graceful close, shutdown records persisted"
          Write-Host "--- application output tail ---"
          if (Test-Path $smokeLog) { Get-Content $smokeLog -Tail 20 }
          Write-Host "--- data\logs\app.log tail ---"
          if (Test-Path $appLog) { Get-Content $appLog -Tail 25 }
          # v1.11.1 dependency-audit gate (release gate, run 41933333132):
          # the launch evidence above was collected even when the audit
          # itself could not run (ERROR) — but ERROR is never PASS, so the
          # job fails here, AFTER the separate smoke outcome was recorded.
          if (Test-Path "ci-logs/win-dep-audit-ERROR.marker") {
            Write-Host (Get-Content "ci-logs/win-dep-audit-ERROR.marker")
            Write-Host "::error::job gate: the pre-launch dependency audit ended in ERROR — the Windows dependency closure is UNVERIFIED and this release candidate is blocked (see ci-logs/win-smoke-dep-audit.log)"
            throw "dependency audit ERROR — dependency closure unverified (job gate)"
          }

      # The smoke copy's own diagnostics must land in the consolidated
      # run-log artifact (run #117: zero diagnostics survived the step log). Red or
      # green, best-effort collection of the app's portable data residue
      # from the COPY (never the staging tree).
      - name: Collect smoke diagnostics into ci-logs (best-effort)
        if: always()
        run: |
          $ErrorActionPreference = "Continue"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "win-smoke\${{ env.WIN_PKG_ROOT }}"
          New-Item -ItemType Directory -Force -Path "ci-logs" | Out-Null
          try {
            $appLogs = @(Get-ChildItem -Path (Join-Path $smokeRoot "data") -Filter "app.log" -Recurse -ErrorAction SilentlyContinue)
            if ($appLogs.Count -gt 0) {
              Copy-Item $appLogs[0].FullName "ci-logs/win-smoke-app.log" -Force
              Write-Host "collected $($appLogs[0].FullName) -> ci-logs/win-smoke-app.log"
            } else { Write-Host "smoke copy produced no app.log (no data root created)" }
            $crashes = @(Get-ChildItem -Path (Join-Path $smokeRoot "data") -Filter "crash-*.log" -Recurse -ErrorAction SilentlyContinue)
            foreach ($c in $crashes) {
              Copy-Item $c.FullName ("ci-logs/win-smoke-" + $c.Name) -Force
              Write-Host "collected $($c.FullName) -> ci-logs/win-smoke-$($c.Name)"
            }
            foreach ($f in @("smoke-app-output.log", "smoke-app-output.log.err")) {
              if (Test-Path $f) { Copy-Item $f ("ci-logs/" + $f) -Force; Write-Host "collected $f -> ci-logs" }
            }
          } catch { Write-Host "diagnostic collection (best-effort) failed: $($_.Exception.Message)" }

      # BUILD-INFO and package metadata (run #54 root cause #3): explicit
      # writes — no here-string indentation traps — each file validated
      # for existence + nonzero size + content marker, UTF-8 without BOM,
      # with the failing path and operation in the error.
      - name: Write BUILD-INFO.txt and package metadata
        run: |
          $root = "dist/windows/app/${{ env.WIN_PKG_ROOT }}"
          if (-not (Test-Path $root)) { Write-Host "::error::BUILD-INFO guard: staging root missing at $root"; throw "staging root missing: $root" }
          foreach ($dir in @("resources/docs", "resources/brand")) {
            if (-not (Test-Path (Join-Path $root $dir))) { Write-Host "::error::BUILD-INFO guard: staging directory missing at $root\$dir"; throw "staging directory missing: $root\$dir" }
          }
          $files = @(
            @{ Path = "$root/resources/docs/BUILD-INFO.txt"; Marker = "version: ${{ env.APP_VERSION }}";
               Lines = @("product: SHEYTAN-LA", "version: ${{ env.APP_VERSION }}", "commit: ${{ github.sha }}", "ui: fyne (one Go UI)") },
            @{ Path = "$root/resources/docs/README.txt"; Marker = "run SHEYTAN-LA.exe";
               Lines = @("SHEYTAN-LA ${{ env.APP_VERSION }} — run SHEYTAN-LA.exe. Models are downloaded in-app; user data lives under data\ next to the executable. Static package content lives under resources\.") }
          )
          foreach ($f in $files) {
            try {
              Set-Content -Path $f.Path -Value $f.Lines -Encoding utf8NoBOM
            } catch {
              Write-Host ("::error::BUILD-INFO guard: writing {0} failed: {1} ({2})" -f $f.Path, $_.Exception.Message, $_.Exception.GetType().FullName)
              throw ("writing {0} failed: {1} ({2})" -f $f.Path, $_.Exception.Message, $_.Exception.GetType().FullName)
            }
            if (-not (Test-Path $f.Path)) { Write-Host "::error::BUILD-INFO guard: write reported success but the file is missing: $($f.Path)"; throw "write reported success but the file is missing: $($f.Path)" }
            $size = (Get-Item $f.Path).Length
            if ($size -le 0) { Write-Host "::error::BUILD-INFO guard: written file is empty: $($f.Path) (size=$size)"; throw "written file is empty: $($f.Path)" }
            $content = Get-Content -Raw -Path $f.Path
            if (-not $content.Contains($f.Marker)) { Write-Host "::error::BUILD-INFO guard: written file lacks the expected content marker '$($f.Marker)': $($f.Path)"; throw "written file lacks the expected content marker '$($f.Marker)': $($f.Path)" }
            Write-Host "wrote $($f.Path) ($size bytes, marker OK)"
          }

      - name: Create Windows ZIP
        run: |
          try {
            Compress-Archive -Path "dist/windows/app/${env:WIN_PKG_ROOT}" -DestinationPath "dist/${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-windows-x64.zip" -Force -ErrorAction Stop
            Write-Host "ZIP created"
          } catch {
            Write-Host ("::error::Create Windows ZIP failed: source dist/windows/app/${env:WIN_PKG_ROOT}, destination dist/${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-windows-x64.zip — {0}" -f $_.Exception.Message)
            throw
          }

      - name: Verify Windows ZIP
        run: |
          $zip = "dist/${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-windows-x64.zip"
          if (-not (Test-Path $zip)) { Write-Host "::error::Verify Windows ZIP guard: ZIP missing at $zip"; throw "ZIP missing: $zip" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $required = @(
              "${env:WIN_PKG_ROOT}/SHEYTAN-LA.exe",
              "${env:WIN_PKG_ROOT}/SHEYTAN-LA.bat",
              "${env:WIN_PKG_ROOT}/resources/docs/README.txt",
              "${env:WIN_PKG_ROOT}/resources/docs/BUILD-INFO.txt",
              "${env:WIN_PKG_ROOT}/resources/docs/LICENSE.md",
              "${env:WIN_PKG_ROOT}/resources/brand/sheytan.ico"
            )
            $names = $archive.Entries.FullName
            foreach ($entry in $required) {
              if ($names -notcontains $entry) { Write-Host "::error::Verify Windows ZIP guard: contracted ZIP entry missing: $entry (entries present: $($names.Count))"; throw "ZIP entry missing: $entry" }
            }
            # ZIP purity assertions (run #118 defect, extended for run
            # #119's two-DLL Mesa contract, extended v1.11.1 for the
            # minimal-root payload): required entries are not enough —
            # forbidden ones must FAIL the build too.
            #   1. nothing under the app's portable data root (a smoke run
            #      inside the staging tree leaves data\app.log residue);
            #   2. never the smoke-provisioned Mesa opengl32.dll;
            #   3. never its megadriver companion libgallium_wgl.dll —
            #      since Mesa 21.3.0 opengl32.dll alone is not a valid
            #      per-app deployment, and NEITHER DLL may ship;
            #   4. never the RETIRED root-level models/ or workspace/
            #      placeholder directories (v1.11.1 minimal root — the
            #      canonical data root is data\; legacy user-created roots
            #      are migrated by the runtime, never shipped as empty
            #      payload duplicates).
            $forbiddenData = "${env:WIN_PKG_ROOT}/data/"
            $forbiddenDlls = @("${env:WIN_PKG_ROOT}/opengl32.dll", "${env:WIN_PKG_ROOT}/libgallium_wgl.dll")
            $forbiddenRoots = @("${env:WIN_PKG_ROOT}/models/", "${env:WIN_PKG_ROOT}/workspace/")
            foreach ($name in $names) {
              if ($name.StartsWith($forbiddenData, [System.StringComparison]::OrdinalIgnoreCase)) {
                Write-Host ("::error::Verify Windows ZIP purity violation: data-root residue entry '{0}' — the smoke must run from the RUNNER_TEMP copy, never the staging tree" -f $name)
                throw ("ZIP purity violation: data-root residue entry '{0}'" -f $name)
              }
              foreach ($forbiddenDll in $forbiddenDlls) {
                if ($name.Equals($forbiddenDll, [System.StringComparison]::OrdinalIgnoreCase)) {
                  Write-Host ("::error::Verify Windows ZIP purity violation: '{0}' present — the Mesa software-GL DLLs are smoke-only and must never ship" -f $name)
                  throw ("ZIP purity violation: '{0}' present" -f $name)
                }
              }
              foreach ($forbiddenRoot in $forbiddenRoots) {
                if ($name.StartsWith($forbiddenRoot, [System.StringComparison]::OrdinalIgnoreCase)) {
                  Write-Host ("::error::Verify Windows ZIP purity violation: retired root-level placeholder entry '{0}' — v1.11.1 minimal installed root (static content lives under resources/, mutable data under data/)" -f $name)
                  throw ("ZIP purity violation: retired root-level placeholder '{0}'" -f $name)
                }
              }
              # v1.11.1 Qt/QML retirement contract (run 42502043636 work
              # order §3.3 items 3-4): no Qt runtime may ever ship inside
              # the portable payload — the application is ONE Go/Fyne UI.
              # Classic Qt deployment shapes are matched case-insensitively
              # on the entry's leaf name under the app root: Qt5*/Qt6* and
              # the Unix-style libQt* runtime DLLs (a windeployqt-style
              # payload or a plugins/ tree carrying Qt DLLs fails here).
              $leaf = if ($name.Contains('/')) { $name.Substring($name.LastIndexOf('/') + 1) } else { $name }
              if ($name.StartsWith("${env:WIN_PKG_ROOT}/", [System.StringComparison]::OrdinalIgnoreCase) -and
                  ($leaf -like 'Qt5*.dll' -or $leaf -like 'Qt6*.dll' -or $leaf -like 'libQt*.dll')) {
                Write-Host ("::error::Verify Windows ZIP purity violation: Qt runtime DLL entry '{0}' — the application is one Go/Fyne UI and must never carry a Qt runtime" -f $name)
                throw ("ZIP purity violation: Qt runtime DLL '{0}' present" -f $name)
              }
            }
            Write-Host "ZIP OK: all contracted entries present; purity assertions passed (no data/ residue, no opengl32.dll, no libgallium_wgl.dll, no root-level models/workspace placeholders)"
          } finally { $archive.Dispose() }

      # NSIS installer: ONE Go executable payload — no Qt runtime, no
      # second UI binary. payload-uninstall.nsh is generated from the
      # staged tree (uninstall symmetry).
      - name: Install NSIS
        run: |
          # v1.11.1 maintenance: NSIS pinned to the verified upstream
          # stable release 3.13 (2026-09-27; Chocolatey package 3.13.0
          # maps to it — verified on community.chocolatey.org and
          # github.com/nsis-dev/nsis/releases/tag/v313). The actual
          # makensis version is recorded in the log below and in
          # ci-logs/win-nsis-version.log.
          choco install nsis --version=3.13.0 -y --no-progress
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::NSIS 3.13.0 install failed (choco exit $LASTEXITCODE) — the installer job cannot build"; throw "NSIS install failed" }
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { Write-Host "::error::makensis not found at $makensis after the NSIS install"; throw "makensis missing" }
          $nsisVersion = (& $makensis "/VERSION") 2>&1
          Write-Host "makensis /VERSION: $nsisVersion"
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          "makensis /VERSION: $nsisVersion" | Add-Content -Path ci-logs/win-nsis-version.log -Encoding utf8NoBOM
          if ("$nsisVersion" -notmatch "^3\.13") { Write-Host "::error::makensis reports version '$nsisVersion', want 3.13.x — the pin did not take effect"; throw "NSIS version mismatch: $nsisVersion" }

      - name: Generate payload-uninstall.nsh (uninstall symmetry)
        run: |
          $root = "dist/windows/app/${{ env.WIN_PKG_ROOT }}"
          $lines = @('!define SHEYTAN_PAYLOAD_UNINSTALL', '!macro SHEYTAN_PAYLOAD_UNINSTALL_FILES')
          # Uninstall symmetry is generated from the PRISTINE staging tree
          # (the smoke runs from the RUNNER_TEMP copy). Assert it: data
          # residue or either Mesa DLL here means the smoke leaked upstream.
          $payloadFiles = @(Get-ChildItem -Recurse -File $root)
          if ($payloadFiles.Count -eq 0) { Write-Host "::error::payload generator guard: staging root has no files at $root"; throw "staging root has no files: $root" }
          foreach ($f in $payloadFiles) {
            $rel = $f.FullName.Substring((Resolve-Path $root).Path.Length + 1)
            if ($rel -like "data\*" -or $rel -eq "opengl32.dll" -or $rel -eq "libgallium_wgl.dll") {
              Write-Host ("::error::payload generator guard: pristine-payload violation — staging tree contains '{0}'; the smoke must never write into dist/windows/app" -f $rel)
              throw ("pristine-payload violation: staging tree contains '{0}'" -f $rel)
            }
          }
          foreach ($f in $payloadFiles) {
            $rel = $f.FullName.Substring((Resolve-Path $root).Path.Length + 1)
            $lines += "  Delete `"`$INSTDIR\$rel`""
          }
          $dirs = Get-ChildItem -Recurse -Directory $root | Sort-Object { $_.FullName.Length } -Descending
          foreach ($d in $dirs) {
            $rel = $d.FullName.Substring((Resolve-Path $root).Path.Length + 1)
            $lines += "  RMDir `"`$INSTDIR\$rel`""
          }
          # Run #124 root cause: the terminator emitted here was the
          # non-NSIS endmacro token, so the generated macro opened and was
          # never closed — makensis aborted on the include with
          # "unterminated (no !macroend found in file)". NSIS closes macros
          # with exactly '!macroend'.
          $lines += '!macroend'
          Set-Content -Path "packaging/nsis/payload-uninstall.nsh" -Value ($lines -join "`r`n")

          # Run #124 post-write validation: that failure was fully
          # deterministic at generation time, so validate the actual file
          # HERE — before makensis reads it — with a titled ::error per
          # failed invariant (one-look diagnosability, same class as every
          # other custom Windows step).
          $gen = "packaging/nsis/payload-uninstall.nsh"
          if (-not (Test-Path -LiteralPath $gen) -or ((Get-Item -LiteralPath $gen).Length -eq 0)) {
            Write-Host "::error::payload-uninstall validation: generated include missing or empty at $gen — the uninstall-symmetry macro cannot be included"
            throw "payload-uninstall validation failed: missing or empty generated include: $gen"
          }
          $genLines = @(Get-Content -LiteralPath $gen | Where-Object { $_.Trim().Length -gt 0 })
          if ($genLines.Count -lt 4) {
            Write-Host "::error::payload-uninstall validation: only $($genLines.Count) non-empty directives in $gen — the guard-define + macro + Delete body + closing macroend structure is incomplete"
            throw "payload-uninstall validation failed: incomplete generated include: $gen"
          }
          $first = $genLines[0].Trim()
          $second = $genLines[1].Trim()
          if ($first -ne '!define SHEYTAN_PAYLOAD_UNINSTALL' -or $second -ne '!macro SHEYTAN_PAYLOAD_UNINSTALL_FILES') {
            Write-Host "::error::payload-uninstall validation: opening directives are '$first' / '$second' in $gen — expected the guard define '!define SHEYTAN_PAYLOAD_UNINSTALL' then the macro '!macro SHEYTAN_PAYLOAD_UNINSTALL_FILES'"
            throw "payload-uninstall validation failed: unexpected opening directives in $gen"
          }
          $last = $genLines[-1].Trim()
          if ($last -ne '!macroend') {
            Write-Host "::error::payload-uninstall validation: final non-empty directive is '$last' in $gen — NSIS closes macros with exactly '!macroend'; any other terminator leaves the macro unterminated (run #124 failed hosted with 'unterminated (no !macroend found in file)')"
            throw "payload-uninstall validation failed: macro not closed by the macroend directive in $gen"
          }
          $macroOpens = @($genLines | Where-Object { $_.Trim() -like '!macro *' }).Count
          $macroCloses = @($genLines | Where-Object { $_.Trim() -eq '!macroend' }).Count
          if ($macroOpens -ne 1 -or $macroCloses -ne 1) {
            Write-Host "::error::payload-uninstall validation: macro directives unbalanced (open=$macroOpens close=$macroCloses) in $gen — exactly one !macro and one closing macroend are expected"
            throw "payload-uninstall validation failed: unbalanced macro directives in $gen"
          }
          $deleteCount = @($genLines | Where-Object { $_.Trim() -like 'Delete *' }).Count
          if ($deleteCount -lt 1) {
            Write-Host "::error::payload-uninstall validation: no generated Delete commands in $gen — the uninstaller would remove nothing"
            throw "payload-uninstall validation failed: no Delete commands in $gen"
          }
          Write-Host "payload-uninstall.nsh validated: guard define + macro open, $deleteCount Delete lines, exactly one closing macroend"
          Write-Host "payload-uninstall.nsh generated"

      - name: Build the NSIS installer
        run: |
          # Script: packaging/nsis/installer.nsi — makensis receives the
          # ABSOLUTE resolved script path. Run #125 lesson (reproduced and
          # fixed on real makensis 3.11): a relative script path makes NSIS's
          # ${__FILEDIR__} predefine RELATIVE too, and the script-directory
          # generated include in installer.nsi then misses (warning 7000) —
          # so the script path gets the same absolute-path discipline the
          # v1.2.0 path contract already applies to BUILDDIR/OUTFILE.
          # -V4: the payload-uninstall marker is emitted with !echo, and
          # makensis prints !echo output ONLY at verbosity 4 ("all output").
          # At the default verbosity the marker NEVER reaches this tee'd
          # log and the assertion below could never pass — the second
          # stacked run #125 defect, found by the local 3.11 reproduction.
          # Run #122 lesson: the red was NAMED but not RETRIEVABLE — the
          # makensis transcript existed only in the auth-gated step log.
          # Every makensis line is now teed into ci-logs/win-nsis-build.log
          # (retrievable in the consolidated run-log artifact), and the
          # payload-uninstall include marker is asserted in that teed log
          # after the build, with a titled ::error on absence.
          $nsi = "packaging/nsis/installer.nsi"
          $nsiAbs = (Resolve-Path $nsi).Path
          $stage = Join-Path (Resolve-Path "dist/windows/app/${{ env.WIN_PKG_ROOT }}") ""
          New-Item -ItemType Directory -Force -Path "ci-logs" | Out-Null
          $nsisLog = "ci-logs/win-nsis-build.log"
          & "C:\Program Files (x86)\NSIS\makensis.exe" "-V4" "-DVERSION=${{ env.APP_VERSION }}" "-DEXE=SHEYTAN-LA.exe" "-DBUILDDIR=$stage" "-DOUTFILE=$(Resolve-Path dist)\${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-windows-x64-installer.exe" "$nsiAbs" 2>&1 | Tee-Object -FilePath $nsisLog
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::makensis failed (exit $LASTEXITCODE) — packaging/nsis/installer.nsi build log above; full transcript teed to $nsisLog"; throw "makensis failed" }
          # Transcript contract (run #125): the teed log must show the
          # script was actually processed, the payload-uninstall marker
          # was emitted, and the installer was written — three greps, one
          # look, each with a titled ::error.
          if (-not (Select-String -LiteralPath $nsisLog -Pattern 'Processing script file' -SimpleMatch)) { Write-Host "::error::NSIS transcript contract: 'Processing script file' NOT found in $nsisLog — makensis never opened the installer script"; throw "NSIS transcript contract: installer script never processed" }
          # Marker contract (documented in installer.nsi itself): when the
          # generated payload-uninstall list is included, the nsi emits
          # "sheytan: payload uninstall list included" into the makensis
          # output. Run #122 shipped without this being enforced. Absent
          # marker → the uninstaller would silently skip the generated
          # payload list (uninstall symmetry broken even on a green build).
          $marker = Select-String -LiteralPath $nsisLog -Pattern 'sheytan: payload uninstall list included' -SimpleMatch
          if (-not $marker) { Write-Host "::error::NSIS marker contract: 'sheytan: payload uninstall list included' NOT found in $nsisLog — payload-uninstall.nsh was not included; the uninstaller would not remove the staged payload"; throw "NSIS payload-uninstall marker missing from makensis log" }
          if (-not (Select-String -LiteralPath $nsisLog -Pattern 'Output:' -SimpleMatch)) { Write-Host "::error::NSIS transcript contract: 'Output:' NOT found in $nsisLog — makensis reported success but never wrote the installer"; throw "NSIS transcript contract: installer output not written" }
          Write-Host "NSIS marker contract: payload uninstall list included (verified in $nsisLog)"

      - name: Verify the installer exists
        run: |
          $inst = "dist/${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-windows-x64-installer.exe"
          if (-not (Test-Path $inst)) { Write-Host "::error::installer guard: installer missing at $inst (makensis reported success)"; throw "installer missing: $inst" }
          $size = (Get-Item $inst).Length
          if ($size -lt 1MB) { Write-Host "::error::installer guard: installer suspiciously small: $size bytes at $inst"; throw "installer suspiciously small: $size bytes" }
          # v1.11.1 (run 42502043636 work order §3.3 item 6): installer PE
          # identity is VALIDATED, never inferred from the .exe suffix. NSIS
          # 3.x installer stubs are 32-bit PEs even when the payload they
          # install is x64-only, so the machine type is accepted as i386
          # (0x014C) or x86-64 (0x8664); the PAYLOAD's x64 identity is
          # enforced separately by "Verify the PE" on SHEYTAN-LA.exe, and
          # the installer's NSIS identity by the marker contract + the real
          # install/uninstall round-trip below.
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $inst))
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { Write-Host "::error::installer guard: $inst is not a PE binary (missing MZ header)"; throw "installer is not a PE binary (missing MZ)" }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45) { Write-Host "::error::installer guard: PE signature missing in $inst (peOffset=$peOffset)"; throw "installer PE signature missing" }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x014C -and $machine -ne 0x8664) { Write-Host ("::error::installer guard: PE machine = 0x{0:X4}, want i386 (0x014C, NSIS stub) or x86-64 (0x8664) in {1}" -f $machine, $inst); throw ("installer PE machine = 0x{0:X4}, want i386 or x86-64" -f $machine) }
          Write-Host ("installer PE OK (machine = 0x{0:X4}; NSIS 3.x stubs are i386, payload x64 enforced on SHEYTAN-LA.exe)" -f $machine)
          Write-Host "installer OK ($size bytes)"

      # ----------------------------------------------------------------------
      # REAL installer round-trip proof (run #125 mandate — the portable
      # launch smoke never proved installation): silently install the
      # ACTUAL compiled installer into a unique isolated path under
      # RUNNER_TEMP, verify the installed payload + registration, seed
      # user-data sentinels, silently uninstall, then prove BOTH payload
      # removal AND data preservation. NSIS silent CLI (Chapter 3 docs):
      # /S with a FINAL /D=<path> (last parameter, unquoted, no spaces);
      # silent uninstall: Uninstall.exe /S with a FINAL _?=<path> (runs in
      # place, does not self-delete, lets the caller wait for the exit
      # code). https://nsis.sourceforge.io/Docs/Chapter3.html
      # Every failure emits a titled ::error naming the stage and the
      # transcript; the transcript reaches the consolidated run-log on red
      # AND green (the run-attempt log collector runs with if: always()).
      # Cleanup is strictly
      # bounded to the unique GUID-named directory under RUNNER_TEMP.
      # ----------------------------------------------------------------------
      - name: "NSIS install/uninstall smoke (payload symmetry + data preservation)"
        run: |
          $ErrorActionPreference = "Stop"
          $log = "ci-logs/win-nsis-install-uninstall-smoke.log"
          New-Item -ItemType Directory -Force -Path "ci-logs" | Out-Null
          Start-Transcript -Path $log -Force | Out-Null
          $base = Join-Path $env:RUNNER_TEMP ("nsis-smoke-" + [guid]::NewGuid().ToString("N"))
          $instDir = Join-Path $base "app"
          $externalData = Join-Path $base "external-data"
          $installer = (Resolve-Path "dist/${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-windows-x64-installer.exe").Path
          $stage = "dist/windows/app/${env:WIN_PKG_ROOT}"
          $stageRoot = (Resolve-Path $stage).Path
          function Fail([string]$Stage, [string]$Msg) {
            Write-Host ("::error::NSIS install/uninstall smoke ({0}): {1} — full transcript teed to ci-logs/win-nsis-install-uninstall-smoke.log" -f $Stage, $Msg)
            throw ("[{0}] {1}" -f $Stage, $Msg)
          }
          try {
            Write-Host "smoke root: $base"
            Write-Host "installer: $installer"
            # Purity snapshot: the smoke must not touch the staging tree.
            $stageFilesBefore = @(Get-ChildItem -Recurse -File $stageRoot | ForEach-Object { $_.FullName.Substring($stageRoot.Length + 1) } | Sort-Object)

            # --- 1. silent install into the isolated path (/D last, unquoted, no spaces) ---
            $proc = Start-Process -FilePath $installer -ArgumentList @("/S", "/D=$instDir") -PassThru
            if (-not $proc.WaitForExit(180000)) { Fail "install" "installer did not exit within 180s" }
            if ($proc.ExitCode -ne 0) { Fail "install" "installer exit code $($proc.ExitCode) (expected 0)" }

            # --- 2. installed payload = the staged tree (+ Uninstall.exe) ---
            # v1.11.1 minimal root: the executable + launcher stay at the
            # root; every static file lives under resources\docs and
            # resources\brand; Uninstall.exe is written by the installer.
            $required = @(
              "SHEYTAN-LA.exe",
              "SHEYTAN-LA.bat",
              "resources/docs/README.txt",
              "resources/docs/BUILD-INFO.txt",
              "resources/docs/LICENSE.md",
              "resources/brand/sheytan.ico",
              "Uninstall.exe"
            )
            if (Test-Path (Join-Path $stageRoot "resources/docs/SIGNATURE")) { $required += "resources/docs/SIGNATURE" }
            foreach ($rel in $required) {
              $p = Join-Path $instDir ($rel -replace '/', '\')
              if (-not (Test-Path -LiteralPath $p)) { Fail "install-payload" "installed payload missing: $rel" }
              if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { Fail "install-payload" "installed payload is not a file: $rel" }
              if ((Get-Item -LiteralPath $p).Length -le 0) { Fail "install-payload" "installed payload file is empty: $rel" }
              Write-Host "installed OK: $rel"
            }
            # v1.11.1 minimal-root proof: the installer must NOT create the
            # retired root-level placeholder directories (they are no
            # longer shipped payload; user-created legacy roots are still
            # preserved on uninstall — proven by the sentinels below).
            foreach ($retired in @("models", "workspace")) {
              if (Test-Path -LiteralPath (Join-Path $instDir $retired)) { Fail "install-payload" "retired root-level placeholder directory was created by the installer: $retired" }
            }
            Write-Host "minimal installed root OK: no root-level models/workspace placeholders"

            # --- 3. registration: ARP entry (either registry view), AUMID, Start Menu + desktop shortcuts ---
            $arpViews = @("HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\SHEYTAN-LA", "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\SHEYTAN-LA")
            $arp = @($arpViews | Where-Object { Test-Path $_ })
            if ($arp.Count -eq 0) { Fail "install-registration" "Add/Remove Programs entry not found in any registry view: $($arpViews -join ' | ')" }
            foreach ($k in $arp) {
              $v = Get-ItemProperty -Path $k
              if (-not $v.UninstallString) { Fail "install-registration" "ARP entry lacks UninstallString: $k" }
              if (-not $v.DisplayName) { Fail "install-registration" "ARP entry lacks DisplayName: $k" }
              Write-Host "ARP OK: $k -> $($v.DisplayName)"
            }
            $aumid = "HKCU:\Software\Classes\AppUserModelId\SHEYTANx13.SHEYTAN-LA"
            if (-not (Test-Path $aumid)) { Fail "install-registration" "AppUserModelID key missing: $aumid" }
            $smDir = Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs\SHEYTAN-LA"
            if (-not (Test-Path (Join-Path $smDir "SHEYTAN Local Agent.lnk"))) { Fail "install-shortcuts" "Start Menu shortcut missing under $smDir" }
            $deskLnk = Join-Path $env:PUBLIC "Desktop\SHEYTAN Local Agent.lnk"
            if (-not (Test-Path $deskLnk)) { Fail "install-shortcuts" "desktop shortcut missing at $deskLnk (silent install keeps the default CHECKED option)" }
            Write-Host "registration + shortcuts OK"

            # --- 4. seed user-data sentinels (runtime data + USER-CREATED
            # legacy roots + external root + legacy README.md) ---
            # v1.11.1: the top-level models\ and workspace\ entries are
            # USER-CREATED legacy roots now (the installer no longer ships
            # them) — they exercise exactly the preservation contract the
            # uninstaller must keep: never in the payload manifest, never
            # recursively deleted, plain RMDir leaves non-empty dirs alone.
            $sentinels = [ordered]@{
              "data\user-preservation-sentinel.txt"      = "sheytan uninstall-smoke sentinel: canonical data root"
              "data\models\user-model-sentinel.gguf"     = "sheytan uninstall-smoke sentinel: runtime model placeholder (plain text, not a model)"
              "data\sessions\user-session-sentinel.txt"  = "sheytan uninstall-smoke sentinel: sessions"
              "data\logs\user-log-sentinel.txt"          = "sheytan uninstall-smoke sentinel: logs"
              "data\workspace\user-workspace-sentinel.txt" = "sheytan uninstall-smoke sentinel: install-local workspace"
              "models\user-model-sentinel.gguf"          = "sheytan uninstall-smoke sentinel: user-created legacy top-level models dir (pre-v1.11.1 install)"
              "workspace\user-workspace-sentinel.txt"    = "sheytan uninstall-smoke sentinel: user-created legacy top-level workspace dir (pre-v1.11.1 install)"
            }
            foreach ($rel in $sentinels.Keys) {
              $p = Join-Path $instDir ($rel -replace '/', '\')
              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $p) | Out-Null
              Set-Content -LiteralPath $p -Value $sentinels[$rel] -Encoding utf8NoBOM
            }
            New-Item -ItemType Directory -Force -Path $externalData | Out-Null
            $extSentinel = Join-Path $externalData "user-external-sentinel.txt"
            Set-Content -LiteralPath $extSentinel -Value "sheytan uninstall-smoke sentinel: external user-chosen data dir" -Encoding utf8NoBOM
            $legacyReadme = Join-Path $instDir "README.md"
            Set-Content -LiteralPath $legacyReadme -Value "legacy install README from an older version; the uninstaller's hardcoded fallback delete must remove it" -Encoding utf8NoBOM
            $hashes = @{}
            foreach ($p in @($sentinels.Keys | ForEach-Object { Join-Path $instDir ($_ -replace '/', '\') }) + @($extSentinel)) {
              $hashes[$p] = (Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash
            }
            Write-Host "sentinels seeded: $($hashes.Count) hashed (install-local + external)"

            # --- 5. silent uninstall (/S, _?= last unquoted — in place, waits, does not self-delete) ---
            $up = Start-Process -FilePath (Join-Path $instDir "Uninstall.exe") -ArgumentList @("/S", "_?=$instDir") -PassThru
            if (-not $up.WaitForExit(120000)) { Fail "uninstall" "uninstaller did not exit within 120s" }
            if ($up.ExitCode -ne 0) { Fail "uninstall" "uninstaller exit code $($up.ExitCode) (expected 0)" }

            # --- 6. payload removed EXACTLY (documented _?= exception: Uninstall.exe stays) ---
            foreach ($rel in ($required | Where-Object { $_ -ne "Uninstall.exe" })) {
              $p = Join-Path $instDir ($rel -replace '/', '\')
              if (Test-Path -LiteralPath $p) { Fail "uninstall-payload" "payload file survived uninstall: $rel" }
              Write-Host "removed OK: $rel"
            }
            # The resources tree itself must be gone (bottom-up RMDir in
            # the generated manifest removes docs/ and brand/ then resources).
            if (Test-Path -LiteralPath (Join-Path $instDir "resources")) { Fail "uninstall-payload" "resources directory survived uninstall — the generated manifest must remove the static-resource tree" }
            if (Test-Path -LiteralPath $legacyReadme) { Fail "uninstall-payload" "legacy README.md survived uninstall — the hardcoded fallback delete regressed" }
            if (-not (Test-Path -LiteralPath (Join-Path $instDir "Uninstall.exe"))) { Fail "uninstall-payload" "Uninstall.exe vanished — with _?= NSIS documents that it stays in place; if this fires the uninstaller contract drifted" }
            foreach ($k in $arpViews) { if (Test-Path $k) { Fail "uninstall-registration" "ARP entry survived uninstall: $k" } }
            if (Test-Path $aumid) { Fail "uninstall-registration" "AppUserModelID key survived uninstall: $aumid" }
            if (Test-Path (Join-Path $smDir "SHEYTAN Local Agent.lnk")) { Fail "uninstall-shortcuts" "Start Menu shortcut survived uninstall" }
            if (Test-Path $deskLnk) { Fail "uninstall-shortcuts" "desktop shortcut survived uninstall" }
            Write-Host "payload removal + registration/shortcut removal OK"

            # --- 7. data preservation: every sentinel intact, byte-identical ---
            foreach ($p in $hashes.Keys) {
              if (-not (Test-Path -LiteralPath $p)) { Fail "data-preservation" "user sentinel MISSING after uninstall: $p" }
              if ((Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash -ne $hashes[$p]) { Fail "data-preservation" "user sentinel content CHANGED after uninstall: $p" }
              Write-Host "preserved OK: $p"
            }
            Write-Host "data preservation OK: non-empty user directories were left in place by the non-recursive RMDir contract (expected residue: $instDir, data\*, models\*, workspace\* containing sentinels)"

            # --- 8. staging tree untouched (the smoke never writes into dist/windows/app) ---
            $stageFilesAfter = @(Get-ChildItem -Recurse -File $stageRoot | ForEach-Object { $_.FullName.Substring($stageRoot.Length + 1) } | Sort-Object)
            if ((Compare-Object -ReferenceObject $stageFilesBefore -DifferenceObject $stageFilesAfter).Count -ne 0) { Fail "staging-purity" "staging tree changed during the smoke run" }
            Write-Host ("staging purity OK ({0} staged files unchanged)" -f $stageFilesAfter.Count)
            Write-Host "NSIS install/uninstall smoke: PASS (payload symmetry + data preservation)"
          } finally {
            try { Stop-Transcript | Out-Null } catch {}
            if (Test-Path $base) { Remove-Item -Recurse -Force $base -ErrorAction SilentlyContinue }
          }

      # Package gate: the root failure is reported HERE (not by a vague
      # "no files found" upload error that buries the cause).
      # v1.11.1 (run 42502043636 work order §3.3 item 6): the gate is now
      # FAIL-CLOSED and independent — scripts/ci/PackageGate.ps1 requires
      # BOTH distribution files to exist as regular, non-empty files and
      # names the exact incomplete state otherwise (both missing / ZIP-only
      # / installer-only / either empty). The retired inline predicate
      # ("ZIP missing AND installer exists") printed "package gate: reached"
      # with BOTH packages absent — the captured consolidated-log line 3313
      # defect — so the success line now appears ONLY after every assertion
      # succeeds. The truth table is pinned by PackageGate.Tests.ps1 (six
      # states, run hosted by the "Package gate fixture contract" step) and
      # by the releasecontract workflow-contract tests.
      - name: Package gate (root-cause reporter)
        if: always()
        run: |
          & ./scripts/ci/PackageGate.ps1 -Zip "dist/${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-windows-x64.zip" -Installer "dist/${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-windows-x64-installer.exe" 2>&1 | Tee-Object -FilePath "ci-logs/win-package-gate.log"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::package gate: Windows package contract violated (gate exit $LASTEXITCODE; named incomplete state in ci-logs/win-package-gate.log)"; throw "Windows package gate failed (exit $LASTEXITCODE)" }

      # F6 (run 43008361835): the per-job machine-readable diagnostics
      # index — always built (bash via Git Bash), printed to the step log
      # (so it reaches the consolidated run-log artifact) and written to
      # ci-logs/diagnostics-index.json. Best-effort: never masks the
      # original job conclusion.
      - name: Build the per-job diagnostics index (always run)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          bash scripts/ci/diagnostics-index.sh --job "Windows x64" \
            || echo "::error::diagnostics index build failed (non-masking; original job conclusion stands)"
        env:
          DIAGNOSTICS_CACHE_HIT: ${{ steps.setup-go.outputs.cache-hit }}

      # v1.11.1 §7.4: the bundle uploads only on job success — never on
      # always() — and only when BOTH verified distribution files exist
      # (error on missing): no partial or placeholder package bundles.
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-package
          path: |
            dist/${{ env.WIN_PKG_ROOT }}-v${{ env.APP_VERSION }}-windows-x64.zip
            dist/${{ env.WIN_PKG_ROOT }}-v${{ env.APP_VERSION }}-windows-x64-installer.exe
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  # ==========================================================================
  # Linux x64 — the native build of SHEYTAN-LA (executable bit preserved),
  # ELF verification, compiled-version cross-check, Xvfb launch smoke,
  # portable ZIP.
  # ==========================================================================
  build-linux:
    name: Linux x64
    runs-on: ubuntu-26.04
    needs: [preflight]
    timeout-minutes: 45
    env:
      APP_VERSION: "1.11.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Runner OS identity (Ubuntu 26.04 gate)
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          echo "dpkg arch: $(dpkg --print-architecture)"
          echo "ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
          # v1.11.1 (run 41933333132, work order §7): the 24.04 -> 26.04
          # migration is VERIFIED, not a YAML-only change — the exact OS
          # release and architecture are asserted so later runner drift
          # fails loudly here instead of surprising the build.
          . /etc/os-release
          if [ "${ID}" != "ubuntu" ] || [ "${VERSION_ID}" != "26.04" ]; then
            echo "::error::runner identity: expected ubuntu-26.04, got ${ID}-${VERSION_ID} — the Linux lane is pinned to 26.04"
            exit 1
          fi
          if [ "$(dpkg --print-architecture)" != "amd64" ]; then
            echo "::error::runner identity: expected amd64 architecture, got $(dpkg --print-architecture)"
            exit 1
          fi


      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # F1/F7 (run 43008361835): the cache key family is scoped to
          # OS + Go version + the dependency lock (go.sum) — declared
          # explicitly so dependency changes invalidate every lane's
          # cache together and a hit/miss is reproducible.
          cache-dependency-path: go.sum

      # CGO-free resolution (run #54 root cause #2: the old step compiled
      # the Fyne UI before the graphics headers were installed and died in
      # ~1s). printversion is pure Go: it resolves before any
      # prerequisite exists, captures the raw output and the exit status
      # BEFORE parsing, and fails closed on malformed values.
      - name: Resolve APP_VERSION from the Go authority
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          set +e
          raw="$(CGO_ENABLED=0 go run ./cmd/printversion --plain 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "EXIT_CODE: $rc" "$raw" | tee ci-logs/linux-version-resolution.log
          if [ $rc -ne 0 ]; then
            echo "::error::printversion exited $rc — version resolution failed (raw output above)"
            exit 1
          fi
          resolved="$(printf '%s' "$raw" | tr -d '[:space:]')"
          if ! [[ "$resolved" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::printversion produced a malformed version: '$resolved'"
            exit 1
          fi
          if [ "$resolved" != "$APP_VERSION" ]; then
            echo "::error::workflow APP_VERSION ($APP_VERSION) disagrees with internal/config.AppVersion ($resolved)"
            exit 1
          fi
          echo "APP_VERSION = $resolved (matches internal/config.AppVersion)"

      - name: Install Fyne build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
            gcc \
            pkg-config \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxxf86vm-dev \
            libwayland-dev \
            libxkbcommon-dev \
            xorg-dev \
            xauth \
            xvfb \
            x11-utils \
            zip \
            unzip

      - name: Build SHEYTAN-LA (executable)
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          mkdir -p "dist/linux/app/${LINUX_PKG_ROOT}"
          go build -o "dist/linux/app/${LINUX_PKG_ROOT}/SHEYTAN-LA" ./cmd/sheytan-local-agent
          chmod +x "dist/linux/app/${LINUX_PKG_ROOT}/SHEYTAN-LA"

      # The COMPILED desktop binary must agree with the workflow APP_VERSION
      # (the compiled Go authority), not only the resolver.
      #
      # v1.11.1 (run #41415240891 Failure A): the probe runs from an
      # ISOLATED working directory, never beside the staged tree — extra
      # defense on top of the read-only version dispatch in cmd/root.go.
      # A version query that regains filesystem side effects would then
      # drop its residue here instead of inside the release ZIP, and the
      # purity verifier below still rejects any data/ entry fail-closed.
      - name: Cross-check the compiled binary's version
        run: |
          set -euo pipefail
          repoDir="$(pwd)"
          bin="${repoDir}/dist/linux/app/${LINUX_PKG_ROOT}/SHEYTAN-LA"
          probeDir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/version-probe.XXXXXX")"
          trap 'rm -rf "$probeDir"' EXIT
          cd "$probeDir"
          set +e
          resolved="$("$bin" version 2>/dev/null | grep -m1 -oE 'v[0-9]+\.[0-9]+\.[0-9]+')"
          rc=$?
          set -e
          printf 'compiled binary reports: %s (grep rc=%s)\n' "${resolved:-<none>}" "$rc" | tee "${repoDir}/ci-logs/linux-compiled-version.log"
          if [ "$resolved" != "v${APP_VERSION}" ]; then
            echo "::error::compiled SHEYTAN-LA reports '${resolved:-<none>}', want v${APP_VERSION} — the compiled authority drifted"
            exit 1
          fi
          echo "compiled version OK: $resolved"
          residue="$(ls -A "$probeDir" || true)"
          if [ -n "$residue" ]; then
            echo "::error::version probe created filesystem residue in the isolated probe dir: $residue — the version dispatch must stay read-only (run #41415240891 Failure A)"
            exit 1
          fi
          echo "version probe left the probe directory clean"

      - name: Verify the ELF (x86-64, executable bit)
        run: |
          set -euo pipefail
          bin="dist/linux/app/${LINUX_PKG_ROOT}/SHEYTAN-LA"
          test -x "$bin" || { echo "::error::the Linux binary lost its executable bit"; exit 1; }
          file "$bin" | tee ci-logs/linux-elf-check.log
          file "$bin" | grep -q "ELF 64-bit LSB.*x86-64" || { echo "::error::not an x86-64 ELF binary"; exit 1; }

      # Same smoke contract as the ui job: bounded observable readiness,
      # soak, real SIGTERM with zombie-safe reaping.
      - name: "Launch smoke (Xvfb: boot, window, clean shutdown)"
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/linux-smoke"
          mkdir -p "$work" && cp "dist/linux/app/${LINUX_PKG_ROOT}/SHEYTAN-LA" "$work/"
          cd "$work"
          Xvfb :92 -screen 0 1280x800x24 >/dev/null 2>&1 &
          XVFB_PID=$!
          xvfb_ready=0
          for i in $(seq 1 20); do
            [ -e "/tmp/.X92-lock" ] && { xvfb_ready=1; break; }
            sleep 0.5
          done
          if [ "$xvfb_ready" -ne 1 ]; then
            echo "::error::desktop smoke: Xvfb never became ready within 10s"
            exit 1
          fi
          DISPLAY=:92 ./SHEYTAN-LA > smoke-stdout.log 2>&1 &
          APP_PID=$!
          app_ready=0
          for i in $(seq 1 60); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then break; fi
            if DISPLAY=:92 xwininfo -root -tree 2>/dev/null | grep -q "SHEYTAN-Local-Agent"; then
              app_ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$app_ready" -ne 1 ]; then
            echo "::error::desktop smoke: the application window was never observable within 30s (see smoke-stdout.log)"
            cat smoke-stdout.log || true
            kill "$XVFB_PID" 2>/dev/null || true
            exit 1
          fi
          soak_ok=1
          for i in $(seq 1 20); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then soak_ok=0; break; fi
            sleep 0.5
          done
          if [ "$soak_ok" -ne 1 ]; then
            echo "::error::desktop smoke: the application exited during the 10s soak (see smoke-stdout.log)"
            cat smoke-stdout.log || true
            kill "$XVFB_PID" 2>/dev/null || true
            exit 1
          fi
          kill -TERM "$APP_PID"
          reaped=0
          for i in $(seq 1 30); do
            st="$(ps -o stat= -p "$APP_PID" 2>/dev/null || true)"
            if [ -z "$st" ]; then reaped=1; break; fi
            case "$st" in
              *Z*) wait "$APP_PID" 2>/dev/null || true; reaped=1; break;;
            esac
            sleep 0.5
          done
          if [ "$reaped" -ne 1 ]; then
            echo "::error::desktop smoke: the application ignored SIGTERM"
            kill -KILL "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
            kill "$XVFB_PID" 2>/dev/null || true
            exit 1
          fi
          wait "$APP_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true
          echo "SMOKE OK: window booted, event loop alive, clean SIGTERM shutdown with reap"
          cp smoke-stdout.log "$GITHUB_WORKSPACE/ci-logs/linux-smoke-stdout.log"

      # v1.11.1 minimal root (same contract as Windows): static package
      # content under resources/docs; no root-level models/workspace
      # placeholders — the canonical data root is <AppRoot>/data.
      - name: Write BUILD-INFO.txt and portable metadata
        run: |
          set -euo pipefail
          root="dist/linux/app/${LINUX_PKG_ROOT}"
          mkdir -p "$root/resources/docs"
          cat > "$root/resources/docs/BUILD-INFO.txt" <<EOF
          product: SHEYTAN-LA
          version: ${APP_VERSION}
          commit: ${GITHUB_SHA}
          ui: fyne (one Go UI)
          EOF
          echo "SHEYTAN-LA ${APP_VERSION} — run ./SHEYTAN-LA. Models are downloaded in-app; user data lives under data/ next to the executable. Static package content lives under resources/." > "$root/resources/docs/README.txt"
          for f in "$root/resources/docs/BUILD-INFO.txt" "$root/resources/docs/README.txt"; do
            test -s "$f" || { echo "::error::metadata file missing or empty: $f"; exit 1; }
          done
          grep -q "version: ${APP_VERSION}" "$root/resources/docs/BUILD-INFO.txt" || { echo "::error::BUILD-INFO.txt lacks the version line"; exit 1; }
          cp LICENSE.md "$root/resources/docs/LICENSE.md"
          cp SIGNATURE "$root/resources/docs/SIGNATURE"

      - name: Create Linux ZIP
        run: |
          set -euo pipefail
          cd dist/linux/app
          zip -r -X "../../${LINUX_PKG_ROOT}-v${APP_VERSION}-linux-x64.zip" "${LINUX_PKG_ROOT}"
          cd ../..
          echo "ZIP created"

      - name: Verify Linux ZIP
        run: |
          set -euo pipefail
          zip="dist/${LINUX_PKG_ROOT}-v${APP_VERSION}-linux-x64.zip"
          test -f "$zip" || { echo "::error::ZIP missing: $zip"; exit 1; }
          entries=$(unzip -l "$zip" | awk '{print $4}')
          for required in \
            "${LINUX_PKG_ROOT}/SHEYTAN-LA" \
            "${LINUX_PKG_ROOT}/resources/docs/README.txt" \
            "${LINUX_PKG_ROOT}/resources/docs/BUILD-INFO.txt" \
            "${LINUX_PKG_ROOT}/resources/docs/LICENSE.md"; do
            echo "$entries" | grep -qx "$required" || { echo "::error::ZIP entry missing: $required"; exit 1; }
          done
          # v1.11.1 minimal root: no root-level placeholder directories.
          if echo "$entries" | grep -qE "^${LINUX_PKG_ROOT}/(models|workspace)/"; then
            echo "::error::ZIP purity violation: retired root-level models/ or workspace/ placeholder entries present (v1.11.1 minimal root)"; exit 1
          fi
          if echo "$entries" | grep -qE "^${LINUX_PKG_ROOT}/data/"; then
            echo "::error::ZIP purity violation: data-root residue present (the smoke must run from a copy, never the staging tree)"; exit 1
          fi
          # The executable bit survives the archive.
          rm -rf "$RUNNER_TEMP/zipcheck" && mkdir -p "$RUNNER_TEMP/zipcheck"
          unzip -q "$zip" -d "$RUNNER_TEMP/zipcheck"
          test -x "$RUNNER_TEMP/zipcheck/${LINUX_PKG_ROOT}/SHEYTAN-LA" || { echo "::error::executable bit lost in the ZIP"; exit 1; }
          echo "ZIP OK: all contracted entries present, executable bit preserved, minimal root purity passed"

      # Package gate: report the root failure HERE rather than letting the
      # upload step emit a vague "no files were found" annotation.
      - name: Package gate (root-cause reporter)
        if: always()
        run: |
          set -euo pipefail
          zip="dist/${LINUX_PKG_ROOT}-v${APP_VERSION}-linux-x64.zip"
          if [ ! -f "$zip" ]; then
            echo "::error::the Linux portable package was not produced — see the FIRST failed step of this job for the root cause (this gate intentionally reports the missing package once, with cause context)"
          fi
          echo "package gate: reached"

      # F6 (run 43008361835): the per-job machine-readable diagnostics
      # index — always built, printed to the step log (so it reaches the
      # consolidated run-log artifact) and written to
      # ci-logs/diagnostics-index.json. Best-effort: never masks the
      # original job conclusion.
      - name: Build the per-job diagnostics index (always run)
        if: always()
        run: |
          set -uo pipefail
          bash scripts/ci/diagnostics-index.sh --job "Linux x64" \
            || echo "::error::diagnostics index build failed (non-masking; original job conclusion stands)"
        env:
          DIAGNOSTICS_CACHE_HIT: ${{ steps.setup-go.outputs.cache-hit }}

      # v1.11.1 §7.4: the bundle uploads only on job success — never on
      # always() — and only when the verified portable archive exists
      # (error on missing): no partial or placeholder package bundles.
      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-package
          path: dist/${{ env.LINUX_PKG_ROOT }}-v${{ env.APP_VERSION }}-linux-x64.zip
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  # ==========================================================================
  # Consolidate logs — ONE authoritative PLAIN-TEXT run log per RUN,
  # collected directly from the GitHub run-attempt logs API (no per-job
  # part artifacts, no intermediate downloads, no ZIP wrapper:
  # upload-artifact@v7 archive:false uploads the file itself, so the
  # artifact name IS the filename: SHEYTAN-LA-all-logs.txt).
  #   - Always runs — red and cancelled runs keep their log.
  #   - Sees EVERY job of the run through the jobs API, including the
  #     tag-only release job (skipped on normal main pushes = NEVER_STARTED,
  #     never "failed"). The needs list stays acyclic: release needs
  #     consolidate-logs, so consolidate-logs does NOT need release; the
  #     jobs API covers it regardless.
  #   - Fails closed on jobs-API/pagination/redirect/download/ZIP errors:
  #     a diagnostic report is still written and uploaded, then the
  #     collector verdict step fails the job.
  #   - The bearer token is sent only to the API host; the signed download
  #     URL is fetched by a credential-free curl after an https check.
  #   - Secrets are redacted before the artifact is written.
  # The collector script and its offline fixture suite (run in the audit
  # job) live in scripts/ci/consolidate-run-log*.sh.
  # ==========================================================================
  consolidate-logs:
    name: Consolidate logs
    runs-on: ubuntu-26.04
    needs: [preflight, audit, ui, build-windows, build-linux]
    if: always()
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout (collector script)
        uses: actions/checkout@v7

      # ONE collector, ONE plain-text artifact. The collector pulls the
      # COMPLETED JOB-SPECIFIC LOGS (GET /actions/jobs/{job_id}/logs) for
      # every upstream job that reached a terminal state, using the
      # paginated jobs metadata — never the run-attempt logs archive,
      # which may 404 while this very run is still in progress. The
      # collector's own progress is embedded as a local COLLECTOR SELF-LOG.
      # Red/cancelled runs keep their log (the collector writes the report
      # BEFORE exiting nonzero on coverage gaps, and the upload below runs
      # with if: always()).
      - name: Collect the run-attempt logs into one plain-text report
        id: collector
        env:
          GH_TOKEN: ${{ github.token }}
          CONSOLIDATE_REPO: ${{ github.repository }}
          CONSOLIDATE_RUN_ID: ${{ github.run_id }}
          CONSOLIDATE_ATTEMPT: ${{ github.run_attempt }}
          CONSOLIDATE_COMMIT: ${{ github.sha }}
          CONSOLIDATE_REF: ${{ github.ref }}
          CONSOLIDATE_WORKFLOW: ${{ github.workflow }}
          CONSOLIDATE_TRIGGER: ${{ github.event_name }}
        run: |
          set -uo pipefail
          rc=0
          bash scripts/ci/consolidate-run-log.sh --out SHEYTAN-LA-all-logs.txt || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::error::Consolidate logs: collector reported a coverage/verification gap (rc=$rc) — the report artifact still carries the diagnosis"
          fi
          {
            echo "## Consolidated run log"
            echo ""
            echo "Artifact: \`SHEYTAN-LA-all-logs.txt\` — ONE plain-text file (upload-artifact archive:false), attempt ${{ github.run_attempt }} recorded INSIDE the report."
            echo "If the artifact contains a '=== MISSING LOG SOURCE ===' section, job logs could not be recovered for those jobs and coverage is incomplete."
            echo ""
            echo "Job results: preflight=${{ needs.preflight.result }} audit=${{ needs.audit.result }} ui=${{ needs.ui.result }} windows=${{ needs.build-windows.result }} linux=${{ needs.build-linux.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # The ONE mandatory user-facing log artifact. upload-artifact is
      # pinned to the verified immutable v7 commit SHA; archive:false
      # uploads the file ITSELF (filename = artifact display name, no ZIP
      # wrapper — verified against this revision's action.yml);
      # if-no-files-found: error (never ignore — a silently absent log is
      # a contract breach); stable name — a rerun replaces the same
      # artifact; the attempt number lives inside the report content.
      - name: Upload the consolidated run log (single plain-text artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SHEYTAN-LA-all-logs.txt
          path: SHEYTAN-LA-all-logs.txt
          if-no-files-found: error
          retention-days: 14
          overwrite: true
          archive: false

      - name: Collector verdict (fail the job on coverage gaps)
        if: always()
        run: |
          rc="${{ steps.collector.outputs.rc }}"
          if [ -z "$rc" ]; then
            echo "::error::collector step produced no verdict — fail closed"
            exit 1
          fi
          if [ "$rc" != "0" ]; then
            echo "::error::collector exited $rc — the report artifact names the missing log sources / errors"
            exit 1
          fi
          echo "collector verdict: complete report (rc=0)"

  # ==========================================================================
  # Release — tags only. Publishes the contracted artifacts.
  # ==========================================================================
  release:
    name: Release (tags only)
    runs-on: ubuntu-26.04
    needs: [audit, ui, build-windows, build-linux, consolidate-logs]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      APP_VERSION: "1.11.1"
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: windows-x64-package
          path: dist/

      - name: Download Linux package
        uses: actions/download-artifact@v8
        with:
          name: linux-x64-package
          path: dist/

      - name: Verify the artifact set against the release contract
        run: |
          set -euo pipefail
          for want in \
            "${WIN_PKG_ROOT}-v${APP_VERSION}-windows-x64.zip" \
            "${WIN_PKG_ROOT}-v${APP_VERSION}-windows-x64-installer.exe" \
            "${LINUX_PKG_ROOT}-v${APP_VERSION}-linux-x64.zip"; do
            test -f "dist/$want" || { echo "::error::release artifact missing: $want"; exit 1; }
          done
          echo "release artifact set OK"

      # UPDATE.md contract (drift fixed here): the in-app updater
      # (internal/updater, AppManifestURL) consumes release-manifest.json —
      # version + per-platform url/sha256/sizeBytes/kind — and the release
      # carries a deterministic SHA256SUMS.txt. Both are generated HERE,
      # from the exact artifact bytes being published (never hand-written),
      # deterministically: jq -nS emits sorted keys; SHA256SUMS.txt is
      # LC_ALL=C-sorted by filename with the canonical two-space separator.
      - name: Generate release-manifest.json and SHA256SUMS.txt
        run: |
          set -euo pipefail
          ver="${APP_VERSION}"
          base="${{ github.server_url }}/${{ github.repository }}/releases/download/v${ver}"
          win_zip="${WIN_PKG_ROOT}-v${ver}-windows-x64.zip"
          win_inst="${WIN_PKG_ROOT}-v${ver}-windows-x64-installer.exe"
          lin_zip="${LINUX_PKG_ROOT}-v${ver}-linux-x64.zip"
          win_sha="$(sha256sum "dist/${win_zip}" | cut -d' ' -f1)"
          win_size="$(stat -c%s "dist/${win_zip}")"
          lin_sha="$(sha256sum "dist/${lin_zip}" | cut -d' ' -f1)"
          lin_size="$(stat -c%s "dist/${lin_zip}")"
          jq -nS \
            --arg ver "$ver" \
            --arg winurl "${base}/${win_zip}" \
            --arg winsha "$win_sha" \
            --arg winsize "$win_size" \
            --arg linurl "${base}/${lin_zip}" \
            --arg linsha "$lin_sha" \
            --arg linsize "$lin_size" \
            '{version: $ver,
              platforms: {
                "linux-x64":   {url: $linurl, sha256: $linsha, sizeBytes: ($linsize|tonumber), kind: "zip"},
                "windows-x64": {url: $winurl, sha256: $winsha, sizeBytes: ($winsize|tonumber), kind: "zip"}
              }}' > dist/release-manifest.json
          {
            printf '%s  %s\n' "$(sha256sum "dist/${lin_zip}" | cut -d' ' -f1)" "${lin_zip}"
            printf '%s  %s\n' "$(sha256sum "dist/${win_inst}" | cut -d' ' -f1)" "${win_inst}"
            printf '%s  %s\n' "$(sha256sum "dist/${win_zip}" | cut -d' ' -f1)" "${win_zip}"
            printf '%s  %s\n' "$(sha256sum "dist/release-manifest.json" | cut -d' ' -f1)" "release-manifest.json"
          } | LC_ALL=C sort -k2 > dist/SHA256SUMS.txt
          jq -e '.version == $ver and (.platforms["windows-x64"].sha256 | length == 64) and (.platforms["linux-x64"].sha256 | length == 64)' --arg ver "$ver" dist/release-manifest.json > /dev/null \
            || { echo "::error::generated release-manifest.json failed its contract self-check"; exit 1; }
          test "$(wc -l < dist/SHA256SUMS.txt)" -eq 4 || { echo "::error::SHA256SUMS.txt must list exactly 4 files"; exit 1; }
          echo "--- SHA256SUMS.txt ---"; cat dist/SHA256SUMS.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ env.WIN_PKG_ROOT }}-v${{ env.APP_VERSION }}-windows-x64.zip
            dist/${{ env.WIN_PKG_ROOT }}-v${{ env.APP_VERSION }}-windows-x64-installer.exe
            dist/${{ env.LINUX_PKG_ROOT }}-v${{ env.APP_VERSION }}-linux-x64.zip
            dist/release-manifest.json
            dist/SHA256SUMS.txt
          generate_release_notes: true
