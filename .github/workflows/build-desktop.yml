# ============================================================================
# SHEYTAN-LA — build-desktop.yml (v1.11.0 one-Go-UI pipeline, run #54 repair)
# ============================================================================
# The ONE CI pipeline for the ONE Go + Fyne application. The retired
# stacks — Qt/QML + CMake host, React/TypeScript/Vite frontend, Playwright
# suites, Node toolchain — have no gates here anymore; their behavioral
# contracts live in Go tests (ui/fyne, internal/releasecontract).
#
# Run #54 repair (run 40394318382, commit e6e1968) — root causes fixed:
#   1. audit + Linux version steps compiled the Fyne UI (CGO) on runners
#      without graphics headers → both now run CGO-free: the stress gate
#      under `-tags headless`, version resolution via cmd/printversion.
#   2. Windows BUILD-INFO.txt: fragile here-string + unvalidated writes →
#      explicit, individually-validated UTF-8 (no BOM) writes with
#      per-file diagnostics.
#   3. Log consolidation flattened per-job artifacts with
#      merge-multiple:true (same-named logs overwrote each other) and
#      could silently drop the report → namespaced parts + the
#      scripts/ci/consolidate-run-log.sh collector + mandatory upload.
#   4. MINGW64 deprecation (msys2, October 2026) → UCRT64 toolchain.
#
# Job topology (v1.11.1 run 43630164424 repair: INDEPENDENT parallel gates —
# a red preflight must never prevent the four validation gates from running;
# the strict overall verdict moved to the final-verdict job):
#
#   preflight      INDEPENDENT fast compile gate (go build ./... — includes
#                  the Fyne UI, so the Fyne prerequisites install here) +
#                  gofmt + vet + module integrity. Required for the final
#                  verdict, but NOT a prerequisite of any other job.
#   audit          INDEPENDENT headless core suite (-tags headless), race
#                  gates on the critical concurrent packages, the HEADLESS
#                  stress release-surface gate, the release/version contract
#                  tests and the log-collector fixture suite. Own checkout,
#                  own toolchain setup, same github.sha.
#   ui             INDEPENDENT Fyne UI contract + composition suite, the
#                  button fit matrix (logical-size sweep), the FULL
#                  non-headless test sweep, and the Linux desktop smoke.
#                  Own checkout/setup; never waits for preflight.
#   Windows x64    INDEPENDENT native MSYS2/UCRT64 CGO build of
#                  SHEYTAN-LA.exe, the named-pipe CoreClient integration
#                  gate (the REAL production client over localipc.Serve),
#                  PE verification, the IPC-aware launch smoke, portable
#                  ZIP (installers are retired — master work order §10).
#                  Own checkout/setup.
#   Linux x64      INDEPENDENT native Linux build of SHEYTAN-LA (executable
#                  bit), ELF verification, compiled-version cross-check,
#                  Xvfb launch smoke, portable ZIP. Own checkout/setup.
#   consolidate-logs   ONE errors/warnings-only plain-text diagnostic
#                  a machine-readable run-diagnostics.json, collected from
#                  the jobs/logs API (runs after every gate regardless of
#                  outcome — !cancelled(); red runs keep their evidence)
#   final-verdict  the STRICT overall verdict: needs every required gate
#                  and the collector; fails if any required gate is not
#                  success. A red preflight keeps the run red, but it can
#                  never again hide the other four gates' evidence.
#   release        tags only: publishes the contracted artifacts (needs
#                  final-verdict — no release from a red run)
#
# Run 43630164424 root cause (DAG): preflight was a hard `needs:`
# prerequisite of audit/ui/build-windows/build-linux, so its single `go
# vet` failure skipped all four independent gates — zero evidence, red
# run. The four gates each own their checkout/toolchain/setup now; no
# continue-on-error exists anywhere (job continuation and verdict
# acceptance are separate concerns), and final-verdict preserves the
# strict "any required gate red = run red" contract.
#
# Honesty contract: a green run is build/test/smoke evidence on hosted
# runners — NEVER a claim of physical-PC or mobile runtime verification.
# Android/iOS are architecture-portable (Fyne) but require their own
# SDKs/toolchains and are NOT built or claimed here.
# ============================================================================
name: build-desktop

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Work order §6.2: never cancel evidence collection — a superseded ref
  # may queue behind an in-progress run instead of destroying its evidence.
  cancel-in-progress: false

permissions:
  contents: read

env:
  # v1.11.1 maintenance: the EXACT stable Go patch (go1.27.4, released
  # 2026-11-10; verified on go.dev/dl) — one version authority for every
  # lane, matching the go.mod toolchain directive.
  GO_VERSION: "1.27.4"
  # ONE canonical package root per platform (internal/releasecontract):
  # every staging directory, ZIP name, artifact name and release-metadata
  # reference derives from these. No duplicated root literals.
  WIN_PKG_ROOT: "SHEYTAN-LA"
  LINUX_PKG_ROOT: "SHEYTAN-LA"
  # Bounded steps: the largest gates carry explicit timeouts (minutes).
  GO_TEST_TIMEOUT: "25m"

jobs:
  # ==========================================================================
  # Preflight — the compile gate runs FIRST so a broken tree fails in
  # ~2 minutes instead of after the full matrix.
  # ==========================================================================
  preflight:
    name: Preflight compile gate
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Runner OS identity (Ubuntu 26.04 gate)
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          echo "dpkg arch: $(dpkg --print-architecture)"
          echo "ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
          # v1.11.1 (run 41933333132, work order §7): the 24.04 -> 26.04
          # migration is VERIFIED, not a YAML-only change — the exact OS
          # release and architecture are asserted so later runner drift
          # fails loudly here instead of surprising the build.
          . /etc/os-release
          if [ "${ID}" != "ubuntu" ] || [ "${VERSION_ID}" != "26.04" ]; then
            echo "::error::runner identity: expected ubuntu-26.04, got ${ID}-${VERSION_ID} — the Linux lane is pinned to 26.04"
            exit 1
          fi
          if [ "$(dpkg --print-architecture)" != "amd64" ]; then
            echo "::error::runner identity: expected amd64 architecture, got $(dpkg --print-architecture)"
            exit 1
          fi


      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # F1/F7 (run 43008361835): the cache key family is scoped to
          # OS + Go version + the dependency lock (go.sum) — declared
          # explicitly so dependency changes invalidate every lane's
          # cache together and a hit/miss is reproducible.
          cache-dependency-path: go.sum

      # Fyne native build prerequisites (Linux desktop path). This is the
      # HONEST dependency contract: a C compiler + pkg-config + the
      # X11/OpenGL/Wayland development libraries (including libxxf86vm-dev,
      # the linker failure that killed the run-#51 Fyne spike). No Qt, no
      # Node, no GTK.
      # F7 (run 43008361835): cache hit/miss is recorded per job — a hit is
      # a performance optimization, never a correctness condition. Only
      # allowlisted toolchain facts; no environment dumps.
      - name: Record Go cache/toolchain facts
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          {
            echo "setup-go cache-hit: ${GO_CACHE_HIT:-unknown}"
            go version
            go env GOOS GOARCH GOMODCACHE GOCACHE
          } | tee ci-logs/go-cache-facts.log
        env:
          GO_CACHE_HIT: ${{ steps.setup-go.outputs.cache-hit }}

      - name: Install Fyne build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
            gcc \
            pkg-config \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxxf86vm-dev \
            libwayland-dev \
            libxkbcommon-dev \
            xorg-dev

      - name: Compile gate (go build ./...)
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          echo "RUN go build ./..." >> ci-logs/gate-order.txt
          go build ./... 2>&1 | tee ci-logs/preflight-build.log
          echo "gate OK: go build ./..." >> ci-logs/gate-order.txt

      - name: gofmt (enforced)
        run: |
          set -euo pipefail
          echo "RUN gofmt -l cmd internal ui scripts" >> ci-logs/gate-order.txt
          # The gate's own evidence MUST outlive the step log: on red, the
          # violation list and the exact formatter version are teed into the
          # consolidated run-log artifact (run #118 root cause: the
          # file list existed only in the step log, so nobody could retrieve
          # which files to reformat).
          {
            echo "toolchain: $(go version)"
            echo "files:"
          } | tee ci-logs/preflight-gofmt.log
          # SCOPE PARITY (run 44378562071 §4.3.3): this is the ONE canonical
          # scope, identical to every platform lane's gofmt gate:
          # cmd internal ui scripts.
          unformatted=$(gofmt -l cmd internal ui scripts | tee -a ci-logs/preflight-gofmt.log)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt violations — run gofmt -w on:"
            echo "$unformatted"
            echo "::error::full list captured at ci-logs/preflight-gofmt.log — retrievable in the SHEYTAN-LA-errors-warnings.txt run diagnostic artifact"
            exit 1
          fi
          echo "gofmt OK" | tee -a ci-logs/preflight-gofmt.log
          echo "gate OK: gofmt -l cmd internal ui scripts" >> ci-logs/gate-order.txt

      - name: go vet ./...
        run: |
          set -euo pipefail
          echo "RUN go vet ./..." >> ci-logs/gate-order.txt
          go vet ./... 2>&1 | tee ci-logs/preflight-vet.log
          echo "gate OK: go vet ./..." >> ci-logs/gate-order.txt

      # Work order §9 gate 5 (v1.11.1) + run 44378562071 §4.1.11: Go
      # dependency integrity via the ONE reproducible script — go mod
      # verify, then go mod tidy -diff EMPTY TWICE with GOTOOLCHAIN=local
      # (the go.mod toolchain directive is the one authority) and the
      # recorded environment. The script prints the real module root and
      # the true diff on failure; it never mutates the manifests.
      - name: Go dependency integrity (mod verify + tidy idempotence)
        run: |
          set -euo pipefail
          echo "RUN scripts/ci/module-integrity.sh (mod verify + tidy -diff x2)" >> ci-logs/gate-order.txt
          bash scripts/ci/module-integrity.sh --log-dir ci-logs
          echo "gate OK: module integrity" >> ci-logs/gate-order.txt

      # F6 (run 43008361835): the per-job machine-readable diagnostics
      # index — always built, printed to the step log (so it reaches the
      # consolidated run-log artifact) and written to
      # ci-logs/diagnostics-index.json. Best-effort: a diagnostics failure
      # must never mask the original job conclusion.
      - name: Build the per-job diagnostics index (always run)
        if: always()
        run: |
          set -uo pipefail
          bash scripts/ci/diagnostics-index.sh --job "Preflight compile gate" \
            || echo "::error::diagnostics index build failed (non-masking; original job conclusion stands)"
        env:
          DIAGNOSTICS_CACHE_HIT: ${{ steps.setup-go.outputs.cache-hit }}

  # ==========================================================================
  # Audit — the headless core suite, race gates and release-surface gates.
  # Every command here compiles WITHOUT the Fyne/CGO graphics stack: the
  # job's runner has no X11/OpenGL/Wayland development headers, so all Go
  # invocations carry -tags headless (run #54 root cause #1: the untagged
  # stress invocation compiled ui/fyne and died on the missing headers).
  # ==========================================================================
  audit:
    name: Core audit (headless)
    runs-on: ubuntu-26.04
    # v1.11.1 (run 43630164424 repair): NO needs: [preflight] — this gate
    # is INDEPENDENT. A red preflight (even a vet failure) must never skip
    # the headless core suite; the strict overall verdict is owned by
    # final-verdict, not by this job's scheduling.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Runner OS identity (Ubuntu 26.04 gate)
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          echo "dpkg arch: $(dpkg --print-architecture)"
          echo "ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
          # v1.11.1 (run 41933333132, work order §7): the 24.04 -> 26.04
          # migration is VERIFIED, not a YAML-only change — the exact OS
          # release and architecture are asserted so later runner drift
          # fails loudly here instead of surprising the build.
          . /etc/os-release
          if [ "${ID}" != "ubuntu" ] || [ "${VERSION_ID}" != "26.04" ]; then
            echo "::error::runner identity: expected ubuntu-26.04, got ${ID}-${VERSION_ID} — the Linux lane is pinned to 26.04"
            exit 1
          fi
          if [ "$(dpkg --print-architecture)" != "amd64" ]; then
            echo "::error::runner identity: expected amd64 architecture, got $(dpkg --print-architecture)"
            exit 1
          fi


      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # F1/F7 (run 43008361835): the cache key family is scoped to
          # OS + Go version + the dependency lock (go.sum) — declared
          # explicitly so dependency changes invalidate every lane's
          # cache together and a hit/miss is reproducible.
          cache-dependency-path: go.sum

      - name: go test ./internal/... (headless)
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          echo "RUN go test ./internal/... (headless)" >> ci-logs/gate-order.txt
          go test ./internal/... -tags headless -count=1 -timeout "${GO_TEST_TIMEOUT:-25m}" 2>&1 | tee ci-logs/audit-go-test-headless.log
          echo "gate OK: go test ./internal/... (headless)" >> ci-logs/gate-order.txt

      - name: Race gate (critical concurrent packages)
        run: |
          set -euo pipefail
          echo "RUN go test -race (critical packages)" >> ci-logs/gate-order.txt
          go test -race -tags headless -count=1 ./internal/api ./internal/agent ./internal/sessions ./internal/contextplan ./internal/histref ./internal/runtime ./internal/localipc 2>&1 | tee ci-logs/audit-go-race.log
          echo "gate OK: go test -race (critical packages)" >> ci-logs/gate-order.txt

      # The stress + release-surface gate runs HEADLESS: it pins the
      # workflow/packaging/release contract from a source checkout and has
      # no need for the desktop build. The headless-tag spelling is a
      # release-contract assertion (cmd/stress_release_surface.go 3l).
      - name: Stress + release-surface gate (headless)
        run: |
          set -euo pipefail
          echo "RUN go run -tags headless ./cmd/sheytan-local-agent stress" >> ci-logs/gate-order.txt
          go run -tags headless ./cmd/sheytan-local-agent stress 2>&1 | tee ci-logs/audit-stress-surface.log
          echo "gate OK: stress suite (includes the release_surface scenario)" >> ci-logs/gate-order.txt

      - name: Release + version contract tests
        run: |
          set -euo pipefail
          echo "RUN go test ./internal/releasecontract/" >> ci-logs/gate-order.txt
          go test ./internal/releasecontract/ -count=1 -v 2>&1 | tee ci-logs/audit-release-contract.log
          echo "gate OK: release contract" >> ci-logs/gate-order.txt

      # File-catalog freshness gate (run 44205355718 repair, master work
      # order §0.2 root cause A): CI must PROVE the checked-in catalog is
      # exactly what the generator produces from the tracked tree, not
      # merely that the coverage test passes. Regenerating must be a
      # byte-level no-op; any diff means a tracked file was added,
      # renamed or deleted without a final regeneration step.
      - name: File-catalog freshness gate (regeneration is a no-op)
        run: |
          set -euo pipefail
          echo "RUN go run ./scripts/gen-filecatalog (freshness proof)" >> ci-logs/gate-order.txt
          go run ./scripts/gen-filecatalog 2>&1 | tee ci-logs/audit-catalog-freshness.log
          if ! git diff --exit-code -- docs/architecture/FILE_CATALOG.json docs/architecture/FILE_CATALOG.md > ci-logs/audit-catalog-freshness.diff; then
            echo "::error::the checked-in FILE_CATALOG is stale — regenerating it from the tracked tree produced a diff (ci-logs/audit-catalog-freshness.diff). Regeneration must be the LAST source-tree generation step: run \`go run ./scripts/gen-filecatalog\` after the final source/test/workflow/doc edit and commit both artifacts."
            sed -n '1,60p' ci-logs/audit-catalog-freshness.diff || true
            exit 1
          fi
          echo "gate OK: FILE_CATALOG regeneration is a no-op against the tracked tree" >> ci-logs/gate-order.txt

      # Consolidated-log collector fixtures: the one-file run log is a
      # primary deliverable, so its construction logic is regression-tested
      # on every run (synthetic fixtures: success, failure, warning-only,
      # empty, missing source, duplicates, red workflow, never-started).
      - name: Consolidated-log collector fixtures
        run: |
          set -euo pipefail
          echo "RUN bash scripts/ci/consolidate-run-log-fixtures.sh" >> ci-logs/gate-order.txt
          bash scripts/ci/consolidate-run-log-fixtures.sh 2>&1 | tee ci-logs/audit-log-fixtures.log
          echo "gate OK: log collector fixtures" >> ci-logs/gate-order.txt

      # F6 (run 43008361835): the diagnostics-index builder is itself
      # regression-tested here (schema, gate statuses, log inventory,
      # redaction) before any job depends on it.
      - name: Diagnostics-index fixture (self-test)
        run: |
          set -euo pipefail
          echo "RUN bash scripts/ci/diagnostics-index.sh --self-test" >> ci-logs/gate-order.txt
          bash scripts/ci/diagnostics-index.sh --self-test 2>&1 | tee ci-logs/audit-diagnostics-index-selftest.log
          echo "gate OK: diagnostics-index self-test" >> ci-logs/gate-order.txt

      # F6: the per-job machine-readable diagnostics index — always built,
      # printed to the step log (so it reaches the consolidated run-log
      # artifact) and written to ci-logs/diagnostics-index.json.
      # Best-effort: never masks the original job conclusion.
      - name: Build the per-job diagnostics index (always run)
        if: always()
        run: |
          set -uo pipefail
          bash scripts/ci/diagnostics-index.sh --job "Core audit (headless)" \
            || echo "::error::diagnostics index build failed (non-masking; original job conclusion stands)"
        env:
          DIAGNOSTICS_CACHE_HIT: ${{ steps.setup-go.outputs.cache-hit }}

  # ==========================================================================
  # UI — the Fyne suite (real widget trees over a fake core), the full
  # non-headless sweep, and the Linux desktop smoke under Xvfb.
  # ==========================================================================
  ui:
    name: Fyne UI gates (Linux)
    runs-on: ubuntu-26.04
    # v1.11.1 (run 43630164424 repair): NO needs: [preflight] — the Fyne
    # suite runs independently of the preflight compile gate.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Runner OS identity (Ubuntu 26.04 gate)
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          echo "dpkg arch: $(dpkg --print-architecture)"
          echo "ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
          # v1.11.1 (run 41933333132, work order §7): the 24.04 -> 26.04
          # migration is VERIFIED, not a YAML-only change — the exact OS
          # release and architecture are asserted so later runner drift
          # fails loudly here instead of surprising the build.
          . /etc/os-release
          if [ "${ID}" != "ubuntu" ] || [ "${VERSION_ID}" != "26.04" ]; then
            echo "::error::runner identity: expected ubuntu-26.04, got ${ID}-${VERSION_ID} — the Linux lane is pinned to 26.04"
            exit 1
          fi
          if [ "$(dpkg --print-architecture)" != "amd64" ]; then
            echo "::error::runner identity: expected amd64 architecture, got $(dpkg --print-architecture)"
            exit 1
          fi


      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # F1/F7 (run 43008361835): the cache key family is scoped to
          # OS + Go version + the dependency lock (go.sum) — declared
          # explicitly so dependency changes invalidate every lane's
          # cache together and a hit/miss is reproducible.
          cache-dependency-path: go.sum

      - name: Install Fyne build prerequisites + smoke tooling
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
            gcc \
            pkg-config \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxxf86vm-dev \
            libwayland-dev \
            libxkbcommon-dev \
            xorg-dev \
            xauth \
            xvfb \
            x11-utils

          # v1.11.1 (work order §7): the Fyne native prerequisites are
          # re-verified on the 26.04 image — pkg-config must actually
          # resolve gl, not merely have the package names installed.
          echo "gl pkg-config version: $(pkg-config --modversion gl)"
          echo "glx pkg-config version: $(pkg-config --modversion glx 2>/dev/null || echo 'n/a')"

      - name: Fyne UI contract + composition suite
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          echo "RUN go test ./ui/fyne/" >> ci-logs/gate-order.txt
          go test ./ui/fyne/ -count=1 -v 2>&1 | tee ci-logs/ui-fyne-tests.log
          echo "gate OK: go test ./ui/fyne/" >> ci-logs/gate-order.txt

      # v1.11.1 button-fit contract: every primary and utility destination
      # is walked at every representative logical size (phone → wide,
      # breakpoint boundaries, minimum probe) — visible buttons at or
      # above their content size, rigid controls inside the content area,
      # every action reachable. Same binary as the suite above; this named
      # stage exists so the gate and its dedicated log are individually
      # visible in the job transcript and the consolidated run log.
      - name: Fyne button fit matrix (logical-size sweep, no clipped labels)
        run: |
          set -euo pipefail
          echo "RUN go test ./ui/fyne/ -run TestButtonFitMatrix" >> ci-logs/gate-order.txt
          go test ./ui/fyne/ -count=1 -v -run "TestButtonFitMatrix|TestLongLabelButtonsShortened" 2>&1 | tee ci-logs/ui-button-fit-matrix.log
          echo "gate OK: button fit matrix" >> ci-logs/gate-order.txt

      - name: Full test sweep (desktop build, no headless tag)
        run: |
          set -euo pipefail
          echo "RUN go test ./... (desktop)" >> ci-logs/gate-order.txt
          go test -count=1 -timeout "${GO_TEST_TIMEOUT:-25m}" ./... 2>&1 | tee ci-logs/ui-go-test-full.log
          echo "gate OK: go test ./... (desktop)" >> ci-logs/gate-order.txt

      - name: Build the real Linux binary for the smoke
        run: |
          set -euo pipefail
          go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/SHEYTAN-LA" ./cmd/sheytan-local-agent
          file "$RUNNER_TEMP/SHEYTAN-LA"

      # Smoke contract (run #54 repair): bounded polling of OBSERVABLE
      # readiness — the X server lock (Xvfb ready) and the real window in
      # the X tree (xwininfo, title = config.AppName) — then a real
      # SIGTERM close with explicit reaping (zombie-safe; kill -0 alone
      # cannot distinguish a live event loop from an unreaped zombie).
      - name: "Desktop launch smoke (Xvfb: boot, window, clean shutdown)"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          cp "$RUNNER_TEMP/SHEYTAN-LA" .
          Xvfb :91 -screen 0 1280x800x24 >/dev/null 2>&1 &
          XVFB_PID=$!
          xvfb_ready=0
          # v1.11.1 (work order §7): readiness is a REAL X-server probe
          # (xdpyinfo answers only when the server accepts clients), not
          # a lock file that can exist before the server is usable.
          for i in $(seq 1 20); do
            if DISPLAY=:91 xdpyinfo >/dev/null 2>&1; then xvfb_ready=1; break; fi
            sleep 0.5
          done
          if [ "$xvfb_ready" -ne 1 ]; then
            echo "::error::desktop smoke: Xvfb never became ready within 10s"
            exit 1
          fi
          # F2 (run 43008361835): the controlled startup-diagnostics mode
          # rides along — monotonic phase timings land in the captured
          # stdout even when the pristine smoke copy never creates a data
          # root. Adds stdout evidence only; behavior is unchanged.
          DISPLAY=:91 SHEYTAN_STARTUP_DIAGNOSTICS=1 ./SHEYTAN-LA > smoke-stdout.log 2>&1 &
          APP_PID=$!
          app_ready=0
          for i in $(seq 1 60); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then break; fi
            if DISPLAY=:91 xwininfo -root -tree 2>/dev/null | grep -q "SHEYTAN-Local-Agent"; then
              app_ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$app_ready" -ne 1 ]; then
            echo "::error::desktop smoke: the application window was never observable within 30s (boot failure — see smoke-stdout.log)"
            cat smoke-stdout.log || true
            kill "$XVFB_PID" 2>/dev/null || true
            exit 1
          fi
          # v1.11.1 (run 43995689377) MANAGED-ENGINE SETTLE + VERDICT:
          # the same false-green fix as the Windows smoke. The launch
          # smoke above proves the SHELL only; on the pristine smoke copy
          # the startup gate runs transactional engine maintenance in
          # the background. Give it a BOUNDED window to reach a terminal
          # record, then apply the SAME engine-ready verdict as Windows
          # (rules mirror internal/smokeverdict): launch/resize alone
          # never claims Linux AI-readiness. Failure evidence classes:
          # update-failed-engine-unusable / prewarm BLOCKED / stage
          # engine swap — the run-43995689377 failure shape.
          app_log="data/logs/app.log"
          maint_terminal=0
          for i in $(seq 1 150); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then break; fi
            if [ -f "$app_log" ] && grep -qE "prewarm released|engine is current|prewarm BLOCKED|no maintenance this boot|no recent release ships a prebuilt asset" "$app_log" 2>/dev/null; then
              maint_terminal=1
              break
            fi
            sleep 1
          done
          echo "engine maintenance settle window: terminal record observed = ${maint_terminal} (deadline 150s)"
          # Soak: the event loop must stay alive under a real desktop session.
          soak_ok=1
          for i in $(seq 1 20); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then soak_ok=0; break; fi
            sleep 0.5
          done
          if [ "$soak_ok" -ne 1 ]; then
            echo "::error::desktop smoke: the application exited during the 10s soak (see smoke-stdout.log)"
            cat smoke-stdout.log || true
            kill "$XVFB_PID" 2>/dev/null || true
            exit 1
          fi
          # Real close path: SIGTERM, then bounded reap (zombie-safe).
          kill -TERM "$APP_PID"
          reaped=0
          for i in $(seq 1 30); do
            st="$(ps -o stat= -p "$APP_PID" 2>/dev/null || true)"
            if [ -z "$st" ]; then reaped=1; break; fi
            case "$st" in
              *Z*) wait "$APP_PID" 2>/dev/null || true; reaped=1; break;;
            esac
            sleep 0.5
          done
          if [ "$reaped" -ne 1 ]; then
            echo "::error::desktop smoke: the application ignored SIGTERM (no clean exit within 15s)"
            kill -KILL "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
            kill "$XVFB_PID" 2>/dev/null || true
            exit 1
          fi
          wait "$APP_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true

          # v1.11.1 (run 43995689377) MANAGED-ENGINE-READY VERDICT (Linux
          # mirror of the Windows gate; rules mirror
          # internal/smokeverdict): the shell gate passed above; the
          # Linux AI test-ready claim additionally requires the managed
          # engine. Candidate-defect failure records make the gate RED
          # with the explicit label. ONE distinct class is NOT a
          # candidate defect: upstream llama.cpp ships no prebuilt
          # engine asset for linux/amd64 (live-observed 2026-11-17) —
          # the engine cannot be installed from upstream at all. That
          # class is recorded as an explicit UPSTREAM-UNAVAILABLE
          # warning: the Linux artifact stays honestly UI-ONLY-TEST
          # (never TEST-READY-LINUX while upstream lacks the asset),
          # and the shell gate result stands.
          upstream_unavailable=0
          if [ -f "$app_log" ] && grep -q "no recent release ships a prebuilt asset" "$app_log"; then upstream_unavailable=1; fi
          engine_why=""
          if [ -f "$app_log" ]; then
            if grep -q "update-failed-engine-unusable" "$app_log"; then engine_why="${engine_why} maintenance BLOCKED (update-failed-engine-unusable);" ; fi
            if grep -q "prewarm BLOCKED" "$app_log"; then engine_why="${engine_why} prewarm refused;" ; fi
            if grep -q "stage engine swap" "$app_log"; then engine_why="${engine_why} engine swap failure;" ; fi
          fi
          engine_success=0
          if [ -f "$app_log" ] && grep -qE "prewarm released|engine is current|keeping the last-known-good engine" "$app_log"; then engine_success=1; fi
          if [ "$upstream_unavailable" -eq 1 ] && [ "$engine_success" -ne 1 ]; then
            echo "::warning::desktop smoke MANAGED-ENGINE-READY: upstream publishes NO prebuilt engine asset for linux/amd64 — the managed engine cannot be installed from upstream (an upstream availability limit, NOT a candidate defect). The Linux artifact is UI-ONLY-TEST; TEST-READY-LINUX is impossible while upstream lacks the asset. Launch/resize evidence alone never claims Linux AI-readiness."
            echo "SHELL SMOKE OK; ENGINE NOT READY (upstream-unavailable) — Linux artifact is UI-ONLY-TEST"
            echo "RUN managed-engine verdict (upstream-unavailable, UI-ONLY-TEST label)" >> "$GITHUB_WORKSPACE/ci-logs/gate-order.txt"
            echo "gate OK: desktop launch smoke (Xvfb) — shell green; engine upstream-unavailable (labelled)" >> "$GITHUB_WORKSPACE/ci-logs/gate-order.txt"
          elif [ -n "$engine_why" ] || [ "$engine_success" -ne 1 ]; then
            if [ -z "$engine_why" ]; then engine_why=" no managed-engine success record observed;" ; fi
            echo "::error::desktop smoke stage MANAGED-ENGINE-READY: the Linux shell PASSED (window/soak/SIGTERM) but the managed engine is NOT ready — the Linux AI test-ready gate is RED. Engine evidence:${engine_why}"
            if [ -f "$app_log" ]; then echo "--- data/logs/app.log tail ---"; tail -n 50 "$app_log"; fi
            echo "SHELL SMOKE OK; ENGINE NOT READY — this artifact is UI-ONLY-TEST at best, never TEST-READY"
            exit 1
          else
            echo "managed engine ready: maintenance success record observed, no BLOCKED/refused/swap-failure records"
            echo "INFERENCE: NOT RUN (no model selected on the smoke profile — engine health is not inference proof)"
            echo "SMOKE OK: window booted (observed in the X tree), event loop alive through the soak, clean SIGTERM shutdown with reap, managed engine ready"
          fi
          mkdir -p "$GITHUB_WORKSPACE/ci-logs"
          cp smoke-stdout.log "$GITHUB_WORKSPACE/ci-logs/linux-smoke-stdout.log"
          echo "RUN desktop launch smoke (Xvfb)" >> "$GITHUB_WORKSPACE/ci-logs/gate-order.txt"
          echo "gate OK: desktop launch smoke (Xvfb)" >> "$GITHUB_WORKSPACE/ci-logs/gate-order.txt"

      # F4/§5.3 (run 43008361835): the REAL desktop resize smoke — the
      # same binary, a real GLFW window under Xvfb, resized through the
      # logical-size matrix (phone portrait/landscape, tablets, breakpoint
      # boundaries, laptops, desktop, wide) by the app's controlled
      # SHEYTAN_UI_RESIZE_SMOKE mode. Every target must settle at its
      # requested logical size, the resolved navigation zone is printed
      # per size, and the app closes through the SAME graceful shutdown
      # coordinator a user close exercises (exit code 0, never a kill).
      - name: "Desktop resize smoke (Xvfb: logical-size matrix, graceful close)"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/smoke"
          rm -f resize-stdout.log
          # The screen must fit the widest matrix target (2560x1440).
          Xvfb :92 -screen 0 2560x1440x24 >/dev/null 2>&1 &
          XVFB_PID=$!
          xvfb_ready=0
          for i in $(seq 1 20); do
            if DISPLAY=:92 xdpyinfo >/dev/null 2>&1; then xvfb_ready=1; break; fi
            sleep 0.5
          done
          if [ "$xvfb_ready" -ne 1 ]; then
            echo "::error::resize smoke: Xvfb :92 never became ready within 10s"
            kill "$XVFB_PID" 2>/dev/null || true
            exit 1
          fi
          rc=0
          DISPLAY=:92 SHEYTAN_UI_RESIZE_SMOKE=1 SHEYTAN_STARTUP_DIAGNOSTICS=1 ./SHEYTAN-LA > resize-stdout.log 2>&1 || rc=$?
          cp resize-stdout.log "$GITHUB_WORKSPACE/ci-logs/linux-resize-smoke.log"
          if [ "$rc" -ne 0 ]; then
            echo "::error::resize smoke: the application exited with code $rc (see ci-logs/linux-resize-smoke.log)"
            cat resize-stdout.log || true
            kill "$XVFB_PID" 2>/dev/null || true
            exit 1
          fi
          if ! grep -q "UI-RESIZE-SMOKE complete targets=" resize-stdout.log; then
            echo "::error::resize smoke: no completion evidence line (see ci-logs/linux-resize-smoke.log)"
            cat resize-stdout.log || true
            kill "$XVFB_PID" 2>/dev/null || true
            exit 1
          fi
          failed_targets=$(grep -c "ok=false" resize-stdout.log || true)
          if [ "$failed_targets" -ne 0 ]; then
            echo "::error::resize smoke: $failed_targets resize target(s) did not settle at the requested logical size (see ci-logs/linux-resize-smoke.log)"
            grep "ok=false" resize-stdout.log || true
            kill "$XVFB_PID" 2>/dev/null || true
            exit 1
          fi
          echo "RESIZE SMOKE OK: every logical-size target settled, navigation zone recorded per size, graceful coordinator close (exit 0)"
          kill "$XVFB_PID" 2>/dev/null || true
          echo "RUN desktop resize smoke (Xvfb matrix)" >> "$GITHUB_WORKSPACE/ci-logs/gate-order.txt"
          echo "gate OK: desktop resize smoke (Xvfb matrix)" >> "$GITHUB_WORKSPACE/ci-logs/gate-order.txt"

      # F6: the per-job machine-readable diagnostics index (always run).
      - name: Build the per-job diagnostics index (always run)
        if: always()
        run: |
          set -uo pipefail
          bash scripts/ci/diagnostics-index.sh --job "Fyne UI gates (Linux)" \
            || echo "::error::diagnostics index build failed (non-masking; original job conclusion stands)"
        env:
          DIAGNOSTICS_CACHE_HIT: ${{ steps.setup-go.outputs.cache-hit }}

  # ==========================================================================
  # Five-platform reusable workflows (run 44306343338 repair, work order
  # §6.2): the orchestrator owns the push/PR triggers and invokes each of
  # the five platform workflows via workflow_call EXACTLY ONCE per run.
  # The legacy native in-orchestrator build-windows/build-linux lanes are
  # RETIRED — every distinct check they performed was transferred verbatim
  # into build-windows.yml/build-linux.yml, which are now the single
  # authoritative build path per platform (no duplicate platform builds,
  # no parallel legacy/new jobs). The platform lanes are INDEPENDENT gates
  # (own checkout/toolchain; a red preflight never skips their evidence —
  # the strict final verdict owns acceptance). Core headless audit (preflight), the
  # stress/contract audit and the Fyne UI gates remain separate jobs: they
  # are not duplicate platform builds. The Fyne UI gate stays until the
  # Go-Gui primary-shell migration actually replaces it. Least privilege:
  # each invocation receives contents: read and no secrets.
  # ==========================================================================
  platform-windows:
    name: Windows x64 (§10 reusable lane)
    uses: ./.github/workflows/build-windows.yml
    permissions:
      contents: read

  platform-linux:
    name: Linux x64 (§10 reusable lane)
    uses: ./.github/workflows/build-linux.yml
    permissions:
      contents: read

  platform-macos:
    name: macOS arm64/x64 (§10 reusable lane)
    uses: ./.github/workflows/build-macos.yml
    permissions:
      contents: read

  platform-android:
    name: Android arm64 (§10 reusable lane)
    uses: ./.github/workflows/build-android.yml
    permissions:
      contents: read

  platform-ios:
    name: iOS simulator (§10 reusable lane)
    uses: ./.github/workflows/build-ios.yml
    permissions:
      contents: read

  consolidate-logs:
    name: Consolidate logs
    runs-on: ubuntu-26.04
    needs: [preflight, audit, ui, platform-windows, platform-linux, platform-macos, platform-android, platform-ios]
    # v1.11.1 (run 43630164424 repair): !cancelled() — the collector runs
    # after ANY gate outcome (failure or skipped-by-tag-policy), so red
    # runs keep their evidence; it does not run after a cancelled run
    # (deliberate: cancellation means the operator stopped the run).
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout (collector script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ONE collector, TWO run-level artifacts (plain-text report + a
      # machine-readable run-diagnostics.json). The collector pulls the
      # COMPLETED JOB-SPECIFIC LOGS (GET /actions/jobs/{job_id}/logs) for
      # every upstream job that reached a terminal state, using the
      # paginated jobs metadata — never the run-attempt logs archive,
      # which may 404 while this very run is still in progress. The
      # collector's own progress is embedded as a local COLLECTOR SELF-LOG.
      # Red runs keep their evidence (the collector writes the report
      # BEFORE exiting nonzero on coverage gaps, and the uploads below
      # run with if: !cancelled()).
      - name: Collect the run-attempt logs into one plain-text report
        id: collector
        env:
          GH_TOKEN: ${{ github.token }}
          CONSOLIDATE_REPO: ${{ github.repository }}
          CONSOLIDATE_RUN_ID: ${{ github.run_id }}
          CONSOLIDATE_ATTEMPT: ${{ github.run_attempt }}
          CONSOLIDATE_COMMIT: ${{ github.sha }}
          CONSOLIDATE_REF: ${{ github.ref }}
          CONSOLIDATE_WORKFLOW: ${{ github.workflow }}
          CONSOLIDATE_TRIGGER: ${{ github.event_name }}
        run: |
          set -uo pipefail
          rc=0
          bash scripts/ci/consolidate-run-log.sh \
            --out SHEYTAN-LA-errors-warnings.txt \
            --json-out run-diagnostics.json || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::error::Consolidate logs: collector reported a coverage/verification gap (rc=$rc) — the report artifact still carries the diagnosis"
          fi
          {
            echo "## Consolidated run log"
            echo ""
            echo "Artifacts: \`SHEYTAN-LA-errors-warnings.txt\` (ONE errors/warnings-only plain-text file, upload-artifact archive:false) and \`run-diagnostics.json\` (machine-readable per-job index), attempt ${{ github.run_attempt }} recorded INSIDE both."
            echo "If the report contains a MISSING LOG SOURCES section, job logs could not be recovered for those jobs and coverage=INCOMPLETE."
            echo ""
            echo "Job results: preflight=${{ needs.preflight.result }} audit=${{ needs.audit.result }} ui=${{ needs.ui.result }} platform-windows=${{ needs.platform-windows.result }} platform-linux=${{ needs.platform-linux.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # The ONE mandatory user-facing log artifact. upload-artifact uses
      # the upstream v7 RELEASE TAG (repo-wide action-reference policy);
      # archive:false uploads the file ITSELF (filename = artifact display
      # name, no ZIP wrapper — verified against this revision's action.yml);
      # if-no-files-found: error (never ignore — a silently absent log is
      # a contract breach); stable name — a rerun replaces the same
      # artifact; the attempt number lives inside the report content.
      - name: Upload the errors-warnings-only consolidated diagnostic (single plain-text artifact)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SHEYTAN-LA-errors-warnings.txt
          path: SHEYTAN-LA-errors-warnings.txt
          if-no-files-found: error
          retention-days: 14
          overwrite: true
          archive: false

      # The machine-readable run-level diagnostics index (§9.2): every
      # job of the run with its API status/conclusion/id and the
      # collector's per-job log-source category (CAPTURED / SKIPPED /
      # MISSING / IN_PROGRESS / SELF). Red runs keep it: same
      # !cancelled() condition as the plain-text report.
      - name: Upload the machine-readable run diagnostics index
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: run-diagnostics.json
          path: run-diagnostics.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
          archive: false

      - name: Collector verdict (fail the job on coverage gaps)
        if: ${{ !cancelled() }}
        run: |
          rc="${{ steps.collector.outputs.rc }}"
          if [ -z "$rc" ]; then
            echo "::error::collector step produced no verdict — fail closed"
            exit 1
          fi
          if [ "$rc" != "0" ]; then
            echo "::error::collector exited $rc — the report artifact names the missing log sources / errors"
            exit 1
          fi
          echo "collector verdict: complete report (rc=0)"

  # ==========================================================================
  # Final verdict — the STRICT overall conclusion (run 43630164424
  # repair). Separating evidence collection from the verdict means a red
  # preflight can never again skip the four independent gates, while the
  # workflow still fails whenever ANY required gate is not success.
  #   - No continue-on-error anywhere: job continuation (gates run) and
  #     result acceptance (gates must be green) are different concerns.
  #   - The collector is NOT a required gate: a collector failure is
  #     REPORTED here, but it can never turn a red run green (a failed
  #     gate already failed the verdict) nor mask a green one (its own
  #     job conclusion is independently red).
  #   - Runs after every expected job reached a terminal state
  #     (!cancelled()); a skipped REQUIRED gate (impossible while the
  #     needs list is intact) also fails the verdict — only the tag-only
  #     release job may legitimately be skipped.
  # ==========================================================================
  final-verdict:
    name: Final verdict (all required gates)
    runs-on: ubuntu-26.04
    needs: [preflight, audit, ui, platform-windows, platform-linux, platform-macos, platform-android, platform-ios, consolidate-logs]
    if: ${{ !cancelled() }}
    timeout-minutes: 5
    steps:
      - name: Render the gate matrix
        run: |
          echo "Required gates: preflight=${{ needs.preflight.result }} audit=${{ needs.audit.result }} ui=${{ needs.ui.result }} platform-windows=${{ needs.platform-windows.result }} platform-linux=${{ needs.platform-linux.result }}"
          echo "Five-platform lanes (§10): platform-windows=${{ needs.platform-windows.result }} platform-linux=${{ needs.platform-linux.result }} platform-macos=${{ needs.platform-macos.result }} platform-android=${{ needs.platform-android.result }} platform-ios=${{ needs.platform-ios.result }}"
          echo "Evidence collector: consolidate-logs=${{ needs.consolidate-logs.result }} (reported separately; never a required gate)"
      - name: Verdict (fail unless every required gate is success)
        run: |
          verdict=0
          for gate in "preflight:${{ needs.preflight.result }}" \
                     "audit:${{ needs.audit.result }}" \
                     "ui:${{ needs.ui.result }}" \
                     "platform-windows:${{ needs.platform-windows.result }}" \
                     "platform-linux:${{ needs.platform-linux.result }}" \
                     "platform-macos:${{ needs.platform-macos.result }}" \
                     "platform-android:${{ needs.platform-android.result }}" \
                     "platform-ios:${{ needs.platform-ios.result }}"; do
            name="${gate%%:*}"
            result="${gate#*:}"
            if [ "$result" != "success" ]; then
              echo "::error::required gate '$name' concluded '$result' — the overall workflow verdict is FAILURE"
              verdict=1
            fi
          done
          if [ "${{ needs.consolidate-logs.result }}" != "success" ]; then
            echo "::warning::evidence collector consolidate-logs concluded '${{ needs.consolidate-logs.result }}' — diagnostics coverage may be incomplete (reported separately; not a required gate)"
          fi
          if [ "$verdict" -ne 0 ]; then
            exit 1
          fi
          echo "FINAL VERDICT: SUCCESS — every required gate (preflight, audit, ui, platform-windows, platform-linux, platform-macos, platform-android, platform-ios) is green."

  # ==========================================================================
  # Release — tags only. Publishes the contracted artifacts.
  # ==========================================================================
  release:
    name: Release (tags only)
    runs-on: ubuntu-26.04
    needs: [audit, ui, platform-windows, platform-linux, consolidate-logs, final-verdict]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      APP_VERSION: "1.11.1"
    steps:
      - name: Download Windows portable package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: SHEYTAN-LA-ALPHA-windows-x64-portable
          path: dist/

      - name: Download Linux portable package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: SHEYTAN-LA-ALPHA-linux-x64-portable
          path: dist/

      - name: Verify the artifact set against the release contract
        run: |
          set -euo pipefail
          for want in \
            "SHEYTAN-LA-ALPHA-windows-x64-portable.zip" \
            "SHEYTAN-LA-ALPHA-linux-x64-portable.tar.gz"; do
            test -f "dist/$want" || { echo "::error::release artifact missing: $want"; exit 1; }
          done
          echo "release artifact set OK"

      # UPDATE.md contract (drift fixed here): the in-app updater
      # (internal/updater, AppManifestURL) consumes release-manifest.json —
      # version + per-platform url/sha256/sizeBytes/kind — and the release
      # carries a deterministic SHA256SUMS.txt. Both are generated HERE,
      # from the exact artifact bytes being published (never hand-written),
      # deterministically: jq -nS emits sorted keys; SHA256SUMS.txt is
      # LC_ALL=C-sorted by filename with the canonical two-space separator.
      - name: Generate release-manifest.json and SHA256SUMS.txt
        run: |
          set -euo pipefail
          ver="${APP_VERSION}"
          base="${{ github.server_url }}/${{ github.repository }}/releases/download/v${ver}"
          win_zip="SHEYTAN-LA-ALPHA-windows-x64-portable.zip"
          lin_zip="SHEYTAN-LA-ALPHA-linux-x64-portable.tar.gz"
          win_sha="$(sha256sum "dist/${win_zip}" | cut -d' ' -f1)"
          win_size="$(stat -c%s "dist/${win_zip}")"
          lin_sha="$(sha256sum "dist/${lin_zip}" | cut -d' ' -f1)"
          lin_size="$(stat -c%s "dist/${lin_zip}")"
          jq -nS \
            --arg ver "$ver" \
            --arg winurl "${base}/${win_zip}" \
            --arg winsha "$win_sha" \
            --arg winsize "$win_size" \
            --arg linurl "${base}/${lin_zip}" \
            --arg linsha "$lin_sha" \
            --arg linsize "$lin_size" \
            '{version: $ver,
              platforms: {
                "linux-x64":   {url: $linurl, sha256: $linsha, sizeBytes: ($linsize|tonumber), kind: "tar.gz"},
                "windows-x64": {url: $winurl, sha256: $winsha, sizeBytes: ($winsize|tonumber), kind: "zip"}
              }}' > dist/release-manifest.json
          {
            printf '%s  %s\n' "$(sha256sum "dist/${lin_zip}" | cut -d' ' -f1)" "${lin_zip}"
            printf '%s  %s\n' "$(sha256sum "dist/${win_zip}" | cut -d' ' -f1)" "${win_zip}"
            printf '%s  %s\n' "$(sha256sum "dist/release-manifest.json" | cut -d' ' -f1)" "release-manifest.json"
          } | LC_ALL=C sort -k2 > dist/SHA256SUMS.txt
          jq -e '.version == $ver and (.platforms["windows-x64"].sha256 | length == 64) and (.platforms["linux-x64"].sha256 | length == 64)' --arg ver "$ver" dist/release-manifest.json > /dev/null \
            || { echo "::error::generated release-manifest.json failed its contract self-check"; exit 1; }
          test "$(wc -l < dist/SHA256SUMS.txt)" -eq 3 || { echo "::error::SHA256SUMS.txt must list exactly 3 files (linux tar.gz, windows zip, release-manifest.json)"; exit 1; }
          echo "--- SHA256SUMS.txt ---"; cat dist/SHA256SUMS.txt

      - name: Publish the release
        # v1.11.1 (CodeQL run 43883548572, alert #186): immutable 40-hex
        # commit pin for the verified upstream v3 tag (resolved from the
        # softprops/action-gh-release repository; not covered by the
        # run-log resolution table, so it was resolved fresh from upstream) —
        # same policy as every external action in this workflow.
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            dist/${{ env.WIN_PKG_ROOT }}-v${{ env.APP_VERSION }}-windows-x64.zip
            dist/${{ env.LINUX_PKG_ROOT }}-v${{ env.APP_VERSION }}-linux-x64.zip
            dist/release-manifest.json
            dist/SHA256SUMS.txt
          generate_release_notes: true
