name: Build Desktop

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# v1.10.14-fixed (R2/D16) CAPACITY — SUPERSEDE STALE RUNS: a new push
# cancels the superseded run instead of letting it burn 20+ minutes of
# runner time to a verdict nobody reads (the run-#38 class). Group from
# workflow+ref so the same policy covers push/PR/dispatch. Best-effort
# capacity only: a cancellation can never change, mask or reorder a gate
# outcome on the run that matters (I16).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# GATE SEMANTICS (v1.4.0, § CI-integrity — the run 35996462352 repair).
#
# Every step in this pipeline is one of exactly three classes, and the
# class determines what a failure means:
#
#   REQUIRED GATES (fail ⇒ job fails):
#     - typecheck / lint / test:units / test:release — frontend source
#       and release-metadata contracts.
#     - npm run build + verify-static-assets + embedded-frontend checks
#       — the production build contract.
#     - go test ./internal/... (headless) and go test ./... — the Go
#       suites, including the testfakes portability gate and every
#       integration boundary exercised there.
#     - go vet ./... — static analysis.
#     - go test -race (audit) — the concurrency-heavy packages.
#     - cmake configure/build + ctest — the native C++ engine.
#     - stress suite (Linux), executable smoke probes, ZIP/installer
#       structural verification.
#     These run under `set -euo pipefail` (bash) or with per-command
#     $LASTEXITCODE assertions (pwsh). A green job therefore means the
#     gated verification genuinely passed — the v1.3.7 Windows job could
#     be green while `go test` failed (four annotations on a green run);
#     that failure-hiding class is repaired in v1.4.0 and every future
#     native-command invocation must keep the assertion discipline.
#
#   OPTIONAL DIAGNOSTICS (informational, never gate):
#     - Authenticode signature STATUS reporting (unsigned is expected
#       until credentials exist; it is reported, never faked).
#     - tool/version echo steps (node --version, cmake --version...).
#
#   ENVIRONMENT-SPECIFIC TESTS (fail or skip depending on the runner's
#     ability to provide the real dependency; a skip is honest and
#     loud, never a silent pass):
#     - TestRealCppHost* native integration tests: the CI always builds
#       the C++ host BEFORE the Go suites, so on CI these RUN for real;
#       a developer machine without the build skips with the reason.
#     - Live-model browser E2E (test:e2e with a provisioned engine):
#       runs only when the environment provides a real engine+model;
#       without one the E2E suite proves the full stack minus live
#       generation and NEVER fabricates a green generation result.
#
# The release identity is NOT hardcoded here. package.json is the single
# source of truth; the audit job resolves it at runtime
# (scripts/release-version.mjs --env) and every other job consumes it via
# needs-outputs. A version bump therefore only touches package.json + the
# derived surfaces the script repairs. The identity is version-only:
# APP_VERSION; there is no codename dimension and no second version
# variable. Release-metadata VERIFICATION is likewise centralized: every
# build job invokes the canonical cross-platform validator in check mode
# instead of per-shell reimplementations (the v1.3.1 Windows job's
# Select-String -SimpleMatch block treated the AppVersion pattern's regex
# whitespace-escapes as literal text and failed every run: 35542000811).
env:
  # v1.10.14-fixed (R4/D19): the go1.27 line — latest stable go1.27.3
  # (2026-10-19, security fixes to crypto/x509; source: go.dev release
  # history, re-derived at P1 2026-10-23). go.mod's `go 1.26` is a MINIMUM
  # below the toolchain: no go.mod edit (charter).
  GO_VERSION: "1.27"
  NODE_VERSION: "24"
  # Canonical package-root variables — ONE root per platform, from which
  # every staging directory, ZIP name, ZIP entry check, artifact name and
  # release-metadata reference is derived. No root literal is repeated
  # below; the Go contract (internal/releasecontract) mirrors these values
  # and the stress gate fails the build if the two copies of the truth ever
  # drift apart.
  # v1.10.14-fixed (D7/I11): ONE naming map — both roots spell the product
  # identically. The Linux executable inside the package KEEPS its name
  # (SHEYTAN-Local-Agent); only the package root, the ZIP/asset names and
  # the artifact display names follow this map.
  WIN_PKG_ROOT: "SHEYTAN-LA"
  LINUX_PKG_ROOT: "SHEYTAN-LA"

jobs:
  # v1.10.14-fixed (R2/D16) PREFLIGHT COMPILE GATE — the run-#38 case
  # study: 21m29s to learn one file did not compile (13m07s Windows and
  # 14m55s Linux both died in go test, plus audit). This fast ubuntu job
  # runs the compile gate FIRST; both platform jobs wait on it, so a
  # compile defect dies in ~2 minutes with ONE red job, not three.
  # Additive only: the platform jobs' gates, step order and exit
  # contracts are untouched (I16).
  preflight:
    name: Preflight compile gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Compile gate (go build ./...)
        shell: bash
        run: |
          set -euo pipefail

          go version

          # v1.10.14-fixed (R3/D15) FIRST-BYTE CAPTURE: the gate's log
          # exists (empty) BEFORE the command starts — even a toolchain
          # failure leaves its log behind (I15).
          mkdir -p ci-logs
          : > ci-logs/preflight-build.log
          echo "RUN go build (preflight)" > ci-logs/gate-order.txt

          go build ./... 2>&1 | tee ci-logs/preflight-build.log

          echo "OK go build (preflight)" >> ci-logs/gate-order.txt

      # v1.10.14-fixed (D21/I18, run-#41 R2): the per-class log-artifact
      # sprawl ends here. The job's ci-logs writes are UNCHANGED (the gate
      # keeps its first-byte log); the ONE upload surface is a single
      # plain-text part — every ci-logs file with per-file headers plus a
      # ci-summary accounting line — built under log-parts/ so the part
      # never self-includes its own inputs. The consolidate-logs job
      # merges all four parts into SHEYTAN-LA-v1.10.14-all-logs (the ONE
      # log artifact, I18) and deletes the parts in-run; retention-days: 1
      # bounds a part's exposure even if that deletion ever fails.
      - name: Build preflight log part (all outcomes)
        if: always()
        shell: bash
        env:
          JOB_OUTCOME: ${{ job.status }}
        run: |
          set -uo pipefail
          mkdir -p log-parts
          part="log-parts/preflight-logs-part-${GITHUB_RUN_ATTEMPT}.txt"
          {
            echo "job: preflight"
            echo "attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "outcome: ${JOB_OUTCOME}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$part"
          for f in ci-logs/*; do
            [ -f "$f" ] || continue
            {
              echo "----- 8< ----- $(basename "$f") -----"
              cat "$f"
              echo ""
            } >> "$part"
          done
          files="$(find ci-logs -maxdepth 1 -type f 2>/dev/null | wc -l)"
          echo "ci-summary job=preflight outcome=${JOB_OUTCOME} log-files=${files} part=$(basename "$part")" >> "$part"
          echo "preflight log part built: $part ($(wc -c < "$part") bytes)"

      - name: Upload preflight log part (all outcomes)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preflight-logs-part-attempt${{ github.run_attempt }}
          path: log-parts/preflight-logs-part-*.txt
          if-no-files-found: error
          retention-days: 1

  audit:
    name: Source & frontend audit
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    # The identity step emits APP_VERSION (exactly as release-version.mjs
    # --env names it). The output names here MUST match the keys written to
    # GITHUB_OUTPUT below.
    outputs:
      version: ${{ steps.identity.outputs.APP_VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          package-manager-cache: true

      - name: Verify repository shape and release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -f package-lock.json
          test -f go.mod
          test -f go.sum
          test -f internal/config/config.go
          test -f src/App.tsx
          test -f src/AgentBody.tsx
          test -f src/styles.css
          test ! -e web/package.json

          # v1.10.7 REPOSITORY SHAPE (R-A/R-B, operator specification): the
          # root shows ONLY README.md / LICENSE.md / SECURITY.md as visible
          # documentation; all other documentation lives in docs/; the core
          # entry lives in cmd/sheytan-local-agent/; the launcher script
          # source lives in packaging/. Two-sided: the moved files must
          # EXIST at their new paths, and the old root paths must be GONE.
          for f in docs/ARCHITECTURE.md docs/CONTRIBUTING.md docs/ROADMAP.md \
                   docs/UPDATE.md docs/agent.md docs/changelog.md docs/worklog.md \
                   cmd/sheytan-local-agent/main.go cmd/sheytan-local-agent/main_headless.go \
                   cmd/sheytan-local-agent/main_other.go cmd/sheytan-local-agent/main_stderr.go \
                   cmd/sheytan-local-agent/main_windows.go \
                   packaging/SHEYTAN-LA.bat; do
            test -f "$f" || { echo "::error::repository shape: missing $f (v1.10.7 reshape contract)"; exit 1; }
          done
          for f in ARCHITECTURE.md CONTRIBUTING.md ROADMAP.md UPDATE.md agent.md \
                   changelog.md worklog.md main.go main_headless.go main_other.go \
                   main_stderr.go main_windows.go SHEYTAN-LA.bat; do
            test ! -e "$f" || { echo "::error::repository shape: $f must live at its v1.10.7 relocated path, not the repo root"; exit 1; }
          done

          node --version
          npm --version

          node_major="$(node -p 'process.versions.node.split(".")[0]')"
          test "$node_major" -ge 24

          node scripts/release-version.mjs

          # Derive the release identity from package.json (the one
          # canonical source) instead of trusting a workflow env constant.
          identity_out="$(node scripts/release-version.mjs --env)"

          while IFS='=' read -r key value; do
            case "$key" in
              APP_VERSION)
                export "$key=$value"
                printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done <<< "$identity_out"

          # Fail fast — before any expensive build job starts — if the
          # release identity did not resolve.
          if [ -z "${APP_VERSION:-}" ]; then
            echo "::error::Release identity did not resolve. APP_VERSION must be non-empty after 'release-version.mjs --env'."
            exit 1
          fi

          # The identity step must be tagged so needs-outputs can read it
          # (id: identity above). Job outputs map from the APP_* names.
          echo "Resolved identity: $APP_VERSION"

          # THE canonical release-metadata verification (v1.3.2): the
          # repaired tree must pass the one cross-platform validator.
          # There is deliberately NO per-shell reimplementation here — the
          # bash greps the audit job previously carried were one of three
          # divergent copies of the same semantics.
          node scripts/release-version.mjs --check

      - name: Install frontend dependencies
        shell: bash
        run: npm ci

      - name: Frontend verification
        shell: bash
        run: |
          set -euo pipefail

          npm run typecheck
          npm run lint
          npm run test:units

          # v1.3.2: release-metadata regression suite (semver shapes,
          # drift/missing markers, whitespace/CRLF, --env identity,
          # workflow contract — the run 35542000811 failure class).
          npm run test:release

          # Production build contract: start from a CLEAN dist so no
          # previous-generation asset can survive into web/static.
          rm -rf dist
          npm run build

      - name: Verify embedded frontend
        shell: bash
        run: |
          set -euo pipefail

          test -f web/static/index.html
          grep -q '<div id="root"></div>' web/static/index.html

          echo "Embedded frontend verification passed."

      # v1.3.1: the static-asset acceptance contract. The embedded
      # frontend must use STABLE deterministic filenames (index.js,
      # AgentBody.js, ...) — content-hashed names are rejected, every
      # referenced asset and dynamic-import chunk must exist, and
      # web/static must exactly mirror the clean build in dist/.
      - name: Verify stable frontend asset contract
        shell: bash
        run: |
          set -euo pipefail

          node scripts/verify-static-assets.mjs --dist

      # v1.3.1: codename removal gate. The product identity is
      # version-only; no codename may remain anywhere in the tracked
      # tree. v1.7.6: the gate is TOKEN-AWARE (scripts/codename-gate.mjs)
      # — a retired-codename TOKEN fails in every spelling (bare, quoted,
      # snake/kebab/camel, digit-joined, any case), while larger English
      # identifiers that merely contain the same character sequence across
      # a compound boundary (the historical MaterializeTarget false
      # positive) are allowed. Deterministic proofs:
      # scripts/codename-gate.test.mjs (run in npm run test:release).
      - name: Codename removal gate
        shell: bash
        run: |
          set -euo pipefail

          node scripts/codename-gate.mjs

      # v1.3.5: native temp-path portability gate (Actions run
      # 35583009466 — tokenizer/generate failed on Windows because two
      # tests assumed a POSIX temp location). No native source or test
      # may hard-code a POSIX temp path literal or read TMPDIR directly;
      # the ONE canonical cross-platform helper is
      # native/engine/tests/temp_dir.h (its POSIX fallback constant is
      # the single sanctioned literal).
      - name: Native temp-path portability gate
        shell: bash
        run: |
          set -euo pipefail

          bad="$(git grep -n -F '"/tmp' -- 'native/engine' \
            ':!native/engine/tests/temp_dir.h' || true)"

          if [ -n "$bad" ]; then
            echo "::error::Hard-coded POSIX temp path literal in native sources (use native/engine/tests/temp_dir.h):"
            printf '%s\n' "$bad"
            exit 1
          fi

          env_bad="$(git grep -n -F 'getenv("TMPDIR")' -- 'native/engine' \
            ':!native/engine/tests/temp_dir.h' || true)"

          if [ -n "$env_bad" ]; then
            echo "::error::Direct TMPDIR dependence in native sources (use native/engine/tests/temp_dir.h):"
            printf '%s\n' "$env_bad"
            exit 1
          fi

          echo "Native temp-path portability gate passed."

      - name: Setup Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Focused race gate. The concurrency-heavy packages run under the
      # race detector on every push/PR (headless tag: the desktop shell is
      # not needed for these suites; CGO is required by the engine-boundary
      # code paths they exercise).
      - name: Go race gate (concurrency-heavy packages)
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail

          go version

          mkdir -p ci-logs

          # v1.10.6 FAILURE-VISIBILITY: every Go-verification command tees to
          # a log file. The if:failure() steps at the end of this job append
          # the failing test names to $GITHUB_STEP_SUMMARY (publicly visible
          # without login — this is how a credential-less agent reads the
          # next failure) and upload the full logs via
          # actions/upload-artifact. v1.10.13 D1 (operator directive): the
          # summaries publish ERRORS ONLY — no tail dumps; every test still
          # runs exactly as before. No secrets/keys are ever written to
          # these outputs.
          go test -race -tags headless -count=1 ./internal/api ./internal/agent ./internal/sessions ./internal/contextplan ./internal/histref ./internal/runtime 2>&1 | tee ci-logs/audit-go-race.log

          echo "Race gate passed."

      # The C++ native engine builds and its dependency-free test suites
      # pass on the same runner the Go build uses. Ubuntu-24.04 images ship
      # cmake (>= 3.28) and g++.
      #
      # CMake cache rule: a relocatable CMake build tree is NOT a safe
      # cache artifact — CMakeCache.txt / CMakeFiles embed absolute paths,
      # and a cache entry produced under one workspace casing cannot be
      # restored into another. The build directory is therefore wiped and
      # reconfigured with `--fresh` on every run; compile cost is paid once
      # per run and reproducibility is exact.
      - name: Native engine (C++) build and tests
        shell: bash
        run: |
          set -euo pipefail

          cmake --version

          # Regression guard: never reuse a stale or path-mismatched cache.
          # Wipe the build dir unconditionally, then configure with --fresh
          # so cmake regenerates every cache entry from scratch.
          rm -rf native/engine/build
          cmake -S native/engine -B native/engine/build --fresh

          # Regression guard: the freshly written CMakeCache.txt must
          # record THIS runner workspace's absolute paths (correct letter
          # case included).
          grep -F "$(pwd)/native/engine/build" native/engine/build/CMakeCache.txt > /dev/null
          grep -F "$(pwd)/native/engine" native/engine/build/CMakeCache.txt > /dev/null

          cmake --build native/engine/build
          ctest --test-dir native/engine/build --output-on-failure

          test -x native/engine/build/shtn-engine-host
          echo "Native engine verification passed."

      # v1.10.6 FAILURE-VISIBILITY (runs on ANY failure in this job): the
      # summary excerpts ARE the readable log for the next cycle — no
      # credentials needed. Fenced blocks keep the output copy-pasteable;
      # no secrets/keys appear here (test logs carry no capability tokens,
      # runIds or sessionIds).
      #
      # v1.10.7 VISIBILITY 2.0 (V-A): this step ALSO emits ::error::
      # annotations naming the failing audit gate(s) and the first failing
      # test names, machine-readable via the check-run annotations API
      # without any login (verified against run 38731387959). Capped at the
      # 10-annotations-per-step limit; no secrets (rule 7).
      - name: Failure summary (audit job)
        if: failure()
        shell: bash
        run: |
          {
            echo "## Audit job FAILED"
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY" || true

          emitted=0
          if [ -d ci-logs ]; then
            for f in ci-logs/*.log; do
              [ -f "$f" ] || continue
              failing="$(grep -E '^(--- FAIL|FAIL|panic:|fatal error:)' "$f" | head -60 || true)"
              # v1.10.13 D1: errors-only — the 200-line tail dump is gone;
              # the capped failing-line block is the whole publication.
              {
                echo ""
                echo "### $f — failing test names"
                echo '```'
                printf '%s\n' "$failing"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY" || true
              if [ -n "$failing" ]; then
                while IFS= read -r line; do
                  [ "$emitted" -lt 10 ] || break
                  msg="$(basename "$f"): $line"
                  [ ${#msg} -le 250 ] || msg="${msg:0:247}..."
                  echo "::error::$msg"
                  emitted=$((emitted + 1))
                done <<< "$failing"
              fi
            done
          fi
          if [ "$emitted" -eq 0 ]; then
            echo "::error::Audit job failed with no FAIL-prefixed lines captured — read the step summary and the all-logs artifact (all-logs.txt, D21)"
          fi

      # v1.10.14-fixed (D21/I18, run-#41 R2): ONE log part per job — the
      # two per-class audit uploads (failure-gated verification logs +
      # all-outcomes ci-logs) fold into a single part built on EVERY
      # outcome; see the preflight part builder for the full contract.
      - name: Build audit log part (all outcomes)
        if: always()
        shell: bash
        env:
          JOB_OUTCOME: ${{ job.status }}
        run: |
          set -uo pipefail
          mkdir -p log-parts
          part="log-parts/audit-logs-part-${GITHUB_RUN_ATTEMPT}.txt"
          {
            echo "job: audit"
            echo "attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "outcome: ${JOB_OUTCOME}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$part"
          for f in ci-logs/*; do
            [ -f "$f" ] || continue
            {
              echo "----- 8< ----- $(basename "$f") -----"
              cat "$f"
              echo ""
            } >> "$part"
          done
          files="$(find ci-logs -maxdepth 1 -type f 2>/dev/null | wc -l)"
          echo "ci-summary job=audit outcome=${JOB_OUTCOME} log-files=${files} part=$(basename "$part")" >> "$part"
          echo "audit log part built: $part ($(wc -c < "$part") bytes)"

      - name: Upload audit log part (all outcomes)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-logs-part-attempt${{ github.run_attempt }}
          path: log-parts/audit-logs-part-*.txt
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Windows x64
    needs: [audit, preflight]
    timeout-minutes: 60

    # Identity flows from the audit job's runtime resolution of
    # package.json — no local hardcoded version can drift here either.
    env:
      APP_VERSION: ${{ needs.audit.outputs.version }}
    runs-on: windows-latest

    steps:
      # v1.10.8 LINE-ENDING POLICY (W-A, run 38823624040 class): the
      # windows-latest image defaults to core.autocrlf=true, so the
      # checkout materialized every .go file as CRLF and the gofmt gate
      # (which normalizes to LF) listed the whole tree — while the
      # committed tree is byte-for-byte gofmt-clean (Linux's identical
      # gate is green on the same commit). The gate is RIGHT; the
      # checkout was wrong. This pin plus the repository .gitattributes
      # (*.go text eol=lf) make the Windows working tree the same LF tree
      # Linux already sees. The gofmt gate itself is byte-identical.
      - name: Pin checkout to LF (line-ending policy, W-A)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config --global core.autocrlf false
          $pinned = git config --global core.autocrlf
          if ("$pinned" -ne "false") {
            throw "[W-A] core.autocrlf pin failed (got: $pinned)."
          }
          Write-Host "core.autocrlf=false pinned pre-checkout: $(& git --version)"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          package-manager-cache: true

      - name: Verify Node and repository
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          node --version
          npm --version

          $nodeMajor = [int](node --version).TrimStart("v").Split(".")[0]

          if ($nodeMajor -lt 24) {
            throw "Node.js 24 or newer is required."
          }

          if (-not (Test-Path "package.json")) {
            throw "Root package.json missing."
          }

          if (-not (Test-Path "package-lock.json")) {
            throw "Root package-lock.json missing."
          }

          if (-not (Test-Path "go.mod")) {
            throw "go.mod missing."
          }

          if (-not (Test-Path "go.sum")) {
            throw "go.sum missing."
          }

          if (Test-Path "web/package.json") {
            throw "Unexpected web/package.json found."
          }

      - name: Synchronize release metadata
        shell: pwsh
        run: node scripts/release-version.mjs

      # v1.3.2 ROOT FIX for CI run 35542000811: release-metadata
      # verification is performed by the ONE canonical cross-platform
      # validator (scripts/release-version.mjs --check). The previous
      # per-shell PowerShell block built a regex-syntax pattern for the
      # AppVersion constant (whitespace-escape tokens around the equals
      # sign) and passed it to Select-String -SimpleMatch, which treats
      # regex escapes as LITERAL text — the pattern could never match
      # config.go's real content and the Windows job failed at this step
      # on every run. Shell steps now only orchestrate the canonical
      # validator; the validator's own workflow contract (checked in
      # --check mode) fails the build if a per-shell reimplementation
      # ever reappears.
      - name: Verify release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          node scripts/release-version.mjs --check

          if ($LASTEXITCODE -ne 0) {
            throw "Canonical release metadata verification failed (release-version.mjs --check)."
          }

          Write-Host "Release metadata verified through the canonical cross-platform gate."

      - name: Install frontend dependencies
        shell: pwsh
        run: npm ci

      - name: Frontend verification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # v1.4.0: native-command exit codes are asserted explicitly —
          # npm failures must fail the job, not fall through to the next
          # statement (the run 35996462352 failure-hiding class).
          #
          # v1.10.14-fixed (R2/D15/D18): the audit gates leave first-byte
          # logs like every other gate, so the all-logs artifact carries
          # real evidence on every outcome.
          function Invoke-Gate {
            param([scriptblock]$Command, [string]$Label, [string]$LogFile)
            if ($LogFile) {
              New-Item -ItemType Directory -Force -Path "ci-logs" | Out-Null
              New-Item -ItemType File -Path $LogFile -Force | Out-Null
              & $Command 2>&1 | Tee-Object -FilePath $LogFile
            } else {
              & $Command
            }
            if ($LASTEXITCODE -ne 0) {
              throw "[gate] $Label failed with exit code $LASTEXITCODE."
            }
            if ($LogFile) {
              Write-Host "::notice::gate OK: $Label"
            }
          }

          Invoke-Gate { npm run typecheck } "npm run typecheck" "ci-logs/audit-typecheck.log"
          Invoke-Gate { npm run lint } "npm run lint" "ci-logs/audit-lint.log"
          Invoke-Gate { npm run test:units } "npm run test:units" "ci-logs/audit-test-units.log"

          # v1.3.2: release-metadata regression suite (semver shapes,
          # drift/missing markers, whitespace/CRLF, --env identity,
          # workflow contract — the run 35542000811 failure class).
          Invoke-Gate { npm run test:release } "npm run test:release" "ci-logs/audit-test-release.log"

          # Production build contract: start from a CLEAN dist so no
          # previous-generation asset can survive into web/static.
          if (Test-Path "dist") {
            Remove-Item "dist" -Recurse -Force
          }
          Invoke-Gate { npm run build } "npm run build" "ci-logs/audit-build.log"

      - name: Verify embedded frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "web/static/index.html")) {
            throw "web/static/index.html was not generated."
          }

          $html = Get-Content "web/static/index.html" -Raw

          if ($html -notmatch '<div id="root"></div>') {
            throw "Embedded frontend root element was not found."
          }

          Write-Host "Embedded frontend verification passed."

      # v1.3.1: stable deterministic frontend filenames — no content
      # hashes, every referenced chunk exists, web/static mirrors dist/.
      - name: Verify stable frontend asset contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          node scripts/verify-static-assets.mjs --dist

          if ($LASTEXITCODE -ne 0) {
            throw "Static asset contract verification failed."
          }

      - name: Setup Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # v1.3.2: the Windows job now builds and ctests the native C++ engine
      # BEFORE the Go tests — exactly like the Linux job — so the
      # Go↔C++ integration suites (internal/native/engine
      # TestRealCppHost*) execute against the REAL shtn-engine-host.exe on
      # Windows instead of skipping. Native engine execution is a
      # first-class release objective on the platform whose metadata gate
      # previously failed; the pipeline must reach and prove it.
      #
      # windows-latest ships CMake + Visual Studio. Multi-config generators
      # (Visual Studio) place runtime outputs under a per-configuration
      # subdirectory (e.g. build/Release/); the Go tests expect the host at
      # native/engine/build/shtn-engine-host.exe, so the step locates the
      # produced executable wherever the generator placed it and stages it
      # at the expected path. The CMake cache rule applies unchanged: wipe
      # and reconfigure with --fresh (a relocatable cache is not a safe
      # artifact).
      - name: Native engine (C++) build and tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Invoke-Gate {
            param([scriptblock]$Command, [string]$Label)
            & $Command
            if ($LASTEXITCODE -ne 0) {
              throw "[gate] $Label failed with exit code $LASTEXITCODE."
            }
          }

          Invoke-Gate { cmake --version } "cmake --version"

          # Regression guard: never reuse a stale or path-mismatched cache.
          if (Test-Path "native/engine/build") {
            Remove-Item "native/engine/build" -Recurse -Force
          }
          Invoke-Gate { cmake -S native/engine -B native/engine/build --fresh } "cmake configure (fresh)"

          Invoke-Gate { cmake --build native/engine/build --config Release } "cmake --build (Release)"

          # v1.4.0: a ctest failure must fail the job. The previous
          # script continued past a failed ctest (native commands do not
          # throw in pwsh), staged the built executable anyway, and the
          # step ended green.
          Invoke-Gate { ctest --test-dir native/engine/build -C Release --output-on-failure } "ctest (native suite)"

          # Stage the host executable where the Go integration tests
          # resolve it (<repo>/native/engine/build/shtn-engine-host.exe),
          # regardless of which subdirectory the generator emitted it into.
          $expected = Join-Path (Get-Location) "native\engine\build\shtn-engine-host.exe"

          if (-not (Test-Path $expected)) {
            $found = Get-ChildItem "native/engine/build" -Recurse -Filter "shtn-engine-host.exe" |
              Select-Object -First 1

            if ($null -eq $found) {
              throw "shtn-engine-host.exe was not produced by the native build."
            }

            Copy-Item $found.FullName $expected
            Write-Host "Staged host executable from $($found.FullName) to $expected"
          }

          if ((Get-Item $expected).Length -lt 10000) {
            throw "shtn-engine-host.exe is suspiciously small."
          }

          Write-Host "Native engine (C++) built and tested on Windows: $expected"

      # v1.4.0 GATE-INTEGRITY REPAIR (run 35996462352): this step
      # previously ran `go test` twice and `go vet` WITHOUT checking
      # $LASTEXITCODE. In PowerShell, $ErrorActionPreference = "Stop"
      # does NOT apply to native executables — a `go test` exit 1 was
      # silently swallowed, the step exited with the LAST command's
      # status, and the Windows job reported green while four error
      # annotations sat on the run. Every mandatory verification command
      # now asserts its own exit code; a failure fails the job.
      - name: Go verification
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          $ErrorActionPreference = "Stop"

          function Invoke-Gate {
            param([scriptblock]$Command, [string]$Label, [string]$LogFile)
            # v1.10.6 FAILURE-VISIBILITY: the command's full output is teed
            # to its OWN log file so a red run can name the exact failing
            # command and tests. Tee-Object passes output through; the
            # $LASTEXITCODE below still belongs to the native command.
            #
            # v1.10.14-fixed (R2/D17, run #39): FIRST-BYTE CAPTURE. PowerShell's
            # Tee-Object never runs on empty pipeline input, so a
            # silent-on-success gate (go vet) left NO log file at all and
            # the end-of-job summary fired false "capture defect" catchers
            # for gates that had actually passed. The log now exists
            # (empty) BEFORE the command starts, on every exit path (I15).
            New-Item -ItemType Directory -Force -Path "ci-logs" | Out-Null
            New-Item -ItemType File -Path $LogFile -Force | Out-Null
            Add-Content "ci-logs/gate-order.txt" "RUN $Label"
            & $Command 2>&1 | Tee-Object -FilePath $LogFile
            if ($LASTEXITCODE -ne 0) {
              Add-Content "ci-logs/gate-order.txt" "FAIL $Label"
              throw "[gate] $Label failed with exit code $LASTEXITCODE (log: $LogFile)."
            }
            Add-Content "ci-logs/gate-order.txt" "OK $Label"
            Write-Host "::notice::gate OK: $Label"
          }

          go version

          New-Item -ItemType Directory -Force -Path "ci-logs" | Out-Null

          # v1.10.7 GOFMT GATE (W-B, run 38731387959 class):
          # the editing pipeline mangled tabs to spaces across the tree and
          # nothing caught it — hygiene joins the battery as a REQUIRED
          # gate, fast-fail before the expensive suites. The listing IS
          # the fix list: every file named in the log needs `gofmt -w`.
          # No gate is weakened: this grows the battery.
          #
          # v1.10.14-fixed (R2): first-byte capture — the log exists
          # before the listing runs, green or red (I15).
          New-Item -ItemType File -Path "ci-logs/win-gofmt.log" -Force | Out-Null
          Add-Content "ci-logs/gate-order.txt" "RUN gofmt -l ."
          $gofmtOut = @(gofmt -l . 2>&1)
          $gofmtOut | Tee-Object -FilePath "ci-logs/win-gofmt.log" | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Add-Content "ci-logs/gate-order.txt" "FAIL gofmt -l ."
            throw "[gate] gofmt -l . failed to run (exit $LASTEXITCODE)."
          }
          if ($gofmtOut.Count -gt 0) {
            foreach ($f in ($gofmtOut | Select-Object -First 8)) {
              Write-Host "::error::gofmt violation: $f (run gofmt -w . )"
            }
            Add-Content "ci-logs/gate-order.txt" "FAIL gofmt -l ."
            throw "[gate] gofmt -l . is not clean: $($gofmtOut.Count) file(s) violate gofmt (log: ci-logs/win-gofmt.log)."
          }
          Add-Content "ci-logs/gate-order.txt" "OK gofmt -l ."
          Write-Host "::notice::gate OK: gofmt -l ."
          Write-Host "gofmt: clean"

          # Each Go-verification command tees SEPARATELY: the failure
          # summary names the exact failing command and its failing tests.
          Invoke-Gate { go test ./internal/... -tags headless -count=1 } "go test ./internal/... (headless)" "ci-logs/win-go-test-headless.log"
          Invoke-Gate { go test ./... -run Test -count=1 } "go test ./... (full)" "ci-logs/win-go-test-full.log"
          Invoke-Gate { go vet ./... } "go vet ./..." "ci-logs/win-go-vet.log"

      # v1.6.2 — WINDOWS ENGINE VARIANT ASSET VALIDATION through the
      # AUTHORITATIVE production resolver (no duplicated release-tag
      # knowledge: the v1.6.1 step hard-coded $tag = "b10642" and could
      # drift from the code). The gate is the same Go code the app ships
      # (internal/updater): ResolveDownloadURLForVariant pins the exact
      # variant asset (pinned tag first, else the newest release that
      # actually contains it), verifies the exact asset name for the
      # platform, HEAD-checks reachability (2xx/3xx), verifies the
      # support matrix advertises only servable variants, and proves an
      # explicitly unsupported variant is REFUSED — never a silent CPU
      # fallback. It runs on the Windows x64 runner, where the full
      # resolution contract is enforced.
      #
      # HONESTY NOTE: this verifies ASSET RESOLUTION AND REACHABILITY.
      # HTTP reachability is NOT successful runtime execution — the
      # runtime backend truth is verified by the engine's own device
      # enumeration inside the provisioning transaction (see
      # internal/llm/llama.go verifyRuntimeBackendForVariant and its
      # regression suite).
      - name: Validate engine variant assets (authoritative resolver)
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          SHEYTAN_CI_VARIANT_GATE: "1"
        run: |
          $ErrorActionPreference = "Stop"

          go test ./internal/updater -run TestCIVariantAssetContract -count=1 -v

          if ($LASTEXITCODE -ne 0) {
            throw "[gate] the authoritative engine-variant asset contract failed — the resolver no longer resolves a reachable variant asset (check internal/updater/variant.go and DefaultEngineTag)."
          }

      - name: Generate Windows resources
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          $ErrorActionPreference = "Stop"

          go run ./scripts/gen-syso

          if (-not (Test-Path "rsrc_windows_amd64.syso")) {
            throw "Windows resource object was not generated."
          }

      - name: Build Windows executable and console smoke probe
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          $ErrorActionPreference = "Stop"

          # Staging root derives from the canonical WIN_PKG_ROOT.
          $appRoot = "dist/windows/app/${env:WIN_PKG_ROOT}"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $appRoot | Out-Null

          # v1.4.0: each go build asserts its exit code — a failed first
          # build must never be masked by a successful second one.
          # v1.10.7 (R-B): the core entry moved to cmd/sheytan-local-agent/.
          go build `
            -trimpath `
            -ldflags="-s -w -H=windowsgui" `
            -o "$appRoot/SHEYTAN-LA.exe" `
            ./cmd/sheytan-local-agent

          if ($LASTEXITCODE -ne 0) {
            throw "[gate] go build (SHEYTAN-LA.exe) failed with exit code $LASTEXITCODE."
          }

          go build `
            -trimpath `
            -ldflags="-s -w" `
            -o "dist/windows/sheytan-version-smoke.exe" `
            ./cmd/sheytan-local-agent

          if ($LASTEXITCODE -ne 0) {
            throw "[gate] go build (console smoke probe) failed with exit code $LASTEXITCODE."
          }

      - name: Verify Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # The probed executable derives from the canonical root.
          $exe = "dist/windows/app/${env:WIN_PKG_ROOT}/SHEYTAN-LA.exe"
          $probe = "dist/windows/sheytan-version-smoke.exe"

          if (-not (Test-Path $exe)) {
            throw "Windows executable was not produced."
          }

          if (-not (Test-Path $probe)) {
            throw "Windows console smoke probe was not produced."
          }

          $size = (Get-Item $exe).Length

          if ($size -lt 1000000) {
            throw "Windows executable is suspiciously small: $size bytes."
          }

          Write-Host "Windows executable size: $size bytes"

          $output = & $probe version 2>&1
          $exitCode = $LASTEXITCODE
          $text = ($output | Out-String).Trim()

          Write-Host "=== Windows console smoke probe ==="
          Write-Host $text
          Write-Host "=== Console probe exit code: $exitCode ==="

          if ($exitCode -ne 0) {
            throw "Windows console version probe exited with code $exitCode."
          }

          $expectedVersion = "SHEYTAN-Local-Agent v$($env:APP_VERSION)"

          if ($text -notmatch [regex]::Escape($expectedVersion)) {
            throw "Windows executable version mismatch. Expected: $expectedVersion"
          }

          if ($text -notmatch "os:\s+windows/amd64") {
            throw "Windows executable platform mismatch. Expected windows/amd64."
          }

          Write-Host "Windows executable version/platform smoke test passed."

          Remove-Item $probe -Force

      # v1.9.1 RUNTIME SMOKE — the REAL desktop executable launched as a
      # process. Build/version/package never prove runtime: this gate
      # starts SHEYTAN-LA.exe (the windowsgui Go-core launcher; it spawns the
# native Qt host) against an
      # isolated SHEYTAN_DATA_DIR and asserts, STATE-BASED (never sleeps):
      # (1) the process starts and STAYS alive; (2) the boot path
      # completed far enough to write the session banner + boot markers
      # into the isolated data dir's logs/app.log (backend/runtime init);
      # (3) no crash report exists after boot; (4) the process shuts down
      # when asked (CloseMainWindow, bounded wait, Kill only as the CI
      # backstop for an already-failing run). Explicit evidence boundary:
      # this proves PROCESS-START + BACKEND INIT — not real GUI
      # interaction; interaction with the same stack is proven by the
      # Browser E2E job and the runner-side flows where supported.
      # v1.10.1 QT HOST BUILD (Windows) — the native Qt Quick/QML desktop
      # host is built with the official Qt 6.8 toolchain and deployed with
      # windeployqt (QML-aware: plugins + imports land next to the host
      # binary, per doc.qt.io/qt-6/windows-deployment.html). The packaged
      # pair is: SHEYTAN-LA.exe (Go core + launcher) + sheytan-ui.exe (Qt
      # host) + deployed Qt runtime.
      - name: Build Qt host (Windows) and deploy runtime
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          arch: win64_msvc2022_64
          cache: true

      - name: Build Qt host (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # v1.10.13 W-VIS: every post-verification native command tees its
          # own log into ci-logs/ and tracks RUN/OK/FAIL in
          # ci-logs/gate-order.txt, so the end-of-job failure summary can
          # name the failing gate anonymously (the run 39024607296 class:
          # a post-verification failure published only the generic
          # exit-code annotation).
          New-Item -ItemType Directory -Force -Path "ci-logs" | Out-Null
          Add-Content "ci-logs/gate-order.txt" "STEP Build Qt host (Windows)"

          $appRoot = "dist/windows/app/${env:WIN_PKG_ROOT}"

          # v1.10.13 P-CMAKE: the repo's own CMake cache rule — a
          # relocatable CMake build tree is NOT a safe cache artifact
          # (CMakeCache.txt / CMakeFiles embed absolute paths) — applies to
          # the Qt host exactly as to the native engine: the build dir is
          # wiped unconditionally and reconfigured with --fresh, and the Qt
          # prefix is PINNED, never left to CMake's search behavior (the
          # green Linux twin passes -DCMAKE_PREFIX_PATH explicitly).
          # v1.10.13 W-PIN (run 39038248810): the former env-var pin read
          # Qt6_DIR/CMAKE_PREFIX_PATH, but install-qt-action@v4 prepends
          # Qt's bin to PATH and exports NEITHER variable (its README:
          # "The Qt bin directory is prepended to your `path` environment
          # variable" / "you will not need to set the CMAKE_PREFIX_PATH
          # CMake variable"), so the guard threw BEFORE cmake ran — the
          # named gate + the absent tee file prove exactly that path. The
          # fix derives the prefix from the action's DOCUMENTED PATH
          # contract: qmake.exe lives at <qt>/bin/qmake.exe, so its
          # grandparent is the Qt root; assert the exact file
          # find_package(Qt6) consumes before configuring.
          if (Test-Path "ui/qt/build") {
            Remove-Item "ui/qt/build" -Recurse -Force
          }
          $qmake = (Get-Command qmake.exe -ErrorAction SilentlyContinue).Source
          if ([string]::IsNullOrEmpty($qmake)) {
            Add-Content "ci-logs/gate-order.txt" "FAIL Qt host cmake configure"
            throw "[gate] qmake.exe is not on PATH — the install-qt-action PATH contract (Qt bin prepended to PATH) is absent from this session; refusing an unpinned Qt configure."
          }
          $qtPrefix = Split-Path (Split-Path $qmake)
          if (-not (Test-Path (Join-Path $qtPrefix "lib\cmake\Qt6\Qt6Config.cmake"))) {
            Add-Content "ci-logs/gate-order.txt" "FAIL Qt host cmake configure"
            throw "[gate] derived Qt prefix '$qtPrefix' does not carry lib\cmake\Qt6\Qt6Config.cmake (the file find_package(Qt6) consumes) — refusing an unpinned Qt configure."
          }
          Write-Host "Qt prefix derived from qmake on PATH (install-qt-action contract): $qmake -> $qtPrefix"

          cmake -S ui/qt -B ui/qt/build --fresh -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$qtPrefix" 2>&1 | Tee-Object -FilePath "ci-logs/win-qt-configure.log"
          if ($LASTEXITCODE -ne 0) {
            Add-Content "ci-logs/gate-order.txt" "FAIL Qt host cmake configure"
            throw "[gate] Qt host cmake configure failed ($LASTEXITCODE) (log: ci-logs/win-qt-configure.log)."
          }
          Add-Content "ci-logs/gate-order.txt" "OK Qt host cmake configure"

          cmake --build ui/qt/build --config Release 2>&1 | Tee-Object -FilePath "ci-logs/win-qt-build.log"
          if ($LASTEXITCODE -ne 0) {
            Add-Content "ci-logs/gate-order.txt" "FAIL Qt host cmake build"
            throw "[gate] Qt host build failed ($LASTEXITCODE) (log: ci-logs/win-qt-build.log)."
          }
          Add-Content "ci-logs/gate-order.txt" "OK Qt host cmake build"

          # Acceptance suite binary (QtTest; drives the REAL Main.qml
          # against the REAL core in the live-answer gate below).
          # v1.10.3 (R16): MSVC multi-config puts the binary in build/Release/
          # — the v1.10.2 single flat-path Copy-Item with SilentlyContinue
          # silently no-opped there, so the acceptance gate threw late with
          # "the Qt acceptance suite was not produced". Resolve Release/
          # first, then the flat path, and throw if NEITHER exists — never
          # a silent continue.
          $accSrc = "ui/qt/build/Release/sheytan-ui-acceptance.exe"
          if (-not (Test-Path $accSrc)) { $accSrc = "ui/qt/build/sheytan-ui-acceptance.exe" }
          if (-not (Test-Path $accSrc)) { throw "[gate] sheytan-ui-acceptance.exe was not produced (looked in ui/qt/build/Release/ and ui/qt/build/)." }
          Copy-Item $accSrc "dist/windows/"
          if (-not (Test-Path "dist/windows/sheytan-ui-acceptance.exe")) { throw "[gate] acceptance binary staging failed." }

          # v1.10.13 P-DEPLOY: stage the Qt host into the package root
          # FIRST, then run windeployqt against IT. Qt's documented
          # deployment model (doc.qt.io/qt-6/windows-deployment.html)
          # copies dependencies based on the TARGET binary's imports — the
          # former call aimed at "$appRoot/SHEYTAN-LA.exe" (the Go core
          # launcher, which imports zero Qt libraries) and piped to
          # Out-Null with no $LASTEXITCODE assertion (violating the
          # v1.4.0 gate-integrity rule), so the packaged pair could carry
          # sheytan-ui.exe without its Qt runtime. The command is now
          # teed, its exit code asserted, and the deployment is verified
          # by the presence of the Qt runtime (Qt6Core.dll) beside the
          # host binary.
          $uiSrc = "ui/qt/build/Release/sheytan-ui.exe"
          if (-not (Test-Path $uiSrc)) { $uiSrc = "ui/qt/build/sheytan-ui.exe" }
          if (-not (Test-Path $uiSrc)) {
            Add-Content "ci-logs/gate-order.txt" "FAIL Qt host staging"
            throw "[gate] sheytan-ui.exe was not produced (looked in ui/qt/build/Release/ and ui/qt/build/)."
          }
          Copy-Item $uiSrc $appRoot -Force
          if (-not (Test-Path "$appRoot/sheytan-ui.exe")) {
            Add-Content "ci-logs/gate-order.txt" "FAIL Qt host staging"
            throw "[gate] sheytan-ui.exe was not staged into the package root."
          }

          Add-Content "ci-logs/gate-order.txt" "RUN windeployqt"
          windeployqt --qmldir ui/qt/qml --no-compiler-runtime "$appRoot/sheytan-ui.exe" 2>&1 | Tee-Object -FilePath "ci-logs/win-windeployqt.log"
          if ($LASTEXITCODE -ne 0) {
            Add-Content "ci-logs/gate-order.txt" "FAIL windeployqt"
            throw "[gate] windeployqt failed ($LASTEXITCODE) (log: ci-logs/win-windeployqt.log)."
          }
          if (-not (Test-Path "$appRoot/Qt6Core.dll")) {
            Add-Content "ci-logs/gate-order.txt" "FAIL windeployqt"
            throw "[gate] windeployqt did not deploy the Qt runtime — Qt6Core.dll is missing beside the host (log: ci-logs/win-windeployqt.log)."
          }
          Add-Content "ci-logs/gate-order.txt" "OK windeployqt"

          Write-Host "Qt host deployed next to the Go core with its Qt runtime (windeployqt against the Qt host binary, asserted)."

      - name: Desktop runtime smoke (real executable, process + backend init)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = "dist/windows/app/${env:WIN_PKG_ROOT}/SHEYTAN-LA.exe"

          if (-not (Test-Path $exe)) {
            throw "runtime smoke: Windows executable was not produced."
          }

          $smokeDir = Join-Path $env:RUNNER_TEMP "sheytan-runtime-smoke"
          if (Test-Path $smokeDir) {
            Remove-Item $smokeDir -Recurse -Force
          }
          $dataDir = Join-Path $smokeDir "data"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null

          $env:SHEYTAN_DATA_DIR = $dataDir

          $outLog = Join-Path $smokeDir "stdout.log"
          $errLog = Join-Path $smokeDir "stderr.log"

          $proc = Start-Process `
            -FilePath $exe `
            -WorkingDirectory (Split-Path $exe) `
            -RedirectStandardOutput $outLog `
            -RedirectStandardError $errLog `
            -PassThru

          if ($null -eq $proc) {
            throw "runtime smoke: the desktop process could not be started."
          }

          Write-Host "Desktop process started (pid $($proc.Id))."

          # STATE-BASED readiness: the session banner + boot marker in
          # logs/app.log (bounded, 60s — no fixed sleeps).
          $appLog = Join-Path $dataDir "logs/app.log"
          $bannerSeen = $false
          $deadline = (Get-Date).AddSeconds(60)

          while ((Get-Date) -lt $deadline) {
            if ($proc.HasExited) {
              Write-Host "--- desktop process exited before the boot markers ---"
              Get-Content $outLog -ErrorAction SilentlyContinue | Select-Object -Last 20
              Get-Content $errLog -ErrorAction SilentlyContinue | Select-Object -Last 20
              if (Test-Path $appLog) {
                Get-Content $appLog | Select-Object -Last 40
              }
              throw "runtime smoke: desktop process exited during startup (code $($proc.ExitCode))."
            }

            if ((Test-Path $appLog) -and
                (Select-String -Path $appLog -Pattern "==== SHEYTAN-Local-Agent v$($env:APP_VERSION) session start" -Quiet) -and
                (Select-String -Path $appLog -Pattern "starting \(windows/amd64" -Quiet)) {
              $bannerSeen = $true
              break
            }

            Start-Sleep -Milliseconds 500
          }

          if (-not $bannerSeen) {
            Write-Host "--- runtime smoke: boot markers never appeared ---"
            if (Test-Path $appLog) {
              Get-Content $appLog | Select-Object -Last 40
            }
            throw "runtime smoke: the session banner never appeared in logs/app.log."
          }

          # Liveness: the process is still running with the backend up.
          if ($proc.HasExited) {
            throw "runtime smoke: desktop process exited right after boot."
          }

          Write-Host "--- desktop runtime: session banner + boot markers observed, process alive (pid $($proc.Id)) ---"

          # Backend/runtime init ran clean: no crash report at boot.
          $crashDir = Join-Path $dataDir "logs/crashes"
          if (Test-Path $crashDir) {
            $crashes = Get-ChildItem $crashDir -Filter "*.log" -ErrorAction SilentlyContinue
            if ($crashes -and $crashes.Count -gt 0) {
              Write-Host "--- runtime smoke: crash report present after boot ---"
              $crashes | ForEach-Object { Write-Host $_.Name }
              throw "runtime smoke: crash report exists after boot."
            }
          }

          Select-String -Path $appLog -Pattern "==== SHEYTAN-Local-Agent v$($env:APP_VERSION) session start" |
            Select-Object -First 1 | ForEach-Object { Write-Host $_.Line }

          # v1.10.13 W-SMOKE (run 39038248810 lineage): the close flow is
          # retargeted to the architecture the v1.10 core actually runs.
          # The core is built -H=windowsgui and owns NO top-level window;
          # the REAL top-level window belongs to the sheytan-ui Qt host
          # child that desktop.go spawns from beside the core and waits on
          # unconditionally (the child's exit code IS the core's exit
          # code). Mirrors the green Linux twin's G3/G5 semantics:
          # (G3) wait for a windowed sheytan-ui child; (G5) deliver
          # WM_CLOSE to IT, require the child to exit, then require the
          # CORE to exit with code 0 (the launcher's documented lifecycle
          # ends when the child ends), and assert no orphan remains.
          # Banner, liveness, and crash-report assertions above unchanged.
          $uiDeadline = (Get-Date).AddSeconds(60)
          $ui = $null
          while ((Get-Date) -lt $uiDeadline) {
            if ($proc.HasExited) {
              throw "runtime smoke: the core exited before the Qt host produced a windowed UI process (code $($proc.ExitCode))."
            }
            $ui = Get-Process -Name "sheytan-ui" -ErrorAction SilentlyContinue |
              Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
            if ($ui) { break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ui) {
            Write-Host "--- sheytan-ui process/window never appeared ---"
            Get-Content $outLog -ErrorAction SilentlyContinue | Select-Object -Last 30
            Get-Content $errLog -ErrorAction SilentlyContinue | Select-Object -Last 30
            throw "runtime smoke: the Qt host produced no windowed UI process."
          }
          $winMsg = ("Qt host child present (pid {0}, hwnd {1}); core alive (pid {2})." -f $ui.Id, $ui.MainWindowHandle, $proc.Id)
          Write-Host $winMsg

          $closeRequested = $ui.CloseMainWindow()

          if (-not $closeRequested) {
            $closeErr = ("runtime smoke: CloseMainWindow() returned false — no main window received the close request (pid {0}, hwnd {1})." -f $ui.Id, $ui.MainWindowHandle)
            throw $closeErr
          }

          Write-Host "WM_CLOSE delivered to the Qt host's main window; requiring child exit within 15s."

          if (-not $ui.WaitForExit(15000)) {
            Write-Host "--- runtime smoke: the Qt host ignored a DELIVERED WM_CLOSE; stopping it ---"
            Stop-Process -Id $ui.Id -Force
            $ignoreErr = ("runtime smoke: Qt host {0} did not exit after a delivered WM_CLOSE (hwnd {1}) — the window-close path does not terminate the application lifecycle." -f $ui.Id, $ui.MainWindowHandle)
            throw $ignoreErr
          }

          # The launcher waits on the child unconditionally and exits with
          # the child's code (desktop.go): the core's clean exit is the
          # lifecycle CONSEQUENCE of the child's exit. Bounded, 30s. A core
          # that lingers or exits non-zero is a REAL product finding.
          if (-not $proc.WaitForExit(30000)) {
            $lingerErr = ("runtime smoke: the core (pid {0}) did not exit after the Qt host ended — the launcher's documented child-wait lifecycle did not complete." -f $proc.Id)
            throw $lingerErr
          }
          $proc.Refresh()
          if ($proc.ExitCode -ne 0) {
            throw ("runtime smoke: the core exited with code {0} after the Qt host's clean close." -f $proc.ExitCode)
          }

          # G5 completion: no sheytan-ui orphan may outlive the core.
          $orphans = @(Get-Process -Name "sheytan-ui" -ErrorAction SilentlyContinue)
          if ($orphans.Count -gt 0) {
            foreach ($orphan in $orphans) { Write-Host ("orphan sheytan-ui pid {0}" -f $orphan.Id) }
            throw "runtime smoke: sheytan-ui orphan process(es) remain after the core exited."
          }

          Write-Host "Desktop RUNTIME SMOKE passed: process-start + backend/runtime init + real Qt UI window (child) + delivered WM_CLOSE + child exit + core exit (code 0) + no orphan."

      # v1.9.5 (P0): the REAL Windows live-answer acceptance gate — the
      # exact user journey, executed against the actual packaged desktop
      # binary with a REAL native-engine generation over
      # the canonical fixture model: ready composer → send → ORDERED
      # live-growth evidence (non-placeholder text visible while Stop is
      # up, then strictly longer with Stop still up) → exactly one
      # persisted assistant reply + one user message → reload keeps the
      # SAME session active → a second full cycle → real WM_CLOSE exit.
      # The harness exits non-zero on ANY unmet assertion; a skipped or
      # unavailable run is NEVER a pass. This is the gate the Linux
      # Chromium E2E cannot be (the packaged Windows transport surface).
      # v1.10.1 (P0): the REAL Windows live-answer acceptance gate — the
      # QtTest acceptance binary drives the REAL Main.qml through a REAL
      # CoreClient against the REAL packaged core executable with the
      # deterministic fixture engine: handshake → session create → send →
      # ordered live-growth evidence (non-placeholder text visible while
      # Stop is up) → exactly one terminal settle → exactly one persisted
      # assistant reply → composer unlock + live bubble removal → same
      # session reload persistence → repeat send. The former
      # WebView2/CDP harness is retired with the Wails shell itself; a
      # skipped or unavailable run is NEVER a pass.
      - name: Windows live-answer acceptance (real Qt UI, real core over IPC)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $core = "dist/windows/app/${env:WIN_PKG_ROOT}/SHEYTAN-LA.exe"
          $acc = "dist/windows/sheytan-ui-acceptance.exe"
          if (-not (Test-Path $core)) { throw "acceptance: the core executable was not produced." }
          if (-not (Test-Path $acc)) { throw "acceptance: the Qt acceptance suite was not produced." }

          $env:SHEYTAN_REPO = (Get-Location).Path
          $env:SHEYTAN_CORE_BIN = (Resolve-Path $core).Path
          $env:QT_QPA_PLATFORM = "offscreen"
          # v1.10.13 T-INTEGRITY: load-bearing for the qmlLoadsCleanly slot —
          # the software scene graph renders without a GL context under
          # offscreen (the Linux acceptance and smoke steps pin the same).
          $env:QT_QUICK_BACKEND = "software"
          # v1.10.13 D1: SHEYTAN_UI_BIN deleted — the harness reads it only
          # into Q_UNUSED (ui/qt/tests/tst_acceptance.cpp), and the Linux-only
          # Resolve-Path target threw a terminating error before the try/catch
          # under $ErrorActionPreference = "Stop" (run 39115765789, step 22).

          # v1.10.13 W-ACC3: Start-Process with native-handle capture into
          # ci-logs/win-qt-acceptance.out.log and .err.log, merged into
          # ci-logs/win-qt-acceptance.log behind a process-facts prelude.
          # This is immune to the pwsh $ErrorActionPreference="Stop" + 2>&1
          # ErrorRecord wrapping class that swallowed output in run 39101817218.
          $accLog = "ci-logs/win-qt-acceptance.log"
          $outLog = "ci-logs/win-qt-acceptance.out.log"
          $errLog = "ci-logs/win-qt-acceptance.err.log"
          # v1.10.13 WINDOWS-REPORT (I5): QtTest writes its OWN report
          # file, independent of native stdout/stderr — the record of
          # record on any exit. The native captures stay (diagnostics);
          # an empty report on a nonzero exit is an INSTRUMENTATION
          # FAILURE — named, not tolerated.
          $repLog = "ci-logs/win-qt-acceptance-report.txt"
          Add-Content "ci-logs/gate-order.txt" "STEP Windows live-answer acceptance"
          Add-Content "ci-logs/gate-order.txt" "RUN Qt live-answer acceptance"
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          $accExit = $null
          try {
            # Process-facts prelude
            $prelude = @(
              "=== Process Facts ===",
              "exe: $acc",
              "exe exists: $(Test-Path $acc)",
              "exe size: $((Get-Item $acc).Length)",
              "exe LastWriteTime: $((Get-Item $acc).LastWriteTime)",
              "QT_QPA_PLATFORM: $env:QT_QPA_PLATFORM",
              "QT_QUICK_BACKEND: $env:QT_QUICK_BACKEND",
              "SHEYTAN_CORE_BIN: $env:SHEYTAN_CORE_BIN",
              "SHEYTAN_CORE_BIN exists: $(Test-Path $env:SHEYTAN_CORE_BIN)"
            )
            Add-Content $accLog ($prelude -join [Environment]::NewLine)
            Add-Content $accLog "=== Process Output ==="

            $proc = Start-Process -FilePath $acc -Wait -PassThru -NoNewWindow -ArgumentList @("-o", "$repLog,txt") -RedirectStandardOutput $outLog -RedirectStandardError $errLog
            $accExit = $proc.ExitCode
            # Merge output files into the gate log
            if (Test-Path $outLog) { Get-Content $outLog | Add-Content $accLog }
            if (Test-Path $errLog) { Get-Content $errLog | Add-Content $accLog }
          } catch {
            Add-Content "ci-logs/gate-order.txt" "FAIL Qt live-answer acceptance"
            Add-Content $accLog "acceptance launch failed: $($_.Exception.GetType().Name): $($_.Exception.Message)"
            Write-Host "::error::Qt live-answer acceptance launch failed: $($_.Exception.GetType().Name): $($_.Exception.Message)"
            throw "[gate] the Qt acceptance binary could not be launched: $($_.Exception.Message) (log: $accLog)."
          }
          if (-not (Test-Path $accLog) -or (Get-Item $accLog).Length -eq 0) {
            Add-Content $accLog "acceptance produced no output (exit code $accExit)."
          }
          if ($accExit -ne 0) {
            Add-Content "ci-logs/gate-order.txt" "FAIL Qt live-answer acceptance"
            # v1.10.13 W-ANN-ORDER: the log itself carries the evidence the
            # anonymous reader needs — first the empty-capture fact (run #23
            # captured ZERO process output despite a completed run), then the
            # exit-code contract. The failure summary below greps these
            # classes FIRST; the prelude lines follow, never lead.
            if ((-not (Test-Path $outLog)) -or ((Get-Item $outLog -ErrorAction SilentlyContinue).Length -eq 0)) {
              if ((-not (Test-Path $errLog)) -or ((Get-Item $errLog -ErrorAction SilentlyContinue).Length -eq 0)) {
                Add-Content $accLog "acceptance output captures were empty (stdout AND stderr zero-length) — the binary exited $accExit with no captured output"
              }
            }
            # v1.10.13 WINDOWS-REPORT: the report file is the record of
            # record (I5) — a nonzero exit with a missing or empty report
            # is an instrumentation failure, named, not tolerated.
            if (-not (Test-Path $repLog) -or (Get-Item $repLog -ErrorAction SilentlyContinue).Length -eq 0) {
              Add-Content $accLog "acceptance instrumentation failure: the QtTest -o report ($repLog) is missing or empty on a nonzero exit ($accExit) — stdout/stderr are diagnostics, never the only record"
              Write-Host "::error::Qt acceptance report missing/empty on nonzero exit $accExit (instrumentation failure)"
            }
            Add-Content $accLog "acceptance exit code $accExit (QTEST_MAIN contract: exit == the number of failed test functions, capped at 127; 0 = all passed; 134 = killed by SIGABRT, a crash class)"
            Write-Host "::error::Qt live-answer acceptance failed with exit code $accExit (log: $accLog)"
            throw "[gate] windows qt acceptance failed with exit code $accExit (log: $accLog)."
          }
          # v1.10.13 WINDOWS-REPORT: on a GREEN exit the report must
          # still exist (I5 — every test process writes an on-disk
          # report regardless of exit code); a missing green report is
          # named so the green is never trusted blindly.
          if (-not (Test-Path $repLog) -or (Get-Item $repLog -ErrorAction SilentlyContinue).Length -eq 0) {
            Add-Content $accLog "acceptance instrumentation failure: the QtTest -o report ($repLog) is missing or empty on a ZERO exit — named, non-fatal; read the native captures"
            Write-Host "::warning::Qt acceptance report missing/empty on exit 0 (instrumentation failure named)"
          }
          Add-Content "ci-logs/gate-order.txt" "OK Qt live-answer acceptance"

          Write-Host "Windows live-answer acceptance PASSED: real Qt UI + real core over the local IPC channel."

      # v1.10.13 WINDOWS-REPORT (I5): the QtTest -o report is the record
      # of record — it is still written on EVERY attempt (green or red).
      # v1.10.14-fixed (D21/I18, run-#41 R2): its dedicated upload folded
      # into the job's ONE log part below — the report rides inside
      # all-logs.txt, so an anonymous reader still gets the named slots,
      # assertions and line numbers on any exit.

      - name: Prepare Windows portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # v1.10.13 Task-32 (run #35 class): every post-acceptance
          # packaging step is gate-order-tracked — RUN at the step start,
          # OK as the step's final statement; a trailing RUN without OK
          # makes the failure summary name the gate instead of falling
          # back to "outside them". Additive only: no gate logic changes.
          Add-Content "ci-logs/gate-order.txt" "RUN Windows package prepare"

          # Canonical package root — the same value controls staging, ZIP
          # creation, ZIP verification and artifact naming.
          $root = "dist/windows/app/${env:WIN_PKG_ROOT}"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$root/models" | Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$root/workspace" | Out-Null

          @"
          SHEYTAN-LA $env:APP_VERSION

          Portable Windows x64 distribution.

          Keep the complete SHEYTAN-LA folder together.
          "@ | Set-Content "$root/README.txt" -Encoding utf8

          @"
          LOCAL MODELS

          Place GGUF models in this folder.
          "@ | Set-Content "$root/models/README.txt" -Encoding utf8

          @"
          CODING LAB

          Portable Coding Lab workspaces live under this folder.
          "@ | Set-Content "$root/workspace/README.txt" -Encoding utf8

          @"
          SHEYTAN-LA (SHEYTAN Local Agent)
          Version: $env:APP_VERSION
          Platform: Windows x64
          Commit: $env:GITHUB_SHA
          "@ | Set-Content "$root/BUILD-INFO.txt" -Encoding utf8

          if (Test-Path "LICENSE.md") {
            Copy-Item "LICENSE.md" "$root/LICENSE.md" -Force
          }

          if (Test-Path "README.md") {
            Copy-Item "README.md" "$root/README.md" -Force
          }

          if (Test-Path "docs/agent.md") {
            # v1.10.7 (R-B): the canonical handoff document moved to docs/.
            Copy-Item "docs/agent.md" "$root/AI-CONTEXT.md" -Force
          }

          if (Test-Path "SIGNATURE") {
            Copy-Item "SIGNATURE" "$root/SIGNATURE" -Force
          }

          if (Test-Path "packaging/SHEYTAN-LA.bat") {
            # v1.10.7 (R-B): the launcher script source moved to packaging/.
            Copy-Item `
              "packaging/SHEYTAN-LA.bat" `
              "$root/SHEYTAN-LA.bat" `
              -Force
          }

          Add-Content "ci-logs/gate-order.txt" "OK Windows package prepare"

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Add-Content "ci-logs/gate-order.txt" "RUN Windows ZIP create"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "dist" | Out-Null

          $zip = "dist/${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-windows-x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "dist/windows/app/${env:WIN_PKG_ROOT}" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
            throw "Windows ZIP was not created."
          }

          if ((Get-Item $zip).Length -le 0) {
            throw "Windows ZIP is empty."
          }

          Add-Content "ci-logs/gate-order.txt" "OK Windows ZIP create"

      - name: Verify Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Add-Content "ci-logs/gate-order.txt" "RUN Windows ZIP verify"

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          # Every expected entry is rooted at the canonical WIN_PKG_ROOT —
          # the same variable that staged and zipped the application. No
          # duplicated root literal exists to drift.
          $zipPath = Resolve-Path `
            "dist/${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-windows-x64.zip"

          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)

          try {
            $entries = @(
              $archive.Entries |
              ForEach-Object { $_.FullName }
            )

            $required = @(
              "${env:WIN_PKG_ROOT}/SHEYTAN-LA.exe",
              "${env:WIN_PKG_ROOT}/README.txt",
              "${env:WIN_PKG_ROOT}/BUILD-INFO.txt",
              "${env:WIN_PKG_ROOT}/models/README.txt",
              "${env:WIN_PKG_ROOT}/workspace/README.txt"
            )

            # v1.10.13 P-ZIP (defensive gate): no archive entry name may
            # contain a backslash. Compress-Archive's historical
            # backslash-separator bug (Microsoft.PowerShell.Archive #48) is
            # fixed in module 1.2.5, which pwsh 7.4+ ships (windows-latest
            # qualifies), so this is a deterministic tripwire against a
            # packaging regression — without it the forward-slash
            # required-entry checks below would misreport the condition as
            # "Missing ZIP entry". Offenders are printed anonymously and
            # the gate fails loudly; the packaging itself is NOT rewritten.
            $backslashed = @($entries | Where-Object { $_ -like '*\*' })
            if ($backslashed.Count -gt 0) {
              foreach ($offender in ($backslashed | Select-Object -First 10)) {
                Write-Host "::error::ZIP entry uses a backslash separator: $offender"
              }
              throw "[gate] Windows ZIP contains $($backslashed.Count) backslash-separated entry name(s) — the archive is not portable."
            }

            foreach ($item in $required) {
              if ($entries -notcontains $item) {
                throw "Missing ZIP entry: $item"
              }
            }

            # v1.10.13 W-ZIP-LAUNCHER: the launcher source moved to
            # packaging/SHEYTAN-LA.bat in v1.10.7 (R-B) and the repo root
            # carries NO SHEYTAN-LA.bat, so the former root Test-Path made
            # this requirement DEAD — the ZIP launcher entry was never
            # asserted. Gate on the real source path (the Prepare step
            # stages it from packaging/) and require the staged entry.
            if (
              (Test-Path "packaging/SHEYTAN-LA.bat") -and
              ($entries -notcontains "${env:WIN_PKG_ROOT}/SHEYTAN-LA.bat")
            ) {
              throw "Expected launcher script is missing from Windows ZIP."
            }

            # Release metadata inside the package must carry the identity:
            # BUILD-INFO.txt is the in-archive version authority.
            $buildInfo = $archive.Entries |
              Where-Object { $_.FullName -eq "${env:WIN_PKG_ROOT}/BUILD-INFO.txt" }
            $reader = New-Object System.IO.StreamReader($buildInfo.Open())
            $buildText = $reader.ReadToEnd()
            $reader.Dispose()

            if ($buildText -notmatch [regex]::Escape("Version: $env:APP_VERSION")) {
              throw "BUILD-INFO.txt inside the ZIP does not carry version $env:APP_VERSION."
            }

            Write-Host "Windows ZIP structure verification passed."
          }
          finally {
            $archive.Dispose()
          }

          Add-Content "ci-logs/gate-order.txt" "OK Windows ZIP verify"

      - name: Verify Windows ZIP integrity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Add-Content "ci-logs/gate-order.txt" "RUN Windows ZIP integrity"

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zipPath = Resolve-Path `
            "dist/${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-windows-x64.zip"

          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)

          try {
            foreach ($entry in $archive.Entries) {
              $stream = $entry.Open()

              try {
                $buffer = New-Object byte[] 65536

                while ($true) {
                  $read = $stream.Read($buffer, 0, $buffer.Length)

                  if ($read -eq 0) {
                    break
                  }
                }
              }
              finally {
                $stream.Dispose()
              }
            }
          }
          finally {
            $archive.Dispose()
          }

          Write-Host "Windows ZIP integrity verification passed."

          Add-Content "ci-logs/gate-order.txt" "OK Windows ZIP integrity"

      # v1.10.14 R1 PAYLOAD (run #36 class): the installer must ship the
      # COMPLETE staged application — the same pair + Qt runtime the
      # portable ZIP carries. Run #36's installer staged ONLY the Go core
      # (5.03 MB LZMA vs the ZIP's 38.9 MB) so every installed launch died
      # silently at the ui-resolve step. This step copies the application
      # root into the payload dir EXCLUDING the portable-only companions,
      # asserts the pair, and generates the enumerated uninstall list the
      # uninstaller includes (UNINSTALL SYMMETRY: the uninstaller removes
      # EXACTLY what was written; user data is never in the list).
      - name: Prepare Windows installer payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Add-Content "ci-logs/gate-order.txt" "RUN Windows installer payload"

          $appRoot = "dist/windows/app/${env:WIN_PKG_ROOT}"
          $payload = "dist/windows/installer-payload/${env:WIN_PKG_ROOT}"

          if (Test-Path "dist/windows/installer-payload") {
            Remove-Item "dist/windows/installer-payload" -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item -Path "$appRoot/*" -Destination $payload -Recurse -Force

          # Portable-only companions stay out of the installed product:
          # the installer carries the APPLICATION (pair + Qt runtime +
          # license + readme + signature), never the portable harness.
          foreach ($p in @("README.txt", "BUILD-INFO.txt", "AI-CONTEXT.md", "SHEYTAN-LA.bat")) {
            Remove-Item (Join-Path $payload $p) -Force -ErrorAction SilentlyContinue
          }
          foreach ($d in @("models", "workspace")) {
            Remove-Item (Join-Path $payload $d) -Recurse -Force -ErrorAction SilentlyContinue
          }

          # The installed product must boot the desktop: assert the pair
          # and the core companions BEFORE makensis sees the tree.
          foreach ($f in @("SHEYTAN-LA.exe", "sheytan-ui.exe", "Qt6Core.dll", "LICENSE.md", "README.md", "SIGNATURE")) {
            if (-not (Test-Path (Join-Path $payload $f))) {
              throw "installer payload: required file missing: $f (staged appRoot: $appRoot)"
            }
          }
          if (Test-Path (Join-Path $payload "models")) {
            throw "installer payload: models/ must NEVER be bundled."
          }

          # UNINSTALL SYMMETRY: enumerate the exact payload tree into the
          # .nsh the uninstaller includes — one Delete per file, bottom-up
          # RMDir per directory, $INSTDIR itself never removed here. The
          # runtime-created trees (data/, models/, workspace/, sessions/,
          # logs/, any user file) are absent from this list and survive.
          $payloadRoot = (Resolve-Path $payload).Path
          $files = Get-ChildItem $payload -Recurse -File | ForEach-Object {
            $_.FullName.Substring($payloadRoot.Length + 1) -replace "/", "\"
          } | Sort-Object
          $dirs = Get-ChildItem $payload -Recurse -Directory | ForEach-Object {
            $_.FullName.Substring($payloadRoot.Length + 1) -replace "/", "\"
          } | Sort-Object -Descending

          $lines = @(
            "; AUTO-GENERATED by .github/workflows/build-desktop.yml (Prepare Windows installer payload).",
            "; UNINSTALL SYMMETRY contract: the uninstaller deletes EXACTLY the files the",
            "; installer staged from the payload tree, bottom-up directories last. User",
            "; data (data/, models/, workspace/, sessions/, logs/, any user file) is never",
            "; in this list and survives uninstall by construction. DO NOT EDIT — CI regenerates.",
            "; v1.10.14-fixed: the file OPENS with the guard define — NSIS keeps defines and",
            "; macros in separate namespaces, and installer.nsi's !ifdef tests the define.",
            "!define SHEYTAN_PAYLOAD_UNINSTALL",
            "!macro SHEYTAN_PAYLOAD_UNINSTALL"
          )
          foreach ($f in $files) { $lines += ('  Delete "$INSTDIR\{0}"' -f $f) }
          foreach ($d in $dirs) { $lines += ('  RMDir "$INSTDIR\{0}"' -f $d) }
          $lines += "!macroend"
          Set-Content -Path "packaging/nsis/payload-uninstall.nsh" -Value $lines -Encoding UTF8

          Write-Host "Installer payload staged ($($files.Count) files, $($dirs.Count) dirs); uninstall list generated: packaging/nsis/payload-uninstall.nsh"

          Add-Content "ci-logs/gate-order.txt" "OK Windows installer payload"

      - name: Build Windows NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # The primary user installer. NSIS is the broad Win32
          # distribution path; the portable ZIP remains the advanced
          # option. Models are NEVER bundled — the installer ships the
          # COMPLETE application (the pair + Qt runtime, v1.10.14).
          #
          # PATH CONTRACT: makensis resolves compile-time paths relative to
          # the .nsi SCRIPT directory, not the invoking CWD. CI therefore
          # passes ABSOLUTE BUILDDIR/OUTFILE paths, which are unambiguous
          # from any invocation context, and the script itself asserts the
          # staging executable exists before compiling anything.
          choco install nsis -y --no-progress

          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $found = Get-ChildItem "C:\Program Files*" -Recurse -Filter makensis.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($null -eq $found) { throw "makensis.exe not found after NSIS install." }
            $makensis = $found.FullName
          }

          # Pre-flight assertions: refuse to invoke NSIS against a broken
          # staging tree — the exact executable, at the exact stage path.
          # The staging path derives from the canonical root.
          $repoRoot = (Get-Location).Path
          $stagingDir = Join-Path $repoRoot "dist\windows\app\${env:WIN_PKG_ROOT}"
          $stagingExe = Join-Path $stagingDir "SHEYTAN-LA.exe"

          if (-not (Test-Path $stagingDir)) {
            throw "NSIS staging directory missing: $stagingDir"
          }
          if (-not (Test-Path $stagingExe)) {
            throw "NSIS staging executable missing: $stagingExe"
          }

          # v1.10.14: makensis compiles from the PAYLOAD dir (the staged
          # application minus the portable-only companions), not the raw
          # appRoot — the installer ships the complete pair, nothing else.
          $payloadDir = Join-Path $repoRoot "dist\windows\installer-payload\${env:WIN_PKG_ROOT}"
          if (-not (Test-Path $payloadDir)) {
            throw "NSIS payload directory missing: $payloadDir (the Prepare Windows installer payload step must run first)."
          }
          foreach ($payloadFile in @("SHEYTAN-LA.exe", "sheytan-ui.exe", "Qt6Core.dll")) {
            if (-not (Test-Path (Join-Path $payloadDir $payloadFile))) {
              throw "NSIS payload incomplete: $payloadFile missing from $payloadDir (run-#36 defect class)."
            }
          }

          # NSIS installer source-contract — the installer MUST
          # keep the directory-selection page, the optional desktop
          # shortcut (default checked), a registered uninstaller, and the
          # user-data-preserving uninstall section. Checking the SOURCE
          # here means a silent regression fails CI before any installer
          # is built from a weakened script.
          $nsi = Get-Content "packaging/nsis/installer.nsi" -Raw
          $nsiContract = @(
            "MUI_PAGE_DIRECTORY",
            "Create a &desktop shortcut",
            "BST_CHECKED",
            "WriteUninstaller",
            "UninstallString",
            "SHEYTAN_DATA_DIR",
            "preserve user data",
            "sheytan-ui.exe",
            "Qt6Core.dll",
            "File /r",
            "payload-uninstall.nsh",
            "SHEYTAN_PAYLOAD_UNINSTALL"
          )
          foreach ($fragment in $nsiContract) {
            if ($nsi -notmatch [regex]::Escape($fragment)) {
              throw "installer.nsi lost required contract fragment: $fragment"
            }
          }

          # Negative contract: the uninstaller must NEVER contain the
          # recursive-delete instruction — user data is preserved by
          # construction, not by discipline.
          if ($nsi -match [regex]::Escape("RMDir /r")) {
            throw "installer.nsi contains 'RMDir /r' — recursive deletes are forbidden in the uninstaller (user data must be preserved)."
          }
          Write-Host "NSIS source contract verified (directory page, shortcut option, uninstaller, complete-pair payload, generated uninstall list, no recursive deletes)."

          $installerPath = Join-Path $repoRoot "dist\${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-windows-x64-installer.exe"

          # v1.10.13 W-VIS: makensis output is teed into ci-logs and the
          # gate is tracked like every other post-verification command.
          #
          # v1.10.14-fixed (R2/I15): the log exists (empty) BEFORE makensis
          # starts — a toolchain crash still leaves its log behind.
          New-Item -ItemType File -Path "ci-logs/win-nsis.log" -Force | Out-Null
          Add-Content "ci-logs/gate-order.txt" "STEP Build Windows NSIS installer"
          Add-Content "ci-logs/gate-order.txt" "RUN NSIS makensis"
          # v1.10.14-fixed (R1, compile-proven locally with makensis 3.10):
          # -V4 is the MINIMUM verbosity at which NSIS !echo output reaches
          # stdout. At the default verbosity (and at -V1/-V2/-V3) the
          # uninstall-symmetry include marker never appears in the captured
          # log, so the assertion below was dead-on-arrival — runs #37 and
          # #39 red regardless of the chain's correctness. installer.nsi
          # stays byte-identical; the gate keeps its teeth.
          & $makensis `
            -V4 `
            -DVERSION="$env:APP_VERSION" `
            -DEXE="SHEYTAN-LA.exe" `
            -DBUILDDIR="$payloadDir" `
            -DOUTFILE="$installerPath" `
            "packaging\nsis\installer.nsi" 2>&1 | Tee-Object -FilePath "ci-logs/win-nsis.log"

          if ($LASTEXITCODE -ne 0) {
            Add-Content "ci-logs/gate-order.txt" "FAIL NSIS makensis"
            throw "makensis exited with code $LASTEXITCODE (log: ci-logs/win-nsis.log)."
          }
          Add-Content "ci-logs/gate-order.txt" "OK NSIS makensis"
          Write-Host "::notice::gate OK: NSIS makensis"

          # UNINSTALL SYMMETRY, compile-proven (run #37 red gate class):
          # the generated payload-uninstall.nsh opens with its own guard
          # define and installer.nsi echoes the include marker from inside
          # the !ifdef. If the marker is absent from the log, the
          # preprocessor skipped the insert — fail the step instead of
          # shipping an uninstaller that leaves sheytan-ui.exe and the Qt
          # tree on disk.
          $nsisLog = Get-Content "ci-logs/win-nsis.log" -Raw
          if (-not $nsisLog.Contains("sheytan: payload uninstall list included")) {
            Add-Content "ci-logs/gate-order.txt" "FAIL NSIS makensis"
            throw "uninstall-symmetry include marker missing from ci-logs/win-nsis.log — the payload uninstall list did not compile in (run #37 red gate class)."
          }
          Write-Host "Uninstall-symmetry include marker present in win-nsis.log."

          Add-Content "ci-logs/gate-order.txt" "RUN NSIS post-build contract"

          # Post-build assertions: the installer must exist, be non-empty,
          # and its version resource must carry the release identity.
          if (-not (Test-Path $installerPath)) {
            throw "NSIS installer was not produced."
          }
          if ((Get-Item $installerPath).Length -le 0) {
            throw "NSIS installer is empty."
          }

          # v1.10.13 W-INST-VER: NSIS's VIProductVersion is REQUIRED to be
          # four-part X.X.X.X (makensis parses "%d.%d.%d.%d" and requires
          # all four fields; a three-part value fails with "invalid
          # VIProductVersion format, should be X.X.X.X"), and
          # installer.nsi therefore carries VIProductVersion
          # "${VERSION}.0" — the version resource reads "<APP_VERSION>.0".
          # installer.nsi stays byte-identical; the gate compares against
          # the four-part identity.
          $versionInfo = (Get-Item $installerPath).VersionInfo
          if ($versionInfo.ProductVersion -ne "$($env:APP_VERSION).0") {
            throw "Installer ProductVersion '$($versionInfo.ProductVersion)' != '$($env:APP_VERSION).0' (NSIS four-part VIProductVersion contract)."
          }
          if ($versionInfo.ProductName -ne "SHEYTAN-LA") {
            throw "Installer ProductName '$($versionInfo.ProductName)' != expected identity 'SHEYTAN-LA'."
          }
          Add-Content "ci-logs/gate-order.txt" "OK NSIS post-build contract"

          Write-Host "NSIS installer built: $installerPath"

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Add-Content "ci-logs/gate-order.txt" "RUN Windows installer verify"

          $installer = Get-Item "dist/${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-windows-x64-installer.exe"

          if ($installer.Length -lt 1MB) {
            throw "Installer is implausibly small ($($installer.Length) bytes) — refusing to publish."
          }

          # Authenticode state is REPORTED, never faked: unsigned builds are
          # expected until signing credentials are configured.
          $sig = Get-AuthenticodeSignature $installer.FullName
          Write-Host "Installer Authenticode status: $($sig.Status)"

          # Structural inspection instead of trusting the exit code — the
          # installer must be a valid PE carrying the identity.
          $bytes = New-Object byte[] 2
          $fs = [System.IO.File]::OpenRead($installer.FullName)
          try { $null = $fs.Read($bytes, 0, 2) } finally { $fs.Dispose() }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Installer is not a valid PE executable (missing MZ header)."
          }

          $vi = $installer.VersionInfo
          if ($vi.ProductName -ne "SHEYTAN-LA") {
            throw "Installer ProductName '$($vi.ProductName)' != expected identity 'SHEYTAN-LA'."
          }

          Write-Host "Installer identity: $($vi.ProductName) v$($vi.ProductVersion) ($([math]::Round($installer.Length/1MB,1)) MB)"

          Write-Host "Installer verification passed: $($installer.Name) ($([math]::Round($installer.Length/1MB,1)) MB)"

          Add-Content "ci-logs/gate-order.txt" "OK Windows installer verify"

      # v1.10.14 R3 (run #36 class): the verification blind spot. CI proved
      # the desktop boots from the UNPACKAGED staging tree and verified the
      # installer structurally (size, MZ header, identity) — but NO gate
      # ever INSTALLED the installer and booted the installed tree. A fully
      # green matrix shipped an installer that cannot boot the desktop.
      # This gate closes that: silent-install into a runner temp dir, the
      # PAYLOAD CONTRACT asserted on the INSTALLED tree (the complete
      # pair), then the INSTALLED core booted with the UI child disabled —
      # the same state-based assertions as the runtime smoke (session
      # banner + boot markers in logs/app.log, bounded waits, alive, no
      # crash report, clean shutdown). RED against the run-#36 installer.
      # Then the silent uninstall proves UNINSTALL SYMMETRY hosted: the
      # payload is removed, the install-local data tree survives.
      - name: Silent-install smoke (installed tree boots)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Add-Content "ci-logs/gate-order.txt" "RUN silent-install smoke"

          $installer = Join-Path (Get-Location).Path "dist/${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-windows-x64-installer.exe"
          if (-not (Test-Path $installer)) {
            throw "silent-install smoke: the installer was not produced."
          }

          # NSIS silent semantics (documented NSIS behavior): /S runs the
          # installer silently; /D=<dir> overrides $INSTDIR and MUST be the
          # LAST argument and unquoted. A fresh runner carries no registry
          # InstallDir (InstallDirRegKey is empty), so /D is the only
          # directory source — the assertions below hold regardless.
          $instDir = Join-Path $env:RUNNER_TEMP "sheytan-install-smoke"
          if (Test-Path $instDir) { Remove-Item $instDir -Recurse -Force }
          $null = New-Item -ItemType Directory -Force -Path $instDir

          $setup = Start-Process -FilePath $installer -ArgumentList "/S", "/D=$instDir" -Wait -PassThru
          if ($setup.ExitCode -ne 0) {
            throw "silent-install smoke: the installer exited with code $($setup.ExitCode)."
          }

          # THE PAYLOAD CONTRACT, proven on the INSTALLED tree: the pair
          # must exist, or the installer does not ship the application.
          foreach ($f in @("SHEYTAN-LA.exe", "sheytan-ui.exe", "Qt6Core.dll", "Uninstall.exe")) {
            if (-not (Test-Path (Join-Path $instDir $f))) {
              throw "silent-install smoke: installed tree missing $f — the installer did not ship the complete application (run-#36 defect class)."
            }
          }
          # models are NEVER bundled — the installed tree must not carry one.
          if (Test-Path (Join-Path $instDir "models")) {
            throw "silent-install smoke: models/ must never be bundled."
          }
          Write-Host "Silent install complete: the installed tree carries the complete pair (SHEYTAN-LA.exe + sheytan-ui.exe + Qt6Core.dll)."

          # Operator data in the canonical install-local data root: the
          # uninstaller must leave it untouched (preserve-user-data by
          # construction, asserted hosted below).
          $userFile = Join-Path $instDir "data\models\operator-model.gguf"
          Set-Content -Path $userFile -Value "operator data — must survive uninstall" -Encoding utf8

          # Boot the INSTALLED core with the UI child disabled
          # (SHEYTAN_UI_EXECUTABLE=none): the core serves without the
          # child, so the state assertions decide between "boots" and
          # "closed instantly" — the exact physical symptom run #36 hid.
          $runDir = Join-Path $env:RUNNER_TEMP "sheytan-install-smoke-run"
          if (Test-Path $runDir) { Remove-Item $runDir -Recurse -Force }
          $dataDir = Join-Path $runDir "data"
          $null = New-Item -ItemType Directory -Force -Path $dataDir

          $env:SHEYTAN_DATA_DIR = $dataDir
          $env:SHEYTAN_UI_EXECUTABLE = "none"

          $core = Start-Process -FilePath (Join-Path $instDir "SHEYTAN-LA.exe") -WorkingDirectory $instDir -PassThru
          if ($null -eq $core) {
            throw "silent-install smoke: the installed core could not be started."
          }

          $appLog = Join-Path $dataDir "logs/app.log"
          $bannerSeen = $false
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline) {
            if ($core.HasExited) {
              Write-Host "--- installed boot failed: the INSTALLED core exited during startup ---"
              if (Test-Path $appLog) {
                Get-Content $appLog -ErrorAction SilentlyContinue | Select-Object -Last 40
              }
              throw "silent-install smoke: the INSTALLED core exited during startup (code $($core.ExitCode)) — the installer's product does not boot."
            }
            if ((Test-Path $appLog) -and
                (Select-String -Path $appLog -Pattern "==== SHEYTAN-Local-Agent v$($env:APP_VERSION) session start" -Quiet) -and
                (Select-String -Path $appLog -Pattern "starting \(windows/amd64" -Quiet)) {
              $bannerSeen = $true
              break
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $bannerSeen) {
            Write-Host "--- installed boot: boot markers never appeared ---"
            if (Test-Path $appLog) {
              Get-Content $appLog | Select-Object -Last 40
            }
            throw "silent-install smoke: the session banner never appeared in the installed run's logs/app.log."
          }
          if ($core.HasExited) {
            throw "silent-install smoke: the installed core exited right after boot."
          }

          # Backend/runtime init ran clean: no crash report after boot.
          $crashDir = Join-Path $dataDir "logs/crashes"
          if (Test-Path $crashDir) {
            $crashes = Get-ChildItem $crashDir -Filter "*.log" -ErrorAction SilentlyContinue
            if ($crashes -and $crashes.Count -gt 0) {
              throw "silent-install smoke: crash report exists after the installed boot."
            }
          }

          Write-Host "INSTALLED boot verified: session banner + boot markers in the installed run's app.log, core alive (pid $($core.Id)), no crash report."

          # Clean shutdown: the UI=none core serves until terminated; the
          # documented stop for the windowless serve-forever mode is
          # process termination — bounded exit is the assertion.
          Stop-Process -Id $core.Id -Force
          if (-not $core.WaitForExit(15000)) {
            throw "silent-install smoke: the installed core did not exit after termination."
          }
          Write-Host "Installed core shut down (bounded exit verified)."

          Add-Content "ci-logs/gate-order.txt" "OK silent-install smoke"
          Add-Content "ci-logs/gate-order.txt" "RUN silent-uninstall smoke"

          # UNINSTALL SYMMETRY, hosted: the silent uninstaller removes the
          # enumerated payload; the data tree survives; the user file is
          # untouched. Bounded poll — NSIS relaunches the uninstaller from
          # a temp copy, so the payload may outlive the launching process
          # briefly.
          $un = Start-Process -FilePath (Join-Path $instDir "Uninstall.exe") -ArgumentList "/S" -PassThru
          if ($null -eq $un) {
            throw "silent-uninstall smoke: the uninstaller could not be started."
          }

          $gone = $false
          $unDeadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $unDeadline) {
            if (-not (Test-Path (Join-Path $instDir "sheytan-ui.exe")) -and
                -not (Test-Path (Join-Path $instDir "Qt6Core.dll")) -and
                -not (Test-Path (Join-Path $instDir "SHEYTAN-LA.exe"))) {
              $gone = $true
              break
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $gone) {
            # D1/D6: the failure names WHAT survived — capped list, no
            # dumps — so the anonymous annotation is self-describing.
            $targets = @("sheytan-ui.exe", "Qt6Core.dll", "SHEYTAN-LA.exe")
            $survivors = @($targets | Where-Object { Test-Path (Join-Path $instDir $_) })
            $listed = ($survivors | Select-Object -First 10) -join ", "
            if ([string]::IsNullOrWhiteSpace($listed)) { $listed = "install root itself survived" }
            throw ("silent-uninstall smoke: the payload survived the silent uninstall (uninstall symmetry broken). Surviving targets: {0}" -f $listed)
          }
          if (-not (Test-Path $userFile)) {
            throw "silent-uninstall smoke: USER DATA WAS DELETED — the data tree must survive uninstall."
          }
          Write-Host "Silent uninstall verified: the payload is gone; the data tree and the operator's file survived untouched."

          Add-Content "ci-logs/gate-order.txt" "OK silent-uninstall smoke"

          Write-Host ("::notice::ci-summary step=silent-install-smoke errors=0/0 | warnings=0/0 | notices=2/2 | installed-boot=verified uninstall-symmetry=verified | installer={0}MB" -f [math]::Round((Get-Item $installer).Length/1MB, 2))

      # v1.10.14-fixed (D7/I11): if: always() — a red run still exposes its
      # binaries (run #37's artifact table hid the installer and the ZIP
      # behind the failing uninstall smoke). Display names follow the ONE
      # naming map.
      - name: Upload Windows installer
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WIN_PKG_ROOT }}-v${{ env.APP_VERSION }}-windows-x64-installer
          path: dist/${{ env.WIN_PKG_ROOT }}-v${{ env.APP_VERSION }}-windows-x64-installer.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WIN_PKG_ROOT }}-v${{ env.APP_VERSION }}-windows-x64
          path: dist/${{ env.WIN_PKG_ROOT }}-v${{ env.APP_VERSION }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      # v1.10.6 FAILURE-VISIBILITY: on failure, append the failing test
      # names to $GITHUB_STEP_SUMMARY (publicly visible without login —
      # the log is admin-gated, this is not). This is how a credential-less
      # agent reads the next failure. No secrets/keys are ever written
      # here.
      #
      # v1.10.7 VISIBILITY 2.0 (V-A): the summary steps ALSO emit
      # ::error:: workflow-command annotations — anonymously machine-readable
      # via the check-run annotations API without any login (verified against
      # run 38731387959 this cycle). Windows names the failing command and
      # the first failing test names. Caps respect the 10-annotations-per-step
      # limit; long lines are truncated; no secrets (rule 7) — the same lines
      # already publish to the public step summary.
      # v1.10.9 (V-A.2, run 38871731277 class): the failing-lines filter ALSO
      # captures Go test ASSERTION lines ("serve_test.go:287: ..." — the
      # \.go:[0-9]+:  class, unanchored so indented test-output lines match;
      # compile errors "file.go:NN: ..." ride the same class). v1.10.8's red
      # published the failing TEST NAME but not its STATEMENT — the next red
      # Windows run must be fully self-describing anonymously. Capped and
      # truncated exactly as before; assertion lines carry no IPC keys,
      # tokens, runIds, sessionIds or model content (rule 7).
      #
      # v1.10.13 W-VIS (run 39024607296 class — THE POSITIONAL REPAIR): this
      # pair MOVED from its mid-job position (immediately after Go
      # verification) to the END of the job. GitHub evaluates a step's
      # condition when the step is reached in sequence, so the mid-job
      # if:failure() pair could not observe a failure in the
      # post-verification chain that follows it — run 39024607296's step-22
      # failure published ONLY the generic "Process completed with exit
      # code 1." annotation while both steps reported "skipped". At the
      # job's end, if:failure() covers the ENTIRE job. The summary is
      # EXTENDED: every post-verification native command (cmake configure,
      # cmake build, windeployqt, the acceptance run, NSIS makensis) tees
      # its own log into ci-logs/ and tracks RUN/OK/FAIL in
      # ci-logs/gate-order.txt; on failure the summary names the failing
      # gate and emits redacted, truncated tail lines of that gate's log as
      # anonymous annotations under the same caps (10 per step, 250 chars,
      # no secrets — named-pipe endpoints and key-shaped assignments are
      # redacted before anything leaves the job). The proven
      # Go-verification summary path below is unchanged: when the failure
      # happened at or before Go verification (no post-verification gate
      # markers exist), the exact former logic runs.
      - name: Failure summary (Windows)
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $summaryPath = $env:GITHUB_STEP_SUMMARY
          if ([string]::IsNullOrEmpty($summaryPath)) { exit 0 }

          # v1.10.13 §9 CI SEVERITY CONTRACT (Task ID 28, R5): classify →
          # dedup → caps → escape → truncate → redact → emit notices →
          # warnings → errors → ONE accounting line.
          #   ::error   — failed assertions, gate failures, crashes, real
          #               capture/report instrumentation failures, compile
          #               errors (priority: assertions/gates → capture →
          #               compile; the failing gate is named first).
          #   ::warning — QWARN log lines (run #28 measured 5 of the
          #               Windows job's failure-level annotations as
          #               QWARN warnings — V10) and toolchain warnings.
          #   ::notice  — diagnostic context: the goal/chat-persist dump
          #               lines, QDEBUG/QINFO/QSKIP, and the
          #               "captures were empty" line — C1 CONFIRMED (Qt
          #               Test docs, "-o filename,format" routes ALL
          #               QtTest output into the report file; stdout only
          #               when no -o is given), so empty native captures
          #               beside a non-empty report are documented routing,
          #               not an instrumentation failure. A missing/empty
          #               REPORT on a nonzero exit stays a real
          #               instrumentation failure (::error, I5).
          # The failing gate itself is never masked (the acceptance step's
          # own ::error names it); a green gate never executes this step.
          # D1 preserved: signal lines only, no tail dumps; full logs stay
          # in the artifacts.

          $stepName = "Failure summary (Windows)"
          # v1.10.14-fixed (D21): the full list of captured lines lives in
          # the ONE all-logs artifact — the per-class artifacts are gone.
          $fullList = "${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-all-logs (all-logs.txt)"
          $errCap = 10; $warnCap = 10; $noticeCap = 10
          $global:Redacted = 0

          # v1.10.13 §9 redaction (extends the proven W-VIS conservative
          # redaction: no IPC keys, capability tokens, runIds, sessionIds or
          # model content — rule 7). Every emitted and summary line is
          # redacted; $count marks the annotation-pipeline pass whose
          # changed-line count the accounting line reports.
          function Redact-Anonymous([string]$line, [bool]$count = $false) {
            $r = $line -replace '\\\\\.\\pipe\\\S+', '\\.\pipe\<redacted>'
            $r = $r -replace '(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}', '<REDACTED>'
            $r = $r -replace 'github_pat_[A-Za-z0-9_]{82,}', '<REDACTED>'
            $r = $r -replace '(AKIA|ASIA)[0-9A-Z]{16}', '<REDACTED>'
            $r = $r -replace 'sk-proj-[A-Za-z0-9_-]{80,}', '<REDACTED>'
            $r = $r -replace 'sk-[A-Za-z0-9]{48}', '<REDACTED>'
            $r = $r -replace '(?i)bearer [A-Za-z0-9._~-]+', 'bearer <REDACTED>'
            $r = $r -replace "(?i)((password|passwd|pwd|token|secret|api[_-]?key)[:=])\S*", '$1<REDACTED>'
            if ($env:USERPROFILE) { $r = $r -replace [regex]::Escape($env:USERPROFILE), '<HOME>' }
            if ($env:RUNNER_TEMP) { $r = $r -replace [regex]::Escape($env:RUNNER_TEMP), '<TMP>' }
            if ($count -and ($r -cne $line)) { $global:Redacted++ }
            return $r
          }

          # §9 classification (precedence: error → DUMP-DIAGNOSTIC notice →
          # warning → informational notice; the dump classes OUTRANK the
          # QWARN rule — a dump line wrapped in a QWARN prefix is diagnostic
          # context (G4), not a real warning; via §10 the same line arrives
          # bare on stderr and dedup collapses the two copies into one
          # notice). Same escaped patterns as the Linux half.
          $errRe  = '^(FAIL!|--- FAIL|FAIL\s)|panic: |fatal error: |^Totals: .*, [1-9][0-9]* failed|QFATAL|^Fatal|^Aborted|terminate called|core dumped|\.go:[0-9]+: |: (fatal )?error( [A-Z0-9]+)?: |CMake Error|^FAILED: |ninja: build stopped|^acceptance (exit code|instrumentation failure)'
          $dumpNoticeRe = 'goal [^ ]+ → |chat-persist\[|^acceptance output captures were empty'
          $warnRe = '^(QWARN|warning: |W[0-9]{4}: )'
          $infoNoticeRe = 'QDEBUG|QINFO|QSKIP'
          $errARe = '^(FAIL!|--- FAIL|FAIL\s)|panic: |fatal error: |^Totals: .*, [1-9][0-9]* failed|QFATAL|^Fatal|^Aborted|terminate called|core dumped'
          $errBRe = '^acceptance (exit code|instrumentation failure)'

          function Classify-Line([string]$l) {
            if ($l -match $errRe) { return 'error' }
            if ($l -match $dumpNoticeRe) { return 'notice' }
            if ($l -match $warnRe) { return 'warning' }
            if ($l -match $infoNoticeRe) { return 'notice' }
            return $null
          }

          # §9 dedup normalization: strip ANSI, the QtTest prefix, and the
          # file:line prefix (unless the line starts with
          # FAIL!/QVERIFY/QCOMPARE/QFATAL), collapse whitespace.
          function Norm-Line([string]$l) {
            $x = $l.TrimStart()
            $x = [regex]::Replace($x, "\x1B\[[0-9;]*[A-Za-z]", "")
            $x = [regex]::Replace($x, '^(QWARN|QDEBUG|QINFO|QFAIL|QSYSTEM)\s*:\s*[A-Za-z0-9_:]+\(\)\s*', '')
            if ($x -notmatch '^(FAIL!|QVERIFY|QCOMPARE|QFATAL)') {
              $x = [regex]::Replace($x, '^[^ :]+:[0-9]+:\s*', '')
            }
            return (($x -replace '\s+', ' ').Trim())
          }

          # §9 workflow-command escaping (%→%25, CR→%0D, LF→%0A) and
          # truncation (500 diagnostics / 250 generic, "… [truncated]").
          function Esc-WF([string]$s) {
            return ($s -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A')
          }
          function Trunc-Line([string]$s, [int]$cap) {
            if ($s.Length -gt $cap) { return ($s.Substring(0, $cap) + "… [truncated]") }
            return $s
          }
          function Emit-Line([string]$sev, [string]$msg) {
            switch ($sev) {
              'notice'  { Write-Host "::notice::$msg" }
              'warning' { Write-Host "::warning::$msg" }
              'error'   { Write-Host "::error::$msg" }
            }
          }

          $lines = @()
          $lines += "## Windows job FAILED"
          $lines += ""
          $lines += "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $lines += ""
          $lines += "Full evidence artifact: ${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-all-logs (all-logs.txt — every gate log, the gate chain and the QtTest -o report; D21)."

          # v1.10.13 W-VIS: name the failing gate from the tracked markers
          # (RUN without OK/FAIL = the gate that started and never
          # finished; explicit FAIL = the gate that threw).
          $goLogs = @("win-gofmt.log", "win-go-test-headless.log", "win-go-test-full.log", "win-go-vet.log")

          # v1.10.14-fixed (R2/D17): name the COMMAND each missing log
          # belonged to. With first-byte capture this guard is a true last
          # resort; when it fires it carries the gate's command and the
          # expected path (I17) — never a bare path again.
          $goLogCommands = @{
            "win-gofmt.log"            = "gofmt -l ."
            "win-go-test-headless.log" = "go test ./internal/... (headless)"
            "win-go-test-full.log"     = "go test ./... (full)"
            "win-go-vet.log"           = "go vet ./..."
          }

          # v1.10.14-fixed (R3/D15): a gate log that is absent or EMPTY at
          # failure time is a NAMED instrumentation failure — never silence
          # (I15). The tee'd logs must exist from their gate's first byte;
          # a missing one means the gate never started or the capture
          # wiring is broken, and either way the operator reads it here.
          foreach ($name in $goLogs) {
            $p = Join-Path "ci-logs" $name
            if (-not (Test-Path $p)) {
              Write-Host "::error::gate produced no log — capture defect: $p absent at failure time (gate: $($goLogCommands[$name]) — it died before its first log byte)"
            } elseif ((Get-Item $p).Length -eq 0) {
              Write-Host "::error::gate produced no log — capture defect: $p exists but is EMPTY (gate: $($goLogCommands[$name]))"
            }
          }
          $gateLogMap = @{
            "Qt host cmake configure"   = "ci-logs/win-qt-configure.log"
            "Qt host cmake build"       = "ci-logs/win-qt-build.log"
            "windeployqt"               = "ci-logs/win-windeployqt.log"
            "Qt host staging"           = "ci-logs/win-qt-build.log"
            # v1.10.13 WINDOWS-REPORT: the -o report carries the
            # FAIL!/assertion lines now — both files are evidence.
            "Qt live-answer acceptance" = @("ci-logs/win-qt-acceptance.log", "ci-logs/win-qt-acceptance-report.txt")
            "NSIS makensis"             = "ci-logs/win-nsis.log"
          }
          $failingGate = $null
          $lastGate = $null
          $tracked = $false
          $gateOrder = "ci-logs/gate-order.txt"
          if (Test-Path $gateOrder) {
            $markers = @(Get-Content $gateOrder -ErrorAction SilentlyContinue)
            foreach ($m in $markers) {
              if ($m -like "OK *") { $lastGate = $null; $tracked = $true }
              elseif ($m -like "RUN *") { $lastGate = $m.Substring(4); $tracked = $true }
              elseif ($m -like "FAIL *") { $failingGate = $m.Substring(5); $tracked = $true; break }
            }
            if (-not $failingGate -and $lastGate) { $failingGate = $lastGate }
          }

          # v1.10.13 D1 (operator directive 1): errors-only summaries. The
          # per-log "last 200 lines" tail dumps are REMOVED — the summary
          # publishes ONLY classified error lines, capped, each block
          # carrying its source name; the full logs remain in the uploaded
          # artifacts.
          foreach ($log in (Get-ChildItem "ci-logs" -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in ".log", ".txt" })) {
            $raw = @(Get-Content $log.FullName -ErrorAction SilentlyContinue)
            $text = if ($goLogs -contains $log.Name) { $raw } else { @($raw | ForEach-Object { Redact-Anonymous $_ }) }
            $lines += ""
            $lines += "### $($log.Name) — failing/error lines"
            $failing = @($text | Where-Object { (Classify-Line $_) -eq 'error' })
            $lines += '```'
            if ($failing.Count -gt 0) { $lines += ($failing | Select-Object -First 60) } else { $lines += "(no FAIL lines captured)" }
            $lines += '```'
          }

          # v1.10.13 W-ANN-ORDER: mirror the FAILING SLOT NAMES and the
          # first error-class lines of the failing gate into the job
          # SUMMARY — the summary is public and uncapped; the per-class
          # annotation budgets are spent on signal lines first, the slot
          # names ride here forever.
          if ($failingGate) {
            # v1.10.13 WINDOWS-REPORT: the gate's evidence may be several
            # files (native log + the -o report) — concatenate them.
            $gateLines = @()
            foreach ($gl in @($gateLogMap[$failingGate])) {
              if ($gl -and (Test-Path $gl)) {
                $gateLines += @(Get-Content $gl -ErrorAction SilentlyContinue | ForEach-Object { Redact-Anonymous $_ })
              }
            }
            if ($gateLines.Count -gt 0) {
              # QtTest emits "FAIL!  : tst_acceptance::slotName()" — the
              # capture must cross the :: namespace separator.
              $slotNames = @($gateLines | Where-Object { $_ -match '^FAIL!\s*:\s*([A-Za-z0-9_:]+)\(' } | ForEach-Object { $_ -replace '^FAIL!\s*:\s*([A-Za-z0-9_:]+)\(.*$', '$1' } | Select-Object -Unique)
              $firstFails = @($gateLines | Where-Object { (Classify-Line $_) -eq 'error' } | Select-Object -First 8)
              if ($slotNames.Count -gt 0) {
                $lines += ""
                $lines += "### Failing test slots — $failingGate"
                $lines += ($slotNames | ForEach-Object { "- $_" })
                $lines += ""
                $lines += '```'
                $lines += $firstFails
                $lines += '```'
              }
            }
          }

          Add-Content -Path $summaryPath -Value ($lines -join [Environment]::NewLine)

          # §9 unified classified annotation pipeline. The failing gate's
          # own evidence files are read FIRST so their lines win the
          # keep-first dedup (signal-first, W-ANN-ORDER's intent). Prelude
          # and other unclassified lines match no class and are never
          # emitted as errors — the run-#23/#28 classes that consumed the
          # cap or inflated severity are structurally gone.
          $orderedFiles = @()
          if ($failingGate) {
            foreach ($gl in @($gateLogMap[$failingGate])) {
              if ($gl -and (Test-Path $gl)) { $orderedFiles += (Resolve-Path $gl).Path }
            }
          }
          foreach ($log in (Get-ChildItem "ci-logs" -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in ".log", ".txt" })) {
            if ($orderedFiles -notcontains $log.FullName) { $orderedFiles += $log.FullName }
          }

          $seen = @{}
          $dup = 0
          $errA = @(); $errB = @(); $errC = @(); $warnL = @(); $noticeL = @()
          $errSel = 0; $warnSel = 0; $noticeSel = 0

          foreach ($f in $orderedFiles) {
            $base = (Split-Path $f -Leaf)
            $raw = @(Get-Content $f -ErrorAction SilentlyContinue)
            $isGo = $goLogs -contains $base
            foreach ($line in $raw) {
              if ([string]::IsNullOrWhiteSpace($line)) { continue }
              $r = if ($isGo) { $line } else { Redact-Anonymous $line $true }
              $sev = Classify-Line $r
              if (-not $sev) { continue }
              $key = "$sev|" + (Norm-Line $r)
              if ($seen.ContainsKey($key)) { $dup++; continue }
              $seen[$key] = 1
              $disp = "$base" + ": " + $r
              switch ($sev) {
                'error' {
                  $errSel++
                  if ($r -match $errARe) { $errA += $disp }
                  elseif ($r -match $errBRe) { $errB += $disp }
                  else { $errC += $disp }
                }
                'warning' { $warnSel++; $warnL += $disp }
                'notice'  { $noticeSel++; $noticeL += $disp }
              }
            }
          }

          # §9 emission order: notices → warnings → errors → accounting.
          $noticeEm = 0; $warnEm = 0; $errEm = 0
          foreach ($l in $noticeL) {
            if ($noticeEm -ge $noticeCap) { break }
            Emit-Line notice (Esc-WF (Trunc-Line $l 500))
            $noticeEm++
          }
          foreach ($l in $warnL) {
            if ($warnEm -ge $warnCap) { break }
            Emit-Line warning (Esc-WF (Trunc-Line $l 250))
            $warnEm++
          }
          if ($tracked) {
            if ($failingGate) {
              Emit-Line error (Esc-WF "failing gate: $failingGate")
              $errEm++
            } else {
              Emit-Line error (Esc-WF "all tracked post-verification gates passed; the failure occurred outside them — see the red step on the run page")
              $errEm++
            }
          }
          foreach ($l in $errA) {
            if ($errEm -ge $errCap) { break }
            Emit-Line error (Esc-WF (Trunc-Line $l 250))
            $errEm++
          }
          foreach ($l in $errB) {
            if ($errEm -ge $errCap) { break }
            Emit-Line error (Esc-WF (Trunc-Line $l 250))
            $errEm++
          }
          foreach ($l in $errC) {
            if ($errEm -ge $errCap) { break }
            Emit-Line error (Esc-WF (Trunc-Line $l 250))
            $errEm++
          }
          if (($errEm + $warnEm + $noticeEm) -eq 0 -and -not $tracked) {
            $gofmtLog = "ci-logs/win-gofmt.log"
            if ((Test-Path $gofmtLog) -and (Get-Content $gofmtLog -ErrorAction SilentlyContinue)) {
              $first = @(Get-Content $gofmtLog | Select-Object -First 8)
              foreach ($f in $first) { Emit-Line error (Esc-WF "gofmt violation: $f (run gofmt -w . )") }
              Emit-Line error (Esc-WF "Windows Go verification failed at the gofmt gate — $($first.Count)+ file(s) listed in win-gofmt.log")
              $errEm += $first.Count + 1
            } else {
              Emit-Line error (Esc-WF "Windows Go verification failed with no FAIL-prefixed lines captured — read the step summary and the all-logs artifact (all-logs.txt, D21)")
              $errEm++
            }
          }

          # §9 ONE accounting line per step.
          Emit-Line notice (Esc-WF "ci-summary step=$stepName errors=$errEm/$errSel | warnings=$warnEm/$warnSel | notices=$noticeEm/$noticeSel | duplicates_removed=$dup redacted=$($global:Redacted) | full_list=$fullList")

      # v1.10.14-fixed (D21/I18, run-#41 R2): the Windows job's three
      # per-class log uploads (failure-gated go-verification logs, the
      # all-outcomes ci-logs set, and the Qt acceptance report) fold into
      # the ONE part built by this job's LAST step below (after Run
      # summary, so the part carries the complete gate chain).

      # v1.10.14-fixed (D7, D1-compliant): ONE run-summary per job — the
      # publicly visible $GITHUB_STEP_SUMMARY table: version, the packaged
      # artifacts with their sizes, the gate chain from gate-order.txt.
      # Tables, not dumps; missing artifacts print "absent" (this step can
      # never fail the job); error details stay in the failure-summary step.
      - name: Run summary (Windows)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $lines = @()
          $lines += "## SHEYTAN-LA build summary"
          $lines += ""
          $lines += "| Item | Value |"
          $lines += "| --- | --- |"
          $lines += ("| Version | ${env:APP_VERSION} |")
          $lines += ("| Installer | ${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-windows-x64-installer.exe |")
          $lines += ("| Windows ZIP | ${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-windows-x64.zip |")
          $lines += ""
          $lines += "| Artifact | Size |"
          $lines += "| --- | --- |"
          foreach ($pair in @(
            @("Installer", "dist/${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-windows-x64-installer.exe"),
            @("Windows ZIP", "dist/${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-windows-x64.zip")
          )) {
            if (Test-Path $pair[1]) {
              $mb = [math]::Round((Get-Item $pair[1]).Length / 1MB, 2)
              $lines += ("| {0} | {1} MB |" -f $pair[0], $mb)
            } else {
              $lines += ("| {0} | absent |" -f $pair[0])
            }
          }
          $lines += ""
          $lines += "| Gate chain (ci-logs/gate-order.txt) |"
          $lines += "| --- |"
          if (Test-Path "ci-logs/gate-order.txt") {
            foreach ($g in Get-Content "ci-logs/gate-order.txt") {
              if ($g.Trim()) { $lines += ("| {0} |" -f $g.Trim()) }
            }
          } else {
            $lines += "| (gate-order.txt not yet written) |"
          }
          Add-Content $env:GITHUB_STEP_SUMMARY ($lines -join "`n")
          Add-Content "ci-logs/gate-order.txt" "OK run summary (Windows)"

      # v1.10.14-fixed (D21/I18, run-#41 R2): the Windows job's ONE log
      # part — built on EVERY outcome as the job's LAST step, after Run
      # summary, so the part carries the complete gate chain. The three
      # per-class log uploads this replaces (failure-gated go-verification
      # logs, all-outcomes ci-logs, Qt acceptance report) are strictly
      # subsumed: every ci-logs file rides with per-file headers.
      # win-nsis.log — the file that rode in no artifact at all in run
      # #39 — rides the part too.
      - name: Build Windows log part (all outcomes)
        if: always()
        shell: pwsh
        env:
          JOB_OUTCOME: ${{ job.status }}
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force -Path "log-parts" | Out-Null
          $part = "log-parts/build-windows-logs-part-$env:GITHUB_RUN_ATTEMPT.txt"
          @(
            "job: build-windows"
            "attempt: $env:GITHUB_RUN_ATTEMPT"
            "outcome: $env:JOB_OUTCOME"
            "run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Set-Content -Path $part
          if (Test-Path "ci-logs") {
            Get-ChildItem "ci-logs" -File | Sort-Object Name | ForEach-Object {
              Add-Content -Path $part -Value "----- 8< ----- $($_.Name) -----"
              Add-Content -Path $part -Value (Get-Content -Raw -Path $_.FullName)
            }
          }
          $files = 0
          if (Test-Path "ci-logs") { $files = (Get-ChildItem "ci-logs" -File).Count }
          Add-Content -Path $part -Value "ci-summary job=build-windows outcome=$env:JOB_OUTCOME log-files=$files part=$(Split-Path -Leaf $part)"
          Write-Host "Windows log part built: $part ($((Get-Item $part).Length) bytes)"

      - name: Upload Windows log part (all outcomes)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-windows-logs-part-attempt${{ github.run_attempt }}
          path: log-parts/build-windows-logs-part-*.txt
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: Linux x64
    needs: [audit, preflight]
    timeout-minutes: 50

    # Identity flows from the audit job's runtime resolution of
    # package.json — no local hardcoded version can drift here either.
    env:
      APP_VERSION: ${{ needs.audit.outputs.version }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          package-manager-cache: true

      - name: Verify Node and repository
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version

          node_major="$(node -p 'process.versions.node.split(".")[0]')"
          test "$node_major" -ge 24

          test -f package.json
          test -f package-lock.json
          test -f go.mod
          test -f go.sum
          test ! -e web/package.json

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          # v1.10.1: the desktop UI is the native Qt host — the GTK4 +
          # WebKitGTK development stack (the Wails/WebView shell) is no
          # longer a product dependency. The smoke keeps xvfb/xdotool/
          # x11-utils; libxcb userspace pieces the Qt xcb plugin loads
          # (xkbcommon-x11, cursor, icccm, keysyms, image, render-util)
          # come with the runner image or the Qt deploy step.
          # v1.10.3 (R3): libx11-dev (the smoke builds scripts/closewin.c
          # with cc -lX11) and openbox (the smoke's G3/G5 gates require a
          # REAL window manager — no WM-less GUI claims) are REQUIRED now;
          # their v1.10.2 absence made the first hosted smoke run fail
          # (missing X11 headers) or run WM-less (untrustable geometry).
          # v1.10.5 (Blocker B, run 38584769607 step 22): the Qt host build
          # needs the OpenGL DEVELOPMENT stack, not just the runtime libs.
          # CMake FindOpenGL requires OPENGL_opengl_LIBRARY +
          # OPENGL_glx_LIBRARY + OPENGL_INCLUDE_DIR; with only libgl1 /
          # libegl1 (runtime .so.N, no headers, no dev symlinks) the
          # configure step fails with "Could NOT find OpenGL" →
          # WrapOpenGL NOT FOUND → Qt6Gui NOT FOUND. The glvnd dev
          # packages provide the GL/GLX/EGL/OpenGL headers and .so
          # link-time symlinks; mesa-common-dev provides GL/gl.h and
          # GL/glext.h; libxkbcommon-dev provides the pkg-config module
          # the Qt xcb platform plugin's build-time lookup needs.
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgl1 \
            libegl1 \
            libgl-dev \
            libglx-dev \
            libopengl-dev \
            libegl-dev \
            mesa-common-dev \
            libxkbcommon-dev \
            libxkbcommon0 \
            libx11-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-image0 \
            libxcb-render-util0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-randr0 \
            libxcb-shm0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            libxcb-xkb1 \
            libxcb-sync1 \
            libxcb-dri3-0 \
            openbox \
            xvfb \
            xdotool \
            x11-utils \
            zip \
            unzip \
            file

      - name: Verify Linux build environment
        shell: bash
        run: |
          set -euo pipefail

          gcc --version
          g++ --version
          make --version
          pkg-config --version

          # v1.10.1: the Qt host toolchain replaces the GTK/WebKit stack.
          command -v cmake
          cmake --version | head -1

          command -v zip
          command -v unzip
          command -v file

      - name: Synchronize release metadata
        shell: bash
        run: node scripts/release-version.mjs

      # v1.3.2: the ONE canonical cross-platform verification — the bash
      # greps this job previously carried (a second divergent copy of the
      # release semantics) are gone. See scripts/release-version.mjs.
      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail

          node scripts/release-version.mjs --check

      - name: Install frontend dependencies
        shell: bash
        run: npm ci

      - name: Frontend verification
        shell: bash
        run: |
          set -euo pipefail

          npm run typecheck
          npm run lint
          npm run test:units

          # v1.3.2: release-metadata regression suite (semver shapes,
          # drift/missing markers, whitespace/CRLF, --env identity,
          # workflow contract — the run 35542000811 failure class).
          npm run test:release

          # Production build contract: start from a CLEAN dist so no
          # previous-generation asset can survive into web/static.
          rm -rf dist
          npm run build

      - name: Verify embedded frontend
        shell: bash
        run: |
          set -euo pipefail

          test -f web/static/index.html
          grep -q '<div id="root"></div>' web/static/index.html

      # v1.3.1: stable deterministic frontend filenames — no content
      # hashes, every referenced chunk exists, web/static mirrors dist/.
      - name: Verify stable frontend asset contract
        shell: bash
        run: |
          set -euo pipefail

          node scripts/verify-static-assets.mjs --dist

      - name: Setup Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Build the C++ engine BEFORE the Go tests so the Go↔C++ integration
      # suites (internal/native/engine TestRealCppHost*) run against the
      # REAL shtn-engine-host binary instead of skipping. The audit job
      # builds and ctests the engine, but on its own runner/workspace —
      # without this step the boundary tests never actually execute in any
      # Go job. CMake build trees embed absolute paths and are not
      # relocatable across workspaces; this job always configures a clean
      # build directory with --fresh and guards the recorded cache paths
      # before compiling.
      - name: Native engine (C++) build for Go integration tests
        shell: bash
        run: |
          set -euo pipefail

          cmake --version

          # Regression guard: clean configure, no restored cache.
          rm -rf native/engine/build
          cmake -S native/engine -B native/engine/build --fresh

          grep -F "$(pwd)/native/engine/build" native/engine/build/CMakeCache.txt > /dev/null
          grep -F "$(pwd)/native/engine" native/engine/build/CMakeCache.txt > /dev/null

          cmake --build native/engine/build
          ctest --test-dir native/engine/build --output-on-failure

          test -x native/engine/build/shtn-engine-host

      - name: Go verification
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail

          go version

          mkdir -p ci-logs

          # v1.10.6 FAILURE-VISIBILITY: each Go-verification command tees to
          # its own log; the if:failure() follow-ups publish failing test
          # names + tails to $GITHUB_STEP_SUMMARY and upload the full logs.
          # pipefail keeps the gate strict: a failing go test still fails
          # the step through the tee pipeline.
          #
          # v1.10.14-fixed (R2/D17, run #39): FIRST-BYTE CAPTURE — each log
          # exists (empty) BEFORE its command runs. `cmd | tee` on a
          # silent-on-success command (go vet) previously created NO file
          # at all (tee never ran on empty input) and the failure machinery
          # then saw an absent log for a gate that had passed. Each gate
          # also leaves RUN/OK markers in gate-order.txt and ONE green
          # success notice (I17) — a dangling RUN names the gate that
          # never finished.
          : > ci-logs/linux-go-test-headless.log
          echo "RUN go test ./internal/... (headless)" >> ci-logs/gate-order.txt
          go test ./internal/... -tags headless -count=1 2>&1 | tee ci-logs/linux-go-test-headless.log
          echo "OK go test ./internal/... (headless)" >> ci-logs/gate-order.txt
          echo "::notice::gate OK: go test ./internal/... (headless)"

          : > ci-logs/linux-go-test-full.log
          echo "RUN go test ./... (full)" >> ci-logs/gate-order.txt
          go test ./... -run Test -count=1 2>&1 | tee ci-logs/linux-go-test-full.log
          echo "OK go test ./... (full)" >> ci-logs/gate-order.txt
          echo "::notice::gate OK: go test ./... (full)"

          : > ci-logs/linux-go-vet.log
          echo "RUN go vet ./..." >> ci-logs/gate-order.txt
          go vet ./... 2>&1 | tee ci-logs/linux-go-vet.log
          echo "OK go vet ./..." >> ci-logs/gate-order.txt
          echo "::notice::gate OK: go vet ./..."

          # v1.10.7 Wails is REMOVED — the dependency graph must stay
          # free of it. The check asserts ABSENCE (a `go list -m` hit here
          # fails the job).
          if go list -m all 2>/dev/null | grep -q wails; then
            echo "::error::Wails dependency re-entered the module graph"
            exit 1
          fi
          echo "dependency graph: no Wails (verified)"

          # v1.10.7 GOFMT GATE (W-B, run 38731387959 class): hygiene joins
          # the battery as a REQUIRED gate on BOTH platforms. The listing
          # IS the fix list; each violating file is additionally emitted as
          # an anonymously readable ::error:: annotation (capped). No gate
          # is weakened: this grows the battery.
          # v1.10.14-fixed (R2): first-byte capture + gate-order markers.
          echo "RUN gofmt -l ." >> ci-logs/gate-order.txt
          : > ci-logs/linux-gofmt.log
          gofmt_out="$(gofmt -l .)"
          if [ -n "$gofmt_out" ]; then
            printf '%s\n' "$gofmt_out" | tee ci-logs/linux-gofmt.log
            printf '%s\n' "$gofmt_out" | head -8 | sed 's/^/::error::gofmt violation: /'
            echo "::error::gofmt -l . is not clean: $(printf '%s\n' "$gofmt_out" | wc -l) file(s) violate gofmt (log: ci-logs/linux-gofmt.log)"
            exit 1
          fi
          echo "OK gofmt -l ." >> ci-logs/gate-order.txt
          echo "::notice::gate OK: gofmt -l ."
          echo "gofmt: clean"

      # v1.10.15-fixed (R2/D17/I15-I17, run-#41): the run-#41 red — THIS
      # gate died with exit 1 (the step-15 "Process completed with exit
      # code 1" annotation, after the headless gate-OK notice) and its
      # output reached NO annotation and no failure summary: a content-free
      # red, the exact class D17 bans. The gate already carries first-byte
      # logs (linux-go-test-headless/full.log, linux-go-vet.log,
      # linux-gofmt.log) and gate-order RUN/OK markers; the summary below
      # finally READS them: on failure it publishes the suite's real
      # FAIL/compile/vet/panic lines as capped ::error annotations (D1:
      # errors-only, no tail dumps), names any dangling RUN marker as the
      # sub-gate that never finished, and classifies a missing log
      # STARTED-DIED-BEFORE-LOG only when the gate actually started — a
      # stage that never started emits ONE ::notice, never an ::error
      # (I17; the run-#41 false-positive class is retired here too).
      # Report-only: the gate's exit contract above is untouched.
      - name: Go verification failure summary (Linux)
        if: failure()
        shell: bash
        run: |
          set -uo pipefail

          headless_log="ci-logs/linux-go-test-headless.log"
          full_log="ci-logs/linux-go-test-full.log"
          vet_log="ci-logs/linux-go-vet.log"
          gofmt_log="ci-logs/linux-gofmt.log"
          gate_order="ci-logs/gate-order.txt"

          {
            echo "## Go verification FAILED"
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY" || true

          # NEVER-STARTED: the gate's first-byte log does not exist — the
          # Go verification step never ran (the job died upstream). ONE
          # notice; never an ::error (I17).
          if [ ! -f "$headless_log" ]; then
            echo "::notice::Go verification never started — the failure is upstream (the job died before the gate could run)"
            exit 0
          fi

          emitted=0
          emit() {
            if [ "$emitted" -lt 10 ]; then
              msg="$1"
              if [ "${#msg}" -gt 250 ]; then msg="${msg:0:247}"; fi
              printf '::error::%s\n' "$msg"
              emitted=$((emitted + 1))
            fi
          }

          redact() {
            printf '%s' "$1" | sed -E \
              -e 's/(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}/<REDACTED>/g' \
              -e 's/github_pat_[A-Za-z0-9_]{82,}/<REDACTED>/g' \
              -e 's/(AKIA|ASIA)[0-9A-Z]{16}/<REDACTED>/g' \
              -e 's/sk-proj-[A-Za-z0-9_-]{80,}/<REDACTED>/g' \
              -e 's/sk-[A-Za-z0-9]{48}/<REDACTED>/g' \
              -e 's/[Bb]earer [A-Za-z0-9._~-]+/bearer <REDACTED>/g' \
              -e 's/((password|passwd|pwd|token|secret|api[_-]?key)[:=])[^[:space:]]+/\1<REDACTED>/Ig' \
              -e "s#${HOME}#<HOME>#g" \
              -e 's#/tmp/#<TMP>/#g'
          }

          # Publish a log's real error content: failing test names, package
          # compile headers, compile/vet diagnostics, panics — capped,
          # redacted, D1-compliant (errors-only; no tail dumps).
          publish_log() {
            log="$1"
            label="$2"
            [ -f "$log" ] || return 0
            {
              echo ""
              echo "### $label — error lines"
              echo '```'
              grep -aE '^(--- FAIL|FAIL[[:space:]]|FAIL$|panic:|fatal error:|# |\.go:[0-9]+:[0-9]+:)' "$log" 2>/dev/null | head -40 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY" || true
            while IFS= read -r line; do
              emit "$label| $(redact "$(printf '%s' "$line" | cut -c1-200)")"
            done < <(grep -aE '^(--- FAIL|FAIL[[:space:]]|FAIL$|panic:|fatal error:|\.go:[0-9]+:[0-9]+:|# )' "$log" 2>/dev/null | head -6)
          }

          publish_log "$full_log" "go test ./... (full)"
          publish_log "$headless_log" "go test ./internal/... (headless)"
          publish_log "$vet_log" "go vet ./..."

          # gofmt: the gate itself emits per-file ::error annotations when
          # it fails; this summary never duplicates them — a non-empty
          # gofmt log whose OK marker is missing is surfaced as ONE notice
          # pointing at the gate's own annotations.
          if [ -s "$gofmt_log" ] && [ -f "$gate_order" ] \
            && ! grep -q '^OK gofmt -l \.$' "$gate_order"; then
            echo "::notice::gofmt violations were annotated by the gate itself (count: $(wc -l < "$gofmt_log")); full list in the all-logs artifact (all-logs.txt, D21)"
          fi

          # Dangling RUN marker = the sub-gate that never finished. The
          # marker scan runs in a process substitution so `emitted` stays
          # in THIS shell (the house pattern).
          if [ -f "$gate_order" ]; then
            while IFS= read -r marker; do
              [ -n "$marker" ] || continue
              emit "dangling gate marker: sub-gate '$marker' never reached OK — it died before completing (its log is in the all-logs artifact, all-logs.txt)"
            done < <(sed -n 's/^RUN //p' "$gate_order" 2>/dev/null | while IFS= read -r g; do
              grep -q "^OK ${g}\$" "$gate_order" || printf '%s\n' "$g"
            done | head -4)
          fi

          if [ "$emitted" -eq 0 ]; then
            emit "Go verification failed with no FAIL/compile/vet/panic lines captured — the sub-gate verdicts are in ci-logs/gate-order.txt; read the matching logs in the all-logs artifact (all-logs.txt, D21)"
          fi

      # v1.10.14-fixed (R2/D16) PLAYWRIGHT BROWSER CACHE — best-effort:
      # on a hit the chromium download is skipped; on a miss the path is
      # byte-identical to the old green one, only slower (I16). The key
      # is pinned by the lockfile, which pins the Playwright version.
      # The cache itself never gates: actions/cache failures are
      # non-fatal and the install step below still runs unconditionally.
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-ms-playwright-

      - name: Playwright cache hit notice
        if: steps.pwcache.outputs.cache-hit == 'true'
        shell: bash
        run: echo "::notice::Playwright browser cache HIT — chromium restore skipped"

      - name: Playwright cache miss notice
        if: steps.pwcache.outputs.cache-hit != 'true'
        shell: bash
        run: echo "::notice::Playwright browser cache MISS — chromium downloads this run (identical green path)"

      # v1.5.0 (run 36083843376): the E2E fixture generator is a REAL
      # Python program (e2e/make-e2e-model.py → the canonical GGUF writer
      # in native/engine/tests/reference/make_fixture.py) with a REAL
      # third-party dependency: numpy, used for the tensor payload and
      # fp16 K/V semantics. The ubuntu-24.04 system python3 is externally
      # managed (PEP 668) and carries no numpy, so the fixture generation
      # step failed with "python3 required" even though python3 itself
      # existed. GitHub recommends explicitly provisioning the Python
      # version instead of relying on the runner image; the setup-python
      # toolchain is pip-installable, so numpy is provisioned explicitly
      # and the generator is smoke-probed BEFORE the suite runs — a
      # missing dependency must fail HERE, loudly, not inside a test.
      - name: Setup Python 3.13 (E2E fixture generator)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # v1.4.0: the BROWSER E2E GATE (required). The real built frontend
      # + the real headless Go server + the real HTTP API + the real
      # WebSocket + the real session lifecycle + REAL native-engine
      # generation (the C++ host built two steps above, executing the
      # wide-context fixture generated from the canonical fixture
      # writer). This is the layer that proves Chat/Agent actually work
      # as a user drives them; a failure here fails the release.
      - name: Browser E2E (real application stack)
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          # v1.10.14-fixed (R3/D15) FIRST-BYTE CAPTURE: both gate logs are
          # created (empty) at the step's first byte — a failure BEFORE any
          # tee (the pip install / fixture probe below, a toolchain error)
          # still leaves its log behind. run #38's Linux job could only say
          # "E2E produced no build log (the step failed before tee captured
          # output)" — the file did not exist to even be empty (I15).
          mkdir -p ci-logs
          : > ci-logs/e2e-build.log
          : > ci-logs/e2e-playwright.log

          # v1.10.15-fixed (R2/I15-I17): gate-order markers for BOTH stages
          # of this gate. The failure summary below reads them to tell a
          # stage that STARTED (marker written after the first-byte logs)
          # from one that NEVER RAN — the run-#41 guard class is split on
          # exactly this evidence. Green runs get ONE success notice each.
          echo "RUN build:e2e" >> ci-logs/gate-order.txt
          echo "RUN playwright" >> ci-logs/gate-order.txt

          # The fixture generator's dependency is provisioned explicitly
          # (numpy) and proven working before any test executes — the
          # Linux environment is fixed, the fixture is never disabled.
          python3 -m pip install --quiet numpy
          python3 - <<'PY'
          import numpy  # noqa: F401 — the generator's only third-party dep
          print("fixture-generator python OK:", __import__("sys").version)
          PY

          # The frontend is already built and embedded (web/static) by
          # the verification steps above; build the headless server and
          # run the Playwright suite against it.
          #
          # v1.10.8 VISIBILITY 3.0 (V-B, run 38823624040 class): this gate
          # failed as a bare exit code 1 with NO log capture, NO ci-logs
          # trail and NO failure summary — its root cause took a manual
          # reproduction to name. It now gets the same treatment as every
          # other gate: both stages tee to ci-logs, and the if:failure()
          # summary step below publishes failing spec names + error lines
          # as anonymously readable ::error:: annotations. pipefail keeps
          # the gates strict: a failing tee'd command still fails the step.
          mkdir -p ci-logs
          npm run build:e2e 2>&1 | tee ci-logs/e2e-build.log
          echo "OK build:e2e" >> ci-logs/gate-order.txt
          echo "::notice::gate OK: build:e2e"
          npx playwright install chromium --with-deps
          npm run test:e2e 2>&1 | tee ci-logs/e2e-playwright.log
          echo "OK playwright" >> ci-logs/gate-order.txt
          echo "::notice::gate OK: Browser E2E (playwright)"

      # v1.10.8 VISIBILITY 3.0 (V-B): the E2E failure summary — same
      # contract as the Windows Go verification summary. On failure it
      # appends the captured logs' ERROR LINES to $GITHUB_STEP_SUMMARY
      # (public without login; v1.10.13 D1: no tail dumps) and emits
      # capped ::error:: annotations naming the first failing specs and
      # error lines (10-per-step budget; lines truncated; no secrets —
      # rule 7: these logs contain no IPC keys, tokens, runIds,
      # sessionIds or model content). A missing Playwright log means the
      # BUILD stage failed — the summary says so instead of implying the
      # tests ran (the run 38823624040 false-lead class).
      - name: E2E failure summary (Linux)
        if: failure()
        shell: bash
        run: |
          set -uo pipefail

          build_log="ci-logs/e2e-build.log"
          pw_log="ci-logs/e2e-playwright.log"

          {
            echo "## Browser E2E FAILED"
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY" || true

          emitted=0
          emit() {
            if [ "$emitted" -lt 10 ]; then
              msg="$1"
              if [ "${#msg}" -gt 250 ]; then msg="${msg:0:247}..."; fi
              printf '::error::%s\n' "$msg"
              emitted=$((emitted + 1))
            fi
          }

          # v1.10.15-fixed (R2/I17, run-#41 guard-class split): the step
          # creates BOTH logs at its first byte, so an ABSENT build log
          # means the Browser E2E step NEVER RAN — the job died upstream.
          # That class emits ONE ::notice and exits; it must never fire an
          # ::error (run-#41 fired four, including "the build:e2e stage is
          # the failing gate" for a stage that never began — the exact
          # false-lead class D17 bans).
          if [ ! -f "$build_log" ]; then
            echo "::notice::Browser E2E never started — the failure is upstream of the E2E step (read the red step above)"
            exit 0
          fi

          if [ -s "$build_log" ]; then
            # v1.10.13 D1: errors-only — the 200-line tail dump is gone;
            # the build log publishes its build-tool error lines instead.
            {
              echo ""
              echo "### e2e-build.log — build errors"
              echo '```'
              grep -aE '(npm error|error TS[0-9]+|ERROR in |Build failed)' "$build_log" | head -60 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY" || true
          else
            # STARTED-DIED-BEFORE-LOG: the step ran (first byte created
            # this log) but its tee captured not one byte — a toolchain
            # error before output. Named capture defect; never silence
            # (I15/I17).
            emit "gate produced no log — capture defect: ci-logs/e2e-build.log exists but is EMPTY (the build:e2e stage died before its tee wrote a byte)"
          fi

          if [ ! -s "$pw_log" ]; then
            if [ -s "$build_log" ]; then
              # EVIDENCE-GATED claim (I17): the build stage RAN and left
              # content, and Playwright produced nothing — ONLY here is
              # build:e2e the failing gate.
              emit "Browser E2E failed BEFORE Playwright ran — the build:e2e stage is the failing gate (e2e-build.log errors are in the step summary)"
            elif [ -f "$pw_log" ]; then
              emit "gate produced no log — capture defect: ci-logs/e2e-playwright.log exists but is EMPTY (the playwright stage died before its tee wrote a byte)"
            else
              emit "gate produced no log — capture defect: ci-logs/e2e-playwright.log absent at failure time (the playwright stage died before the log was created)"
            fi
          else
            {
              echo ""
              echo "### e2e-playwright.log — failing specs"
              echo '```'
              grep -E '^[[:space:]]*[0-9]+\) ' "$pw_log" | head -10 || true
              grep -E '^[[:space:]]+[0-9]+ (failed|passed|interrupted|skipped)' "$pw_log" | tail -5 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY" || true

            # Capped ::error:: annotations: failing spec names first,
            # then error lines — machine-readable without login. The
            # loops read via process substitution so `emitted` stays in
            # THIS shell (a pipe-fed while would run in a subshell and
            # reset the cap counter between groups).
            while IFS= read -r line; do
              emit "spec| $(printf '%s' "$line" | sed 's/^[[:space:]]*//')"
            done < <(grep -E '^[[:space:]]*[0-9]+\) ' "$pw_log" | head -5)
            while IFS= read -r line; do
              emit "error| $(printf '%s' "$line" | sed 's/^[[:space:]]*//' | cut -c1-200)"
            done < <(grep -E '(Error|TimeoutError|AssertionError):' "$pw_log" | head -5)
            summary_line="$(grep -E '^[[:space:]]+[0-9]+ failed' "$pw_log" | tail -1 | sed 's/^[[:space:]]*//' || true)"
            if [ -n "$summary_line" ]; then
              emit "playwright| $summary_line"
            fi
            if [ "$emitted" -eq 0 ]; then
              emit "Browser E2E failed with no spec/error lines captured — read the e2e-playwright.log tail in the step summary and the all-logs artifact (all-logs.txt, D21)"
            fi
          fi

      # v1.10.14-fixed (R1/D17/I15-I17, run-#41): the run-#40 red — this
      # gate died with exit 1 (46 pass / 1 fail: a stale toolchain pin in
      # the Go release-surface check) and its output reached NO annotation
      # and no failure summary: a content-free red, the exact class D17
      # bans. The gate now plays the FULL capture contract its sibling
      # gates already carry: first-byte log (`: >` before any command),
      # gate-order RUN/OK markers, tee capture, ONE green success notice,
      # and the if:failure() summary step below that publishes the suite's
      # real FAIL/panic lines as ::error annotations. The exit contract is
      # byte-identical: pipefail keeps a failing stress run fatal through
      # the tee pipeline; no assertion weakened, no bound inflated.
      - name: Stress suite
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail

          mkdir -p ci-logs
          : > ci-logs/stress-suite.log
          echo "RUN stress suite" >> ci-logs/gate-order.txt

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o /tmp/sheytan-stress \
            ./scripts/stress-main

          test -x /tmp/sheytan-stress

          /tmp/sheytan-stress stress 2>&1 | tee ci-logs/stress-suite.log

          echo "OK stress suite" >> ci-logs/gate-order.txt
          echo "::notice::gate OK: stress suite"

      # v1.10.14-fixed (R1/D17): the stress gate's failure summary — the
      # run-#40 red reached no annotation because nothing ever read the
      # gate's output. On failure this step publishes the suite's REAL
      # error lines (the FAIL scenario lines, any panic/crash lines, and
      # the STRESS-RESULT verdict) as capped ::error annotations (D1:
      # errors-only, no tail dumps) and mirrors them to
      # $GITHUB_STEP_SUMMARY. A missing or empty log is the named capture
      # defect it would be (I15/I17) — never silence.
      - name: Stress failure summary (Linux)
        if: failure()
        shell: bash
        run: |
          set -uo pipefail

          log="ci-logs/stress-suite.log"

          {
            echo "## Stress suite FAILED"
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY" || true

          emitted=0
          emit() {
            if [ "$emitted" -lt 10 ]; then
              msg="$1"
              if [ "${#msg}" -gt 250 ]; then msg="${msg:0:247}"; fi
              printf '::error::%s\n' "$msg"
              emitted=$((emitted + 1))
            fi
          }

          if [ -s "$log" ]; then
            # The suite's own verdict lines ARE the error content: each
            # FAIL line names the failing scenario and its error.
            while IFS= read -r line; do
              emit "stress| $(printf '%s' "$line" | cut -c1-200)"
            done < <(grep -aE 'FAIL' "$log" | head -5)
            while IFS= read -r line; do
              emit "stress| $(printf '%s' "$line" | cut -c1-200)"
            done < <(grep -aE 'panic:|runtime error' "$log" | head -2)
            while IFS= read -r line; do
              emit "stress| $(printf '%s' "$line" | cut -c1-200)"
            done < <(grep -aE 'STRESS-RESULT' "$log" | head -2)
            if [ "$emitted" -eq 0 ]; then
              emit "stress suite failed with no FAIL/panic/STRESS-RESULT lines captured — the failure is before or between verdict lines; read ci-logs/stress-suite.log in the all-logs artifact"
            fi
          elif [ -f "$log" ]; then
            emit "gate produced no log — capture defect: ci-logs/stress-suite.log exists but is EMPTY (the gate died before its tee wrote a byte; a go-build failure of ./scripts/stress-main is the likely class — its error lines are in the step log)"
          else
            # v1.10.15-fixed (R2/I17, run-#41): the stress gate creates its
            # log at its first byte — an ABSENT log means the step NEVER
            # RAN (the job died upstream; the run-#41 class where this
            # summary fired a capture-defect ::error for a never-started
            # stage). ONE notice; never an ::error (I17).
            echo "::notice::Stress suite never started — the failure is upstream of the stress gate (read the red step above)"
            exit 0
          fi

      - name: Build Linux executable
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail

          # Staging root derives from the canonical LINUX_PKG_ROOT.
          mkdir -p "dist/linux/app/${LINUX_PKG_ROOT}"

          # v1.10.7 (R-B): the core entry moved to cmd/sheytan-local-agent/.
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "dist/linux/app/${LINUX_PKG_ROOT}/SHEYTAN-Local-Agent" \
            ./cmd/sheytan-local-agent

      - name: Verify Linux executable
        shell: bash
        run: |
          set -euo pipefail

          exe="dist/linux/app/${LINUX_PKG_ROOT}/SHEYTAN-Local-Agent"

          test -f "$exe"
          test -x "$exe"

          file "$exe"

          size="$(stat -c '%s' "$exe")"

          if [ "$size" -le 1000000 ]; then
            echo "Linux executable is suspiciously small: $size bytes"
            exit 1
          fi

          echo "Linux executable size: $size bytes"

          set +e
          output="$("$exe" version 2>&1)"
          exit_code=$?
          set -e

          printf '%s\n' "$output"
          echo "=== Linux version command exit code: $exit_code ==="

          if [ "$exit_code" -ne 0 ]; then
            echo "Linux version command exited with $exit_code."
            exit 1
          fi

          grep -Fq \
            "SHEYTAN-Local-Agent v${APP_VERSION}" \
            <<< "$output"

          grep -Eq \
            'os:[[:space:]]+linux/amd64' \
            <<< "$output"

          echo "Linux executable version/platform smoke test passed."

      # v1.9.1 RUNTIME SMOKE — the REAL native desktop binary under a
      # virtual display. Build/version/package steps never prove GUI runtime:
      # this gate launches the desktop executable itself and asserts,
      # STATE-BASED (never sleeps): (1) the process starts and STAYS alive;
      # (2) the GTK4/WebKitGTK runtime initializes far enough for the boot
      # path to complete (the session banner + boot markers land in the
      # isolated data dir's logs/app.log); (3) the backend/runtime
      # initialization ran without a crash report; (4) SIGTERM terminates
      # the process within a bounded window (a wedged GUI loop fails here).
      # Explicit evidence boundary: this proves PROCESS-START + RUNTIME
      # INIT — not real GUI interaction (no click/submit inside the
      # webview); interaction with the same stack is proven by the Browser
      # E2E job against the headless surface of the SAME sources.
      # v1.10.1 QT HOST BUILD (Linux) — the official Qt 6.8 toolchain via
      # aqtinstall (pinned, reproducible, same version as local smoke).
      - name: Setup Qt 6.8.2 (aqtinstall)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet aqtinstall
          python3 -m aqt install-qt linux desktop 6.8.2 linux_gcc_64 -O "$RUNNER_TEMP/qt"
          echo "Qt6_DIR=$RUNNER_TEMP/qt/6.8.2/gcc_64/lib/cmake/Qt6" >> "$GITHUB_ENV"

      - name: Build Qt host (Linux)
        shell: bash
        run: |
          set -euo pipefail

          cmake -S ui/qt -B ui/qt/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR"
          cmake --build ui/qt/build

          test -x ui/qt/build/sheytan-ui
          test -x ui/qt/build/sheytan-ui-acceptance
          # v1.10.13 L-CTEST (run #23): the former
          # `ctest --test-dir ui/qt/build --output-on-failure || true` ran
          # an EMPTY suite — ui/qt/CMakeLists.txt registers no tests (no
          # enable_testing()/add_test()) — and the || true masked even
          # that: a green-fabrication of the W-PIPE class. No test
          # invocation may stand here unless it is both real and strict;
          # the acceptance binary is gated directly, separately and
          # strictly by the "Qt live-answer acceptance" step below, so
          # the empty masked call is removed rather than registered
          # twice.

          cp ui/qt/build/sheytan-ui "dist/linux/app/${LINUX_PKG_ROOT}/sheytan-ui"
          cp ui/qt/build/sheytan-ui-acceptance "$RUNNER_TEMP/sheytan-ui-acceptance"
          # v1.10.3 (R4): stage the UI at the exact path the smoke step
          # passes as UI_BIN — the v1.10.2 workflow passed
          # $RUNNER_TEMP/sheytan-ui without ever copying it there, so the
          # run only survived via the smoke's silent repo-tree fallback.
          cp ui/qt/build/sheytan-ui "$RUNNER_TEMP/sheytan-ui"
          test -x "$RUNNER_TEMP/sheytan-ui"

      # v1.10.1 RUNTIME SMOKE — the REAL launch flow under Xvfb: the core
      # executable (desktop.Run) binds the per-user IPC endpoint, spawns
      # the Qt host, and the smoke asserts (all state-based, bounded):
      # (G1) typed keyed handshake sheytan-ipc/1; (G2) core-spawned Qt
      # host alive; (G3) a REAL visible top-level window owned by the UI
      # pid with plausible geometry (a 1x1 window, a boot banner or mere
      # process survival is NEVER GUI proof — the v1.10.0 Wails failure);
      # (G4) the UI holds the channel + the core serves real API
      # interaction; (G5) a real WM_DELETE_WINDOW close request → clean
      # exit, no orphan process, no leaked endpoint file.
      - name: Qt desktop acceptance smoke (real core + Qt UI under Xvfb)
        shell: bash
        run: |
          set -euo pipefail

          # The Qt host must find its own libraries in the aqt layout.
          export LD_LIBRARY_PATH="$RUNNER_TEMP/qt/6.8.2/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export QT_QPA_PLATFORM_PLUGIN_PATH="$RUNNER_TEMP/qt/6.8.2/gcc_64/plugins/platforms"

          # v1.10.6 (L1, run 38714950052 step 23): Qt Quick cannot create a
          # GL scene-graph context under Xvfb on a headless hosted runner —
          # the classic first-run failure. Force the SOFTWARE renderer for
          # the UI process. The smoke script exports the same defaults; the
          # explicit exports here keep the workflow self-documenting. The
          # UI inherits the core's environment (desktop.Run passes
          # os.Environ() to the Qt child), so these reach the real renderer.
          export QT_QUICK_BACKEND=software
          export QT_OPENGL=software
          export LIBGL_ALWAYS_SOFTWARE=1

          # v1.10.3 (R4): the REAL staged paths. The v1.10.2 step passed
          # CORE_BIN=.../SHEYTAN-LA while the build stages the core as
          # SHEYTAN-Local-Agent (and never staged UI_BIN at all) — both
          # mismatches were masked by the smoke's silent fallbacks, so a
          # green run proved the fallbacks, not the wiring. The explicit
          # existence checks fail loudly BEFORE the smoke can fall back.
          test -x "dist/linux/app/${LINUX_PKG_ROOT}/SHEYTAN-Local-Agent"
          test -x "$RUNNER_TEMP/sheytan-ui"
          SMOKE_WORK="$RUNNER_TEMP/sheytan-qt-smoke" \
          SMOKE_DISPLAY="77" \
          CORE_BIN="dist/linux/app/${LINUX_PKG_ROOT}/SHEYTAN-Local-Agent" \
          UI_BIN="$RUNNER_TEMP/sheytan-ui" \
          XTOOLS="$(command -v xdotool >/dev/null && dirname "$(command -v xdotool)")" \
          XLIBS="" \
          bash scripts/qt-desktop-smoke.sh

      # v1.10.6 FAILURE-VISIBILITY: the smoke's core.log / ui.log /
      # xvfb.log / wm.log / engine.log ERROR LINES are appended to
      # $GITHUB_STEP_SUMMARY (public without login; v1.10.13 D1:
      # errors-only, no tail dumps) and the full logs are uploaded as
      # artifacts. ui.log now EXISTS (the smoke captures the UI's real
      # output), so a red smoke prints real QML/Qt evidence — never an
      # empty file again. No IPC keys: the smoke reads the key from the
      # child environment and never logs it (rule enforced in the script
      # itself).
      #
      # v1.10.7 VISIBILITY 2.0 (V-A): this step ALSO emits ::error::
      # annotations — the failing gate name (the smoke writes a
      # smoke-fail.txt marker on every abort path) plus bounded ui.log /
      # core.log tails — so the next red run is machine-readable via the
      # check-run annotations API without any login. Caps respect the
      # 10-annotations-per-step limit; no secrets (rule 7): these lines
      # already publish to the public step summary.
      - name: Qt smoke failure summary (Linux)
        if: failure()
        shell: bash
        run: |
          work="$RUNNER_TEMP/sheytan-qt-smoke"

          {
            echo "## Qt desktop acceptance smoke FAILED"
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY" || true

          mkdir -p ci-logs

          # v1.10.8 V-A (run 38823624040 false-lead class): when the smoke's
          # work directory does not exist, the smoke NEVER STARTED — the
          # job died upstream (that run failed at Browser E2E and this
          # step was skipped, but a run where the smoke step itself never
          # reached script start emitted a misleading "failed before a
          # gate marker was written" line, sending the next cycle to
          # debug a smoke that never ran). Emit the distinct upstream
          # signal and skip the gate-marker logic entirely.
          if [ ! -d "$work" ]; then
            # v1.10.15-fixed (R2/I17, run-#41): never-started is the NOTICE
            # class — the run-#41 red shipped this line as an ::error and
            # became one of the four false-positive reds on a job whose
            # real gate was Go verification. Same signal, right severity.
            echo "::notice::The Qt smoke never started — the failure is upstream of the smoke"
            {
              echo ""
              echo "The smoke work directory \`$work\` does not exist: the smoke never started."
              echo "The failure is UPSTREAM of the smoke (the job died before the smoke step could run) —"
              echo "read the failing step above; do NOT treat this as a smoke-gate failure."
            } >> "$GITHUB_STEP_SUMMARY" || true
            exit 0
          fi

          for f in "$work"/*.log; do
            [ -f "$f" ] || continue
            base="$(basename "$f")"
            # v1.10.13 D1: errors-only — the 200-line tail dump is gone;
            # each smoke log publishes its capped error lines (QtTest
            # FAIL!/Totals, FATAL/panic, Go FAIL/panic, build-tool errors,
            # assertion failures) with the same pipe/key redaction the
            # Windows summary applies. Source name is the block header.
            {
              echo ""
              echo "### smoke log: $base — error lines"
              echo '```'
              grep -aE '^(FAIL!|FATAL|panic:|fatal error:|--- FAIL|FAIL|ERROR|error:)|: (fatal )?error|assert(ion)? failed|Totals: .*, [1-9][0-9]* failed| FAILED|CMake Error|build stopped|\[FAIL\]' "$f" 2>/dev/null \
                | sed -E 's/\\\\\\.\\pipe\\\S+/\\.\\pipe\<redacted\>/g; s/((key|token|secret|password)[=:])[^ ]*/\1<redacted>/Ig' \
                | head -60 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY" || true
            cp -f "$f" "ci-logs/smoke-$base" 2>/dev/null || true
          done

          # v1.10.14-fixed (R3/D15): the smoke started (its work directory
          # exists) but wrote not one log byte — a named capture defect,
          # never silence (I15).
          if ! compgen -G "$work/*.log" > /dev/null; then
            echo "::error::gate produced no log — capture defect: $work exists but contains no *.log"
          fi

          # v1.10.7 VISIBILITY 2.0: named gate + bounded evidence tails as
          # ::error:: annotations (9 of the 10-per-step budget).
          gate=""
          if [ -f "$work/smoke-fail.txt" ]; then
            gate="$(tail -n 1 "$work/smoke-fail.txt" 2>/dev/null || true)"
          fi
          if [ -n "$gate" ]; then
            echo "::error::$gate"
          else
            echo "::error::Qt desktop acceptance smoke failed before a gate marker was written — read the step summary and the all-logs artifact (all-logs.txt, D21)"
          fi
          if [ -f "$work/ui.log" ]; then
            tail -n 4 "$work/ui.log" 2>/dev/null | tr -d '\r' | cut -c1-200 | sed 's/^/::error::ui.log| /'
          fi
          if [ -f "$work/core.log" ]; then
            tail -n 4 "$work/core.log" 2>/dev/null | tr -d '\r' | cut -c1-200 | sed 's/^/::error::core.log| /'
          fi



      # v1.10.1 LIVE-ANSWER ACCEPTANCE — the QtTest suite drives the REAL
      # Main.qml against the REAL core (offscreen platform for CI): send →
      # ordered live growth with Stop visible → exactly one settle →
      # exactly one persisted assistant reply → reload persistence →
      # repeat send.
      - name: Qt live-answer acceptance (real UI + real core)
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ci-logs
          echo "STEP Qt live-answer acceptance" >> ci-logs/gate-order.txt
          echo "RUN Qt live-answer acceptance" >> ci-logs/gate-order.txt

          export SHEYTAN_REPO="$(pwd)"
          export SHEYTAN_CORE_BIN="$(pwd)/dist/linux/app/${LINUX_PKG_ROOT}/SHEYTAN-Local-Agent"
          # v1.10.13 L-QPA (run #23, exit 134 = SIGABRT with zero FAIL
          # lines): the W-UIBIN deletion hunk removed BOTH exports in one
          # touch — the dead SHEYTAN_UI_BIN AND the LIVE platform export
          # beside it. A QTEST_MAIN/QGuiApplication binary on a headless
          # runner without QT_QPA_PLATFORM selects xcb, dies on the
          # no-display qFatal and aborts before a single test function
          # runs. Run #1 is the proof: with this export present the Linux
          # acceptance RAN and exited 2 — real failures, not a crash.
          export QT_QPA_PLATFORM=offscreen
          # v1.10.13 T-INTEGRITY: load-bearing for the qmlLoadsCleanly
          # slot — the software scene graph renders without a GL context
          # under offscreen (the same env the smoke step pins below).
          export QT_QUICK_BACKEND=software
          # v1.10.13 D1: SHEYTAN_UI_BIN stays deleted — dead config (Q_UNUSED
          # in the acceptance harness); same touch as the Windows pin removal.
          export LD_LIBRARY_PATH="$RUNNER_TEMP/qt/6.8.2/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export QT_QPA_PLATFORM_PLUGIN_PATH="$RUNNER_TEMP/qt/6.8.2/gcc_64/plugins/platforms"

          # v1.10.13 D3: the trailing `|| true` ran true on a failed binary
          # (pipefail), resetting PIPESTATUS to 0 and recording a FAILED
          # acceptance as gate OK — a green-fabrication hazard. The exit is
          # now read before errexit is re-enabled.
          # v1.10.13 R-UNBUF: stdbuf -o0 keeps QtTest's piped stdout
          # line-flushed so an abort can no longer erase the FAIL evidence
          # already written, and stderr is captured SEPARATELY in
          # linux-qt-acceptance.err.log — an abort's glibc/qFatal message
          # (the run-#23 class that died with zero FAIL lines) now lands in
          # its own durable file and is named by the failure summary below.
          set +e
          # v1.10.13 LINUX-REPORT (I5): QtTest writes its OWN report
          # file, independent of native stdout/stderr — the record of
          # record on any exit; an empty report on a nonzero exit is
          # an instrumentation failure, named, not tolerated.
          stdbuf -o0 -e0 "$RUNNER_TEMP/sheytan-ui-acceptance" \
            -o ci-logs/linux-qt-acceptance-report.txt,txt \
            2> ci-logs/linux-qt-acceptance.err.log \
            | tee ci-logs/linux-qt-acceptance.log
          accExit=${PIPESTATUS[0]}
          set -e
          if [ "$accExit" -ne 0 ]; then
            echo "FAIL Qt live-answer acceptance" >> ci-logs/gate-order.txt
            if [ ! -s ci-logs/linux-qt-acceptance.log ] && [ ! -s ci-logs/linux-qt-acceptance.err.log ]; then
              echo "acceptance output captures were empty (stdout AND stderr zero-length) — the binary exited $accExit with no captured output" >> ci-logs/linux-qt-acceptance.log
            fi
            # v1.10.13 LINUX-REPORT: the report file is the record of
            # record (I5) — a nonzero exit with a missing or empty report
            # is an instrumentation failure, named, not tolerated.
            if [ ! -s ci-logs/linux-qt-acceptance-report.txt ]; then
              echo "acceptance instrumentation failure: the QtTest -o report (ci-logs/linux-qt-acceptance-report.txt) is missing or empty on a nonzero exit ($accExit) — stdout/stderr are diagnostics, never the only record" >> ci-logs/linux-qt-acceptance.log
            fi
            # The exit-code contract, into the log itself so the summary
            # and the gate tail carry it to the anonymous reader.
            echo "acceptance exit code $accExit (QTEST_MAIN contract: exit == the number of failed test functions, capped at 127; 0 = all passed; 134 = killed by SIGABRT, a crash class)" >> ci-logs/linux-qt-acceptance.log
            echo "::error::Qt live-answer acceptance failed with exit code $accExit (log: ci-logs/linux-qt-acceptance.log)"
            exit $accExit
          fi
          # v1.10.13 LINUX-REPORT: on a GREEN exit the report must still
          # exist (I5); a missing green report is named, non-fatal.
          if [ ! -s ci-logs/linux-qt-acceptance-report.txt ]; then
            echo "acceptance instrumentation failure: the QtTest -o report (ci-logs/linux-qt-acceptance-report.txt) is missing or empty on a ZERO exit — named, non-fatal" >> ci-logs/linux-qt-acceptance.log
            echo "::warning::Qt acceptance report missing/empty on exit 0 (instrumentation failure named)"
          fi
          echo "OK Qt live-answer acceptance" >> ci-logs/gate-order.txt

      # v1.10.13 LINUX-REPORT (I5): the QtTest -o report is the record
      # of record — it is still written on EVERY attempt (green or red).
      # v1.10.14-fixed (D21/I18, run-#41 R2): its dedicated upload folded
      # into the job's ONE log part below — the report rides inside
      # all-logs.txt, so an anonymous reader still gets the named slots,
      # assertions and line numbers on any exit.

      # v1.10.14-fixed (D21/I18, run-#41 R2): the Linux job's three
      # per-class log uploads (the all-outcomes ci-logs set, the
      # failure-gated verification logs and the Qt acceptance report)
      # fold into the ONE part built by this job's LAST step below (after
      # Run summary, so the part carries the complete gate chain). The
      # E2E logs, the gofmt/vet/stress first-byte logs and the full gate
      # chain all ride this one part, green or red.

      - name: Qt acceptance failure summary (Linux)
        if: failure()
        shell: bash
        run: |
          set -uo pipefail

          # v1.10.13 D2: the script's opening brace block carried a literal
          # backslash-n where the { opener belongs — bash executed it as
          # command-not-found and the step exited 127 (run 39115765789,
          # step 27). Rewritten cleanly, with the upstream branch added:
          # when the acceptance gate never started, the summary says so
          # instead of implying the acceptance ran.
          {
            echo "## Qt live-answer acceptance FAILED"
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "Full evidence artifact: ${LINUX_PKG_ROOT}-v${APP_VERSION}-all-logs (all-logs.txt — the QtTest -o report, the native log, the stderr capture, all ci-logs and the gate chain; D21)."
          } >> "$GITHUB_STEP_SUMMARY" || true

          # v1.10.13 §9 CI SEVERITY CONTRACT (Task ID 28, R5): classify →
          # dedup → caps → escape → truncate → redact → emit notices →
          # warnings → errors → ONE accounting line.
          #   ::error   — failed assertions, gate failures, crashes, real
          #               capture/report instrumentation failures, compile
          #               errors (priority: assertions/gates → capture →
          #               compile).
          #   ::warning — QWARN log lines (run #28 measured 6 of 19
          #               failure-level annotations as QWARN warnings —
          #               V10) and toolchain warnings; a warning is never
          #               masked into an error and never demotes one.
          #   ::notice  — diagnostic context: the goal/chat-persist dump
          #               lines, QDEBUG/QINFO/QSKIP, and the
          #               "captures were empty" line — C1 CONFIRMED (Qt
          #               Test docs, "-o filename,format" routes ALL
          #               QtTest output into the report file; stdout only
          #               when no -o is given), so empty native captures
          #               beside a non-empty report are documented routing,
          #               not an instrumentation failure.
          # The failing gate itself is never masked (the acceptance step's
          # own ::error names it before this step runs); a green gate never
          # executes this step, so a green run emits no failure
          # annotations. D1 preserved: signal lines only, no tail dumps;
          # full logs stay in the artifacts.

          accLog="ci-logs/linux-qt-acceptance.log"
          accRep="ci-logs/linux-qt-acceptance-report.txt"
          accErr="ci-logs/linux-qt-acceptance.err.log"
          gateOrder="ci-logs/gate-order.txt"
          STEP_NAME="Qt acceptance failure summary (Linux)"
          # v1.10.14-fixed (D21): the full list of captured lines lives in
          # the ONE all-logs artifact — the per-class artifacts are gone.
          FULL_LIST="${LINUX_PKG_ROOT}-v${APP_VERSION}-all-logs (all-logs.txt)"
          ERR_CAP=10; WARN_CAP=10; NOTICE_CAP=10

          # §9 redaction — every emitted and summary line. The COUNTER is
          # maintained in the caller (command substitution would swallow
          # the increment): redact() returns text only.
          redact() {
            printf '%s' "$1" | sed -E \
              -e 's/(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}/<REDACTED>/g' \
              -e 's/github_pat_[A-Za-z0-9_]{82,}/<REDACTED>/g' \
              -e 's/(AKIA|ASIA)[0-9A-Z]{16}/<REDACTED>/g' \
              -e 's/sk-proj-[A-Za-z0-9_-]{80,}/<REDACTED>/g' \
              -e 's/sk-[A-Za-z0-9]{48}/<REDACTED>/g' \
              -e 's/[Bb]earer [A-Za-z0-9._~-]+/bearer <REDACTED>/g' \
              -e 's/((password|passwd|pwd|token|secret|api[_-]?key)[:=])[^[:space:]]+/\1<REDACTED>/Ig' \
              -e "s#${HOME}#<HOME>#g" \
              -e 's#/tmp/#<TMP>/#g'
          }

          # §9 classification (correctly escaped ERE; a literal [ stays a
          # literal bracket). Precedence: error → DUMP-DIAGNOSTIC notice →
          # warning → informational notice. The dump classes (goal … →,
          # chat-persist[, captures-empty) OUTRANK the QWARN rule: a dump
          # line wrapped in a QWARN prefix is diagnostic context (G4), not
          # a real warning — and via §10 the SAME line arrives bare on
          # stderr, where dedup collapses the two copies into one notice.
          errRe='^FAIL!|^--- FAIL|^FAIL[[:space:]]|panic: |fatal error: |^Totals: .*, [1-9][0-9]* failed|QFATAL|^Fatal|^Aborted|terminate called|core dumped|\.go:[0-9]+: |: (fatal )?error( [A-Z0-9]+)?: |CMake Error|^FAILED: |ninja: build stopped|^acceptance (exit code|instrumentation failure)'
          dumpNoticeRe='goal [^ ]+ → |chat-persist\[|^acceptance output captures were empty'
          warnRe='^QWARN|^warning: |W[0-9]{4}: '
          infoNoticeRe='QDEBUG|QINFO|QSKIP'
          errARe='^FAIL!|^--- FAIL|^FAIL[[:space:]]|panic: |fatal error: |^Totals: .*, [1-9][0-9]* failed|QFATAL|^Fatal|^Aborted|terminate called|core dumped'
          errBRe='^acceptance (exit code|instrumentation failure)'

          classify() {
            if printf '%s' "$1" | grep -qE "$errRe"; then echo error
            elif printf '%s' "$1" | grep -qE "$dumpNoticeRe"; then echo notice
            elif printf '%s' "$1" | grep -qE "$warnRe"; then echo warning
            elif printf '%s' "$1" | grep -qE "$infoNoticeRe"; then echo notice
            else echo none; fi
          }

          # §9 dedup normalization: strip ANSI escapes, the QtTest prefix,
          # and the file:line prefix (unless the line starts with
          # FAIL!/QVERIFY/QCOMPARE/QFATAL), collapse whitespace.
          normalize() {
            printf '%s' "$1" \
              | sed -E 's/^[[:space:]]+//' \
              | sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' \
              | sed -E 's/^(QWARN|QDEBUG|QINFO|QFAIL|QSYSTEM)[[:space:]]*:[[:space:]]*[A-Za-z0-9_:]+\(\)[[:space:]]*//' \
              | sed -E '/^(FAIL!|QVERIFY|QCOMPARE|QFATAL)/!s/^[^ :]+:[0-9]+:[[:space:]]*//' \
              | tr -s ' \t' ' ' \
              | sed -E 's/[[:space:]]$//'
          }

          # §9 workflow-command escaping (%→%25, CR→%0D, LF→%0A) and
          # truncation (500 diagnostics / 250 generic, "… [truncated]").
          esc() {
            printf '%s' "$1" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g'
          }
          trunc() {
            awk -v cap="$2" '{ if (length($0) > cap) print substr($0, 1, cap) "… [truncated]"; else print }' <<<"$1"
          }

          ERR_S=0; WARN_S=0; NOTICE_S=0; DUP=0; REDACTED=0
          ERR_A=(); ERR_B=(); ERR_C=(); WARN_L=(); NOTICE_L=()
          declare -A SEEN

          if [ -f "$accLog" ] || [ -f "$accErr" ] || [ -f "$accRep" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              r="$(redact "$line")"
              if [ "$r" != "$line" ]; then REDACTED=$((REDACTED + 1)); fi
              sev="$(classify "$r")"
              [ "$sev" = "none" ] && continue
              key="$sev|$(normalize "$r")"
              if [ -n "${SEEN[$key]+x}" ]; then DUP=$((DUP + 1)); continue; fi
              SEEN[$key]=1
              case "$sev" in
                error)
                  ERR_S=$((ERR_S + 1))
                  if printf '%s' "$r" | grep -qE "$errARe"; then ERR_A+=("$r")
                  elif printf '%s' "$r" | grep -qE "$errBRe"; then ERR_B+=("$r")
                  else ERR_C+=("$r"); fi
                  ;;
                warning) WARN_S=$((WARN_S + 1)); WARN_L+=("$r") ;;
                notice)  NOTICE_S=$((NOTICE_S + 1)); NOTICE_L+=("$r") ;;
              esac
            done < <(cat "$accLog" "$accErr" "$accRep" 2>/dev/null)
          fi

          # The public job summary keeps the FAILING TEST NAMES (uncapped —
          # annotation caps can never hide a failed slot's name) plus the
          # failed Totals line. §9: summary lines are redacted too.
          if [ -f "$accLog" ] || [ -f "$accRep" ]; then
            {
              echo ""
              echo "### linux-qt-acceptance — failing test names"
              echo '```'
              cat "$accLog" "$accErr" "$accRep" 2>/dev/null | grep -aE '^FAIL!|^Totals: .*, [1-9][0-9]* failed' | head -60 | while IFS= read -r sl; do redact "$sl"; echo; done
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY" || true
          fi

          accStarted=false
          if [ -f "$gateOrder" ] && grep -q 'RUN Qt live-answer acceptance' "$gateOrder" 2>/dev/null; then
            accStarted=true
          fi
          if [ "$accStarted" = false ] && [ "$((ERR_S + WARN_S + NOTICE_S))" -eq 0 ]; then
            {
              echo ""
              echo "### Live-answer acceptance: NEVER STARTED"
              echo ""
              echo "No acceptance log and no RUN marker in gate-order.txt — the failure is upstream of the acceptance gate."
            } >> "$GITHUB_STEP_SUMMARY" || true
            printf '::notice::%s\n' "$(esc "linux-qt-acceptance: The live-answer acceptance never started — the failure is upstream (read the red step above)")"
            printf '::notice::ci-summary step=%s errors=0/0 | warnings=0/0 | notices=1/1 | duplicates_removed=0 redacted=%d | full_list=%s\n' "$(esc "$STEP_NAME")" "$REDACTED" "$FULL_LIST"
            exit 0
          fi

          # §9 emission order: notices → warnings → errors → accounting.
          # Caps are per class; the error priority is bucket A (assertions
          # and gate failures) → bucket B (capture/report failures) →
          # bucket C (compile/link errors).
          emit_line() {
            case "$1" in
              notice)  printf '::notice::%s\n'  "$2" ;;
              warning) printf '::warning::%s\n' "$2" ;;
              error)   printf '::error::%s\n'   "$2" ;;
            esac
          }
          NOTICE_EM=0; WARN_EM=0; ERR_EM=0
          for l in "${NOTICE_L[@]}"; do
            [ "$NOTICE_EM" -ge "$NOTICE_CAP" ] && break
            emit_line notice "$(esc "$(trunc "linux-qt-acceptance: $l" 500)")"
            NOTICE_EM=$((NOTICE_EM + 1))
          done
          for l in "${WARN_L[@]}"; do
            [ "$WARN_EM" -ge "$WARN_CAP" ] && break
            emit_line warning "$(esc "$(trunc "linux-qt-acceptance: $l" 250)")"
            WARN_EM=$((WARN_EM + 1))
          done
          for l in "${ERR_A[@]}"; do
            [ "$ERR_EM" -ge "$ERR_CAP" ] && break
            emit_line error "$(esc "$(trunc "linux-qt-acceptance: $l" 250)")"
            ERR_EM=$((ERR_EM + 1))
          done
          for l in "${ERR_B[@]}"; do
            [ "$ERR_EM" -ge "$ERR_CAP" ] && break
            emit_line error "$(esc "$(trunc "linux-qt-acceptance: $l" 250)")"
            ERR_EM=$((ERR_EM + 1))
          done
          for l in "${ERR_C[@]}"; do
            [ "$ERR_EM" -ge "$ERR_CAP" ] && break
            emit_line error "$(esc "$(trunc "linux-qt-acceptance: $l" 250)")"
            ERR_EM=$((ERR_EM + 1))
          done
          if [ "$((ERR_EM + WARN_EM + NOTICE_EM))" -eq 0 ]; then
            emit_line notice "$(esc "linux-qt-acceptance: no classified lines captured — read the step summary and the artifacts")"
            NOTICE_EM=$((NOTICE_EM + 1)); NOTICE_S=$((NOTICE_S + 1))
          fi

          # §9 ONE accounting line per step.
          printf '::notice::ci-summary step=%s errors=%d/%d | warnings=%d/%d | notices=%d/%d | duplicates_removed=%d redacted=%d | full_list=%s\n' \
            "$(esc "$STEP_NAME")" "$ERR_EM" "$ERR_S" "$WARN_EM" "$WARN_S" "$NOTICE_EM" "$NOTICE_S" "$DUP" "$REDACTED" "$FULL_LIST"

      - name: Headless surface runtime smoke (embedded UI + API over HTTP)
        shell: bash
        run: |
          set -euo pipefail

          go build -tags headless -o "$RUNNER_TEMP/sheytan-headless" ./cmd/sheytan-local-agent

          smokeDir="$(mktemp -d)"
          dataDir="$smokeDir/data"
          mkdir -p "$dataDir"

          # Explicit port: the smoke owns the runner, 18790 collides with
          # nothing; the config is the deterministic boot source.
          printf '%s' '{"host":"127.0.0.1","port":18790}' > "$dataDir/config.json"

          SHEYTAN_DATA_DIR="$dataDir" \
            "$RUNNER_TEMP/sheytan-headless" serve --no-browser \
            >"$smokeDir/stdout.log" 2>"$smokeDir/stderr.log" &
          appPid=$!

          cleanup() {
            kill -TERM "$appPid" 2>/dev/null || true
            wait "$appPid" 2>/dev/null || true
          }
          trap cleanup EXIT

          # The serve banner names the bound URL; parse the port from it.
          for _ in $(seq 1 120); do
            if ! kill -0 "$appPid" 2>/dev/null; then
              echo "--- headless server exited during startup ---"
              cat "$smokeDir/stdout.log" "$smokeDir/stderr.log" || true
              exit 1
            fi
            port="$(grep -oE 'http://localhost:[0-9]+' "$smokeDir/stdout.log" | head -1 | grep -oE '[0-9]+$' || true)"
            if [ -n "$port" ]; then break; fi
            sleep 0.5
          done

          if [ -z "$port" ]; then
            echo "--- runtime smoke: the serve banner never named a port ---"
            cat "$smokeDir/stdout.log" "$smokeDir/stderr.log" || true
            exit 1
          fi

          # Event-driven health readiness (bounded).
          healthOk=0
          for _ in $(seq 1 120); do
            body="$(curl -fsS "http://127.0.0.1:${port}/api/health" 2>/dev/null || true)"
            if grep -q '"overall":"ok"' <<<"$body" 2>/dev/null; then
              healthOk=1
              break
            fi
            kill -0 "$appPid" 2>/dev/null || { echo "--- server exited during health wait ---"; cat "$smokeDir/stdout.log" "$smokeDir/stderr.log"; exit 1; }
            sleep 0.5
          done

          if [ "$healthOk" -ne 1 ]; then
            echo "--- runtime smoke: /api/health never reported ok ---"
            exit 1
          fi

          # The EMBEDDED UI is reachable and is the real shell.
          curl -fsS "http://127.0.0.1:${port}/" | grep -Fq '<div id="root"></div>'

          # Model discovery answers (empty list is honest on a runner
          # without models — the endpoint must exist and answer).
          curl -fsS "http://127.0.0.1:${port}/api/models" >/dev/null

          echo "--- headless surface: embedded UI + health + model discovery verified ---"

          kill -TERM "$appPid"
          shutdownOk=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$appPid" 2>/dev/null; then
              shutdownOk=1
              break
            fi
            sleep 0.5
          done

          if [ "$shutdownOk" -ne 1 ]; then
            echo "--- runtime smoke: headless server did not exit after SIGTERM ---"
            exit 1
          fi

          wait "$appPid" 2>/dev/null || true
          trap - EXIT

          echo "Headless-surface RUNTIME SMOKE passed: process-start, embedded UI, backend health, model discovery, clean shutdown."

      - name: Prepare Linux portable package
        shell: bash
        run: |
          set -euo pipefail

          # Canonical package root — the same single value controls
          # staging, ZIP creation, ZIP verification and artifact naming.
          root="dist/linux/app/${LINUX_PKG_ROOT}"

          mkdir -p \
            "$root/models" \
            "$root/workspace"

          cat > "$root/README.txt" <<EOF
          SHEYTAN-LA ${APP_VERSION}

          Portable Linux x64 distribution.

          Keep the complete SHEYTAN-LA folder together.
          EOF

          cat > "$root/models/README.txt" <<EOF
          LOCAL MODELS

          Place GGUF models in this folder.
          EOF

          cat > "$root/workspace/README.txt" <<EOF
          CODING LAB

          Portable Coding Lab workspaces live under this folder.
          EOF

          cat > "$root/BUILD-INFO.txt" <<EOF
          SHEYTAN-Local-Agent
          Version: ${APP_VERSION}
          Platform: Linux x64
          Commit: ${GITHUB_SHA}
          EOF

          if [ -f LICENSE.md ]; then
            cp LICENSE.md "$root/LICENSE.md"
          fi

          if [ -f README.md ]; then
            cp README.md "$root/README.md"
          fi

          if [ -f agent.md ]; then
            cp agent.md "$root/AI-CONTEXT.md"
          fi

          if [ -f SIGNATURE ]; then
            cp SIGNATURE "$root/SIGNATURE"
          fi

      - name: Verify Linux package contents before ZIP
        shell: bash
        run: |
          set -euo pipefail

          root="dist/linux/app/${LINUX_PKG_ROOT}"

          test -f "$root/SHEYTAN-Local-Agent"
          test -x "$root/SHEYTAN-Local-Agent"
          test -f "$root/README.txt"
          test -f "$root/BUILD-INFO.txt"
          test -f "$root/models/README.txt"
          test -f "$root/workspace/README.txt"

          if [ -f LICENSE.md ]; then
            test -f "$root/LICENSE.md"
          fi

          if [ -f README.md ]; then
            test -f "$root/README.md"
          fi

          if [ -f agent.md ]; then
            test -f "$root/AI-CONTEXT.md"
          fi

          if [ -f SIGNATURE ]; then
            test -f "$root/SIGNATURE"
          fi

          echo "Linux package content verification passed."

      - name: Create Linux ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          zip="dist/${LINUX_PKG_ROOT}-v${APP_VERSION}-linux-x64.zip"

          rm -f "$zip"

          (
            cd dist/linux/app
            zip -r -9 "../../../$zip" "${LINUX_PKG_ROOT}"
          )

          test -f "$zip"
          test -s "$zip"

      # Every expected entry derives from the ONE canonical
      # LINUX_PKG_ROOT variable that also staged and zipped the
      # application — a root mismatch is structurally impossible, and the
      # verifier is strict (version-checked BUILD-INFO content on top of
      # the entry list).
      - name: Verify Linux ZIP
        shell: bash
        run: |
          set -euo pipefail

          zip="dist/${LINUX_PKG_ROOT}-v${APP_VERSION}-linux-x64.zip"

          test -f "$zip"
          test -s "$zip"

          unzip -t "$zip" >/dev/null

          entries="$(unzip -Z1 "$zip")"

          # Every expected entry references the canonical root DIRECTLY
          # (no intermediate aliases): the stress gate pins these exact
          # spellings so the verifier provably derives from
          # LINUX_PKG_ROOT — the same variable that staged and zipped.
          grep -Fxq \
            "${LINUX_PKG_ROOT}/SHEYTAN-Local-Agent" \
            <<< "$entries"

          grep -Fxq \
            "${LINUX_PKG_ROOT}/README.txt" \
            <<< "$entries"

          grep -Fxq \
            "${LINUX_PKG_ROOT}/BUILD-INFO.txt" \
            <<< "$entries"

          grep -Fxq \
            "${LINUX_PKG_ROOT}/models/README.txt" \
            <<< "$entries"

          grep -Fxq \
            "${LINUX_PKG_ROOT}/workspace/README.txt" \
            <<< "$entries"

          if [ -f LICENSE.md ]; then
            grep -Fxq \
              "${LINUX_PKG_ROOT}/LICENSE.md" \
              <<< "$entries"
          fi

          if [ -f README.md ]; then
            grep -Fxq \
              "${LINUX_PKG_ROOT}/README.md" \
              <<< "$entries"
          fi

          if [ -f agent.md ]; then
            grep -Fxq \
              "${LINUX_PKG_ROOT}/AI-CONTEXT.md" \
              <<< "$entries"
          fi

          if [ -f SIGNATURE ]; then
            grep -Fxq \
              "${LINUX_PKG_ROOT}/SIGNATURE" \
              <<< "$entries"
          fi

          # In-package release metadata must carry the resolved identity.
          grep -Fq "Version: ${APP_VERSION}" \
            <(unzip -p "$zip" "${LINUX_PKG_ROOT}/BUILD-INFO.txt")

          echo "Linux ZIP integrity and content verification passed."

      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.LINUX_PKG_ROOT }}-v${{ env.APP_VERSION }}-linux-x64
          path: dist/${{ env.LINUX_PKG_ROOT }}-v${{ env.APP_VERSION }}-linux-x64.zip
          if-no-files-found: error
          retention-days: 30

      # v1.10.14-fixed (D21/I18, run-#41 R2): the failure-gated
      # linux-verification-logs upload folded into the job's ONE log part
      # above (built on EVERY outcome, so the failure-gated class is
      # strictly subsumed).

      # v1.10.14-fixed (D7, D1-compliant): ONE run-summary per job — the
      # publicly visible $GITHUB_STEP_SUMMARY table: version, the packaged
      # artifact with its size, the gate chain from gate-order.txt. Tables,
      # not dumps; a missing artifact prints "absent" (never fails the job).
      - name: Run summary (Linux)
        if: always()
        shell: bash
        run: |
          {
            echo "## SHEYTAN-LA build summary"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Version | ${APP_VERSION} |"
            echo "| Linux ZIP | ${LINUX_PKG_ROOT}-v${APP_VERSION}-linux-x64.zip |"
            echo ""
            echo "| Artifact | Size |"
            echo "| --- | --- |"
            zip_path="dist/${LINUX_PKG_ROOT}-v${APP_VERSION}-linux-x64.zip"
            if test -f "$zip_path"; then
              sz="$(stat -c%s "$zip_path")"
              mb="$(awk -v s="$sz" 'BEGIN { printf "%.2f", s / 1048576 }')"
              echo "| Linux ZIP | ${mb} MB |"
            else
              echo "| Linux ZIP | absent |"
            fi
            echo ""
            echo "| Gate chain (ci-logs/gate-order.txt) |"
            echo "| --- |"
            if test -f ci-logs/gate-order.txt; then
              while IFS= read -r gate; do
                test -n "$gate" && echo "| $gate |"
              done < ci-logs/gate-order.txt
            else
              echo "| (gate-order.txt not yet written) |"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "OK run summary (Linux)" >> ci-logs/gate-order.txt

      # v1.10.14-fixed (D21/I18, run-#41 R2): the Linux job's ONE log
      # part — built on EVERY outcome as the job's LAST step, after Run
      # summary, so the part carries the complete gate chain. The three
      # per-class log uploads this replaces (all-outcomes ci-logs,
      # failure-gated verification logs, Qt acceptance report) are
      # strictly subsumed: every ci-logs file rides with per-file headers.
      - name: Build Linux log part (all outcomes)
        if: always()
        shell: bash
        env:
          JOB_OUTCOME: ${{ job.status }}
        run: |
          set -uo pipefail
          mkdir -p log-parts
          part="log-parts/build-linux-logs-part-${GITHUB_RUN_ATTEMPT}.txt"
          {
            echo "job: build-linux"
            echo "attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "outcome: ${JOB_OUTCOME}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$part"
          for f in ci-logs/*; do
            [ -f "$f" ] || continue
            {
              echo "----- 8< ----- $(basename "$f") -----"
              cat "$f"
              echo ""
            } >> "$part"
          done
          files="$(find ci-logs -maxdepth 1 -type f 2>/dev/null | wc -l)"
          echo "ci-summary job=build-linux outcome=${JOB_OUTCOME} log-files=${files} part=$(basename "$part")" >> "$part"
          echo "Linux log part built: $part ($(wc -c < "$part") bytes)"

      - name: Upload Linux log part (all outcomes)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-linux-logs-part-attempt${{ github.run_attempt }}
          path: log-parts/build-linux-logs-part-*.txt
          if-no-files-found: error
          retention-days: 1

  # v1.10.14-fixed (D21/I18, run-#41 R2) CONSOLIDATE-LOGS — the ONE log
  # artifact. Downloads every job's <job>-logs-part-attempt<N> part,
  # merges them deterministically (fixed job order, per-section job /
  # outcome headers) via scripts/consolidate-logs.mjs, uploads the single
  # SHEYTAN-LA-v1.10.14-all-logs artifact containing exactly one file
  # (all-logs.txt), then deletes the intermediate parts via the Artifacts
  # API. Runs on EVERY outcome: a red run needs its one log the most. A
  # missing part is a named instrumentation failure (the merge names the
  # section and fails the job) — never silence (I15/I17/I18).
  consolidate-logs:
    name: Consolidate logs (one artifact)
    needs: [preflight, audit, build-windows, build-linux]
    if: always()
    timeout-minutes: 10
    runs-on: ubuntu-24.04

    # actions: write is required to delete the intermediate part
    # artifacts; contents: read covers the checkout. Job-level grant —
    # the top-level block keeps contents: read only.
    permissions:
      contents: read
      actions: write

    # Identity flows from the audit job's runtime resolution of
    # package.json — the all-logs artifact name is part of the ONE
    # naming map (I11): ${WIN_PKG_ROOT}-v${APP_VERSION}-all-logs.
    env:
      APP_VERSION: ${{ needs.audit.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download all log parts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-logs-part-attempt*"
          merge-multiple: true
          path: parts/

      - name: Consolidate into all-logs.txt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p all-logs
          # The deterministic merge: fixed job order, per-section headers
          # (job, outcome, attempt, source), one accounting line per
          # input, and a named MISSING PART section for any absent part
          # (exit 1 — a named instrumentation failure, I18).
          node scripts/consolidate-logs.mjs \
            --parts parts \
            --out all-logs/all-logs.txt

      - name: Upload the ONE log artifact (all outcomes)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WIN_PKG_ROOT }}-v${{ env.APP_VERSION }}-all-logs
          path: all-logs/all-logs.txt
          if-no-files-found: error
          retention-days: 30

      # v1.10.14-fixed (D21): the intermediate parts are deleted in-run —
      # the run's FINAL artifact state is exactly ONE log artifact (plus
      # the product artifacts). If the API/permission path fails, the
      # deviation is recorded as a warning (never silenced, never a job
      # failure — the parts already carry retention-days: 1, which bounds
      # their exposure to a single day).
      - name: Delete intermediate log parts (D21)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          deleted=0
          unresolved=0
          for part in preflight audit build-windows build-linux; do
            name="${part}-logs-part-attempt${GITHUB_RUN_ATTEMPT}"
            id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}" --jq '.artifacts[0].id // empty' 2>/dev/null || true)"
            if [ -n "$id" ]; then
              if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" 2>/dev/null; then
                deleted=$((deleted + 1))
              else
                unresolved=$((unresolved + 1))
                echo "::warning::part deletion failed for ${name} (API/permission) — retention-days: 1 bounds its exposure (D21 fallback recorded)"
              fi
            else
              unresolved=$((unresolved + 1))
              echo "::warning::part artifact ${name} not found for deletion (already absent or never uploaded — recorded, not silenced)"
            fi
          done
          echo "part deletion accounting: deleted=${deleted} unresolved=${unresolved}"
          echo "::notice::ci-summary step=part-deletion deleted=${deleted} unresolved=${unresolved} | final state: ONE log artifact (D21)"

  release:
    name: Publish and verify ${{ github.ref_name }}
    needs:
      - build-windows
      - build-linux
      - audit
    timeout-minutes: 20

    # The release job consumes the audit job's runtime-resolved identity
    # (package.json) — it needs no checkout to verify the tag.
    env:
      APP_VERSION: ${{ needs.audit.outputs.version }}

    # Version-agnostic gate — the job runs for any v* tag and the first
    # step verifies the tag equals v${APP_VERSION}. A hardcoded tag would
    # silently skip the release job on every version bump until someone
    # remembered to edit this file.
    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail

          test "${GITHUB_REF_NAME}" = "v${APP_VERSION}"

          echo "Release tag verified: ${GITHUB_REF_NAME}"

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.WIN_PKG_ROOT }}-v${{ env.APP_VERSION }}-windows-x64
          path: dist/windows

      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.WIN_PKG_ROOT }}-v${{ env.APP_VERSION }}-windows-x64-installer
          path: dist/installer

      - name: Download Linux package
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.LINUX_PKG_ROOT }}-v${{ env.APP_VERSION }}-linux-x64
          path: dist/linux

      - name: Verify release ZIP payloads
        shell: bash
        run: |
          set -euo pipefail

          # Artifact names derive from the canonical roots.
          windows_zip_name="${WIN_PKG_ROOT}-v${APP_VERSION}-windows-x64.zip"
          linux_zip_name="${LINUX_PKG_ROOT}-v${APP_VERSION}-linux-x64.zip"
          installer_name="${WIN_PKG_ROOT}-v${APP_VERSION}-windows-x64-installer.exe"

          windows="$(find dist/windows -type f -name "$windows_zip_name" -print -quit)"
          linux="$(find dist/linux -type f -name "$linux_zip_name" -print -quit)"
          installer="$(find dist/installer -type f -name "$installer_name" -print -quit)"

          test -n "$windows"
          test -n "$linux"
          test -n "$installer"

          test -f "$windows"
          test -f "$linux"
          test -f "$installer"

          test -s "$windows"
          test -s "$linux"
          test -s "$installer"

          echo "Found Windows ZIP: $windows"
          echo "Found Linux ZIP:   $linux"
          echo "Found installer:   $installer"

          unzip -t "$windows" >/dev/null
          unzip -t "$linux" >/dev/null

          windows_entries="$(unzip -Z1 "$windows")"
          linux_entries="$(unzip -Z1 "$linux")"

          win_root="${WIN_PKG_ROOT}"
          linux_root="${LINUX_PKG_ROOT}"

          grep -Fxq \
            "${win_root}/SHEYTAN-LA.exe" \
            <<< "$windows_entries"

          grep -Fxq \
            "${win_root}/README.txt" \
            <<< "$windows_entries"

          grep -Fxq \
            "${win_root}/BUILD-INFO.txt" \
            <<< "$windows_entries"

          grep -Fxq \
            "${win_root}/models/README.txt" \
            <<< "$windows_entries"

          grep -Fxq \
            "${win_root}/workspace/README.txt" \
            <<< "$windows_entries"

          grep -Fxq \
            "${linux_root}/SHEYTAN-Local-Agent" \
            <<< "$linux_entries"

          grep -Fxq \
            "${linux_root}/README.txt" \
            <<< "$linux_entries"

          grep -Fxq \
            "${linux_root}/BUILD-INFO.txt" \
            <<< "$linux_entries"

          grep -Fxq \
            "${linux_root}/models/README.txt" \
            <<< "$linux_entries"

          grep -Fxq \
            "${linux_root}/workspace/README.txt" \
            <<< "$linux_entries"

          if grep -Fxq \
            "${win_root}/LICENSE.md" \
            <<< "$windows_entries"; then
            echo "Windows LICENSE.md present."
          fi

          if grep -Fxq \
            "${win_root}/README.md" \
            <<< "$windows_entries"; then
            echo "Windows README.md present."
          fi

          if grep -Fxq \
            "${win_root}/AI-CONTEXT.md" \
            <<< "$windows_entries"; then
            echo "Windows AI-CONTEXT.md present."
          fi

          if grep -Fxq \
            "${win_root}/SIGNATURE" \
            <<< "$windows_entries"; then
            echo "Windows SIGNATURE present."
          fi

          if grep -Fxq \
            "${linux_root}/LICENSE.md" \
            <<< "$linux_entries"; then
            echo "Linux LICENSE.md present."
          fi

          if grep -Fxq \
            "${linux_root}/README.md" \
            <<< "$linux_entries"; then
            echo "Linux README.md present."
          fi

          if grep -Fxq \
            "${linux_root}/AI-CONTEXT.md" \
            <<< "$linux_entries"; then
            echo "Linux AI-CONTEXT.md present."
          fi

          if grep -Fxq \
            "${linux_root}/SIGNATURE" \
            <<< "$linux_entries"; then
            echo "Linux SIGNATURE present."
          fi

          # Installer must be a real PE executable (MZ header), non-trivial.
          installer_head="$(head -c 2 "$installer")"
          test "$installer_head" = "MZ"

          echo "WINDOWS_ZIP=$windows" >> "$GITHUB_ENV"
          echo "LINUX_ZIP=$linux" >> "$GITHUB_ENV"
          echo "INSTALLER=$installer" >> "$GITHUB_ENV"

          echo "Release payload verification passed."

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail

          # v1.10.13 P-SUMS: ONE deterministic SHA256SUMS.txt naming ALL
          # THREE published assets, computed from the artifacts' actual
          # locations. The former step cd'd into the Windows ZIP's
          # directory and hashed the installer by bare basename — but the
          # installer artifact downloads into dist/installer/, so that
          # operand did not resolve there (an outright `set -e` failure
          # class); and the trailing `mv dist/SHA256SUMS.txt …` would in
          # any case have published a file carrying only the Linux line,
          # stranding the Windows checksums in dist/windows/. The sums
          # file is now written once at one deterministic location and
          # asserted to carry exactly the three published asset names
          # before the release step runs.
          sums="SHA256SUMS.txt"
          : > "$sums"
          for artifact in "$WINDOWS_ZIP" "$INSTALLER" "$LINUX_ZIP"; do
            test -n "$artifact"
            test -f "$artifact"
            ( cd "$(dirname "$artifact")" && sha256sum "$(basename "$artifact")" ) >> "$sums"
          done

          test -s "$sums"
          test "$(wc -l < "$sums")" -eq 3
          awk -v a="$(basename "$WINDOWS_ZIP")" \
              -v b="$(basename "$INSTALLER")" \
              -v c="$(basename "$LINUX_ZIP")" \
              'NF >= 2 { name[$NF]++; total++ }
               END { exit !(total == 3 && name[a] == 1 && name[b] == 1 && name[c] == 1) }' \
            "$sums" || { echo "::error::SHA256SUMS.txt does not name exactly the three published assets"; exit 1; }

          cat "$sums"

      - name: Generate release manifest
        shell: bash
        run: |
          set -euo pipefail

          # The update manifest is the authoritative machine-readable release
          # source consumed by the app's updater (internal/updater/appupdate).
          win_zip="$(basename "$WINDOWS_ZIP")"
          win_inst="$(basename "$INSTALLER")"

          win_zip_sha="$(sha256sum "$WINDOWS_ZIP" | cut -d' ' -f1)"
          win_inst_sha="$(sha256sum "$INSTALLER" | cut -d' ' -f1)"

          tag_base="${APP_VERSION}"

          cat > release-manifest.json <<EOF
          {
            "version": "${tag_base}",
            "channel": "stable",
            "notes": "SHEYTAN-LA ${tag_base} — unified product release",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x64": {
                "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${tag_base}/${win_inst}",
                "sha256": "${win_inst_sha}",
                "kind": "installer"
              }
            },
            "artifacts": {
              "windows-x64-zip": {
                "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${tag_base}/${win_zip}",
                "sha256": "${win_zip_sha}",
                "kind": "zip"
              }
            }
          }
          EOF

          python3 -m json.tool release-manifest.json >/dev/null
          echo "release-manifest.json generated and validated."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          # v1.10.14-fixed (D7): the title carries the product prefix —
          # "SHEYTAN-LA v{APP_VERSION}". This SUPERSEDES the v1.3.3
          # bare-version title rule ("the title is the PLAIN canonical
          # version"): the release page is a product surface now, and the
          # verify step below asserts the same prefixed identity in
          # lockstep. The tag itself stays "v{APP_VERSION}".
          name: SHEYTAN-LA v${{ env.APP_VERSION }}
          # v1.10.14-fixed (D7): a structured release body replaces the
          # bare auto-notes — product header, what's new, install links,
          # verification summary. Fixed strings + APP_VERSION only.
          body: |
            SHEYTAN-LA v${{ env.APP_VERSION }} — the local agent, one product, one payload.

            ## What's new in v${{ env.APP_VERSION }}

            - Uninstall symmetry is now compile-proven: the generated
              uninstall list defines its own guard symbol, the NSIS include
              is asserted in the build log, and the silent-uninstall smoke
              names exactly what survived if it ever fails again.
            - Run-phase error catcher: a desktop interface that closes
              unexpectedly mid-session now logs a named ERROR line and
              shows a message box with the reason and the log path — no
              silent exits, boot or run.
            - Publishing visuals: one naming map for every artifact and
              asset, a titled release page with structured notes, and
              binaries exposed on red runs.

            ## Install

            - Windows: download SHEYTAN-LA-v${{ env.APP_VERSION }}-windows-x64-installer.exe
              (or the portable SHEYTAN-LA-v${{ env.APP_VERSION }}-windows-x64.zip).
            - Linux: download SHEYTAN-LA-v${{ env.APP_VERSION }}-linux-x64.zip.

            ## Verification

            - SHA256SUMS.txt names all three published assets.
            - release-manifest.json is the updater's machine-readable source.
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            ${{ env.WINDOWS_ZIP }}
            ${{ env.INSTALLER }}
            ${{ env.LINUX_ZIP }}
            SHA256SUMS.txt
            release-manifest.json

      - name: Verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          payload="$(
            gh release view \
              "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json tagName,name,isDraft,isPrerelease,assets
          )"

          echo "$payload"

          windows_asset="${WIN_PKG_ROOT}-v${APP_VERSION}-windows-x64.zip"
          linux_asset="${LINUX_PKG_ROOT}-v${APP_VERSION}-linux-x64.zip"
          installer_asset="${WIN_PKG_ROOT}-v${APP_VERSION}-windows-x64-installer.exe"

          echo "$payload" |
            jq -e \
              --arg tag "${GITHUB_REF_NAME}" \
              --arg name "SHEYTAN-LA v${APP_VERSION}" \
              --arg windows "$windows_asset" \
              --arg linux "$linux_asset" \
              --arg installer "$installer_asset" \
              '
                .tagName == $tag and
                .name == $name and
                .isDraft == false and
                .isPrerelease == false and
                ([.assets[].name] | index($windows)) != null and
                ([.assets[].name] | index($linux)) != null and
                ([.assets[].name] | index($installer)) != null and
                ([.assets[].name] | index("SHA256SUMS.txt")) != null and
                ([.assets[].name] | index("release-manifest.json")) != null
              ' \
            >/dev/null

          echo "${GITHUB_REF_NAME} release asset + prefixed title verification passed (SHEYTAN-LA v${APP_VERSION})."
