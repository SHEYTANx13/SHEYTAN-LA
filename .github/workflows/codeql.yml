# v1.11.1 (CodeQL run 43883548572, alerts #185/#186 remediation): external
# action references are IMMUTABLE 40-hex COMMIT PINS with a synced
# release-tag comment (# v7 / # v4) — the repo-wide action-reference
# policy. Mutable tags are rejected by
# internal/releasecontract.ValidateUploadArtifactPins; the single weekly
# Dependabot group updates the pins and keeps the version comments in
# sync. Analysis configuration, manual C++ extraction and SARIF uploads are
# unchanged (SEC-03/SEC-04: no query-suite weakening, no suppressions).
# SHEYTAN-LA: full CodeQL security + quality analysis.
# Each language gets an independent CodeQL database and analysis category.
# Go and C++ use explicit manual builds so CodeQL observes the real compilers.

name: CodeQL Security & Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly analysis also picks up newly released CodeQL queries.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          # GitHub Actions workflow security.
          - language: actions
            build-mode: none

          # Portable C++17 native inference engine.
          - language: cpp
            build-mode: manual

          # Go application core and Fyne desktop UI.
          - language: go
            build-mode: manual

          # Tracked JavaScript and HTML assets; repository has no JS build manifest.
          - language: javascript-typescript
            build-mode: none

          # Python reference-fixture generator.
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Fyne's Linux desktop packages require CGO and native development headers.
      - name: Install Go/Fyne Linux build dependencies
        if: matrix.language == 'go'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
            gcc \
            pkg-config \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxxf86vm-dev \
            libwayland-dev \
            libxkbcommon-dev \
            xorg-dev

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Exact parity with build-desktop.yml and the canonical go.mod
          # toolchain directive (go1.27.4) — one Go patch everywhere.
          go-version: "1.27.4"
          cache: false

      # Run vet before CodeQL initialization. It is a useful quality check, but
      # it is not a compiler build that contributes to the CodeQL database.
      # Keeping it outside the traced build avoids wasting extraction time.
      - name: Vet all Go packages
        if: matrix.language == 'go'
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          go version
          go vet ./...

      - name: Initialize CodeQL
        # v1.11.1 (run 43630164424 repair): the init step carries an explicit
        # id so the analyze step can run EVEN WHEN A LATER MANUAL BUILD STEP
        # FAILS — once the database is initialized, analysis of what was
        # extracted is still valuable diagnostics and the SARIF upload must
        # still happen. The analyze condition below keys off this outcome.
        id: codeql-init
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-and-quality includes default + security-extended + quality queries.
          queries: security-and-quality

      # Manual Go build: compile every Linux package so the Go extractor
      # observes the actual application, with the EXACT CGO/build-tag
      # settings each link graph requires (run 44547031698 §3.2/§3.7;
      # run 44663205241 repair):
      #
      # (a) CGO_ENABLED=1 with -tags nogogpu: the Linux-supported
      #     application graph. The pinned goffi v0.6.8 documents that a
      #     binary containing goffi AND other cgo code (fyne/go-gl,
      #     purego) fails to link on Linux with "unhandled relocation ...
      #     (SDYNIMPORT)" (goffi issue #72; macOS/Windows are unaffected)
      #     - the nogogpu seam excludes the adapter on Linux exactly as
      #     the desktop lane does. REPAIRED (run 44663205241): the
      #     command previously built `./...`, which INCLUDES
      #     cmd/sheytan-renderprobe - the one package that
      #     deliberately imports BOTH stacks (internal/render -> gogpu ->
      #     goffi AND ui/gogui -> go-gui -> purego) in ONE binary, so
      #     under CGO_ENABLED=1 it hits exactly the documented
      #     goffi+other-cgo link failure ("unhandled relocation ...
      #     (SDYNIMPORT) (R_CALL)" for the goffi_dlopen/dlsym/dlerror/
      #     errno_location stubs) and build (a) failed on it. The probe's
      #     DOCUMENTED link configuration is (b) below - CGO_ENABLED=0
      #     with -tags nofakecgo (goffi Workaround A) - which is also how
      #     every platform lane links it (scripts/build/linux.sh). Build
      #     (a) therefore compiles every package of ./... EXCEPT that one
      #     package; build (b) still compiles AND LINKS the probe at its
      #     documented configuration, so no package loses extraction
      #     coverage (the library packages internal/render,
      #     internal/renderboot are still compiled - not linked - by
      #     build (a): goffi archives compile fine under CGO_ENABLED=1,
      #     only the MIXED-STACK link is impossible).
      # (b) CGO_ENABLED=0 with -tags nofakecgo: goffi's documented
      #     Workaround A for the purego+goffi duplicate-_cgo_init link
      #     conflict. cmd/sheytan-renderprobe imports BOTH stacks (Go-Gui
      #     shell + GoGPU render service) in ONE binary - the combined
      #     production-shaped link regression target. This command also
      #     extracts the gogpu/goffi adapter source (internal/render,
      #     internal/renderboot) so no package loses coverage.
      #
      # Failure handling (work order §6.2): the previous handler
      #     grep -m1 -E '"ImportPath|Err"'
      # matched the FIRST metadata line of the JSONL stream (an
      # "ImportPath" line) instead of the build-fail event and its
      # compiler output, so the actual source location disappeared. The
      # handlers now parse the stream with scripts/ci/go-build-jsonl-
      # diagnose.py (JSON events only, full compiler output, first
      # diagnostic path:line:col) while the raw JSONL stays the job's
      # evidence.
      - name: Build all Go packages for CodeQL
        if: matrix.language == 'go'
        shell: bash
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          go env GOTOOLCHAIN
          mapfile -t build_a_packages < <(go list -tags nogogpu ./... | grep -v '^github\.com/SHEYTANx13/SHEYTAN-LA/cmd/sheytan-renderprobe$')
          echo "build (a): CGO_ENABLED=1 -tags nogogpu go build -json (every package of ./... EXCEPT cmd/sheytan-renderprobe, whose documented link configuration is build (b) - goffi v0.6.8 documents the goffi+other-cgo mixed-stack link as impossible on Linux, goffi issue #72)"
          echo "build (a) package count: ${#build_a_packages[@]} (go list ./... minus the renderprobe)"
          CGO_ENABLED=1 go build -json -tags nogogpu "${build_a_packages[@]}" > "$RUNNER_TEMP/codeql-go-build-a.jsonl" || { python3 scripts/ci/go-build-jsonl-diagnose.py "$RUNNER_TEMP/codeql-go-build-a.jsonl" || true; exit 1; }
          echo "build (b): CGO_ENABLED=0 -tags nofakecgo go build -json ./cmd/sheytan-renderprobe (combined go-gui+gogpu link)"
          CGO_ENABLED=0 go build -json -tags nofakecgo -o "$RUNNER_TEMP/sheytan-renderprobe-codeql" ./cmd/sheytan-renderprobe > "$RUNNER_TEMP/codeql-go-build-b.jsonl" || { python3 scripts/ci/go-build-jsonl-diagnose.py "$RUNNER_TEMP/codeql-go-build-b.jsonl" || true; exit 1; }
          python3 scripts/ci/go-build-jsonl-diagnose.py --summary "$RUNNER_TEMP/codeql-go-build-a.jsonl" "$RUNNER_TEMP/codeql-go-build-b.jsonl"
          "$RUNNER_TEMP/sheytan-renderprobe-codeql"

      # Manual C++ build: compile the engine, IPC host, and all native test
      # targets while CodeQL's compiler tracing is active.
      - name: Configure native C++ engine
        if: matrix.language == 'cpp'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native/engine -B "$RUNNER_TEMP/shtn-native-codeql" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSHTN_BUILD_TESTS=ON \
            -DSHTN_BUILD_SHARED=OFF

      - name: Build native C++ engine and tests
        if: matrix.language == 'cpp'
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$RUNNER_TEMP/shtn-native-codeql" --parallel 2

      - name: Run native C++ test suite
        if: matrix.language == 'cpp'
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "$RUNNER_TEMP/shtn-native-codeql" --output-on-failure

      # v1.11.1 (run 43630164424 repair, work order §9.4): analyze runs
      # whenever the CodeQL database was initialized — including after a
      # FAILED manual build step (the default implicit success() would skip
      # it). A partial database still produces SARIF diagnostics; the job's
      # own conclusion stays red from the failed build, so this never turns
      # a failed build green. upload: always is explicit (its documented
      # default): SARIF is uploaded for successful AND failed runs.
      - name: Analyze and upload CodeQL results
        if: ${{ !cancelled() && steps.codeql-init.outcome == 'success' }}
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: always

  # The alert report also runs after red analysis jobs (!cancelled()):
  # partial SARIF inventories are diagnostics, and the report explicitly
  # labels a zero-alert response as "not evidence that every possible
  # defect is absent". A red analyze matrix no longer suppresses the
  # report the way it used to suppress all CodeQL evidence.

  # This report exports the complete alert inventory for the analyzed ref.
  # The Code Scanning API returns alert states (open/fixed/dismissed/closed)
  # without a state filter; pagination ensures that no later pages are omitted.
  export-alert-report:
    name: Export complete CodeQL alert report
    needs: analyze
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Fetch all CodeQL alert pages and generate plain-text report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          command -v gh
          command -v python3

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "${PULL_REQUEST_NUMBER:-}" ]]; then
              echo "::error::Pull request number is unavailable; cannot select the analyzed ref."
              exit 1
            fi
            report_ref="refs/pull/${PULL_REQUEST_NUMBER}/merge"
          else
            report_ref="$GITHUB_REF"
          fi

          echo "Exporting CodeQL alerts for ${GITHUB_REPOSITORY} at ${report_ref}"
          gh api --paginate --slurp --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -f per_page=100 \
            -f tool_name=CodeQL \
            -f ref="$report_ref" \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts" \
            > "$RUNNER_TEMP/code-scanning-alerts-pages.json"

          mkdir -p reports
          export CODEQL_REPORT_REF="$report_ref"
          python3 - "$RUNNER_TEMP/code-scanning-alerts-pages.json" "reports/code-scanning-alerts.txt" <<'PY'
          import json
          import os
          import sys
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          source = Path(sys.argv[1])
          destination = Path(sys.argv[2])

          try:
              pages = json.loads(source.read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(f"Could not parse paginated CodeQL API response: {exc}")

          if not isinstance(pages, list):
              raise SystemExit("Unexpected CodeQL API pagination shape: expected a page array")

          alerts = []
          for page_number, page in enumerate(pages, start=1):
              if page is None:
                  continue
              if not isinstance(page, list):
                  raise SystemExit(f"Unexpected response for API page {page_number}: expected an array")
              alerts.extend(page)

          alert_ids = [alert.get("number") for alert in alerts]
          if any(not isinstance(alert_id, int) for alert_id in alert_ids):
              raise SystemExit("At least one returned alert has no valid numeric alert number")
          if len(alert_ids) != len(set(alert_ids)):
              raise SystemExit("Duplicate alert IDs were returned across pages; refusing an ambiguous report")

          def value_text(value):
              if value is None:
                  return "(not provided)"
              if isinstance(value, (dict, list)):
                  return json.dumps(value, ensure_ascii=False, sort_keys=True)
              text = str(value).strip()
              return text if text else "(not provided)"

          def add_field(lines, label, value):
              text = value_text(value)
              lines.append(f"{label}:")
              for item in text.splitlines() or ["(not provided)"]:
                  lines.append(f"  {item}")

          severity_order = {
              "critical": 0,
              "high": 1,
              "error": 2,
              "medium": 3,
              "warning": 4,
              "low": 5,
              "note": 6,
              "unknown": 7,
          }
          state_order = {"open": 0, "fixed": 1, "dismissed": 2, "closed": 3}

          def sort_key(alert):
              rule = alert.get("rule") or {}
              instance = alert.get("most_recent_instance") or {}
              location = instance.get("location") or {}
              severity = (rule.get("security_severity_level") or rule.get("severity") or "unknown").lower()
              state = (alert.get("state") or "unknown").lower()
              return (
                  state_order.get(state, 9),
                  severity_order.get(severity, 8),
                  str(location.get("path") or ""),
                  int(location.get("start_line") or 0),
                  str(rule.get("id") or ""),
                  alert["number"],
              )

          alerts.sort(key=sort_key)
          states = Counter((alert.get("state") or "unknown").lower() for alert in alerts)
          severities = Counter(
              (alert.get("rule") or {}).get("security_severity_level")
              or (alert.get("rule") or {}).get("severity")
              or "unknown"
              for alert in alerts
          )

          generated = datetime.now(timezone.utc).isoformat(timespec="seconds")
          lines = [
              "SHEYTAN-LA — GITHUB CODEQL SECURITY & QUALITY ALERT REPORT",
              "=" * 72,
              f"Repository: {os.environ.get('GITHUB_REPOSITORY', '(unknown)')}",
              f"Analyzed ref: {os.environ.get('CODEQL_REPORT_REF', '(unknown)')}",
              f"Workflow commit: {os.environ.get('GITHUB_SHA', '(unknown)')}",
              f"Workflow run: {os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/"
              f"{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}",
              f"Generated UTC: {generated}",
              "CodeQL query suite: security-and-quality",
              "API filter: tool_name=CodeQL; all returned alert states (state filter omitted)",
              f"API pages received: {len(pages)}",
              f"Total alert records: {len(alerts)}",
              f"Distinct alert IDs: {len(set(alert_ids))}",
              "",
              "SUMMARY BY STATE",
              "----------------",
          ]
          for state in ("open", "fixed", "dismissed", "closed"):
              lines.append(f"{state}: {states.get(state, 0)}")
          for state, count in sorted(states.items()):
              if state not in {"open", "fixed", "dismissed", "closed"}:
                  lines.append(f"{state}: {count}")

          lines.extend(["", "SUMMARY BY SEVERITY", "-------------------"])
          for severity, count in sorted(severities.items(), key=lambda item: (severity_order.get(item[0].lower(), 8), item[0])):
              lines.append(f"{severity}: {count}")

          lines.extend([
              "",
              "ALERT INVENTORY",
              "================",
              "Each GitHub CodeQL alert is listed once. Distinct alert IDs are preserved.",
              "The report includes every severity and every API-returned alert state.",
              "",
          ])

          for alert in alerts:
              rule = alert.get("rule") or {}
              instance = alert.get("most_recent_instance") or {}
              location = instance.get("location") or {}
              message = instance.get("message") or {}
              tool = alert.get("tool") or {}
              start_line = location.get("start_line")
              end_line = location.get("end_line")
              line_range = "(not provided)"
              if start_line is not None:
                  line_range = str(start_line) if end_line in (None, start_line) else f"{start_line}-{end_line}"

              lines.extend([
                  "-" * 72,
                  f"ALERT #{alert['number']}",
                  "-" * 72,
                  f"State: {value_text(alert.get('state'))}",
                  f"Rule ID: {value_text(rule.get('id'))}",
                  f"Rule name: {value_text(rule.get('name'))}",
                  f"Severity: {value_text(rule.get('severity'))}",
                  f"Security severity: {value_text(rule.get('security_severity_level'))}",
                  f"Tool: {value_text(tool.get('name'))}",
                  f"Tool version: {value_text(tool.get('version'))}",
                  f"Location: {value_text(location.get('path'))}:{line_range}",
                  f"Columns: {value_text(location.get('start_column'))}-{value_text(location.get('end_column'))}",
                  f"Classifications: {value_text(instance.get('classifications'))}",
                  f"Instance ref: {value_text(instance.get('ref'))}",
                  f"Instance commit: {value_text(instance.get('commit_sha'))}",
                  f"Analysis category: {value_text(instance.get('category'))}",
                  f"Created: {value_text(alert.get('created_at'))}",
                  f"Updated: {value_text(alert.get('updated_at'))}",
                  f"Fixed at: {value_text(alert.get('fixed_at'))}",
                  f"GitHub alert: {value_text(alert.get('html_url') or alert.get('url'))}",
              ])

              add_field(lines, "Rule description", rule.get("description"))
              add_field(lines, "Full rule description", rule.get("full_description"))
              add_field(lines, "Finding message", message.get("text") or message.get("markdown"))
              add_field(lines, "Rule tags", rule.get("tags"))
              add_field(lines, "CodeQL remediation guidance", rule.get("help"))
              add_field(lines, "CodeQL help URL", rule.get("help_uri"))

              related = instance.get("related_locations") or []
              lines.append("Related data-flow locations:")
              if not related:
                  lines.append("  (none provided)")
              else:
                  for index, item in enumerate(related, start=1):
                      rel_location = item.get("location") or {}
                      rel_message = item.get("message") or {}
                      rel_line = rel_location.get("start_line")
                      rel_end = rel_location.get("end_line")
                      rel_range = "(line unavailable)"
                      if rel_line is not None:
                          rel_range = str(rel_line) if rel_end in (None, rel_line) else f"{rel_line}-{rel_end}"
                      lines.append(
                          f"  {index}. {rel_location.get('path', '(path unavailable)')}:{rel_range}"
                      )
                      if rel_message.get("text"):
                          lines.append(f"     {rel_message['text']}")

              if alert.get("dismissed_reason") or alert.get("dismissed_comment") or alert.get("dismissed_by"):
                  lines.append("Dismissal details:")
                  lines.append(f"  Reason: {value_text(alert.get('dismissed_reason'))}")
                  lines.append(f"  Comment: {value_text(alert.get('dismissed_comment'))}")
                  dismissed_by = alert.get("dismissed_by") or {}
                  if isinstance(dismissed_by, dict):
                      dismissed_by = dismissed_by.get("login") or dismissed_by.get("name") or dismissed_by
                  lines.append(f"  By: {value_text(dismissed_by)}")
                  lines.append(f"  At: {value_text(alert.get('dismissed_at'))}")

              lines.append("")

          if not alerts:
              lines.extend([
                  "No CodeQL alerts were returned for this ref by GitHub's Code Scanning API.",
                  "This is a valid zero-alert report, not evidence that every possible defect is absent.",
              ])

          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8", newline="\n")
          print(f"Generated {destination} with {len(alerts)} distinct CodeQL alerts from {len(pages)} API page(s).")
          PY

      - name: Upload plain-text report (not ZIP-compressed)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: reports/code-scanning-alerts.txt
          archive: false
          retention-days: 30
          if-no-files-found: error

  # ===========================================================================
  # Collect CodeQL logs — the failure-tolerant CodeQL diagnostics collector
  # (work order §9.5, run 43630164424 repair). It REUSES the same hardened
  # scripts/ci/consolidate-run-log.sh collector as the platform-build
  # workflow (no second copy of the URL/token logic): running inside THIS
  # workflow means github.run_id selects the CodeQL run, so the collector
  # needs no separate workflow selector. It runs after ANY analyze/export
  # outcome (!cancelled()), so red CodeQL runs keep their LOCAL diagnosis —
  # distinguishing ran-and-failed, skipped, in-progress, missing log
  # sources and the collector's own job exactly like the platform-build
  # collector. Run 44835425398 artifact policy: the collection stays LOCAL
  # to the runner — NO build-log or diagnostics-index artifact is uploaded
  # (the built-in job-log display is the log surface); the ONLY artifact
  # this workflow uploads remains the security-alert report of the
  # export-alert-report job.
  # Least privilege: contents: read + actions: read only (the SARIF-writing
  # security-events: write permission stays on the analyze jobs alone).
  # ===========================================================================
  collect-codeql-logs:
    name: Collect CodeQL logs
    needs: [analyze, export-alert-report]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout (collector script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Collect the CodeQL run logs into one plain-text report (LOCAL, never uploaded)
        id: collector
        env:
          GH_TOKEN: ${{ github.token }}
          CONSOLIDATE_REPO: ${{ github.repository }}
          CONSOLIDATE_RUN_ID: ${{ github.run_id }}
          CONSOLIDATE_ATTEMPT: ${{ github.run_attempt }}
          CONSOLIDATE_COMMIT: ${{ github.sha }}
          CONSOLIDATE_REF: ${{ github.ref }}
          CONSOLIDATE_WORKFLOW: ${{ github.workflow }}
          CONSOLIDATE_TRIGGER: ${{ github.event_name }}
        run: |
          set -uo pipefail
          rc=0
          bash scripts/ci/consolidate-run-log.sh \
            --out SHEYTAN-LA-codeql-all-logs.txt \
            --json-out run-diagnostics.json || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::error::Collect CodeQL logs: collector reported a coverage/verification gap (rc=$rc) — the LOCAL report still carries the diagnosis"
          fi
          {
            echo "## CodeQL consolidated run log"
            echo ""
            echo "LOCAL reports (run 44835425398 artifact policy — never uploaded as artifacts): \`SHEYTAN-LA-codeql-all-logs.txt\` (ONE plain-text file) and"
            echo "\`run-diagnostics.json\` (machine-readable per-job index), attempt ${{ github.run_attempt }} recorded INSIDE both. The Actions job logs above are the run's log surface; SARIF remains the authoritative security finding surface."
            echo ""
            echo "Analysis jobs: analyze=${{ needs.analyze.result }} export-alert-report=${{ needs.export-alert-report.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collector verdict (fail the job on coverage gaps)
        if: ${{ !cancelled() }}
        run: |
          rc="${{ steps.collector.outputs.rc }}"
          if [ -z "$rc" ]; then
            echo "::error::collector step produced no verdict — fail closed"
            exit 1
          fi
          if [ "$rc" != "0" ]; then
            echo "::error::collector exited $rc — the LOCAL report and the step summary name the missing log sources / errors"
            exit 1
          fi
          echo "collector verdict: complete report (rc=0)"
